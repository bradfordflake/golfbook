// ---------- concurrent-edit merge helpers ----------
// Returns only the values in `next` that differ from `prev`, as a sparse tree.
// This isolates exactly what THIS device changed since its last successful
// push, so those edits can be replayed on top of an incoming cloud snapshot
// without dragging along a stale copy of everyone else's data. Naively keeping
// the whole local round instead would overwrite other players' newer scores.
function sparseDiff(prev, next) {
  if (next === undefined) return undefined;
  const bothPlainObjects =
    typeof next === 'object' && next !== null && !Array.isArray(next) &&
    typeof prev === 'object' && prev !== null && !Array.isArray(prev);
  if (!bothPlainObjects) {
    return JSON.stringify(prev) === JSON.stringify(next) ? undefined : next;
  }
  const out = {};
  let any = false;
  Object.keys(next).forEach((k) => {
    const d = sparseDiff(prev[k], next[k]);
    if (d !== undefined) {
      out[k] = d;
      any = true;
    }
  });
  return any ? out : undefined;
}
// Applies a sparse tree produced by sparseDiff on top of a base object.
function applySparse(base, delta) {
  if (delta === undefined) return base;
  if (typeof delta !== 'object' || delta === null || Array.isArray(delta)) return delta;
  const out = typeof base === 'object' && base !== null && !Array.isArray(base) ? { ...base } : {};
  Object.keys(delta).forEach((k) => {
    out[k] = applySparse(out[k], delta[k]);
  });
  return out;
}
// Reconciles an incoming cloud snapshot with local state, replaying any
// not-yet-pushed local edits on top so a snapshot can never silently discard
// what someone just typed.
function reconcileFromCloud(localList, incomingList, prevSyncedMap) {
  const localById = {};
  localList.forEach((x) => {
    localById[x.id] = x;
  });
  const incomingIds = new Set(incomingList.map((x) => x.id));
  const out = incomingList.map((inc) => {
    const loc = localById[inc.id];
    if (!loc) return inc;
    const lastJSON = prevSyncedMap[inc.id];
    if (lastJSON === JSON.stringify(loc)) return inc; // nothing unsaved locally
    let base;
    try {
      base = lastJSON ? JSON.parse(lastJSON) : {};
    } catch (e) {
      base = {};
    }
    const delta = sparseDiff(base, loc);
    return applySparse(inc, delta);
  });
  // Keep anything created locally that the cloud hasn't seen yet.
  localList.forEach((loc) => {
    if (!incomingIds.has(loc.id)) out.push(loc);
  });
  return out;
}

// Pure diff so it's easy to unit-test in isolation: given the settings object
// before and after a round of local edits, returns only the fields that
// actually changed, each with a human label and formatted before/after value.
function diffSettings(before, after) {
  const changes = [];
  Object.keys(SETTINGS_FIELD_LABELS).forEach((key) => {
    const b = before[key],
      a = after[key];
    if (JSON.stringify(b) !== JSON.stringify(a)) {
      const { label, format } = SETTINGS_FIELD_LABELS[key];
      changes.push({ key, label, before: format(b), after: format(a) });
    }
  });
  const sb = before.stablefordPoints || {};
  const sa = after.stablefordPoints || {};
  Object.keys(STABLEFORD_FIELD_LABELS).forEach((key) => {
    const b = sb[key],
      a = sa[key];
    if ((b ?? null) !== (a ?? null)) {
      changes.push({ key: 'stableford.' + key, label: STABLEFORD_FIELD_LABELS[key], before: b, after: a });
    }
  });
  return changes;
}

// Seeded players get a STABLE id derived from their name. uid() was used here
// before, which meant every fresh load minted 14 brand-new ids for the same 14
// people — and since all devices share one cloud league by default, each one
// pushed its own copy up. Deterministic ids make the seed idempotent: repeated
// seeds write to the same 14 documents and overwrite rather than accumulate.
function seedPlayerId(name) {
  return 'seed-' + String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function makeDefaultPlayers() {
  return SAMPLE_PLAYERS.map((p, i) => ({ id: seedPlayerId(p.name), name: p.name, ghin: p.ghin, handicap: p.handicap, team: i % 2 === 0 ? 'team1' : 'team2' }));
}

// ---------- duplicate player cleanup ----------
function normalizePlayerName(n) {
  return String(n || '').trim().toLowerCase().replace(/\s+/g, ' ');
}
// Recursively rewrite any player id that appears as an object key or a string
// value. Deliberately generic so it covers playerIds, playerData, skinsOptIn,
// trashOptIn, trash[hole][playerId], gameData picks and availability[date][playerId]
// without needing to enumerate every shape by hand.
function remapPlayerIds(value, idMap) {
  if (Array.isArray(value)) {
    const out = [];
    const seen = new Set();
    value.forEach((v) => {
      const mapped = typeof v === 'string' && idMap[v] ? idMap[v] : remapPlayerIds(v, idMap);
      if (typeof mapped === 'string') {
        if (seen.has(mapped)) return; // collapse ids that just became identical
        seen.add(mapped);
      }
      out.push(mapped);
    });
    return out;
  }
  if (value && typeof value === 'object') {
    const out = {};
    // Process survivors (unmapped keys) first so that when a duplicate collides
    // with the keeper, the keeper's real data wins instead of being overwritten.
    const keys = Object.keys(value).sort((a, b) => (idMap[a] ? 1 : 0) - (idMap[b] ? 1 : 0));
    keys.forEach((k) => {
      const nk = idMap[k] || k;
      if (Object.prototype.hasOwnProperty.call(out, nk)) return;
      out[nk] = remapPlayerIds(value[k], idMap);
    });
    return out;
  }
  if (typeof value === 'string' && idMap[value]) return idMap[value];
  return value;
}
// True if this round holds actual scoring data for the given player id.
function hasRoundData(round, id) {
  const pd = round && round.playerData ? round.playerData[id] : null;
  if (!pd) return false;
  if (pd.points != null) return true;
  const hs = pd.holeScores || {};
  return Object.keys(hs).some((k) => hs[k] != null);
}
// Groups players by name and picks the copy with the most existing references
// as the survivor, so the record actually tied to your rounds is the one kept.
// Also reports conflicts: rounds where two copies of one person BOTH carry
// scores, which is the only situation where merging has to discard something.
function planPlayerDedupe(players, rounds, availability) {
  const roundList = rounds || [];
  const haystack = JSON.stringify({ rounds: roundList, availability: availability || {} });
  const refCount = (id) => haystack.split(id).length - 1;
  const groups = {};
  players.forEach((p) => {
    const k = normalizePlayerName(p.name);
    if (!k) return;
    (groups[k] = groups[k] || []).push(p);
  });
  const idMap = {};
  const merges = [];
  const conflicts = [];
  Object.keys(groups).forEach((k) => {
    const list = groups[k];
    if (list.length < 2) return;
    const ranked = [...list].sort((a, b) => refCount(b.id) - refCount(a.id));
    const keeper = ranked[0];
    const dupes = ranked.slice(1);
    dupes.forEach((d) => {
      idMap[d.id] = keeper.id;
    });
    roundList.forEach((r) => {
      const scored = list.filter((p) => hasRoundData(r, p.id));
      if (scored.length > 1) {
        conflicts.push({ name: keeper.name, roundId: r.id, date: r.date, copies: scored.length });
      }
    });
    merges.push({ name: keeper.name, keeperId: keeper.id, removed: dupes.length });
  });
  return { idMap, merges, conflicts, removeCount: Object.keys(idMap).length };
}

// ---------- helpers ----------
function uid() {
  return Math.random().toString(36).slice(2, 9);
}
function roundHalfDown(x) {
  return Math.ceil(x - 0.5);

function quotaFromIndex(quotaBase, handicap) {
  return roundHalfDown(quotaBase - handicap);
}
function courseParTotal(course, n) {
  return course.holes.slice(0, n).reduce((s, h) => s + h.par, 0);
}
function partialSum(values) {

  return scored.reduce((s, v) => s + v, 0);
}
function stablefordPoints(strokes, par, settings) {
  const pts = (settings && settings.stablefordPoints) || DEFAULT_SETTINGS.stablefordPoints;
  const d = strokes - par;
  if (d >= 2) return pts.doubleBogeyPlus;
  if (d === 1) return pts.bogey;
  if (d === 0) return pts.par;
  if (d === -1) return pts.birdie;
  if (d === -2) return pts.eagle;
  return pts.albatrossPlus;
}
function scoreColor(strokes, par) {
  if (strokes == null) return C.faint;
  const d = strokes - par;
  if (d <= -2) return C.gold;
  if (d === -1) return C.lime;
  if (d === 0) return C.text;
  if (d === 1) return C.orange;
  return C.red;
}
// PGA-style scorecard notation:

function ScoreMark({ strokes, par, size = 19, fontSize = 11 }) {

        –
      </span>
    );
  }
  const d = strokes - par;
  const color = scoreColor(strokes, par);
  const shape = d < 0 ? 'circle' : d > 0 ? 'square' : 'none';
  const dbl = Math.abs(d) >= 2;

    <span
      className="font-display inline-flex items-center justify-center"
      style={{
        width: size,
        height: size,
        fontSize,
        lineHeight: 1,
        color,
        border: shape === 'none' ? 'none' : `1.5px solid ${color}`,
        borderRadius: shape === 'circle' ? '50%' : shape === 'square' ? 3 : 0,
        boxSizing: 'border-box',

      {strokes}
    </span>

  if (!dbl || shape === 'none') return inner;
  return (
    <span
      className="inline-flex items-center justify-center"
      style={{
        width: size + 7,
        height: size + 7,
        border: `1.5px solid ${color}`,
        borderRadius: shape === 'circle' ? '50%' : 5,

function roundHoles(round, course) {
  return round.holes === 9 ? course.holes.slice(0, 9) : course.holes;
}

  const sorted = [...withIdx].sort((a, b) => a.si - b.si);
  const rank = new Array(holes.length);
  sorted.forEach((h, r) => (rank[h.i] = r + 1));
  return rank;
}
function strokesOnHole(strokesReceived, rank, holesCount) {

}
function defaultTee(course) {

}
// Visual swatches for the tee picker. Falls back to grey for any tee name a
// course uses that isn't in this list.
const TEE_SWATCHES = {
  Blue: '#3B82F6',
  Purple: '#A855F7',
  Black: '#18181B',
  Grey: '#9CA3AF',
  White: '#FAFAFA',
  Green: '#22C55E',
  Gold: '#EAB308',
  Orange: '#F97316',
  Red: '#EF4444',

function teeSwatch(name) {

}
function getTee(course, teeName) {

// Each golfer can play their own tee within a round. Falls back to the round's
// default tee for anyone who hasn't picked one (and for every existing round,
// which predates per-player tees).
function playerTeeName(round, playerId) {
  const pd = round.playerData && round.playerData[playerId];
  return (pd && pd.teeName) || round.teeName;
}
function playerTee(course, round, playerId) {
  return getTee(course, playerTeeName(round, playerId));
}
// Course handicap already folds in (rating - par), which is exactly the
// adjustment that makes tees comparable. So a player who shoots their course
// handicap lands on their quota no matter which tee they played — mixed-tee
// groups need no extra correction.
function playerQuotaInRound(settings, round, player, course) {
  const pd = round.playerData[player.id];
  if (pd && pd.quotaOverride != null) return pd.quotaOverride;
  const tee = playerTee(course, round, player.id);
  const fullPar = courseParTotal(course, 18);
  const ch18 = Math.round((player.handicap * tee.slope) / 113 + (tee.rating - fullPar));
  if (round.holes === 18) return roundHalfDown(settings.quotaBase - ch18);
  const ch9 = roundHalfDown(ch18 / 2);
  const qBase9 = roundHalfDown(settings.quotaBase / 2);
  return roundHalfDown(qBase9 - ch9);

function roundPlayerList(round, players) {
  if (Array.isArray(round.playerIds)) return players.filter((p) => round.playerIds.includes(p.id));
  return players; // backward compat: rounds created before player-selection existed show everyone
}
function roundGameLabel(round) {
  const game = GAME_LIBRARY.find((g) => g.id === round.gameId) || null;
  if (game) return game.name;
  return round.casual ? 'Casual Round' : 'Dogfight League';
}
function roundNamesLabel(roundPlayers) {
  const firsts = roundPlayers.map((p) => (p.name || '').trim().split(/\s+/)[0] || p.name);
  if (firsts.length === 0) return 'No players selected';
  if (firsts.length <= 4) return firsts.join(', ');
  return firsts.slice(0, 3).join(', ') + ` +${firsts.length - 3} more`;
}
function formatRoundDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function courseHandicapFor(round, player, course) {
  const tee = playerTee(course, round, player.id);
  const fullPar = courseParTotal(course, 18);
  const ch18 = Math.round((player.handicap * tee.slope) / 113 + (tee.rating - fullPar));
  return round.holes === 9 ? roundHalfDown(ch18 / 2) : ch18;
}
function strokesThisHole(round, player, course, holeIdx) {
  const holes = roundHoles(round, course);
  const ch = Math.max(0, courseHandicapFor(round, player, course));
  const ranks = localRanks(holes);
  return strokesOnHole(ch, ranks[holeIdx], holes.length);
}
// A Dogfight quota round is a league round with no alternate game format.
// These are the tournaments the season standings are built from.
function isQuotaRound(round) {
  return !round.casual && !round.gameId;
}
// Quota games MUST be scored gross. The quota itself is already
// handicap-adjusted (36 - course handicap), so applying handicap strokes to the
// scores as well counts the handicap twice: a 24-handicap shooting exactly
// their handicap would finish +28 instead of level. Scored gross, a player who
// shoots their handicap lands on their quota exactly, at every handicap.
// Other formats (best ball, wolf, match play) legitimately use net, so this
// only overrides the quota game.
function effectivePointsBasis(round) {
  if (isQuotaRound(round)) return 'gross';
  return round.pointsBasis || 'net';
}
function playerPointsInRound(settings, round, player, course) {
  if (Array.isArray(round.playerIds) && !round.playerIds.includes(player.id)) return null;
  const pd = round.playerData[player.id];
  if (!pd) return null;
  if (round.entryMode === 'points') return pd.points != null ? pd.points : null;
  const holes = roundHoles(round, course);
  const net = effectivePointsBasis(round) === 'net';
  const ranks = net ? localRanks(holes) : null;
  const ch = net ? Math.max(0, courseHandicapFor(round, player, course)) : 0;
  let total = 0,
    count = 0;
  holes.forEach((h, i) => {
    const s = pd.holeScores ? pd.holeScores[i] : null;
    if (s != null) {
      const eff = net ? s - strokesOnHole(ch, ranks[i], holes.length) : s;

function playerResultInRound(settings, round, player, course) {
  const pts = playerPointsInRound(settings, round, player, course);
  if (pts == null) return null;
  const quota = playerQuotaInRound(settings, round, player, course);
  return { points: pts, quota, result: pts - quota };
}
function getEvents(rounds) {
  const seen = new Set();
  const events = [];
  rounds.forEach((r) => {
    if (seen.has(r.id)) return;
    const partner = r.combinedWith ? rounds.find((x) => x.id === r.combinedWith) : null;
    if (partner) {
      events.push({ id: r.id, roundIds: [r.id, partner.id], date: r.date });
      seen.add(r.id);
      seen.add(partner.id);
    } else {
      events.push({ id: r.id, roundIds: [r.id], date: r.date });
      seen.add(r.id);
    }
  });
  return events;
}
function eventResultForPlayer(settings, event, rounds, courses, player) {
  let pts = 0,
    quota = 0,
    any = false;
  event.roundIds.forEach((rid) => {
    const r = rounds.find((x) => x.id === rid);
    if (!r) return;
    const course = courses.find((c) => c.id === r.courseId);
    if (!course) return;
    const res = playerResultInRound(settings, r, player, course);
    if (res) {
      pts += res.points;
      quota += res.quota;
      any = true;
    }

function seasonPointsForRank(settings, rank) {
  const arr = settings.seasonPointsByFinish;

  if (rank <= arr.length) return arr[rank - 1];
  return arr[arr.length - 1];
}
function computeEventRanking(settings, event, rounds, courses, players) {
  const results = players
    .map((p) => ({ id: p.id, r: eventResultForPlayer(settings, event, rounds, courses, p) }))
    .filter((x) => x.r);
  results.sort((a, b) => b.r.result - a.r.result);
  const pointsMap = {};
  results.forEach((x, i) => (pointsMap[x.id] = seasonPointsForRank(settings, i + 1)));
  return { pointsMap, ranked: results };
}
function computeSeason(settings, rounds, courses, players) {
  const events = getEvents(rounds);
  const perPlayerPts = {};
  const perPlayerRaw = {};
  players.forEach((p) => {
    perPlayerPts[p.id] = [];
    perPlayerRaw[p.id] = [];
  });
  events.forEach((ev) => {
    const { pointsMap, ranked } = computeEventRanking(settings, ev, rounds, courses, players);
    ranked.forEach((x) => {
      perPlayerPts[x.id].push(pointsMap[x.id]);
      perPlayerRaw[x.id].push(x.r.result);
    });
  });
  const seasonTotals = {};
  const rawTotals = {};
  const roundsPlayed = {};
  players.forEach((p) => {
    const sorted = [...perPlayerPts[p.id]].sort((a, b) => b - a);
    const top = sorted.slice(0, settings.topScoresCounted);
    seasonTotals[p.id] = top.reduce((a, b) => a + b, 0);
    const sortedRaw = [...perPlayerRaw[p.id]].sort((a, b) => b - a).slice(0, settings.topScoresCounted);
    rawTotals[p.id] = sortedRaw.reduce((a, b) => a + b, 0);
    roundsPlayed[p.id] = perPlayerPts[p.id].length;

function computeSkinsForRound(round, allPlayers, course, settings) {
  if (round.entryMode !== 'holebyhole') return null;
  const optIn = (round.skinsOptIn || []).filter((id) => !Array.isArray(round.playerIds) || round.playerIds.includes(id));
  if (optIn.length < 2 || settings.skinsBuyIn <= 0) return null;
  const players = allPlayers.filter((p) => optIn.includes(p.id));
  const holes = roundHoles(round, course);
  const netMode = settings.skinsType === 'net';
  let strokesMap = {};
  if (netMode) {
    const fullPar = courseParTotal(course, 18);

    // includes (rating - par), so relative strokes stay correct across a
    // mixed-tee group without any extra adjustment.
    const chVals = players.map((p) => {
      const t = playerTee(course, round, p.id);

const TRASH_TYPES = [

function computeTrashForRound(round, allPlayers, course, settings) {
  if (round.entryMode !== 'holebyhole') return null;
  const optIn = (round.trashOptIn || []).filter((id) => !Array.isArray(round.playerIds) || round.playerIds.includes(id));
  if (optIn.length === 0 || settings.trashValue <= 0) return null;
  const players = allPlayers.filter((p) => optIn.includes(p.id));
  const holes = roundHoles(round, course);
  const tally = {};
  players.forEach((p) => (tally[p.id] = { greenie: 0, sandie: 0, polie: 0, birdie: 0, total: 0 }));
  holes.forEach((h, i) => {
    players.forEach((p) => {
      const marks = (round.trash && round.trash[i] && round.trash[i][p.id]) || {};
      TRASH_TYPES.forEach((t) => {
        if (marks[t.id]) {
          tally[p.id][t.id] += 1;
          tally[p.id].total += 1;
        }
      });
      const score = round.playerData[p.id]?.holeScores?.[i];
      if (score != null && score <= h.par - 1) {
        tally[p.id].birdie += 1;
        tally[p.id].total += 1;
      }
    });
  });
  const totalItems = players.reduce((s, p) => s + tally[p.id].total, 0);
  const payouts = {};
  players.forEach((p) => (payouts[p.id] = tally[p.id].total * settings.trashValue));
  return { players, tally, totalItems, value: settings.trashValue, payouts };
}
// ---------- casual game scoring engines (built purely from raw per-hole gross scores) ----------
function grossOf(round, playerId, holeIdx) {
  return round.playerData[playerId]?.holeScores?.[holeIdx];
}
function strokePlayBoard(round, course, players) {
  const holes = roundHoles(round, course);
  return players
    .map((p) => {
      let total = 0,
        thru = 0;
      holes.forEach((h, i) => {
        const g = grossOf(round, p.id, i);
        if (g != null) {
          total += g;
          thru++;
        }
      });
      return { p, total, thru };
    })
    .sort((a, b) => (a.thru === 0 ? 1 : b.thru === 0 ? -1 : a.total - b.total));
}
function stablefordBoard(round, course, players, settings) {
  const holes = roundHoles(round, course);
  return players
    .map((p) => {
      let total = 0,
        thru = 0;
      holes.forEach((h, i) => {
        const g = grossOf(round, p.id, i);
        if (g != null) {
          total += stablefordPoints(g, h.par, settings);
          thru++;
        }
      });
      return { p, total, thru };
    })
    .sort((a, b) => b.total - a.total);
}
function matchSegment(round, course, players, startHole, endHole) {
  if (players.length !== 2) return null;
  const holes = roundHoles(round, course);
  const end = Math.min(endHole, holes.length);
  const [a, b] = players;
  let diff = 0,
    thru = 0;
  for (let h = startHole; h < end; h++) {
    const av = grossOf(round, a.id, h);
    const bv = grossOf(round, b.id, h);
    if (av == null || bv == null) break;
    thru++;
    if (av < bv) diff++;
    else if (bv < av) diff--;
  }
  const segHoles = end - startHole;
  const remaining = segHoles - thru;
  const clinched = thru > 0 && Math.abs(diff) > remaining;
  return { diff, thru, remaining, clinched, segHoles, a, b };
}
function matchLabel(seg) {
  if (!seg || seg.thru === 0) return 'Not started';
  if (seg.clinched) return `${Math.abs(seg.diff)} & ${seg.remaining}`;
  if (seg.diff === 0) return `All Square · thru ${seg.thru}`;
  return `${Math.abs(seg.diff)} UP · thru ${seg.thru}`;
}
// ---------- best ball (four-ball) automatic engine ----------
function bestBallTeams(round, players) {
  const pairing = round.gameData?.pairing;
  if (!pairing) return null;
  const t1 = players.filter((p) => (pairing.team1Ids || []).includes(p.id));
  const t2 = players.filter((p) => (pairing.team2Ids || []).includes(p.id));
  if (t1.length === 0 || t2.length === 0) return null;
  return { t1, t2 };
}
function bestBallMatch(round, course, players, net) {
  const teams = bestBallTeams(round, players);
  if (!teams) return null;
  const { t1, t2 } = teams;
  const holes = roundHoles(round, course);
  const bestFor = (team, i) => {
    let val = null;
    let who = null;
    team.forEach((p) => {
      const g = grossOf(round, p.id, i);
      if (g == null) return;
      const eff = net ? g - strokesThisHole(round, p, course, i) : g;
      if (val == null || eff < val) {
        val = eff;
        who = p;
      }
    });
    return { val, who };
  };
  const perHole = [];
  let diff = 0;
  let thru = 0;
  holes.forEach((h, i) => {
    const a = bestFor(t1, i);
    const b = bestFor(t2, i);
    let winner = null;
    if (a.val != null && b.val != null) {
      thru++;
      if (a.val < b.val) {
        diff++;
        winner = 'team1';
      } else if (b.val < a.val) {
        diff--;
        winner = 'team2';
      } else {
        winner = 'halved';
      }
    }
    perHole.push({ i, par: h.par, a, b, winner });
  });
  const wonA = perHole.filter((x) => x.winner === 'team1').length;
  const wonB = perHole.filter((x) => x.winner === 'team2').length;
  const halved = perHole.filter((x) => x.winner === 'halved').length;
  const remaining = holes.length - thru;
  const clinched = thru > 0 && Math.abs(diff) > remaining;
  return { t1, t2, perHole, diff, thru, remaining, clinched, wonA, wonB, halved, holesCount: holes.length };
}
function bestBallLabel(bb) {
  if (!bb || bb.thru === 0) return 'Not started';
  if (bb.clinched) return `${Math.abs(bb.diff)} & ${bb.remaining}`;
  if (bb.diff === 0) return `All Square · thru ${bb.thru}`;
  return `${Math.abs(bb.diff)} UP · thru ${bb.thru}`;
}
function ninesBoard(round, course, players) {
  if (players.length !== 3) return null;
  const holes = roundHoles(round, course);
  const pts = {};
  players.forEach((p) => (pts[p.id] = 0));
  let thru = 0;
  for (let h = 0; h < holes.length; h++) {
    const vals = players.map((p) => ({ id: p.id, v: grossOf(round, p.id, h) }));
    if (vals.some((v) => v.v == null)) break;
    thru = h + 1;
    const sorted = [...vals].sort((a, b) => a.v - b.v);
    const POOL = [5, 3, 1];
    let i = 0;
    while (i < 3) {
      let j = i;
      while (j + 1 < 3 && sorted[j + 1].v === sorted[i].v) j++;
      const group = sorted.slice(i, j + 1);
      const share = POOL.slice(i, j + 1).reduce((a, b) => a + b, 0) / group.length;
      group.forEach((m) => (pts[m.id] += share));
      i = j + 1;
    }
  }
  return { pts, thru };
}
function wolfBoard(round, course, players) {
  const picks = round.gameData?.wolfPicks || {};
  const holes = roundHoles(round, course);
  const pts = {};
  players.forEach((p) => (pts[p.id] = 0));
  let thru = 0;
  for (let h = 0; h < holes.length; h++) {
    const pick = picks[h];
    const allScores = players.every((p) => grossOf(round, p.id, h) != null);
    if (!pick || !pick.wolf || !allScores) break;
    if (!pick.partner && !pick.lone) break;
    thru = h + 1;
    const wolfId = pick.wolf;
    const others = players.map((p) => p.id).filter((id) => id !== wolfId);
    if (pick.lone) {
      const wolfScore = grossOf(round, wolfId, h);
      const bestOther = Math.min(...others.map((id) => grossOf(round, id, h)));
      if (wolfScore < bestOther) pts[wolfId] += 6;
      else if (wolfScore > bestOther) others.forEach((id) => (pts[id] += 2));
    } else {
      const teamIds = [wolfId, pick.partner];
      const oppIds = others.filter((id) => id !== pick.partner);
      const teamBest = Math.min(...teamIds.map((id) => grossOf(round, id, h)));
      const oppBest = Math.min(...oppIds.map((id) => grossOf(round, id, h)));
      if (teamBest < oppBest) teamIds.forEach((id) => (pts[id] += 2));
      else if (oppBest < teamBest) oppIds.forEach((id) => (pts[id] += 2));
    }
  }
  return { pts, thru };
}
function bbbBoard(round, players) {
  const picks = round.gameData?.bbbPicks || {};
  const pts = {};
  players.forEach((p) => (pts[p.id] = 0));
  Object.values(picks).forEach((h) => {
    ['bingo', 'bango', 'bongo'].forEach((k) => {
      if (h[k]) pts[h[k]] = (pts[h[k]] || 0) + 1;
    });
  });
  return pts;
}

// Purse for a whole day. An event can span two combined nine-hole rounds, so
// the pot must be based on who played the DAY, not summed per round — otherwise
// a combined 18 would charge everyone two buy-ins.
function purseForEvent(settings, event, rounds, courses, players) {
  const ranked = players
    .map((p) => ({ id: p.id, r: eventResultForPlayer(settings, event, rounds, courses, p) }))
    .filter((x) => x.r)
    .map((x) => ({ id: x.id, result: x.r.result, points: x.r.points, quota: x.r.quota }))
    .sort((a, b) => b.result - a.result);
  const pot = settings.purseBuyIn * ranked.length;
  const rake = ranked.length > 0 ? settings.seasonRakePerRound : 0;
  const payoutPool = Math.max(0, pot - rake);
  const payouts = {};
  // Ties share the combined payout for the places they occupy, so nobody loses
  // money to an arbitrary sort order when two players finish level.
  let i = 0;
  while (i < ranked.length) {
    let j = i;
    while (j + 1 < ranked.length && ranked[j + 1].result === ranked[i].result) j++;
    let share = 0;
    for (let k = i; k <= j; k++) share += settings.purseSplits[k] || 0;
    const each = Math.round((payoutPool * share) / 100 / (j - i + 1));
    for (let k = i; k <= j; k++) payouts[ranked[k].id] = each;
    i = j + 1;
  }
  return { pot, rake, payoutPool, ranked, payouts, scoredCount: ranked.length };
}

function purseForRound(settings, round, players, course) {
  const scored = players.filter((p) => playerPointsInRound(settings, round, p, course) != null);
  const pot = settings.purseBuyIn * scored.length;
  const rake = scored.length > 0 ? settings.seasonRakePerRound : 0;
  const payoutPool = Math.max(0, pot - rake);
  const ranked = scored
    .map((p) => ({ id: p.id, result: playerResultInRound(settings, round, p, course).result }))
    .sort((a, b) => b.result - a.result);
  const payouts = {};
  ranked.forEach((r, i) => {
    const pct = settings.purseSplits[i] || 0;
    payouts[r.id] = Math.round((payoutPool * pct) / 100);
  });
  return { pot, rake, payoutPool, ranked, payouts, scoredCount: scored.length };
}

// no lockout, since this is a soft deterrent against accidental changes by
// teammates, not a real auth system.
function PinPrompt({ pin, title = 'Enter PIN', message, onConfirm, onCancel }) {
  const [value, setValue] = useState('');
  const [error, setError] = useState(false);
  const inputRef = useRef(null);
  useEffect(() => {
    inputRef.current?.focus();
  }, []);
  function submit() {
    if (value === pin) {
      onConfirm();
    } else {
      setError(true);
      setValue('');
      inputRef.current?.focus();
    }
  }
  return (
    <div
      className="fixed inset-0 flex items-center justify-center p-4 backdrop-fade"
      style={{ background: 'rgba(0,0,0,0.75)', zIndex: 100 }}
      onClick={onCancel}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        className="w-full rounded-3xl p-5 modal-pop"
        style={{ maxWidth: 340, background: C.surface, border: `1.5px solid ${C.lime}` }}
      >
        <div className="font-display text-xl mb-1" style={{ color: C.text }}>
          🔒 {title}
        </div>
        <p className="text-sm mb-4" style={{ color: C.muted }}>
          {message || 'League settings are PIN-protected. Enter the PIN to make changes.'}
        </p>
        <input
          ref={inputRef}
          type="tel"
          inputMode="numeric"
          pattern="[0-9]*"
          maxLength={pin.length}
          value={value}
          onChange={(e) => {
            setError(false);
            setValue(e.target.value.replace(/\D/g, '').slice(0, pin.length));
          }}
          onKeyDown={(e) => {
            if (e.key === 'Enter') submit();
          }}
          className="w-full text-center font-display outline-none rounded-xl px-3 py-3 mb-2"
          style={{ fontSize: 26, letterSpacing: '0.5em', background: C.surface2, color: C.text, border: `1.5px solid ${error ? C.red : C.border}` }}
          placeholder={'•'.repeat(pin.length)}
        />
        {error && (
          <div className="text-xs mb-2 font-semibold" style={{ color: C.red }}>
            Incorrect PIN — try again.
          </div>
        )}
        <div className="flex gap-2 mt-2">
          <GhostButton onClick={onCancel} style={{ flex: 1, textAlign: 'center' }}>
            Cancel
          </GhostButton>
          <PrimaryButton onClick={submit} disabled={value.length !== pin.length} style={{ flex: 1, textAlign: 'center' }}>
            Unlock
          </PrimaryButton>
        </div>
      </div>
    </div>
  );
}

        <div className="font-display text-lg mb-1" style={{ color: C.orange }}>
          🛟 Recovery mode
        </div>
        <p className="text-xs leading-relaxed mb-2" style={{ color: C.muted }}>
          Cloud sync is switched off and <b style={{ color: C.text }}>nothing on this device will be
          changed or overwritten</b>. You're looking at whatever data was last saved here.
        </p>
        <p className="text-xs leading-relaxed" style={{ color: C.muted }}>
          Check the Rounds tab to see if today's scores are still here. If they are, use{' '}
          <b style={{ color: C.text }}>Export backup</b> below to save them to a file, then reopen the
          app normally and use <b style={{ color: C.text }}>Import backup</b> to restore.
        </p>
      </Card>
    );
  }

  const isConnected = cloudStatus === 'connected';
  const isUnavailable = cloudStatus === 'unavailable';
  const isConnecting = cloudStatus === 'connecting';

  function connect() {
    setLocalErr('');
    if (!leagueIdInput.trim()) return;
    let cfg = DEFAULT_FIREBASE_CONFIG;
    if (useCustom) {
      if (!configText.trim()) return;
      try {
        cfg = new Function('return (' + configText + ')')();
      } catch (e) {
        setLocalErr("Couldn't read that — paste the exact firebaseConfig object from the Firebase console, curly braces and all.");
        return;
      }
      if (!cfg || !cfg.apiKey || !cfg.projectId) {
        setLocalErr("That doesn't look like a complete Firebase config — it should have apiKey, projectId, etc.");
        return;
      }
    }
    const cleanLeagueId = leagueIdInput.trim().replace(/[\s/]+/g, '-').toLowerCase();
    saveCloudConfig({ ...cfg, leagueId: cleanLeagueId });
    window.location.reload();
  }
  function disconnect() {
    clearCloudConfig();
    window.location.reload();
  }
  function copyLeagueId() {
    try {
      navigator.clipboard.writeText(cloudLeagueId);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) {}
  }

  const rulesText = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /leagues/{leagueId}/{document=**} {
      allow read, write: if true;
    }
  }
}`;

  return (
    <Card>
      <div className="flex items-center justify-between mb-2">
        <div className="font-display text-xl" style={{ color: C.text }}>
          Cloud Sync
        </div>
        <span
          className="px-2 py-0.5 rounded-full text-[10px] font-bold shrink-0"
          style={{
            background: isConnected ? C.limeSoft : C.surface2,
            color: isConnected ? C.lime : cloudStatus === 'error' ? C.red : C.muted,
            border: `1px solid ${isConnected ? C.lime : cloudStatus === 'error' ? C.red : C.border}`,
          }}
        >
          {isConnected ? '🟢 LIVE' : isConnecting ? 'CONNECTING…' : cloudStatus === 'error' ? 'ERROR' : isUnavailable ? 'UNAVAILABLE HERE' : 'LOCAL ONLY'}
        </span>
      </div>

      {isUnavailable && (
        <InfoNote>
          Cloud sync can't run in this in-chat preview (the sandbox won't load the Firebase SDK). It works in the downloadable app and your hosted Vercel link.
        </InfoNote>
      )}
      {cloudStatus === 'error' && <InfoNote>Connection error: {cloudError || 'something went wrong reaching Firestore.'}</InfoNote>}

      {isConnected ? (
        <>
          <p className="text-sm mb-1" style={{ color: C.muted }}>
            Everyone using League ID <b style={{ color: C.text }}>{cloudLeagueId}</b> shares this data live — scores, the calendar, live scoring, all of it.
          </p>
          <button onClick={copyLeagueId} className="text-xs font-semibold mb-3" style={{ color: C.lime }}>
            {copied ? '✓ Copied' : 'Copy League ID to share'}
          </button>
          <GhostButton onClick={disconnect} color={C.red} style={{ width: '100%', textAlign: 'center' }}>
            Disconnect (go local-only)
          </GhostButton>
        </>
      ) : (
        !isUnavailable && (
          <>
            <p className="text-sm mb-3" style={{ color: C.muted }}>
              This app is already connected to a Firebase project. Pick a League ID your whole group will use — everyone who enters the same one shares data live.
            </p>
            <TextField label="League ID (share this with your group)" value={leagueIdInput} onChange={setLeagueIdInput} placeholder="e.g. birmingham-dogfight" />

            <button onClick={() => setUseCustom((v) => !v)} className="text-xs font-semibold mt-3 mb-1" style={{ color: C.muted }}>
              {useCustom ? '← Use the built-in project instead' : 'Use a different Firebase project instead'}
            </button>
            <Collapse open={useCustom}>
              <div className="mt-2">
                <InfoNote>
                  <div className="space-y-1.5">
                    <div>1. Go to console.firebase.google.com → Add project (it's free).</div>
                    <div>2. Click the Web icon (&lt;/&gt;) to register a web app — name it anything.</div>
                    <div>
                      3. It'll show a <code>firebaseConfig</code> object — copy the whole thing.
                    </div>
                    <div>4. In the left sidebar: Build → Firestore Database → Create database.</div>
                    <div>
                      5. Open the <b>Rules</b> tab there and paste this in, then Publish:
                    </div>
                  </div>
                  <pre className="mt-2 p-2 rounded-lg overflow-x-auto" style={{ background: C.surface3, fontSize: 10, color: C.text }}>
                    {rulesText}
                  </pre>
                  <div className="mt-2" style={{ color: C.orange }}>
                    Heads up: those rules let anyone with the League ID read or write that league's data — fine for a friend group, just don't use anything guessable or sensitive.
                  </div>
                </InfoNote>
                <div className="mb-2">
                  <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: C.muted }}>
                    Firebase config — paste the whole object
                  </div>
                  <textarea
                    value={configText}
                    onChange={(e) => setConfigText(e.target.value)}
                    placeholder={'{\n  apiKey: "...",\n  authDomain: "...",\n  projectId: "...",\n  ...\n}'}
                    rows={6}
                    className="w-full rounded-2xl px-3 py-2.5 text-xs outline-none font-mono"
                    style={{ background: C.surface2, color: C.text, border: `1px solid ${C.border}` }}
                  />
                </div>
              </div>
            </Collapse>

            {localErr && (
              <div className="text-xs mb-2" style={{ color: C.red }}>
                {localErr}
              </div>
            )}
            <PrimaryButton
              onClick={connect}
              disabled={!leagueIdInput.trim() || (useCustom && !configText.trim())}
              style={{ width: '100%', textAlign: 'center', marginTop: 8 }}
            >
              Connect
            </PrimaryButton>
          </>
        )
      )}
    </Card>
  );
}

function StandingsTab({ settings, players, setPlayers, rounds, courses, onGoPlayers }) {
  const leagueRounds = rounds.filter((r) => !r.casual);
  const season = computeSeason(settings, leagueRounds, courses, players);
  const [dashPlayerId, setDashPlayerId] = useState(null);
  const [eventIdx, setEventIdx] = useState(0);
  const [showSeason, setShowSeason] = useState(false);
  const [awards, setAwards] = useState(null);
  const [awardsLoading, setAwardsLoading] = useState(false);
  const [awardsError, setAwardsError] = useState('');

  // Days, newest first. Each event is one dogfight — a single 18 or two
  // combined nines played the same day.
  const events = getEvents(leagueRounds)
    .map((ev) => ({ ...ev, purse: purseForEvent(settings, ev, leagueRounds, courses, players) }))
    .filter((ev) => ev.purse.scoredCount > 0)
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  const activeEvent = events[Math.min(eventIdx, Math.max(0, events.length - 1))] || null;

  // Money won per player across every day, for the season table.
  const moneyByPlayer = {};
  players.forEach((p) => (moneyByPlayer[p.id] = 0));
  events.forEach((ev) => {
    Object.entries(ev.purse.payouts).forEach(([pid, amt]) => (moneyByPlayer[pid] = (moneyByPlayer[pid] || 0) + amt));
  });

  const seasonPool = settings.seasonBuyIn * players.length + events.length * settings.seasonRakePerRound;

  // Season order is driven by quota points — total strokes over/under quota —
  // rather than finish-position points, since that's what the league cares about.
  const leaderboard = [...players]
    .filter((p) => (season.roundsPlayed[p.id] || 0) > 0)
    .sort((a, b) => (season.rawTotals[b.id] || 0) - (season.rawTotals[a.id] || 0));

  function updatePlayerFromStandings(id, patch) {
    setPlayers((ps) => ps.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  }
  const dashPlayer = dashPlayerId ? players.find((p) => p.id === dashPlayerId) : null;

  const skinsByPlayer = {};
  players.forEach((p) => (skinsByPlayer[p.id] = 0));
  leagueRounds.forEach((r) => {
    const course = courses.find((c) => c.id === r.courseId);
    if (!course) return;
    const skins = computeSkinsForRound(r, players, course, settings);
    if (skins) Object.entries(skins.tally).forEach(([pid, count]) => (skinsByPlayer[pid] = (skinsByPlayer[pid] || 0) + count));
  });

  async function generateAwards() {
    setAwardsError('');
    setAwards(null);
    if (!season.anyResults) {
      setAwardsError('Play at least one round first.');
      return;
    }
    setAwardsLoading(true);
    const summary = leaderboard
      .map(
        (p, i) =>
          `${p.name}: rank #${i + 1}, ${(season.rawTotals[p.id] || 0) >= 0 ? '+' : ''}${season.rawTotals[p.id] || 0} quota points, ${season.roundsPlayed[p.id] || 0} dogfights played, ${skinsByPlayer[p.id] || 0} skins won, $${moneyByPlayer[p.id] || 0} won`
      )
      .join('\n');
    const prompt = `You are writing a fun, lighthearted end-of-season awards write-up for a golf betting league called "${settings.leagueName}". Here is the season data, one line per player:
${summary}

Write 5 to 6 award categories (invent fitting categories from the data — things like season champion, most skins won, biggest overachiever vs quota, most rounds played / most dedicated, closest rivalry, etc). For each award, pick a real player from the data above by exact name where it fits the category. Keep the tone fun, warm, a little teasing — like a golf buddies group chat, not a corporate write-up. Each blurb should be 1-2 sentences and reference an actual stat from the data.
Respond with ONLY this JSON, no other text: [{"title": "Award Name", "player": "Full Name", "blurb": "1-2 sentence writeup"}]`;
    const res = await callGeminiJSON(prompt);
    setAwardsLoading(false);
    if (!res.ok) {
      setAwardsError(res.error);
      return;
    }
    if (!Array.isArray(res.data)) {
      setAwardsError("That didn't come back right — give it another tap.");
      return;
    }
    setAwards(res.data);
  }

  if (dashPlayer) {
    return (
      <PlayerDashboard
        settings={settings}
        player={dashPlayer}
        players={players}
        rounds={rounds || []}
        courses={courses || []}
        onBack={() => setDashPlayerId(null)}
        updatePlayer={updatePlayerFromStandings}
        backLabel="Standings"
      />
    );
  }

  return (
    <div>
      {events.length === 0 ? (
        <Card style={{ textAlign: 'center' }}>
          <div className="font-display text-xl mb-1" style={{ color: C.text }}>
            No dogfights yet
          </div>
          <p className="text-sm mb-3" style={{ color: C.muted }}>
            Add players, then start a round under <b style={{ color: C.text }}>Rounds &amp; Scores</b>.
            Once scores go in, the day's result and payouts show up here.
          </p>
          {players.length === 0 && (
            <PrimaryButton onClick={onGoPlayers} style={{ margin: '0 auto' }}>
              Add Players
            </PrimaryButton>
          )}
        </Card>
      ) : (
        <>
          {/* Day picker — most recent dogfight first */}
          {events.length > 1 && (
            <div className="flex gap-2 overflow-x-auto scrollbar-hide mb-3 pb-1">
              {events.map((ev, i) => (
                <button
                  key={ev.id}
                  onClick={() => setEventIdx(i)}
                  className="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold tap"
                  style={{
                    background: i === eventIdx ? C.lime : C.surface2,
                    color: i === eventIdx ? C.onAccent : C.muted,
                    border: `1px solid ${i === eventIdx ? C.lime : C.border}`,
                  }}
                >
                  {i === 0 ? 'Latest' : formatRoundDate(ev.date)}
                </button>
              ))}
            </div>
          )}

          {activeEvent && (() => {
            const purse = activeEvent.purse;
            const winner = purse.ranked[0];
            const winnerPlayer = winner ? players.find((p) => p.id === winner.id) : null;
            const tiedAtTop = purse.ranked.filter((x) => winner && x.result === winner.result);
            const evRound = leagueRounds.find((r) => r.id === activeEvent.roundIds[0]);
            const evCourse = evRound ? courses.find((c) => c.id === evRound.courseId) : null;
            return (
              <>
                <Card primary>
                  <div className="flex items-start justify-between gap-2 mb-1">
                    <div className="min-w-0">
                      <div className="font-display text-xl" style={{ color: C.text }}>
                        {formatRoundDate(activeEvent.date)}
                      </div>
                      <div className="text-xs" style={{ color: C.muted }}>
                        {evCourse ? evCourse.name : ''} · {purse.scoredCount} player
                        {purse.scoredCount === 1 ? '' : 's'}
                      </div>
                    </div>
                    <span className="shrink-0 px-2 py-0.5 rounded-full text-[10px] font-bold" style={{ background: C.limeSoft, color: C.lime }}>
                      DOGFIGHT
                    </span>
                  </div>
                  {winnerPlayer && (
                    <div className="rounded-2xl p-3 mt-3" style={{ background: C.surface }}>
                      <div className="text-[11px] uppercase tracking-wide" style={{ color: C.muted }}>
                        {tiedAtTop.length > 1 ? `Tied for the win (${tiedAtTop.length})` : 'Winner'}
                      </div>
                      <div className="font-display text-2xl" style={{ color: C.gold, textShadow: C.goldGlow }}>
                        {tiedAtTop.length > 1
                          ? tiedAtTop.map((x) => (players.find((p) => p.id === x.id) || {}).name).join(' & ')
                          : winnerPlayer.name}
                      </div>
                      <div className="text-xs" style={{ color: C.muted }}>
                        {winner.result >= 0 ? '+' : ''}
                        {winner.result} vs quota · ${purse.payouts[winner.id] || 0}
                      </div>
                    </div>
                  )}
                </Card>

                <Card>
                  <div className="font-display text-lg mb-1" style={{ color: C.text }}>
                    Result &amp; payouts
                  </div>
                  <div className="text-xs mb-3" style={{ color: C.muted }}>
                    {purse.scoredCount} × ${settings.purseBuyIn} = ${purse.pot} pot
                    {purse.rake > 0 && ` · −$${purse.rake} to the season pool`} ·{' '}
                    <b style={{ color: C.lime }}>${purse.payoutPool} paid out</b>
                  </div>
                  <div
                    className="grid gap-2 text-[10px] uppercase tracking-wide pb-1"
                    style={{ gridTemplateColumns: '18px 1fr 42px 42px 46px', color: C.muted, borderBottom: `1px solid ${C.border}` }}
                  >
                    <div />
                    <div>Player</div>
                    <div className="text-right">Quota</div>
                    <div className="text-right">Pts</div>

// ---------- Calendar tab (availability scheduling) ----------
function isoDate(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function dayAvailability(availability, dateKey) {
  return availability[dateKey] || {};
}
function countAvail(dayData, session) {
  return Object.values(dayData).filter((v) => v && v[session]).length;
}
function CalendarTab({ players, availability, setAvailability }) {
  const today = new Date();
  const todayKey = isoDate(today.getFullYear(), today.getMonth(), today.getDate());
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [selectedDay, setSelectedDay] = useState(todayKey);

  function shiftMonth(delta) {
    let m = viewMonth + delta,
      y = viewYear;
    if (m < 0) {
      m = 11;
      y--;
    }
    if (m > 11) {
      m = 0;
      y++;
    }
    setViewMonth(m);
    setViewYear(y);
  }

  function toggleAvail(dateKey, playerId, session) {
    setAvailability((av) => {
      const day = { ...(av[dateKey] || {}) };
      const cur = { am: false, pm: false, ...(day[playerId] || {}) };
      cur[session] = !cur[session];
      if (!cur.am && !cur.pm) delete day[playerId];
      else day[playerId] = cur;
      const next = { ...av };
      if (Object.keys(day).length === 0) delete next[dateKey];
      else next[dateKey] = day;
      return next;
    });
  }

  const monthName = new Date(viewYear, viewMonth, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const firstDow = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const selData = dayAvailability(availability, selectedDay);
  const selDate = new Date(selectedDay + 'T00:00:00');
  const selLabel = isNaN(selDate.getTime()) ? selectedDay : selDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const amPlayers = players.filter((p) => selData[p.id]?.am);
  const pmPlayers = players.filter((p) => selData[p.id]?.pm);

  // upcoming days (from today) with any availability, for the tee-time planner
  const upcoming = Object.keys(availability)
    .filter((k) => k >= todayKey)
    .sort()
    .slice(0, 6)
    .map((k) => {
      const d = dayAvailability(availability, k);
      return { key: k, am: countAvail(d, 'am'), pm: countAvail(d, 'pm') };
    })
    .filter((x) => x.am > 0 || x.pm > 0);

  function SessionSection({ label, session, icon, availList }) {
    return (
      <div className="mb-4 last:mb-0">
        <div className="flex items-center justify-between mb-2">
          <div className="text-[10px] uppercase tracking-wide" style={{ color: C.lime }}>
            {icon} {label}
          </div>
          <div className="text-[11px] font-display" style={{ color: availList.length >= 2 ? C.gold : C.faint }}>
            {availList.length} in{availList.length >= 4 ? ' — full group!' : availList.length >= 2 ? ' — enough to play' : ''}
          </div>
        </div>
        {availList.length > 0 && (
          <div className="text-xs mb-2" style={{ color: C.text }}>
            {availList.map((p) => p.name.split(/\s+/)[0]).join(', ')}
          </div>
        )}
        <div className="flex flex-wrap gap-2">
          {players.map((p) => {
            const on = selData[p.id]?.[session];
            return (
              <button
                key={p.id}
                onClick={() => toggleAvail(selectedDay, p.id, session)}
                className="px-3 py-1.5 rounded-full text-xs font-semibold tap"
                style={{ background: on ? C.lime : C.surface2, color: on ? C.onAccent : C.muted, transition: 'background-color 0.2s ease, color 0.2s ease, transform 0.12s ease' }}
              >
                {p.name.split(/\s+/)[0]}
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  return (
    <div>
      <Card>
        <div className="flex items-center justify-between mb-3">
          <button onClick={() => shiftMonth(-1)} className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: C.surface2, color: C.text }}>
            ‹
          </button>
          <div className="font-display text-xl" style={{ color: C.text }}>
            {monthName}
          </div>
          <button onClick={() => shiftMonth(1)} className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: C.surface2, color: C.text }}>
            ›
          </button>
        </div>
        <div className="grid grid-cols-7 gap-1 mb-1">
          {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d, i) => (
            <div key={i} className="text-center text-[10px] uppercase py-1" style={{ color: C.faint }}>
              {d}
            </div>
          ))}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((d, i) => {
            if (d == null) return <div key={i} />;
            const key = isoDate(viewYear, viewMonth, d);
            const dayData = dayAvailability(availability, key);
            const am = countAvail(dayData, 'am');
            const pm = countAvail(dayData, 'pm');
            const isToday = key === todayKey;
            const isSelected = key === selectedDay;
            return (
              <button
                key={i}
                onClick={() => setSelectedDay(key)}
                className="rounded-xl flex flex-col items-center justify-center py-1.5 tap"
                style={{
                  background: isSelected ? C.lime : C.surface2,
                  border: isToday && !isSelected ? `1.5px solid ${C.lime}` : '1.5px solid transparent',
                  minHeight: 44,
                  transition: 'background-color 0.2s ease, border-color 0.2s ease, transform 0.12s ease',
                }}
              >
                <span className="font-display text-sm leading-none" style={{ color: isSelected ? C.onAccent : C.text, transition: 'color 0.2s ease' }}>
                  {d}
                </span>
                {(am > 0 || pm > 0) && (
                  <span className="flex gap-0.5 mt-1">
                    {am > 0 && <span className="w-1.5 h-1.5 rounded-full" style={{ background: isSelected ? C.onAccent : C.lime }} />}
                    {pm > 0 && <span className="w-1.5 h-1.5 rounded-full" style={{ background: isSelected ? C.onAccent : C.cyan }} />}
                  </span>
                )}
              </button>
            );
          })}
        </div>
        <div className="flex items-center gap-3 mt-3 text-[10px]" style={{ color: C.faint }}>
          <span>
            <span className="inline-block w-1.5 h-1.5 rounded-full mr-1" style={{ background: C.lime }} />
            morning
          </span>
          <span>
            <span className="inline-block w-1.5 h-1.5 rounded-full mr-1" style={{ background: C.cyan }} />
            afternoon
          </span>
          <span className="ml-auto">Tap your name to mark yourself in</span>
        </div>
      </Card>

      <Card>
        <div className="font-display text-lg mb-3" style={{ color: C.text }}>
          {selLabel}
        </div>
        <SessionSection label="Morning" session="am" icon="🌅" availList={amPlayers} />
        <SessionSection label="Afternoon" session="pm" icon="🌇" availList={pmPlayers} />
      </Card>

      {upcoming.length > 0 && (
        <Card>
          <div className="font-display text-lg mb-1" style={{ color: C.text }}>
            Tee Time Planner
          </div>
          <p className="text-xs mb-2" style={{ color: C.muted }}>
            Upcoming days with players marked available — tap one to see who's in.
          </p>
          {upcoming.map(({ key, am, pm }) => {
            const d = new Date(key + 'T00:00:00');
            const label = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            return (
              <button key={key} onClick={() => setSelectedDay(key)} className="w-full flex items-center justify-between py-2" style={{ borderBottom: `1px solid ${C.border}` }}>
                <span className="text-sm" style={{ color: C.text }}>
                  {label}
                </span>
                <span className="text-xs font-display" style={{ color: C.muted }}>
                  {am > 0 && <span style={{ color: C.lime }}>{am} AM</span>}
                  {am > 0 && pm > 0 && ' · '}
                  {pm > 0 && <span style={{ color: C.cyan }}>{pm} PM</span>}
                </span>
              </button>
            );
          })}
        </Card>
      )}
    </div>
  );
}

// ---------- Game Finder tab (casual, non-league rounds) ----------
function GameFinderTab({ players, courses, setRounds, setEditingRoundId, setActiveTab }) {
  const [selectedIds, setSelectedIds] = useState([]);
  const [guests, setGuests] = useState(0);
  const [expandedId, setExpandedId] = useState(null);
  const [selectedGameId, setSelectedGameId] = useState(null);
  const [pairing, setPairing] = useState(null);
  const [pairingLoading, setPairingLoading] = useState(false);
  const [pairingError, setPairingError] = useState('');

  const n = selectedIds.length + guests;
  const selectedGame = GAME_LIBRARY.find((g) => g.id === selectedGameId) || null;
  const pairingEligible = selectedGame?.pairing && selectedIds.length === 4;

  function toggle(id) {
    setSelectedIds((ids) => (ids.includes(id) ? ids.filter((x) => x !== id) : [...ids, id]));
    setPairing(null);
  }
  function selectGame(id) {
    setSelectedGameId((cur) => (cur === id ? null : id));
    setExpandedId(id);
    setPairing(null);
  }

  async function suggestPairing() {
    setPairingError('');
    setPairing(null);
    if (!pairingEligible) return;
    setPairingLoading(true);
    const four = players.filter((p) => selectedIds.includes(p.id));
    const list = four.map((p) => `${p.name} (handicap ${p.handicap})`).join(', ');
    const prompt = `Four golfers are about to play "${selectedGame.name}" — ${selectedGame.rules}
Players: ${list}.
Suggest which 2 should partner against the other 2, using real strategy for this specific format (for example: in Best Ball a strong+weak pairing often covers bad holes well; in Alternate Shot or Chapman, similar-skill partners often reduces friction since shots alternate; adjust your reasoning to fit "${selectedGame.name}" specifically). Every player must be used exactly once, using their exact full name as given above.
Respond with ONLY this JSON: {"team1": ["Full Name", "Full Name"], "team2": ["Full Name", "Full Name"], "reasoning": "1-2 sentences explaining the strategy for this pairing in this specific format"}`;
    const res = await callGeminiJSON(prompt);
    setPairingLoading(false);
    if (!res.ok) {
      setPairingError(res.error);
      return;
    }
    const t1 = Array.isArray(res.data.team1) ? res.data.team1 : [];
    const t2 = Array.isArray(res.data.team2) ? res.data.team2 : [];
    const covered = new Set([...t1, ...t2]);
    if (t1.length !== 2 || t2.length !== 2 || four.some((p) => !covered.has(p.name))) {
      setPairingError("That didn't quite match your foursome — give it another tap to retry.");
      return;
    }
    const course = courses[0];
    const tee = defaultTee(course);
    const fakeRound = { teeName: tee.name, holes: 18 };
    const chOf = (name) => {
      const p = four.find((pp) => pp.name === name);
      return courseHandicapFor(fakeRound, p, course);
    };
    const t1ch = Math.round(((chOf(t1[0]) + chOf(t1[1])) / 2) * 10) / 10;
    const t2ch = Math.round(((chOf(t2[0]) + chOf(t2[1])) / 2) * 10) / 10;
    const diff = Math.round(Math.abs(t1ch - t2ch));
    const strokesTeam1 = t1ch > t2ch ? diff : 0;
    const strokesTeam2 = t2ch > t1ch ? diff : 0;
    setPairing({
      team1: t1,
      team2: t2,
      team1Ids: t1.map((name) => four.find((p) => p.name === name).id),
      team2Ids: t2.map((name) => four.find((p) => p.name === name).id),
      t1ch,
      t2ch,
      strokesTeam1,
      strokesTeam2,
      reasoning: res.data.reasoning || '',
    });
  }

  function beginCasualRound() {
    if (selectedIds.length === 0) return;
    const course = courses[0];
    const gameData = {};
    if (pairing && pairingEligible) {
      gameData.pairing = {
        team1: pairing.team1,
        team2: pairing.team2,
        team1Ids: pairing.team1Ids,
        team2Ids: pairing.team2Ids,
        strokesTeam1: pairing.strokesTeam1,
        strokesTeam2: pairing.strokesTeam2,
        reasoning: pairing.reasoning,
      };
    }
    const r = {
      id: uid(),
      date: new Date().toISOString().slice(0, 10),
      courseId: course.id,
      teeName: defaultTee(course).name,
      holes: 18,
      entryMode: 'holebyhole',
      combinedWith: null,
      playerIds: selectedIds,
      skinsOptIn: [],
      trashOptIn: [],
      trash: {},
      playerData: {},
      status: 'setup',
      currentHole: 0,
      pointsBasis: 'net',
      casual: true,
      gameId: selectedGameId,
      gameData,
    };
    setRounds((rs) => [r, ...rs]);
    setEditingRoundId(r.id);
    setActiveTab('rounds');
  }

  const perfect = GAME_LIBRARY.filter((g) => n >= g.min && n <= g.max && g.ideal.includes(n));
  const works = GAME_LIBRARY.filter((g) => n >= g.min && n <= g.max && !g.ideal.includes(n));
  const notNow = GAME_LIBRARY.filter((g) => n < g.min || n > g.max);

  function GameRow({ g, dim, selectable }) {
    const open = expandedId === g.id;
    const selected = selectedGameId === g.id;
    return (
      <div
        className="w-full rounded-2xl p-3 mb-2"
        style={{ background: selected ? C.limeSolid : open ? C.surface3 : C.surface2, border: `1.5px solid ${selected ? C.lime : open ? C.border : C.border}`, opacity: dim ? 0.45 : 1 }}
      >
        <button onClick={() => setExpandedId(open ? null : g.id)} className="w-full text-left">
          <div className="flex items-center justify-between gap-2">
            <div className="flex items-center gap-2 min-w-0">
              {selected && <Check size={14} style={{ color: C.lime, flexShrink: 0 }} />}
              <span className="font-display text-base truncate" style={{ color: C.text }}>
                {g.name}
              </span>
            </div>
            <span className="text-[10px] font-display shrink-0" style={{ color: C.muted }}>
