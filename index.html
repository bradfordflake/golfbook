                          {t.label}
                        </button>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          <div className="text-[10px] mt-2" style={{ color: C.faint }}>
            Birdies are counted automatically from the score above.
          </div>
        </Card>
      )}

      {/* next hole — big full-width lime button (reference style) */}
      {holeIdx < holes.length - 1 ? (
        <button
          onClick={() => setHole(holeIdx + 1)}
          className="w-full rounded-2xl flex items-center justify-center gap-2 tap mb-2"
          style={{ background: C.lime, color: C.onAccent, height: 58, fontWeight: 700, fontSize: 18 }}
        >
          <span className="font-display tracking-wide">NEXT HOLE {holeIdx + 2}</span>
          <span style={{ fontSize: 20 }}>→</span>
        </button>
      ) : (
        <button
          onClick={onFinish}
          className="w-full rounded-2xl flex items-center justify-center gap-2 tap mb-2"
          style={{ background: C.lime, color: C.onAccent, height: 58, fontWeight: 700, fontSize: 18 }}
        >
          <span className="font-display tracking-wide">FINISH ROUND</span>
          <span style={{ fontSize: 18 }}>✓</span>
        </button>
      )}
      {holeIdx > 0 && (
        <button onClick={() => setHole(holeIdx - 1)} className="w-full text-center text-xs font-semibold mb-4 tap" style={{ color: C.muted }}>
          ← Back to hole {holeIdx}
        </button>
      )}

      {/* live scoreboard, tailored to the selected game */}
      {settings.hideLiveStandings && !revealStandings ? (
        <button onClick={() => setRevealStandings(true)} className="w-full text-left tap" style={{ display: 'block' }}>
          <Card>
            <div className="flex items-center gap-2">
              <EyeOff size={16} color={C.muted} />
              <div className="min-w-0">
                <div className="text-sm font-semibold" style={{ color: C.text }}>
                  Live standings hidden
                </div>
                <div className="text-[11px]" style={{ color: C.muted }}>
                  Tap to reveal who's winning right now
                </div>
              </div>
            </div>
          </Card>
        </button>
      ) : (
        <div>
          <GameScoreboardCard settings={settings} round={round} course={course} players={activePlayers} patchGameData={patchGameData} />
          {settings.hideLiveStandings && (
            <button
              onClick={() => setRevealStandings(false)}
              className="w-full flex items-center justify-center gap-1.5 text-xs font-semibold mb-4 tap"
              style={{ color: C.muted }}
            >
              <EyeOff size={13} />
              Hide standings again
            </button>
          )}
        </div>
      )}

      <GhostButton onClick={onFinish} style={{ width: '100%', textAlign: 'center', marginBottom: 24 }}>
        End live scoring
      </GhostButton>

      {tickerOn && <LiveTicker settings={settings} round={round} course={course} players={activePlayers} />}
    </div>
  );
}

// ---------- Round Summary (shown after Finish round) ----------
function HoleByHoleRecap({ round, course, players }) {
  const holes = roundHoles(round, course);
  const isEighteen = holes.length > 9;
  const summaryLabels = isEighteen ? ['OUT', 'IN', 'TOT'] : ['TOT'];
  const summaryCount = summaryLabels.length;
  const frontPar = holes.slice(0, 9).reduce((s, h) => s + h.par, 0);
  const backPar = holes.slice(9).reduce((s, h) => s + h.par, 0);
  const parSummary = isEighteen ? [frontPar, backPar, frontPar + backPar] : [frontPar];
  return (
    <Card>
      <div className="font-display text-lg mb-2" style={{ color: C.text }}>
        Scorecard
      </div>
      <div style={{ overflowX: 'auto' }}>
        <div
          style={{
            display: 'grid',
            gridTemplateColumns: `100px repeat(${holes.length}, 32px) repeat(${summaryCount}, 38px)`,
            minWidth: 100 + holes.length * 32 + summaryCount * 38,
          }}
        >
          <div style={{ position: 'sticky', left: 0, background: C.surface }} className="text-[9px] uppercase py-1">
            <span style={{ color: C.muted }}>Hole</span>
          </div>
          {holes.map((h, i) => (
            <div key={i} className="text-[10px] text-center py-1 font-display" style={{ color: C.text }}>
              {i + 1}
            </div>
          ))}
          {summaryLabels.map((label, i) => (
            <div
              key={label}
              className="text-[9px] text-center py-1 font-display uppercase"
              style={{ color: C.lime, borderLeft: i === 0 ? `1px solid ${C.border}` : 'none' }}
            >
              {label}
            </div>
          ))}
          <div style={{ position: 'sticky', left: 0, background: C.surface }} className="text-[9px] py-1">
            <span style={{ color: C.muted }}>Par</span>
          </div>
          {holes.map((h, i) => (
            <div key={i} className="text-[10px] text-center py-1" style={{ color: C.muted }}>
              {h.par}
            </div>
          ))}
          {parSummary.map((val, i) => (
            <div
              key={i}
              className="text-[10px] text-center py-1 font-semibold"
              style={{ color: C.muted, borderLeft: i === 0 ? `1px solid ${C.border}` : 'none' }}
            >
              {val}
            </div>
          ))}
          <div style={{ position: 'sticky', left: 0, background: C.surface }} className="text-[9px] py-1 mb-1">
            <span style={{ color: C.muted }}>Stroke Idx</span>
          </div>
          {holes.map((h, i) => (
            <div key={i} className="text-[10px] text-center py-1 mb-1" style={{ color: C.faint, borderBottom: `1px solid ${C.border}` }}>
              {h.si}
            </div>
          ))}
          {summaryLabels.map((_, i) => (
            <div
              key={i}
              className="text-[10px] text-center py-1 mb-1"
              style={{ borderBottom: `1px solid ${C.border}`, borderLeft: i === 0 ? `1px solid ${C.border}` : 'none' }}
            />
          ))}
          {players.map((p) => {
            const scores = holes.map((h, i) => round.playerData[p.id]?.holeScores?.[i]);
            const frontSum = partialSum(scores.slice(0, 9));
            const backSum = partialSum(scores.slice(9));
            const totalSum = partialSum(scores);
            const sumsSummary = isEighteen ? [frontSum, backSum, totalSum] : [totalSum];
            return (
              <React.Fragment key={p.id}>
                <div style={{ position: 'sticky', left: 0, background: C.surface }} className="text-[11px] py-1 truncate pr-1 flex items-center gap-1" title={`${p.name} · ${playerTeeName(round, p.id)} tees`}>
                  <span
                    className="rounded-full shrink-0"
                    style={{ width: 8, height: 8, background: teeSwatch(playerTeeName(round, p.id)), border: `1px solid ${C.faint}` }}
                  />
                  <span className="truncate" style={{ color: C.text }}>{p.name}</span>
                </div>
                {holes.map((h, i) => {
                  const g = round.playerData[p.id]?.holeScores?.[i];
                  return (
                    <div key={i} className="flex items-center justify-center" style={{ height: 30 }}>
                      <ScoreMark strokes={g} par={h.par} size={19} fontSize={11} />
                    </div>
                  );
                })}
                {sumsSummary.map((val, i) => (
                  <div
                    key={i}
                    className="flex items-center justify-center"
                    style={{ height: 30, borderLeft: i === 0 ? `1px solid ${C.border}` : 'none' }}
                  >
                    <span className="font-display" style={{ fontSize: 12, fontWeight: 700, color: val != null ? C.lime : C.faint }}>
                      {val ?? '–'}
                    </span>
                  </div>
                ))}
              </React.Fragment>
            );
          })}
        </div>
      </div>
      <div className="flex items-center gap-3 flex-wrap mt-3 text-[10px]" style={{ color: C.faint }}>
        {[
          { s: 2, label: 'eagle+' },
          { s: 3, label: 'birdie' },
          { s: 4, label: 'par' },
          { s: 5, label: 'bogey' },
          { s: 6, label: 'double+' },
        ].map((x) => (
          <span key={x.label} className="flex items-center gap-1">
            <ScoreMark strokes={x.s} par={4} size={15} fontSize={9} />
            {x.label}
          </span>
        ))}
      </div>
    </Card>
  );
}

function RoundSummary({ round, course, players, courses, rounds, settings, onDone, onReopen }) {
  const activePlayers = roundPlayerList(round, players);
  const game = GAME_LIBRARY.find((g) => g.id === round.gameId) || null;
  const holes = roundHoles(round, course);

  const scoreRows = activePlayers
    .map((p) => {
      let total = 0,
        thru = 0;
      holes.forEach((h, i) => {
        const g = round.playerData[p.id]?.holeScores?.[i];
        if (g != null) {
          total += g;
          thru++;
        }
      });
      return { p, total, thru, toPar: total - holes.slice(0, thru).reduce((s, h) => s + h.par, 0) };
    })
    .sort((a, b) => (a.thru === 0 ? 1 : b.thru === 0 ? -1 : a.total - b.total));

  const purse = !round.casual ? purseForRound(settings, round, activePlayers, course) : null;
  const skinsRound = round.entryMode === 'holebyhole' ? { ...round } : null;
  const skins = skinsRound ? computeSkinsForRound(skinsRound, activePlayers, course, settings) : null;
  const trash = round.entryMode === 'holebyhole' ? computeTrashForRound(round, activePlayers, course, settings) : null;
  const hasMoney = (purse && purse.scoredCount > 0) || (skins && skins.pot > 0) || (trash && trash.totalItems > 0);

  let impact = null;
  if (!round.casual) {
    const leagueRounds = rounds.filter((r) => !r.casual);
    const events = getEvents(leagueRounds);
    const event = events.find((e) => e.roundIds.includes(round.id));
    if (event) {
      const { pointsMap, ranked } = computeEventRanking(settings, event, leagueRounds, courses, players);
      const season = computeSeason(settings, leagueRounds, courses, players);
      const leaderboard = [...players].sort((a, b) => (season.seasonTotals[b.id] || 0) - (season.seasonTotals[a.id] || 0));
      impact = { pointsMap, ranked, season, leaderboard };
    }
  }

  return (
    <div>
      <RoundPhotoBanner course={course} />

      <div className="text-center py-3 fade-in" style={{ position: 'relative' }}>
        <div className="font-display text-3xl leading-none pop-in" style={{ color: C.lime, textShadow: C.limeGlow }}>
          ROUND COMPLETE
        </div>
        <div className="text-xs mt-1" style={{ color: C.muted }}>
          {round.date} · {course?.name} · {round.holes}-hole{round.casual ? ' · Casual' : ''}
          {game ? ` · ${game.name}` : ''}
        </div>
        {['⛳', '🏆', '✨', '🎉'].map((e, i) => (
          <span
            key={i}
            className="float-particle text-lg"
            style={{ left: `${20 + i * 20}%`, top: '10px', animationDelay: `${i * 0.12}s` }}
          >
            {e}
          </span>
        ))}
      </div>

      <div className="tab-fade-in" style={{ animationDelay: '0.08s' }}>
        <GameScoreboardCard settings={settings} round={round} course={course} players={activePlayers} readOnly />
      </div>

      <div className="tab-fade-in" style={{ animationDelay: '0.16s' }}>
        <Card>
          <div className="font-display text-lg mb-2" style={{ color: C.text }}>
            Total Score
          </div>
          {scoreRows.map(({ p, total, thru, toPar }, i) => (
            <BoardRow
              key={p.id}
              rank={i + 1}
              name={p.name}
              value={thru > 0 ? total : '–'}
              sub={thru > 0 ? `${toPar === 0 ? 'E' : toPar > 0 ? `+${toPar}` : toPar} · thru ${thru}` : 'no scores'}
            />
          ))}
        </Card>
      </div>

      <div className="tab-fade-in" style={{ animationDelay: '0.24s' }}>
        {round.entryMode === 'holebyhole' ? (
          <HoleByHoleRecap round={round} course={course} players={activePlayers} />
        ) : (
          <EmptyNote text="This round was scored by total points, not hole-by-hole, so there's no scorecard to show." />
        )}
      </div>

      {hasMoney && (
        <div className="tab-fade-in" style={{ animationDelay: '0.32s' }}>
        <Card>
          <div className="font-display text-lg mb-2" style={{ color: C.text }}>
            Money Won
          </div>
          {purse && purse.scoredCount > 0 && (
            <div className="mb-3">
              <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: C.muted }}>
                Weekly purse — pot ${purse.pot} (${purse.rake} to season pool)
              </div>
              {purse.ranked.map((r, i) => {
                const p = players.find((pp) => pp.id === r.id);
                const pay = purse.payouts[r.id] || 0;
                return <BoardRow key={r.id} rank={i + 1} name={p?.name || '?'} value={pay > 0 ? `$${pay}` : '—'} sub={`${r.result >= 0 ? '+' : ''}${r.result}`} />;
              })}
            </div>
          )}
          {skins && skins.pot > 0 && (
            <div>
              <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: C.muted }}>
                Skins — pot ${skins.pot}
              </div>
              {skins.players
                .map((p) => ({ p, count: skins.tally[p.id], pay: skins.payouts[p.id] }))
                .sort((a, b) => b.count - a.count)
                .map(({ p, count, pay }) => (
                  <div key={p.id} className="flex items-center justify-between py-1.5" style={{ borderBottom: `1px solid ${C.border}` }}>
                    <span style={{ color: count > 0 ? C.text : C.muted, fontWeight: count > 0 ? 600 : 400 }}>{p.name}</span>
                    <span className="font-display text-sm" style={{ color: count > 0 ? C.gold : C.faint }}>
                      {count} skin{count === 1 ? '' : 's'} · ${pay.toFixed(2)}
                    </span>
                  </div>
                ))}
            </div>
          )}
          {trash && trash.totalItems > 0 && (
            <div className={skins && skins.pot > 0 ? 'mt-3' : ''}>
              <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: C.muted }}>
                Trash — ${trash.value} per item
              </div>
              {trash.players
                .map((p) => ({ p, t: trash.tally[p.id], pay: trash.payouts[p.id] }))
                .sort((a, b) => b.t.total - a.t.total)
                .map(({ p, t, pay }) => (
                  <div key={p.id} className="flex items-center justify-between py-1.5" style={{ borderBottom: `1px solid ${C.border}` }}>
                    <div className="min-w-0">
                      <div style={{ color: t.total > 0 ? C.text : C.muted, fontWeight: t.total > 0 ? 600 : 400 }}>{p.name}</div>
                      {t.total > 0 && (
                        <div className="text-[10px]" style={{ color: C.faint }}>
                          {[
                            t.greenie ? `${t.greenie} greenie${t.greenie === 1 ? '' : 's'}` : null,
                            t.sandie ? `${t.sandie} sandie${t.sandie === 1 ? '' : 's'}` : null,
                            t.polie ? `${t.polie} polie${t.polie === 1 ? '' : 's'}` : null,
                            t.birdie ? `${t.birdie} birdie${t.birdie === 1 ? '' : 's'}` : null,
                          ]
                            .filter(Boolean)
                            .join(' · ')}
                        </div>
                      )}
                    </div>
                    <span className="font-display text-sm shrink-0" style={{ color: t.total > 0 ? C.gold : C.faint }}>
                      {t.total} item{t.total === 1 ? '' : 's'} · ${pay.toFixed(2)}
                    </span>
                  </div>
                ))}
            </div>
          )}
        </Card>
        </div>
      )}

      {impact && (
        <div className="tab-fade-in" style={{ animationDelay: '0.4s' }}>
        <Card>
          <div className="font-display text-lg mb-1" style={{ color: C.text }}>
            Dogfight League Impact
          </div>
          <p className="text-xs mb-2" style={{ color: C.muted }}>
            Season points earned this round, and each player's updated season standing.
          </p>
          {impact.ranked.map((x, i) => {
            const p = players.find((pp) => pp.id === x.id);
            const earned = impact.pointsMap[x.id];
            const total = impact.season.seasonTotals[x.id];
            const rank = impact.leaderboard.findIndex((pp) => pp.id === x.id) + 1;
            return (
              <div key={x.id} className="flex items-center justify-between py-2 row-in" style={{ borderBottom: `1px solid ${C.border}`, animationDelay: `${0.4 + Math.min(i, 10) * 0.04}s` }}>
                <div className="flex items-center gap-2 min-w-0">
                  <span className="font-display text-xs w-4" style={{ color: i === 0 ? C.gold : C.faint }}>
                    {i + 1}
                  </span>
                  <span className="text-sm truncate" style={{ color: C.text }}>
                    {p?.name || '?'}
                  </span>
                </div>
                <div className="text-right shrink-0">
                  <div className="font-display text-sm" style={{ color: C.lime }}>
                    +{earned} pts
                  </div>
                  <div className="text-[10px]" style={{ color: C.faint }}>
                    {total} total · #{rank} of {players.length}
                  </div>
                </div>
              </div>
            );
          })}
        </Card>
        </div>
      )}

      <PrimaryButton onClick={onDone} style={{ width: '100%', textAlign: 'center', marginBottom: 8 }}>
        Done
      </PrimaryButton>
      <GhostButton onClick={onReopen} style={{ width: '100%', textAlign: 'center', marginBottom: 24 }}>
        Reopen this round
      </GhostButton>
    </div>
  );
}

// ---------- Rounds & Scores tab ----------
function RoundsTab({ settings, players, courses, rounds, setRounds, editingRoundId, setEditingRoundId }) {
  const [showCasual, setShowCasual] = useState(false);
  const [showRoundDetails, setShowRoundDetails] = useState(false);
  const [selectMode, setSelectMode] = useState(false);
  const [selectedRoundIds, setSelectedRoundIds] = useState([]);
  function toggleSelectRound(id) {
    setSelectedRoundIds((ids) => (ids.includes(id) ? ids.filter((x) => x !== id) : [...ids, id]));
  }
  const [confirmDeleteIds, setConfirmDeleteIds] = useState(null);
  function performDelete() {
    if (!confirmDeleteIds || confirmDeleteIds.length === 0) return;
    deleteRounds(confirmDeleteIds);
    if (confirmDeleteIds.includes(editingRoundId)) setEditingRoundId(null);
    setSelectedRoundIds((ids) => ids.filter((id) => !confirmDeleteIds.includes(id)));
    setSelectMode(false);
    setConfirmDeleteIds(null);
  }
  function newRound() {
    const course = courses[0];
    const r = {
      id: uid(),
      date: new Date().toISOString().slice(0, 10),
      courseId: course.id,
      teeName: defaultTee(course).name,
      holes: 18,
      entryMode: 'holebyhole',
      combinedWith: null,
      playerIds: [],
      skinsOptIn: [],
      trashOptIn: [],
      trash: {},
      playerData: {},
      status: 'setup',
      currentHole: 0,
      // League/Dogfight rounds are quota games and are always scored gross;
      // effectivePointsBasis() enforces this regardless of what's stored.
      pointsBasis: 'gross',
      gameId: null,
      gameData: {},
    };
    setRounds((rs) => [r, ...rs]);
    setEditingRoundId(r.id);
  }
  function deleteRounds(ids) {
    setRounds((rs) => rs.filter((r) => !ids.includes(r.id)).map((r) => (ids.includes(r.combinedWith) ? { ...r, combinedWith: null } : r)));
  }
  function patchRound(id, patch) {
    setRounds((rs) => rs.map((r) => (r.id === id ? { ...r, ...patch } : r)));
  }
  function togglePlayerInRound(roundId, playerId) {
    setRounds((rs) =>
      rs.map((r) => {
        if (r.id !== roundId) return r;
        const current = Array.isArray(r.playerIds) ? r.playerIds : players.map((p) => p.id);
        const set = new Set(current);
        if (set.has(playerId)) set.delete(playerId);
        else set.add(playerId);
        return { ...r, playerIds: Array.from(set) };
      })
    );
  }
  function setRoundPlayerIds(roundId, ids) {
    patchRound(roundId, { playerIds: ids });
  }
  function patchPlayerData(roundId, playerId, patch) {
    setRounds((rs) =>
      rs.map((r) => {
        if (r.id !== roundId) return r;
        const pd = { ...(r.playerData[playerId] || {}), ...patch };
        return { ...r, playerData: { ...r.playerData, [playerId]: pd } };
      })
    );
  }
  function setHoleScore(roundId, playerId, holeIdx, val) {
    setRounds((rs) =>
      rs.map((r) => {
        if (r.id !== roundId) return r;
        const pd = r.playerData[playerId] || {};
        const holeScores = { ...(pd.holeScores || {}), [holeIdx]: val };
        return { ...r, playerData: { ...r.playerData, [playerId]: { ...pd, holeScores } } };
      })
    );
  }
  function setPlayerTee(roundId, playerId, teeName) {
    setRounds((rs) =>
      rs.map((r) => {
        if (r.id !== roundId) return r;
        const pd = r.playerData[playerId] || {};
        return { ...r, playerData: { ...r.playerData, [playerId]: { ...pd, teeName } } };
      })
    );
  }
  function toggleSkinsOptIn(roundId, playerId) {
    setRounds((rs) =>
      rs.map((r) => {
        if (r.id !== roundId) return r;
        const set = new Set(r.skinsOptIn || []);
        if (set.has(playerId)) set.delete(playerId);
        else set.add(playerId);
        return { ...r, skinsOptIn: Array.from(set) };
      })
    );
  }
  function cycleBestBallTeam(roundId, playerId) {
    setRounds((rs) =>
      rs.map((r) => {
        if (r.id !== roundId) return r;
        const pairing = r.gameData?.pairing || {};
        const t1 = new Set(pairing.team1Ids || []);
        const t2 = new Set(pairing.team2Ids || []);
        if (t1.has(playerId)) {
          t1.delete(playerId);
          t2.add(playerId);
        } else if (t2.has(playerId)) {
          t2.delete(playerId);
        } else {
          t1.add(playerId);
        }
        const nameOf = (id) => (players.find((x) => x.id === id) || {}).name || '';
        const ids1 = Array.from(t1);
        const ids2 = Array.from(t2);
        return {
          ...r,
          gameData: {
            ...(r.gameData || {}),
            pairing: { ...pairing, team1Ids: ids1, team2Ids: ids2, team1: ids1.map(nameOf), team2: ids2.map(nameOf) },
          },
        };
      })
    );
  }
  function toggleTrashOptIn(roundId, playerId) {
    setRounds((rs) =>
      rs.map((r) => {
        if (r.id !== roundId) return r;
        const set = new Set(r.trashOptIn || []);
        if (set.has(playerId)) set.delete(playerId);
        else set.add(playerId);
        return { ...r, trashOptIn: Array.from(set) };
      })
    );
  }
  function toggleTrashItem(roundId, holeIdx, playerId, trashTypeId) {
    setRounds((rs) =>
      rs.map((r) => {
        if (r.id !== roundId) return r;
        const holeTrash = { ...(r.trash?.[holeIdx] || {}) };
        const playerTrash = { ...(holeTrash[playerId] || {}) };
        playerTrash[trashTypeId] = !playerTrash[trashTypeId];
        holeTrash[playerId] = playerTrash;
        return { ...r, trash: { ...(r.trash || {}), [holeIdx]: holeTrash } };
      })
    );
  }
  function patchGameData(roundId, patch) {
    setRounds((rs) => rs.map((r) => (r.id === roundId ? { ...r, gameData: { ...(r.gameData || {}), ...patch } } : r)));
  }

  const editing = rounds.find((r) => r.id === editingRoundId);

  if (editing && editing.status === 'live') {
    const course = courses.find((c) => c.id === editing.courseId) || courses[0];
    return (
      <LiveScoring
        settings={settings}
        round={editing}
        players={players}
        course={course}
        patchRound={patchRound}
        setHoleScore={setHoleScore}
        toggleTrashItem={toggleTrashItem}
        patchGameData={patchGameData}
        onBackToSetup={() => patchRound(editing.id, { status: 'setup' })}
        onFinish={() => {
          patchRound(editing.id, { status: 'final' });
        }}
      />
    );
  }

  if (editing && editing.status === 'final') {
    const course = courses.find((c) => c.id === editing.courseId) || courses[0];
    return (
      <RoundSummary
        round={editing}
        course={course}
        players={players}
        courses={courses}
        rounds={rounds}
        settings={settings}
        onDone={() => setEditingRoundId(null)}
        onReopen={() => patchRound(editing.id, { status: editing.logged ? 'setup' : 'live' })}
      />
    );
  }

  if (editing) {
    const course = courses.find((c) => c.id === editing.courseId) || courses[0];
    const tee = getTee(course, editing.teeName);
    const holes = roundHoles(editing, course);
    const isEighteen = holes.length > 9;
    const summaryLabels = isEighteen ? ['OUT', 'IN', 'TOT'] : ['TOT'];
    const summaryCount = summaryLabels.length;
    const frontPar = holes.slice(0, 9).reduce((s, h) => s + h.par, 0);
    const backPar = holes.slice(9).reduce((s, h) => s + h.par, 0);
    const parSummary = isEighteen ? [frontPar, backPar, frontPar + backPar] : [frontPar];
    const otherNines = rounds.filter((r) => r.id !== editing.id && r.holes === 9 && (!r.combinedWith || r.combinedWith === editing.id));
    const activePlayers = roundPlayerList(editing, players);
    const selectedIds = Array.isArray(editing.playerIds) ? editing.playerIds : players.map((p) => p.id);
    const scoredCount = activePlayers.filter((p) => playerPointsInRound(settings, editing, p, course) != null).length;
    // Rounds that are already underway shouldn't be retroactively blocked, so
    // treat any started/scored round as having its tees settled. Logged rounds
    // are excluded: entering a score would otherwise satisfy the gate by
    // itself, and quota depends on the tee being right before scores go in.
    const roundStarted = !!editing.startedAt || Object.keys(editing.playerData || {}).length > 0;
    const teesConfirmed = !!editing.teeConfirmed || (!editing.logged && roundStarted);
    const quotaRange = activePlayers.length
      ? activePlayers.reduce((acc, p) => {
          const q = playerQuotaInRound(settings, editing, p, course);
          return { min: acc === null ? q : Math.min(acc.min, q), max: acc === null ? q : Math.max(acc.max, q) };
        }, null)
      : null;

    return (
      <div>
        <RoundPhotoBanner course={course} />
        <button onClick={() => setEditingRoundId(null)} className="text-sm font-semibold mb-3" style={{ color: C.lime }}>
          ← Rounds
        </button>

        {editing.casual && (
          <InfoNote>
            <b style={{ color: C.cyan }}>Casual round</b> — from Game Finder. Scoring and skins work the same, but this round is excluded from the Dogfight League season standings, purse, and money-in-play.
          </InfoNote>
        )}

        <div className="mb-3">
          <button
            onClick={() => setShowRoundDetails((v) => !v)}
            className="w-full flex items-center justify-between rounded-2xl px-3 py-2.5 tap"
            style={{ background: C.surface, border: `1px solid ${C.border}` }}
          >
            <div className="flex-1 min-w-0 text-left">
              <div className="font-display text-sm" style={{ color: C.text }}>
                Round Details
              </div>
              {!showRoundDetails && (
                <div className="text-[11px] mt-0.5 truncate" style={{ color: C.muted }}>
                  {editing.date} · {course.name} · {tee.name} · {editing.holes} holes
                </div>

                startedAt: editing.startedAt || new Date().toISOString(),
              });
            }}
            disabled={activePlayers.length === 0 || !teesConfirmed}
            style={{ width: '100%', textAlign: 'center', marginBottom: 8, paddingTop: 16, paddingBottom: 16, fontSize: 16 }}
          >
            {!teesConfirmed
              ? '⛳ Select your tees first'
              : editing.status === 'final' || Object.keys(editing.playerData).length > 0
              ? '▶ Resume live scoring'
              : '▶ Begin Round'}
          </PrimaryButton>
        )}
        {!teesConfirmed && (
          <div className="text-xs text-center mb-2 font-semibold" style={{ color: C.orange }}>
            Confirm the tees above — they set every quota for this round
          </div>
        )}
        {activePlayers.length === 0 && (
          <div className="text-xs text-center mb-2" style={{ color: C.muted }}>
            Select at least one player to begin
          </div>
        )}

        <GhostButton onClick={() => setConfirmDeleteIds([editing.id])} color={C.red} style={{ width: '100%', textAlign: 'center', marginBottom: 24 }}>
          Delete round
        </GhostButton>

        {confirmDeleteIds && (
          <ConfirmDialog
            title="Delete this round?"
            message="This will permanently remove the round, its scores, and any skins or purse results tied to it. This can't be undone."
            onCancel={() => setConfirmDeleteIds(null)}
            onConfirm={performDelete}
          />
        )}
      </div>
    );
  }

  function renderRoundRow(r, idx) {
    const course = courses.find((c) => c.id === r.courseId);
    const roundPlayers = roundPlayerList(r, players);
    const scored = course ? roundPlayers.filter((p) => playerPointsInRound(settings, r, p, course) != null).length : 0;
    const selected = selectedRoundIds.includes(r.id);
    return (
      <button
        key={r.id}
        onClick={() => (selectMode ? toggleSelectRound(r.id) : setEditingRoundId(r.id))}
        className="w-full text-left rounded-3xl p-4 mb-3 flex items-center gap-3 tab-fade-in"
        style={{ background: C.surface, border: `1px solid ${selectMode && selected ? C.lime : C.border}`, animationDelay: `${Math.min(idx, 10) * 0.05}s`, transition: 'border-color 0.2s ease' }}
      >
        {selectMode && (
          <span
            key={selected ? 'on' : 'off'}
            className="w-5 h-5 rounded shrink-0 check-pop"
            style={{ background: selected ? C.lime : 'transparent', border: `1.5px solid ${selected ? C.lime : C.faint}` }}
          />
        )}
        <div className="flex-1 min-w-0">
          <div className="flex items-center justify-between">
            <div className="min-w-0">
              <div className="font-display text-lg truncate" style={{ color: C.text }}>
                {roundGameLabel(r)}
              </div>
              <div className="text-xs truncate" style={{ color: C.muted }}>
                {roundNamesLabel(roundPlayers)} · {formatRoundDate(r.date)}
              </div>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              {r.casual && (
                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold" style={{ background: C.surface2, color: C.cyan, border: `1px solid ${C.cyan}` }}>
                  CASUAL
                </span>
              )}
              {r.status === 'live' && (
                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold live-pulse" style={{ background: C.red, color: '#fff' }}>
                  ● LIVE
                </span>
              )}
              {r.logged && r.status !== 'final' && (
                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold" style={{ background: C.surface2, color: C.lime, border: `1px solid ${C.lime}` }}>
                  ✎ LOGGING
                </span>
              )}
              {r.status === 'final' && (
                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold" style={{ background: C.limeSoft, color: C.lime, border: `1px solid ${C.lime}` }}>
                  ✓ COMPLETE
                </span>
              )}
              {(!r.status || r.status === 'setup') && (
                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold" style={{ background: C.surface2, color: C.muted, border: `1px solid ${C.border}` }}>
                  NOT STARTED
                </span>
              )}
              <div className="text-xs font-display" style={{ color: C.gold }}>
                {scored}/{roundPlayers.length} scored
              </div>
            </div>
          </div>
        </div>
      </button>
    );
  }

  const casualCount = rounds.filter((r) => r.casual).length;
  const visibleRounds = showCasual ? rounds : rounds.filter((r) => !r.casual);

  function confirmDeleteSelected() {
    if (selectedRoundIds.length === 0) return;
    setConfirmDeleteIds(selectedRoundIds);
  }

  return (
    <div style={{ paddingBottom: selectMode ? 88 : 0 }}>
      {selectMode ? (
        <div className="flex items-center justify-between gap-2 mb-4">
          <button
            onClick={() => setSelectedRoundIds(selectedRoundIds.length === visibleRounds.length ? [] : visibleRounds.map((r) => r.id))}
            className="text-xs font-semibold shrink-0"
            style={{ color: C.lime }}
          >
            {selectedRoundIds.length === visibleRounds.length && visibleRounds.length > 0 ? 'Deselect all' : 'Select all'}
          </button>
          <span className="text-xs shrink-0" style={{ color: C.muted }}>
            {selectedRoundIds.length} selected
          </span>
          <button
            onClick={() => {
              setSelectMode(false);
              setSelectedRoundIds([]);
            }}
            className="text-xs font-semibold shrink-0"
            style={{ color: C.muted }}
          >
            Cancel
          </button>
        </div>
      ) : (
        <PrimaryButton onClick={newRound} style={{ width: '100%', marginBottom: 12 }}>
          + New Round
        </PrimaryButton>
      )}

      {!selectMode && rounds.length > 0 && (
        <div className="flex items-center justify-between mb-3">
          {casualCount > 0 ? (
            <button onClick={() => setShowCasual((v) => !v)} className="text-xs font-semibold" style={{ color: C.cyan }}>
              {showCasual ? 'Hide' : 'Show'} casual rounds ({casualCount})
            </button>
          ) : (
            <span />
          )}
          <button onClick={() => setSelectMode(true)} className="text-xs font-semibold" style={{ color: C.muted }}>
            Select
          </button>
        </div>
      )}

      {(() => {
        const liveRounds = visibleRounds.filter((r) => r.status === 'live');
        const setupRounds = visibleRounds.filter((r) => !r.status || r.status === 'setup');
        const finalRounds = visibleRounds.filter((r) => r.status === 'final');
        return (
          <>
            {liveRounds.length > 0 && (
              <div className="mb-1">
                <SectionLabel>In Progress ({liveRounds.length})</SectionLabel>
                {liveRounds.map((r, idx) => renderRoundRow(r, idx))}
              </div>
            )}
            {setupRounds.length > 0 && (
              <div className="mb-1">
                <SectionLabel>Not Started ({setupRounds.length})</SectionLabel>
                {setupRounds.map((r, idx) => renderRoundRow(r, idx))}
              </div>
            )}
            {finalRounds.length > 0 && (
              <div className="mb-1">
                <SectionLabel>Completed ({finalRounds.length})</SectionLabel>
                {finalRounds.map((r, idx) => renderRoundRow(r, idx))}
              </div>
            )}
          </>
        );
      })()}
      {visibleRounds.length === 0 && rounds.length === 0 && (
        <div className="text-sm text-center py-6" style={{ color: C.muted }}>
          No rounds yet — create one above.
        </div>
      )}
      {visibleRounds.length === 0 && rounds.length > 0 && (
        <div className="text-sm text-center py-6" style={{ color: C.muted }}>
          All rounds so far are casual — tap "Show casual rounds" above to see them.
        </div>
      )}

      {selectMode && (
        <div className="fixed bottom-4 left-0 right-0 px-4" style={{ maxWidth: 480, margin: '0 auto' }}>
          <PrimaryButton
            onClick={confirmDeleteSelected}
            disabled={selectedRoundIds.length === 0}
            style={{ width: '100%', textAlign: 'center', background: selectedRoundIds.length > 0 ? C.red : C.surface2, color: selectedRoundIds.length > 0 ? '#fff' : C.faint }}
          >
            Delete {selectedRoundIds.length || ''} round{selectedRoundIds.length === 1 ? '' : 's'}
          </PrimaryButton>
        </div>
      )}

      {confirmDeleteIds && (
        <ConfirmDialog
          title={`Delete ${confirmDeleteIds.length} round${confirmDeleteIds.length === 1 ? '' : 's'}?`}
          message="This will permanently remove the selected round(s), their scores, and any skins or purse results tied to them. This can't be undone."
          onCancel={() => setConfirmDeleteIds(null)}
          onConfirm={performDelete}
        />
      )}
    </div>
  );
}

// ---------- Settings tab ----------
function SettingsTab({ settings, setSettings, players, setPlayers, courses, rounds, setRounds, availability, setAvailability, cloudStatus, cloudError, cloudLeagueId, aiStatus, aiErrorMsg, theme, setTheme }) {
  const fileInputRef = useRef(null);

  // --- League settings PIN gate ---
  // settingsUnlocked/draftSettings both live in local component state, so
  // navigating away from the Settings tab unmounts this component and wipes
  // them — the PIN is required again next visit, and any never-saved edits
  // are discarded rather than silently leaking into real settings.
  const [settingsUnlocked, setSettingsUnlocked] = useState(false);
  const [draftSettings, setDraftSettings] = useState(settings);
  const [pinPromptOpen, setPinPromptOpen] = useState(false);
  const [confirmSaveOpen, setConfirmSaveOpen] = useState(false);
  useEffect(() => {
    // Keep the draft mirrored to real settings while locked, so the dimmed
    // preview underneath the lock overlay never shows stale values (e.g.
    // after a cloud sync update from another device).
    if (!settingsUnlocked) setDraftSettings(settings);
  }, [settings, settingsUnlocked]);
  function patchDraft(p) {
    setDraftSettings((s) => ({ ...s, ...p }));
  }
  function handleUnlocked() {
    setDraftSettings(settings);
    setSettingsUnlocked(true);
    setPinPromptOpen(false);
  }
  const pendingChanges = diffSettings(settings, draftSettings);
  function discardDraft() {
    setDraftSettings(settings);
    setSettingsUnlocked(false);
  }
  function commitDraft() {
    setSettings(draftSettings);
    setConfirmSaveOpen(false);
    setSettingsUnlocked(false);
  }

  const [confirmMerge, setConfirmMerge] = useState(false);
  const dupePlan = planPlayerDedupe(players, rounds, availability);
  function mergeDuplicates() {
    const plan = planPlayerDedupe(players, rounds, availability);
    if (!plan.removeCount) return;
    const removed = new Set(Object.keys(plan.idMap));
    // Remap references first, then drop the extra player records. The existing
    // upward-sync pass notices the ids that vanished from state and deletes the
    // matching Firestore documents, so the cloud roster gets cleaned up too.
    setRounds((rs) => remapPlayerIds(rs, plan.idMap));
    setAvailability((av) => remapPlayerIds(av, plan.idMap));
    setPlayers((ps) => ps.filter((p) => !removed.has(p.id)));
  }
  function loadSample() {
    const newPlayers = makeDefaultPlayers();
    setPlayers(newPlayers);
    const sampleRound = {
      id: uid(),
      date: '2026-06-16',
      courseId: DEFAULT_COURSE.id,
      teeName: 'Grey',
      holes: 18,
      entryMode: 'holebyhole',
      combinedWith: null,
      playerIds: newPlayers.map((p) => p.id),
      skinsOptIn: [],
      trashOptIn: [],
      trash: {},
      playerData: {},
    };
    setRounds([sampleRound]);
  }
  function exportBackup() {
    const data = { settings, players, courses, rounds, availability };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${settings.leagueName.replace(/\s+/g, '-').toLowerCase()}-backup.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  function importBackup(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (data.settings) setSettings(data.settings);
        if (data.players) setPlayers(data.players);
        if (data.rounds) setRounds(data.rounds);
        if (data.availability) setAvailability(data.availability);
      } catch (err) {
        alert('Could not read that backup file.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }
  const [confirmErase, setConfirmErase] = useState(false);
  function eraseEverything() {
    setSettings(DEFAULT_SETTINGS);
    setPlayers([]);
    setRounds([]);

              {pendingChanges.length > 0 ? 'Discard changes' : 'Lock'}
            </GhostButton>
            <PrimaryButton onClick={() => setConfirmSaveOpen(true)} disabled={pendingChanges.length === 0} style={{ flex: 1, textAlign: 'center' }}>
              Save changes
            </PrimaryButton>
          </div>
        </Card>
      )}

      {pinPromptOpen && (
        <PinPrompt
          pin={LEAGUE_SETTINGS_PIN}
          title="Unlock league settings"
          message="Enter the league settings PIN to edit buy-ins, quota, point values, and other league-wide settings."
          onConfirm={handleUnlocked}
          onCancel={() => setPinPromptOpen(false)}
        />
      )}

      {confirmSaveOpen && (
        <ConfirmDialog
          title="Save league settings?"
          confirmLabel="Save changes"
          message={
            <div>
              <div className="mb-2">This will update:</div>
              <div className="rounded-xl p-2.5" style={{ background: C.surface2 }}>
                {pendingChanges.map((c) => (
                  <div key={c.key} className="flex items-center justify-between text-xs py-1" style={{ borderBottom: `1px solid ${C.border}` }}>
                    <span style={{ color: C.text }}>{c.label}</span>
                    <span style={{ color: C.muted }}>
                      {String(c.before)} <span style={{ color: C.lime }}>→</span> <b style={{ color: C.text }}>{String(c.after)}</b>
                    </span>
                  </div>
                ))}
              </div>
            </div>
          }
          onCancel={() => setConfirmSaveOpen(false)}
          onConfirm={commitDraft}
        />
      )}

      <Card>
        <SectionLabel>Duplicate players</SectionLabel>
        {dupePlan.removeCount === 0 ? (
          <p className="text-xs" style={{ color: C.muted }}>
            No duplicates found — {players.length} player{players.length === 1 ? '' : 's'} in the roster.
          </p>
        ) : (
          <>
            <p className="text-xs mb-2" style={{ color: C.muted }}>
              Found <b style={{ color: C.orange }}>{dupePlan.removeCount}</b> duplicate record
              {dupePlan.removeCount === 1 ? '' : 's'} across {dupePlan.merges.length} name
              {dupePlan.merges.length === 1 ? '' : 's'}. Merging keeps the copy your rounds already
              point at, moves any scores from the extras onto it, and deletes the leftovers here and
              in the cloud. That would take you from {players.length} to {players.length - dupePlan.removeCount} players.
            </p>
            <div className="mb-2 max-h-32 overflow-y-auto scrollbar-hide">
              {dupePlan.merges.map((m) => (
                <div key={m.keeperId} className="flex items-center justify-between text-[11px] py-0.5">
                  <span style={{ color: C.text }}>{m.name}</span>
                  <span style={{ color: C.faint }}>−{m.removed} {m.removed === 1 ? 'copy' : 'copies'}</span>
                </div>
              ))}
            </div>
            {dupePlan.conflicts.length > 0 && (
              <div className="rounded-xl p-2.5 mb-2" style={{ background: C.surface2, border: `1px solid ${C.orange}` }}>
                <div className="text-[11px] font-bold mb-1" style={{ color: C.orange }}>
                  ⚠ {dupePlan.conflicts.length} scoring conflict{dupePlan.conflicts.length === 1 ? '' : 's'}
                </div>
                <p className="text-[11px] leading-relaxed mb-1" style={{ color: C.muted }}>
                  In these rounds, two copies of the same person both have scores. Merging keeps the
                  surviving copy's card and discards the other. Check these rounds first.
                </p>
                {dupePlan.conflicts.slice(0, 6).map((c, i) => (
                  <div key={i} className="text-[11px]" style={{ color: C.text }}>
                    {c.name} · {formatRoundDate(c.date) || c.roundId}
                  </div>
                ))}
              </div>
            )}
            <GhostButton onClick={() => setConfirmMerge(true)} color={C.lime}>
              Merge {dupePlan.removeCount} duplicate{dupePlan.removeCount === 1 ? '' : 's'}
            </GhostButton>
          </>
        )}
      </Card>

      {confirmMerge && (
        <ConfirmDialog
          title="Merge duplicate players?"
          confirmLabel="Merge"
          message={`This removes ${dupePlan.removeCount} duplicate record${dupePlan.removeCount === 1 ? '' : 's'} and re-points any rounds, skins, trash and availability at the surviving player. Export a backup first if you want a safety net — this can't be undone.`}
          onCancel={() => setConfirmMerge(false)}
          onConfirm={() => {
            mergeDuplicates();
            setConfirmMerge(false);
          }}
        />
      )}

      <Card>
        <SectionLabel>Data</SectionLabel>
        <div className="grid grid-cols-2 gap-2 mb-2">
          <GhostButton onClick={loadSample}>Load sample data</GhostButton>
          <GhostButton onClick={exportBackup}>Export backup (.json)</GhostButton>
        </div>
        <div className="grid grid-cols-2 gap-2">
          <GhostButton onClick={() => fileInputRef.current?.click()}>Import backup</GhostButton>
          <GhostButton onClick={() => setConfirmErase(true)} color={C.red}>
            Erase everything
          </GhostButton>
        </div>
        <input ref={fileInputRef} type="file" accept="application/json" onChange={importBackup} style={{ display: 'none' }} />
        <InfoNote>All data is saved in this browser only. Use Export to keep a backup or move it to another device. Bookmark this page to find it again.</InfoNote>
      </Card>

      <Card>
        <SectionLabel>Appearance</SectionLabel>
        <p className="text-xs mb-2" style={{ color: C.muted }}>
          Light mode is easier to read in bright sun; dark mode saves battery and is easier on the eyes at night.
        </p>
        <Toggle2
          value={theme}
          onChange={setTheme}
          options={[
            { value: 'dark', label: '🌙 Dark' },
            { value: 'light', label: '☀️ Light' },
          ]}
        />
      </Card>

      {confirmErase && (
        <ConfirmDialog
          title="Erase everything?"
          message={
            cloudStatus === 'connected'
              ? "This wipes all players, rounds, and settings back to defaults — and since you're connected to Cloud Sync, it erases the shared data for everyone in this league, not just this device. Export a backup first if you want to keep this data."
              : "This wipes all players, courses, rounds, and settings back to defaults. This can't be undone — export a backup first if you want to keep this data."
          }
          confirmLabel="Erase"
          onCancel={() => setConfirmErase(false)}
          onConfirm={eraseEverything}
        />
      )}
    </div>
  );
}

// ---------- main app ----------
function DogfightLeague() {
  const [loading, setLoading] = useState(true);
  const [activeTab, setActiveTab] = useState('home');
  const [menuOpen, setMenuOpen] = useState(false);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [theme, setTheme] = useState('light');

  // keep the shared color palette in sync with the chosen theme on every render
  applyTheme(theme);

  const [players, setPlayers] = useState(makeDefaultPlayers);
  const [courses] = useState([DEFAULT_COURSE]);
  const [rounds, setRounds] = useState([]);
  const [availability, setAvailability] = useState({});
  const [editingRoundId, setEditingRoundId] = useState(null);
  const saveTimer = useRef(null);

  useEffect(() => {
    document.body.style.background = C.black;
    document.documentElement.style.background = C.black;
  }, [theme]);

  const [cloudStatus, setCloudStatus] = useState('disconnected'); // disconnected | connecting | connected | error | unavailable
  const [cloudError, setCloudError] = useState('');
  const [cloudLeagueId, setCloudLeagueId] = useState('');
  const dbRef = useRef(null);
  const lastSyncedRef = useRef({ players: {}, rounds: {}, availability: {}, settingsJSON: null });
  // Snapshot of what THIS device held on the previous save pass. Cloud
  // deletions are only issued for things that were present here and then
  // disappeared — i.e. an actual local delete. Previously deletion was inferred
  // purely from absence, which meant any moment where local state briefly
  // lagged behind lastSyncedRef (a snapshot lands, another collection's
  // listener fires before the rounds state commits) could delete real rounds
  // outright. Never infer destruction from absence.
  const prevLocalRef = useRef(null);
  // False until the first players snapshot has come back from Firestore. The
  // upward sync must not run before this: on a cold load, state still holds the
  // freshly seeded default roster and lastSyncedRef is empty, so the debounced
  // save would happily push all 14 seeds up as brand-new documents.
  const cloudHydratedRef = useRef(false);
  const unsubsRef = useRef([]);

  const [aiStatus, setAiStatus] = useState('checking'); // checking | ready | error | unavailable
  const [aiErrorMsg, setAiErrorMsg] = useState('');

  useEffect(() => {
    let tries = 0;
    const iv = setInterval(() => {
      tries++;
      if (typeof window === 'undefined' || typeof window.dflAI === 'undefined') {
        if (tries > 20) {
          setAiStatus('unavailable');
          clearInterval(iv);
        }
        return;
      }
      if (window.dflAI.ready) {
        setAiStatus('ready');
        clearInterval(iv);
      } else if (window.dflAI.error) {
        setAiStatus('error');
        setAiErrorMsg(window.dflAI.error);
        clearInterval(iv);
      } else if (tries > 20) {
        setAiStatus('unavailable');
        clearInterval(iv);
      }
    }, 250);
    return () => clearInterval(iv);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY);
        if (res && res.value) {
          const data = JSON.parse(res.value);
          if (data.settings) setSettings({ ...DEFAULT_SETTINGS, ...data.settings });
          if (data.players) setPlayers(data.players);
          if (data.rounds) setRounds(data.rounds);
          if (data.availability) setAvailability(data.availability);
          if (data.theme) setTheme(data.theme);
        }
      } catch (e) {}
      setLoading(false);
    })();
  }, []);

  // connect to Firebase once local data has loaded; no-op and harmless if the SDK isn't loaded
  useEffect(() => {
    if (loading) return; // wait for local storage to load first so we don't race the cloud listener
    // Recovery mode: never touch the cloud, so this device's local data stays
    // exactly as it is and can be exported safely.
    if (RECOVERY_MODE) {
      setCloudStatus('recovery');
      return;
    }
    // Use a saved custom config if the user pasted one; otherwise fall back to the
    // app's built-in Firebase project so every device shares one league by default.
    let cfg = loadCloudConfig();
    if (!cfg) {
      cfg = { ...DEFAULT_FIREBASE_CONFIG, leagueId: 'Dogfight League' };
    }
    if (!fbAvailable()) {
      setCloudStatus('unavailable');
      return;
    }
    setCloudStatus('connecting');
    setCloudLeagueId(cfg.leagueId);
    // Tracks whether we've handled the first snapshot for each collection yet.
    // On that first snapshot, if the cloud is empty but this device already has
    // local data, we push local data UP instead of wiping it with the empty cloud.
    const firstSnap = { players: true, rounds: true, availability: true, settings: true };
    cloudHydratedRef.current = false;
    try {
      if (!window.firebase.apps.length) window.firebase.initializeApp(cfg);
      const db = window.firebase.firestore();
      dbRef.current = db;
      const base = db.collection('leagues').doc(cfg.leagueId);
      const onErr = (err) => {
        setCloudStatus('error');
        setCloudError(err && err.message ? err.message : String(err));
      };

      const unsub1 = base.collection('players').onSnapshot((snap) => {
        if (snap.empty && firstSnap.players) {
          firstSnap.players = false;
          setPlayers((cur) => {
            if (cur.length) {
              const batch = db.batch();
              cur.forEach((p) => {
                batch.set(base.collection('players').doc(p.id), p, { merge: true });
                lastSyncedRef.current.players[p.id] = JSON.stringify(p);
              });
              batch.commit().catch((e) => { setCloudStatus('error'); setCloudError(e && e.message ? e.message : String(e)); });
            }
            return cur;
          });
          cloudHydratedRef.current = true;
          return;
        }
        firstSnap.players = false;
        const arr = [];
        const map = {};
        snap.forEach((doc) => {
          const d = { id: doc.id, ...doc.data() };
          arr.push(d);
          map[doc.id] = JSON.stringify(d);
        });
        lastSyncedRef.current.players = map;
        setPlayers(arr);
        cloudHydratedRef.current = true;
      }, onErr);

      const unsub2 = base.collection('rounds').onSnapshot((snap) => {
        if (snap.empty && firstSnap.rounds) {
          firstSnap.rounds = false;
          setRounds((cur) => {
            if (cur.length) {
              const batch = db.batch();
              cur.forEach((r) => {
                batch.set(base.collection('rounds').doc(r.id), r, { merge: true });
                lastSyncedRef.current.rounds[r.id] = JSON.stringify(r);
              });
              batch.commit().catch((e) => { setCloudStatus('error'); setCloudError(e && e.message ? e.message : String(e)); });
            }
            return cur;
          });
          return;
        }
        firstSnap.rounds = false;
        const arr = [];
        const map = {};
        snap.forEach((doc) => {
          const d = { id: doc.id, ...doc.data() };
          arr.push(d);
          map[doc.id] = JSON.stringify(d);
        });
        // Capture what we had previously pushed BEFORE overwriting it, so we
        // can work out which local edits haven't reached the cloud yet.
        const prevSynced = lastSyncedRef.current.rounds;
        lastSyncedRef.current.rounds = map;
        // Replay unsaved local edits on top of the snapshot. Without this, a
        // snapshot arriving mid-entry would wipe the score someone just typed
        // before their own debounced write had a chance to push it.
        setRounds((cur) => reconcileFromCloud(cur, arr, prevSynced));
      }, onErr);

      const unsub3 = base.collection('availability').onSnapshot((snap) => {
        if (snap.empty && firstSnap.availability) {
          firstSnap.availability = false;
          setAvailability((cur) => {
            const keys = Object.keys(cur);
            if (keys.length) {
              const batch = db.batch();
              keys.forEach((key) => {
                batch.set(base.collection('availability').doc(key), cur[key], { merge: true });
                lastSyncedRef.current.availability[key] = JSON.stringify(cur[key]);
              });
              batch.commit().catch((e) => { setCloudStatus('error'); setCloudError(e && e.message ? e.message : String(e)); });
            }
            return cur;
          });
          return;
        }
        firstSnap.availability = false;
        const obj = {};
        const map = {};
        snap.forEach((doc) => {
          obj[doc.id] = doc.data();
          map[doc.id] = JSON.stringify(doc.data());
        });
        lastSyncedRef.current.availability = map;
        setAvailability(obj);
      }, onErr);

      const unsub4 = base.collection('meta').doc('settings').onSnapshot((doc) => {
        if (!doc.exists && firstSnap.settings) {
          firstSnap.settings = false;
          setSettings((cur) => {
            base.collection('meta').doc('settings').set(cur).catch((e) => { setCloudStatus('error'); setCloudError(e && e.message ? e.message : String(e)); });
            lastSyncedRef.current.settingsJSON = JSON.stringify(cur);
            return cur;
          });
          return;
        }
        firstSnap.settings = false;
        if (doc.exists) {
          const data = doc.data();
          lastSyncedRef.current.settingsJSON = JSON.stringify(data);
          setSettings((s) => ({ ...DEFAULT_SETTINGS, ...data }));
        }
      }, onErr);

      unsubsRef.current = [unsub1, unsub2, unsub3, unsub4];
      setCloudStatus('connected');
    } catch (e) {
      setCloudStatus('error');
      setCloudError(e && e.message ? e.message : String(e));
    }
    return () => {
      unsubsRef.current.forEach((u) => u && u());
    };
  }, [loading]);

  useEffect(() => {
    if (loading) return;
    // In recovery mode we never write anything back — not to local storage and
    // not to the cloud. The device's data is frozen exactly as found so it can
    // be inspected and exported without risk of overwriting it.
    if (RECOVERY_MODE) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await window.storage.set(STORAGE_KEY, JSON.stringify({ settings, players, rounds, availability, theme }));
      } catch (e) {}

      if (dbRef.current && cloudStatus === 'connected' && cloudHydratedRef.current) {
        try {
          const db = dbRef.current;
          const base = db.collection('leagues').doc(cloudLeagueId);
          const batch = db.batch();
          let dirty = false;
          const prevLocal = prevLocalRef.current;

          const curPlayerIds = new Set(players.map((p) => p.id));
          players.forEach((p) => {
            const j = JSON.stringify(p);
            if (lastSyncedRef.current.players[p.id] !== j) {
              batch.set(base.collection('players').doc(p.id), p, { merge: true });
              lastSyncedRef.current.players[p.id] = j;
              dirty = true;
            }
          });
          // Only delete what genuinely vanished from this device's own state
          // since the last pass — never merely what's missing right now.
          if (prevLocal) {
            prevLocal.playerIds.forEach((id) => {
              if (!curPlayerIds.has(id) && lastSyncedRef.current.players[id] !== undefined) {
                batch.delete(base.collection('players').doc(id));
                delete lastSyncedRef.current.players[id];
                dirty = true;
              }
            });
          }

          const curRoundIds = new Set(rounds.map((r) => r.id));
          rounds.forEach((r) => {
            const j = JSON.stringify(r);
            if (lastSyncedRef.current.rounds[r.id] !== j) {
              // { merge: true } is critical for concurrent scoring. A plain
              // set() replaces the whole document, so if two people entered
              // scores within the debounce window the second write erased the
              // first — and a device that happened to hold an empty round
              // could wipe everyone's card. Merging writes only the keys this
              // device actually knows about and leaves the rest of
              // playerData/trash/gameData untouched in the cloud.
              batch.set(base.collection('rounds').doc(r.id), r, { merge: true });
              lastSyncedRef.current.rounds[r.id] = j;
              dirty = true;
            }
          });
          if (prevLocal) {
            prevLocal.roundIds.forEach((id) => {
              if (!curRoundIds.has(id) && lastSyncedRef.current.rounds[id] !== undefined) {
                batch.delete(base.collection('rounds').doc(id));
                delete lastSyncedRef.current.rounds[id];
                dirty = true;
              }
            });
          }

          const curAvailKeys = new Set(Object.keys(availability));
          curAvailKeys.forEach((key) => {
            const j = JSON.stringify(availability[key]);
            if (lastSyncedRef.current.availability[key] !== j) {
              batch.set(base.collection('availability').doc(key), availability[key], { merge: true });
              lastSyncedRef.current.availability[key] = j;
              dirty = true;
            }
          });
          if (prevLocal) {
            prevLocal.availKeys.forEach((key) => {
              if (!curAvailKeys.has(key) && lastSyncedRef.current.availability[key] !== undefined) {
                batch.delete(base.collection('availability').doc(key));
                delete lastSyncedRef.current.availability[key];
                dirty = true;
              }
            });
          }

          const settingsJSON = JSON.stringify(settings);
          if (lastSyncedRef.current.settingsJSON !== settingsJSON) {
            batch.set(base.collection('meta').doc('settings'), settings, { merge: true });
            lastSyncedRef.current.settingsJSON = settingsJSON;
            dirty = true;
          }

          if (dirty) await batch.commit();
          // Baseline for the next pass's deletion check. Only updated after a
          // successful sync attempt, so a failed commit can't cause a spurious
          // "it disappeared" conclusion next time round.
          prevLocalRef.current = {
            playerIds: new Set(players.map((p) => p.id)),
            roundIds: new Set(rounds.map((r) => r.id)),
            availKeys: new Set(Object.keys(availability)),
          };
        } catch (e) {
          setCloudStatus('error');
          setCloudError(e && e.message ? e.message : String(e));
        }
      }
    }, 500);
    return () => clearTimeout(saveTimer.current);
  }, [settings, players, rounds, availability, theme, loading, cloudStatus, cloudLeagueId]);

  if (loading) {
    return (
      <div className="min-h-screen" style={{ background: C.black }}>
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
          .font-display{font-family:'Space Grotesk',sans-serif;}
          @keyframes skeletonPulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
          .skeleton-block { background: ${C.surface2}; border-radius: 16px; animation: skeletonPulse 1.4s ease-in-out infinite; }
        `}</style>
        <div style={{ maxWidth: 480, margin: '0 auto' }}>
          <div className="flex items-center gap-3 px-4 pt-6 pb-4" style={{ borderBottom: `1px solid ${C.border}` }}>
            <div className="flex-1 min-w-0">
              <div className="skeleton-block" style={{ width: 130, height: 20, marginBottom: 8 }} />
              <div className="skeleton-block" style={{ width: 90, height: 12 }} />
            </div>
            <div className="skeleton-block" style={{ width: 40, height: 40, borderRadius: 999 }} />
          </div>
          <div className="p-4">
            <div className="skeleton-block" style={{ height: 100, marginBottom: 16 }} />
            <div className="skeleton-block" style={{ height: 150, marginBottom: 16 }} />
            <div className="skeleton-block" style={{ height: 70, marginBottom: 16 }} />
          </div>
        </div>
      </div>
    );
  }

  function createRoundFromHome(logged) {
    const course = courses[0];
    const r = {
      id: uid(),
      date: new Date().toISOString().slice(0, 10),
      courseId: course.id,
      teeName: defaultTee(course).name,
      holes: 18,
      entryMode: 'holebyhole',
      combinedWith: null,
      playerIds: [],
      skinsOptIn: [],
      trashOptIn: [],
      trash: {},
      playerData: {},
      status: 'setup',
      currentHole: 0,
      // League/Dogfight rounds are quota games and are always scored gross;
      // effectivePointsBasis() enforces this regardless of what's stored.
      pointsBasis: 'gross',
      gameId: null,
      gameData: {},
      // Logged rounds skip live scoring entirely — the setup screen hands you
      // an editable scorecard instead, for cards kept on paper.
      logged: !!logged,
    };
    setRounds((rs) => [r, ...rs]);
    setEditingRoundId(r.id);
    setActiveTab('rounds');
  }
  function beginRoundFromHome() {
    createRoundFromHome(false);
  }
  function logRoundFromHome() {
    createRoundFromHome(true);
  }

  const editingRound = activeTab === 'rounds' ? rounds.find((r) => r.id === editingRoundId) : null;
  const headerTitle = editingRound ? roundGameLabel(editingRound) : (TABS.find((t) => t.id === activeTab) || {}).label;
  const headerSub = editingRound ? formatRoundDate(editingRound.date) : null;

  return (
    <div style={{ maxWidth: 480, margin: '0 auto', minHeight: '100vh', background: C.black }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        .font-display { font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.01em; }
        body, .app-root { font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        input::placeholder { color: ${C.faint}; }
        select { color-scheme: ${theme === 'light' ? 'light' : 'dark'}; }

        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { 0% { transform: scale(0.82); opacity: 0; } 65% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
        @keyframes modalPop { 0% { transform: scale(0.9) translateY(6px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,69,58,0.55); } 50% { box-shadow: 0 0 0 6px rgba(255,69,58,0); } }
        @keyframes limePulse { 0%, 100% { box-shadow: 0 0 0 0 ${C.limeRing}; } 50% { box-shadow: 0 0 0 5px transparent; } }
        @keyframes warnPulse { 0%, 100% { box-shadow: 0 0 0 0 ${C.orange}; opacity: 1; } 50% { box-shadow: 0 0 0 6px transparent; opacity: 0.72; } }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; } 100% { transform: translateY(-70px) scale(1.5) rotate(20deg); opacity: 0; } }
        @keyframes checkPop { 0% { transform: scale(0.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
        @keyframes shimmerBar { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }
        @keyframes tickerScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .ticker-track { display: flex; width: max-content; animation: tickerScroll 32s linear infinite; }
        .ticker-track:hover { animation-play-state: paused; }
        @media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; } }
        @keyframes rowIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes barFill { from { width: 0%; } }
        @keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
        .row-in { animation: rowIn 0.35s cubic-bezier(0.16,1,0.3,1) both; }
        .bar-fill { transition: width 0.7s cubic-bezier(0.16,1,0.3,1); }
        .collapse-grid { display: grid; transition: grid-template-rows 0.28s cubic-bezier(0.16,1,0.3,1); grid-template-rows: 0fr; }
        .collapse-grid.open { grid-template-rows: 1fr; }
        .collapse-inner { overflow: hidden; min-height: 0; }

        .tab-fade-in { animation: fadeSlideUp 0.32s cubic-bezier(0.16,1,0.3,1) both; }
        .fade-in { animation: fadeIn 0.35s ease both; }
        .pop-in { animation: popIn 0.28s cubic-bezier(0.34,1.56,0.64,1) both; }
        .modal-pop { animation: modalPop 0.22s cubic-bezier(0.34,1.56,0.64,1) both; }
        .backdrop-fade { animation: fadeIn 0.18s ease both; }
        .live-pulse { animation: pulseGlow 1.8s ease-in-out infinite; }
        .lime-pulse { animation: limePulse 1.8s ease-in-out infinite; }
        .warn-pulse { animation: warnPulse 1.6s ease-in-out infinite; }
        .check-pop { animation: checkPop 0.22s cubic-bezier(0.34,1.56,0.64,1) both; }
        .float-particle { position: absolute; animation: floatUp 1.4s ease-out forwards; pointer-events: none; }

        .tap { transition: transform 0.12s ease, opacity 0.12s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease; -webkit-tap-highlight-color: transparent; }
        .tap:active { transform: scale(0.94); }
        button { transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease; }
        button:not(:disabled):active { transform: scale(0.96); }
        a, button, [role="button"] { -webkit-tap-highlight-color: transparent; }
      `}</style>
      <div className="app-root min-h-screen">
        <div className="flex items-center gap-3 px-4 pt-6 pb-4" style={{ borderBottom: `1px solid ${C.border}` }}>
          <div className="flex-1 min-w-0">
            <div key={headerTitle} className="font-display text-2xl leading-tight mt-1 truncate pop-in" style={{ color: C.text }}>
              {headerTitle}
            </div>
            {headerSub && (
              <div className="text-[11px] mt-0.5 truncate" style={{ color: C.muted }}>
                {headerSub}
              </div>
            )}
          </div>
          <span
            className={`w-2 h-2 rounded-full shrink-0 ${cloudStatus === 'connected' ? 'lime-pulse' : ''}`}
            title={cloudStatus === 'connected' ? `Synced · ${cloudLeagueId}` : cloudStatus === 'error' ? 'Sync error' : 'Local only'}
            style={{ background: cloudStatus === 'connected' ? C.lime : cloudStatus === 'error' ? C.red : cloudStatus === 'connecting' ? C.gold : C.faint }}
          />
          <button
            onClick={() => setMenuOpen(true)}
            aria-label="Open menu"
            className="w-10 h-10 rounded-full flex items-center justify-center shrink-0 tap"
            style={{ background: C.surface2 }}
          >
            <div style={{ width: 18 }}>
              <div style={{ height: 2, background: C.text, borderRadius: 2, marginBottom: 4 }} />
              <div style={{ height: 2, background: C.text, borderRadius: 2, marginBottom: 4 }} />
              <div style={{ height: 2, background: C.text, borderRadius: 2 }} />
            </div>
          </button>
        </div>

        {/* slide-in nav drawer */}
        <div style={{ position: 'fixed', inset: 0, zIndex: 60, pointerEvents: menuOpen ? 'auto' : 'none' }}>
          <div
            onClick={() => setMenuOpen(false)}
            style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.6)', opacity: menuOpen ? 1 : 0, transition: 'opacity 0.3s ease' }}
          />
          <div style={{ position: 'absolute', inset: 0, maxWidth: 480, margin: '0 auto' }}>
            <div
              style={{
                position: 'absolute',
                top: 0,
                right: 0,
                height: '100%',
                width: '76%',
                maxWidth: 300,
                background: C.surface,
                borderLeft: `1px solid ${C.border}`,
                transform: menuOpen ? 'translateX(0)' : 'translateX(100%)',
                transition: 'transform 0.34s cubic-bezier(0.16,1,0.3,1)',
                boxShadow: menuOpen ? '-24px 0 48px rgba(0,0,0,0.45)' : 'none',
                display: 'flex',
                flexDirection: 'column',
              }}
            >
              <div className="flex items-center justify-between px-4 pt-6 pb-4">
                <span className="font-display text-lg" style={{ color: C.text }}>
                  Menu
                </span>
                <button
                  onClick={() => setMenuOpen(false)}
                  aria-label="Close menu"
                  className="w-9 h-9 rounded-full flex items-center justify-center tap"
                  style={{ background: C.surface2, color: C.text }}
                >
                  <X size={18} />
                </button>
              </div>

              <div className="flex-1 overflow-y-auto px-3 scrollbar-hide">
                {TABS.map((t, i) => {
                  const active = activeTab === t.id;
                  return (
                    <button
                      key={t.id}
                      onClick={() => {
                        setActiveTab(t.id);
                        if (t.id !== 'rounds') setEditingRoundId(null);
                        setMenuOpen(false);
                      }}
                      className="w-full flex items-center rounded-2xl px-4 py-3 mb-1 text-left tap"
                      style={{
                        background: active ? C.surface2 : 'transparent',
                        borderLeft: active ? `3px solid ${C.lime}` : '3px solid transparent',
                        transform: menuOpen ? 'translateX(0)' : 'translateX(12px)',
                        opacity: menuOpen ? 1 : 0,
                        transition: `transform 0.3s cubic-bezier(0.16,1,0.3,1) ${0.06 + i * 0.035}s, opacity 0.3s ease ${0.06 + i * 0.035}s, background-color 0.15s ease`,
                      }}
                    >
                      <span className="font-semibold text-[15px]" style={{ color: active ? C.lime : C.text }}>
                        {t.label}
                      </span>
                    </button>
                  );
                })}
              </div>

              <div className="px-4 py-4" style={{ borderTop: `1px solid ${C.border}` }}>
                <div className="flex items-center gap-2">
                  <span
                    className={`w-2 h-2 rounded-full ${cloudStatus === 'connected' ? 'lime-pulse' : ''}`}
                    style={{ background: cloudStatus === 'connected' ? C.lime : cloudStatus === 'error' ? C.red : cloudStatus === 'connecting' ? C.gold : C.faint }}
                  />
                  <span className="text-xs font-semibold" style={{ color: C.muted }}>
                    {cloudStatus === 'connected' ? `Synced · ${cloudLeagueId}` : cloudStatus === 'connecting' ? 'Syncing…' : cloudStatus === 'error' ? 'Sync error' : 'Local only'}
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>

        {RECOVERY_MODE && (
          <div
            className="px-4 py-2.5 text-center"
            style={{ background: C.orange, color: '#1a1a1a' }}
          >
            <div className="font-display text-sm font-bold">🛟 RECOVERY MODE — nothing is being saved</div>
            <div className="text-[11px] mt-0.5">
              Cloud sync is off and this device's data is frozen. Export a backup from Settings, then
              reload without <b>?recover</b> to go back to normal.
            </div>
          </div>
        )}

        <div key={activeTab} className="px-4 pt-4 pb-10 tab-fade-in">
          {activeTab === 'home' && (
            <HomeTab
              settings={settings}
              players={players}
              rounds={rounds}
              courses={courses}
              onBeginRound={beginRoundFromHome}
              onLogRound={logRoundFromHome}
              onResume={(id) => {
                setEditingRoundId(id);
                setActiveTab('rounds');
              }}
              onGoTab={(t) => setActiveTab(t)}
            />
          )}
          {activeTab === 'standings' && <StandingsTab settings={settings} players={players} setPlayers={setPlayers} rounds={rounds} courses={courses} onGoPlayers={() => setActiveTab('players')} />}
          {activeTab === 'rounds' && (
            <RoundsTab settings={settings} players={players} courses={courses} rounds={rounds} setRounds={setRounds} editingRoundId={editingRoundId} setEditingRoundId={setEditingRoundId} />
          )}
          {activeTab === 'skins' && <SkinsTab settings={settings} players={players} rounds={rounds} courses={courses} />}
          {activeTab === 'calendar' && <CalendarTab players={players} availability={availability} setAvailability={setAvailability} />}
          {activeTab === 'gamefinder' && (
            <GameFinderTab players={players} courses={courses} setRounds={setRounds} setEditingRoundId={setEditingRoundId} setActiveTab={setActiveTab} />
          )}
          {activeTab === 'players' && <PlayersTab settings={settings} players={players} setPlayers={setPlayers} rounds={rounds} courses={courses} />}
          {activeTab === 'settings' && (
            <SettingsTab
              settings={settings}
              setSettings={setSettings}
              players={players}
              setPlayers={setPlayers}
              courses={courses}
              rounds={rounds}
              setRounds={setRounds}
              availability={availability}
              setAvailability={setAvailability}
              cloudStatus={cloudStatus}
              cloudError={cloudError}
              cloudLeagueId={cloudLeagueId}
              aiStatus={aiStatus}
              aiErrorMsg={aiErrorMsg}
              theme={theme}
              setTheme={setTheme}
            />
          )}
          {activeTab === 'howitworks' && <HowItWorksTab settings={settings} />}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<DogfightLeague />);
</script>
</body>
</html>
