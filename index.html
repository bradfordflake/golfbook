              reload without <b>?recover</b> to go back to normal.
            </div>
          </div>
        )}

        <PullToRefresh
          enabled={pullRefreshEnabled}
          status={cloudStatus}
          onRefresh={refreshCloudData}
        >
        <div
          key={activeTab}
          className={isLiveRoundMode ? 'px-4 pt-3' : 'px-4 pt-4 tab-fade-in'}
          style={{ paddingBottom: isLiveRoundMode ? 12 : 'calc(92px + env(safe-area-inset-bottom, 0px))' }}
        >
          {activeTab === 'home' && (
            <HomeTab
              theme={theme}
              settings={settings}
              players={players}
              rounds={rounds}
              courses={courses}
              availability={availability}
              myPlayerId={myPlayerId}
              onSetMyPlayer={setMyPlayerId}
              onOpenPlayerDashboard={(id) => {
                setDashboardPlayerId(id);
                setActiveTab('players');
              }}
              onBeginRound={beginRoundFromHome}
              onLogRound={logRoundFromHome}
              onResume={(id) => {
                setEditingRoundId(id);
                setActiveTab('rounds');
              }}
              onGoTab={(t) => setActiveTab(t)}
            />
          )}
          {activeTab === 'standings' && (
            <StandingsTab
              settings={settings}
              players={players}
              setPlayers={setPlayers}
              rounds={rounds}
              courses={courses}
              availability={availability}
              myPlayerId={myPlayerId}
              onSetMyPlayer={setMyPlayerId}
              onGoCalendar={() => setActiveTab('calendar')}
              onGoPlayers={() => setActiveTab('players')}
            />
          )}
          {activeTab === 'rounds' && (
            <RoundsTab settings={settings} players={players} courses={courses} rounds={rounds} setRounds={setRounds} editingRoundId={editingRoundId} setEditingRoundId={setEditingRoundId} cloudStatus={cloudStatus} saveStatus={saveStatus} onOpenCasual={() => { setEditingRoundId(null); setActiveTab('gamefinder'); }} onGoHome={() => setActiveTab('home')} />
          )}
          {activeTab === 'skins' && <SkinsTab settings={settings} players={players} rounds={rounds} courses={courses} />}
          {activeTab === 'calendar' && <CalendarTab players={players} availability={availability} setAvailability={setAvailability} />}
          {activeTab === 'gamefinder' && (
            <GameFinderTab players={players} courses={courses} rounds={rounds} myPlayerId={myPlayerId} setRounds={setRounds} setEditingRoundId={setEditingRoundId} setActiveTab={setActiveTab} />
          )}
          {activeTab === 'players' && (
            <PlayersTab
              settings={settings}
              players={players}
              setPlayers={setPlayers}
              rounds={rounds}
              courses={courses}
              availability={availability}
              dashboardPlayerId={dashboardPlayerId}
              setDashboardPlayerId={setDashboardPlayerId}
              myPlayerId={myPlayerId}
              onSetMyPlayer={setMyPlayerId}
              onGoCalendar={() => {
                setDashboardPlayerId(null);
                setActiveTab('calendar');
              }}
            />
          )}
          {activeTab === 'feedback' && (
            <FeedbackTab
              feedbackItems={feedbackItems}
              setFeedbackItems={setFeedbackItems}
              players={players}
              myPlayerId={myPlayerId}
              cloudStatus={cloudStatus}
              cloudLeagueId={cloudLeagueId}
            />
          )}
          {activeTab === 'settings' && (
            <SettingsTab
              settings={settings}
              setSettings={setSettings}
              players={players}
              setPlayers={setPlayers}
              courses={courses}
              rounds={rounds}
              setRounds={setRounds}
              availability={availability}
              setAvailability={setAvailability}
              feedbackItems={feedbackItems}
              setFeedbackItems={setFeedbackItems}
              cloudStatus={cloudStatus}
              cloudError={cloudError}
              cloudLeagueId={cloudLeagueId}
              aiStatus={aiStatus}
              aiErrorMsg={aiErrorMsg}
              theme={theme}
              setTheme={setTheme}
            />
          )}
          {activeTab === 'howitworks' && <HowItWorksTab settings={settings} />}
        </div>
        </PullToRefresh>

        {!isLiveRoundMode && (
          <nav
            aria-label="Primary navigation"
            style={{
              position: 'fixed',
              left: '50%',
              bottom: 0,
              transform: 'translateX(-50%)',
              width: 'min(100%, 480px)',
              zIndex: 45,
              background: C.surface,
              borderTop: `1px solid ${C.border}`,
              padding: '7px 8px calc(7px + env(safe-area-inset-bottom, 0px))',
              boxShadow: `0 -8px 24px ${C.shadow}`,
            }}
          >
            <div className="grid grid-cols-5 gap-1 items-end">
              {[
                { id: 'rounds', label: 'Rounds', IconComp: FlagIcon, action: () => setActiveTab('rounds') },
                { id: 'league', label: 'League', IconComp: LeagueShieldIcon, action: () => { setActiveTab('standings'); setEditingRoundId(null); } },
                { id: 'home', label: 'Home', IconComp: HomeIcon, action: () => { setActiveTab('home'); setEditingRoundId(null); } },
                { id: 'players', label: 'Players', IconComp: UsersIcon, action: () => { setDashboardPlayerId(null); setActiveTab('players'); setEditingRoundId(null); } },
                { id: 'more', label: 'More', IconComp: MoreIcon, action: () => setMenuOpen(true) },
              ].map(({ id, label, IconComp, action }) => {
                const active = bottomSection === id;
                const isHome = id === 'home';
                return (
                  <button
                    key={id}
                    onClick={action}
                    className="flex flex-col items-center justify-center gap-1 tap"
                    style={{
                      minHeight: isHome ? 66 : 58,
                      marginTop: isHome ? -5 : 0,
                      marginBottom: isHome ? -1 : 0,
                      borderRadius: isHome ? 13 : 16,
                      background: isHome
                        ? theme === 'dark'
                          ? `linear-gradient(135deg, ${C.lime} 0%, #A9E92F 100%)`
                          : 'linear-gradient(135deg, #0B6A35 0%, #07592E 100%)'
                        : active
                        ? C.limeSoft
                        : 'transparent',
                      color: isHome ? (theme === 'dark' ? C.onAccent : '#FFFFFF') : active ? C.lime : C.muted,
                      border: isHome
                        ? theme === 'dark'
                          ? '1px solid rgba(198,255,61,0.72)'
                          : '1px solid rgba(255,255,255,0.14)'
                        : '1px solid transparent',
                      boxShadow: isHome
                        ? theme === 'dark'
                          ? '0 5px 16px rgba(198,255,61,0.22)'
                          : '0 5px 14px rgba(7,89,46,0.28)'
                        : 'none',
                    }}
                  >
                    {isHome
                      ? <IconComp size={25} active />
                      : <IconComp size={id === 'league' ? 23 : 22} />}
                    <span className={`${isHome ? 'font-display text-xs' : 'text-[11px]'} font-bold`}>{label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
        )}
      </div>
    </div>
  );
}


// Without this, any render error anywhere in the app unmounts everything and
// leaves a blank white screen — indistinguishable from a crash when you're
// standing on the 14th tee. Scores are already safe in localStorage and the
// cloud at this point; the job here is to say so and offer a way back.
class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    try {
      console.error('Dogfight League render error:', error, info);
    } catch (e) {
      /* console may be unavailable */
    }
  }
  render() {
    if (!this.state.error) return this.props.children;
    const wrap = {
      minHeight: '100vh',
      background: '#0B1220',
      color: '#F8FAFC',
      padding: 24,
      fontFamily: 'system-ui, -apple-system, Segoe UI, Roboto, sans-serif',
      display: 'flex',
      flexDirection: 'column',
      justifyContent: 'center',
      gap: 14,
    };
    const btn = {
      width: '100%',
      height: 52,
      borderRadius: 16,
      border: 'none',
      fontWeight: 700,
      fontSize: 16,
      cursor: 'pointer',
    };
    return (
      <div style={wrap}>
        <div style={{ fontSize: 22, fontWeight: 800 }}>Something went wrong on this screen</div>
        <div style={{ fontSize: 15, lineHeight: 1.5, color: '#CBD5E1' }}>
          Your scores are safe. They are saved on this phone and, if you were online, in the
          league cloud. Reloading will bring them back.
        </div>
        <button style={{ ...btn, background: '#A3E635', color: '#0B1220' }} onClick={() => window.location.reload()}>
          Reload the app
        </button>
        <button
          style={{ ...btn, background: 'transparent', color: '#94A3B8', border: '1px solid #334155' }}
          onClick={() => {
            window.location.href = window.location.pathname + '?recover';
          }}
        >
          Open in recovery mode (this phone's data only)
        </button>
        <details style={{ fontSize: 12, color: '#64748B', marginTop: 4 }}>
          <summary style={{ cursor: 'pointer' }}>Technical details</summary>
          <pre style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word', marginTop: 8 }}>
            {String((this.state.error && this.state.error.stack) || this.state.error)}
          </pre>
        </details>
      </div>
    );
  }
}

// Mount defensively. If a CDN file went missing despite the fallbacks above,
// say which one plainly rather than dying with a bare console error.
(function mountApp() {
  const rootEl = document.getElementById('root');
  const missing = [];
  if (typeof React === 'undefined') missing.push('React');
  if (typeof ReactDOM === 'undefined' || !ReactDOM.createRoot) missing.push('ReactDOM');
  if (missing.length) {
    window.__dflBootError = missing.join(' and ') + ' failed to load';
    if (rootEl) {
      rootEl.innerHTML =
        '<div style="min-height:100vh;background:#0B1220;color:#F8FAFC;padding:24px;' +
        'font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;' +
        'flex-direction:column;justify-content:center;gap:14px">' +
        '<div style="font-size:22px;font-weight:800">Couldn\'t finish loading</div>' +
        '<div style="font-size:15px;line-height:1.5;color:#CBD5E1">' +
        missing.join(' and ') +
        ' didn\'t download. This is a network problem, not your data — every score is still ' +
        'saved on this phone and in the league cloud. Check your signal and reload.</div>' +
        '<button onclick="window.location.reload()" style="width:100%;height:52px;' +
        'border-radius:16px;border:none;background:#A3E635;color:#0B1220;font-weight:700;' +
        'font-size:16px;cursor:pointer">Reload the app</button></div>';
    }
    return;
  }
  ReactDOM.createRoot(rootEl).render(
    <AppErrorBoundary>
      <DogfightLeague />
    </AppErrorBoundary>
  );
})();
</script>
<!-- Last-resort watchdog. If Babel itself never loaded, the app script above is
     never compiled or run at all, so none of its own error handling exists.
     This plain script always runs; if nothing has rendered shortly after load,
     it explains why instead of leaving a blank white screen. -->
<script>
  (function bootWatchdog() {
    function check() {
      var rootEl = document.getElementById('root');
      if (!rootEl || rootEl.children.length > 0) return;
      var reason = window.__dflBootError;
      if (!reason) {
        var missing = [];
        if (typeof React === 'undefined') missing.push('React');
        if (typeof ReactDOM === 'undefined') missing.push('ReactDOM');
        if (typeof Babel === 'undefined') missing.push('Babel');
        reason = missing.length ? missing.join(', ') + ' failed to load' : 'the app did not start';
      }
      rootEl.innerHTML =
        '<div style="min-height:100vh;background:#0B1220;color:#F8FAFC;padding:24px;' +
        'font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;' +
        'flex-direction:column;justify-content:center;gap:14px">' +
        '<div style="font-size:22px;font-weight:800">Couldn\'t finish loading</div>' +
        '<div style="font-size:15px;line-height:1.5;color:#CBD5E1">' + reason +
        '. Your scores are safe on this phone and in the league cloud. ' +
        'Check your signal and reload.</div>' +
        '<button onclick="window.location.reload()" style="width:100%;height:52px;' +
        'border-radius:16px;border:none;background:#A3E635;color:#0B1220;font-weight:700;' +
        'font-size:16px;cursor:pointer">Reload the app</button></div>';
    }
    if (document.readyState === 'complete') setTimeout(check, 4000);
    else window.addEventListener('load', function () { setTimeout(check, 4000); });
  })();
</script>
