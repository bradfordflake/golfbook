                </span>
                <div className="flex items-center gap-3 shrink-0">
                  <div className="text-center">
                    <div className="text-[9px] uppercase" style={{ color: C.faint }}>
                      Quota
                    </div>
                    <input
                      type="number"
                      className="w-12 text-center text-sm rounded-lg px-1 py-0.5 outline-none"
                      style={{ background: C.surface2, color: C.muted, fontSize: 16 }}
                      value={editing.playerData[p.id]?.quotaOverride ?? quota}
                      onChange={(e) => patchPlayerData(editing.id, p.id, { quotaOverride: e.target.value === '' ? null : Number(e.target.value) })}
                    />
                  </div>
                  <div className="text-center">
                    <div className="text-[9px] uppercase" style={{ color: C.faint }}>
                      Points
                    </div>
                    {editing.entryMode === 'points' ? (
                      <input
                        type="number"
                        className="w-14 text-center text-sm rounded-lg px-1 py-0.5 outline-none"
                        style={{ background: C.surface2, color: C.text, fontSize: 16 }}
                        value={editing.playerData[p.id]?.points ?? ''}
                        onChange={(e) => patchPlayerData(editing.id, p.id, { points: e.target.value === '' ? null : Number(e.target.value) })}
                      />
                    ) : (
                      <div className="w-14 text-center font-display text-sm" style={{ color: C.text }}>
                        {res ? res.points : '–'}
                      </div>
                    )}
                  </div>
                  <div className="text-center w-12">
                    <div className="text-[9px] uppercase" style={{ color: C.faint }}>
                      +/-
                    </div>
                    <div className="font-display text-sm" style={{ color: res ? (res.result >= 0 ? C.lime : C.red) : C.faint }}>
                      {res ? (res.result >= 0 ? '+' : '') + res.result : '–'}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </Card>
        )}

        {editing.entryMode === 'holebyhole' && activePlayers.length > 0 && ((!editing.setupDraft && editing.logged) || (editing.casual && currentCasualGame?.scoring !== 'teamscore')) && (
          <Card style={editing.logged ? { border: `1.5px solid ${C.lime}` } : undefined}>
            <div className="font-display text-lg mb-1" style={{ color: C.text }}>
              {editing.logged ? '✎ Scorecard' : 'Hole-by-hole'}
            </div>
            {editing.logged && (
              <p className="text-xs mb-2" style={{ color: C.muted }}>
                Type each player's gross score per hole. Quota and points come from the tee each
                player is on above. Each entry advances to the next hole. Saves as you go — hit <b style={{ color: C.text }}>Save round</b>{' '}
                when the card is complete.
              </p>
            )}
            <div style={{ overflowX: 'auto' }}>
              <div
                style={{
                  display: 'grid',
                  gridTemplateColumns: `110px ${cardCols.map((c) => (c.type === 'hole' ? '42px' : '46px')).join(' ')}`,
                  minWidth: 110 + cardCols.reduce((w, c) => w + (c.type === 'hole' ? 42 : 46), 0),
                }}
              >
                <div style={{ position: 'sticky', left: 0, background: C.surface, zIndex: 1 }} className="text-[10px] uppercase py-1">
                  <span style={{ color: C.muted }}>Hole</span>
                </div>
                {cardCols.map((c, ci) =>
                  c.type === 'hole' ? (
                    <div key={ci} className="text-[11px] text-center py-1 font-display" style={{ color: C.text }}>
                      {c.idx + 1}
                    </div>
                  ) : (
                    <div
                      key={ci}
                      className="text-[11px] text-center py-1 font-display uppercase"
                      style={{ color: C.lime, background: C.surface2 }}
                    >
                      {c.label}
                    </div>
                  )
                )}
                <div style={{ position: 'sticky', left: 0, background: C.surface, zIndex: 1 }} className="text-[10px] py-1">
                  <span style={{ color: C.muted }}>Par</span>
                </div>
                {cardCols.map((c, ci) =>
                  c.type === 'hole' ? (
                    <div key={ci} className="text-[11px] text-center py-1" style={{ color: C.muted }}>
                      {holes[c.idx].par}
                    </div>
                  ) : (
                    <div key={ci} className="text-[11px] text-center py-1 font-semibold" style={{ color: C.muted, background: C.surface2 }}>
                      {holes.slice(c.from, c.to).reduce((sum, h) => sum + h.par, 0)}
                    </div>
                  )
                )}
                <div style={{ position: 'sticky', left: 0, background: C.surface, zIndex: 1 }} className="text-[10px] py-1 mb-1">
                  <span style={{ color: C.muted }}>Hdcp</span>
                </div>
                {cardCols.map((c, ci) =>
                  c.type === 'hole' ? (
                    <div key={ci} className="text-[11px] text-center py-1 mb-1" style={{ color: C.faint, borderBottom: `1px solid ${C.border}` }}>
                      {holes[c.idx].si}
                    </div>
                  ) : (
                    <div key={ci} className="py-1 mb-1" style={{ borderBottom: `1px solid ${C.border}`, background: C.surface2 }} />
                  )
                )}
                {activePlayers.map((p, playerIndex) => {
                  const scores = holes.map((h, i) => editing.playerData[p.id]?.holeScores?.[i]);
                  return (
                  <React.Fragment key={p.id}>
                    <div style={{ position: 'sticky', left: 0, background: C.surface, zIndex: 1 }} className="text-xs py-1.5 pr-2" title={`${p.name} · ${playerTeeName(editing, p.id)} tees`}>
                      <div className="flex items-center gap-1.5 min-w-0">
                        <span
                          className="rounded-full shrink-0"
                          style={{ width: 8, height: 8, background: teeSwatch(playerTeeName(editing, p.id)), border: `1px solid ${C.faint}` }}
                        />
                        <span className="truncate" style={{ color: C.text }}>{p.name}</span>
                      </div>
                      <div className="text-[9px] leading-none mt-0.5" style={{ color: C.faint }}>
                        quota {playerQuotaInRound(settings, editing, p, course)}
                      </div>
                    </div>
                    {cardCols.map((c, ci) => {
                      if (c.type === 'sum') {
                        const val = sumOverCols(scores, c);
                        return (
                          <div
                            key={ci}
                            className="py-1 flex items-center justify-center"
                            style={{ background: C.surface2 }}
                          >
                            <span className="font-display text-xs font-bold" style={{ color: val != null ? C.lime : C.faint }}>
                              {val ?? '–'}
                            </span>
                          </div>
                        );
                      }
                      const i = c.idx;
                      const h = holes[i];
                      const v = editing.playerData[p.id]?.holeScores?.[i];
                      const d = v == null ? null : v - h.par;
                      const col = v == null ? C.text : scoreColor(v, h.par);
                      const shape = d == null || d === 0 ? 'none' : d < 0 ? 'circle' : 'square';
                      const dbl = d != null && Math.abs(d) >= 2;
                      return (
                        <div key={ci} className="py-1 flex items-center justify-center">
                          <input
                            ref={(node) => {
                              const key = `${editing.id}:${p.id}:${i}`;
                              if (node) loggedScoreInputRefs.current[key] = node;
                              else delete loggedScoreInputRefs.current[key];
                            }}
                            type="number"
                            inputMode="numeric"
                            value={v ?? ''}
                            onChange={(e) => {
                              const rawValue = e.target.value;
                              setHoleScore(editing.id, p.id, i, rawValue === '' ? null : Number(rawValue));
                              if (!editing.logged || rawValue === '') return;
                              const nextPlayer = i + 1 < holes.length ? p : activePlayers[playerIndex + 1];
                              const nextHole = i + 1 < holes.length ? i + 1 : 0;
                              if (!nextPlayer) return;
                              requestAnimationFrame(() => {
                                const nextInput = loggedScoreInputRefs.current[`${editing.id}:${nextPlayer.id}:${nextHole}`];
                                if (!nextInput) return;
                                nextInput.focus();
                                if (typeof nextInput.select === 'function') nextInput.select();
                              });
                            }}
                            className="w-8 h-8 text-center text-xs outline-none"
                            style={{
                              background: C.surface2,
                              color: col,
                              border: `1.5px solid ${shape === 'none' ? C.border : col}`,
                              borderRadius: shape === 'circle' ? '50%' : shape === 'square' ? 4 : 8,
                              boxShadow: dbl ? `0 0 0 1.5px ${C.surface}, 0 0 0 3px ${col}` : 'none',
                              boxSizing: 'border-box',
                              // Mobile Safari zooms the page when a focused
                              // input's computed font size is below 16px.
                              fontSize: 16,
                            }}
                          />
                        </div>
                      );
                    })}
                  </React.Fragment>
                  );
                })}
              </div>
            </div>
          </Card>
        )}

        {editing.logged ? (
          <>
            {editing.setupDraft ? (
              <PrimaryButton
                onClick={() => beginLoggedRound(editing.id)}
                disabled={activePlayers.length === 0 || !teesConfirmed}
                style={{ width: '100%', textAlign: 'center', marginBottom: 8, paddingTop: 16, paddingBottom: 16, fontSize: 16 }}
              >
                {activePlayers.length === 0
                  ? 'Select players to continue'
                  : !teesConfirmed
                  ? `Confirm ${editing.teeName} tees to continue`
                  : 'Continue to Scorecard'}
              </PrimaryButton>
            ) : (
              <PrimaryButton
                onClick={() => {
                  finalizeRound(editing.id, {
                    entryMode: 'holebyhole',
                    startedAt: editing.startedAt || new Date().toISOString(),
                  });
                }}
                disabled={activePlayers.length === 0 || !teesConfirmed || missingLoggedScores > 0}
                style={{ width: '100%', textAlign: 'center', marginBottom: 8, paddingTop: 16, paddingBottom: 16, fontSize: 16 }}
              >
                {!teesConfirmed
                  ? '⛳ Select your tees first'
                  : loggedScoresEntered === 0
                  ? '✎ Enter scores below'
                  : missingLoggedScores > 0
                  ? `${missingLoggedScores} score${missingLoggedScores === 1 ? '' : 's'} remaining`
                  : '✓ Save round'}
              </PrimaryButton>
            )}
            {!editing.setupDraft && teesConfirmed && activePlayers.length > 0 && missingLoggedScores > 0 && (
              <div className="text-xs text-center mb-2" style={{ color: loggedScoresEntered > 0 ? C.orange : C.muted }}>
                Fill every selected player’s scorecard before saving · {loggedScoresEntered}/{loggedScoresRequired} entered
              </div>
            )}
          </>
        ) : editing.casual ? (
          <PrimaryButton
            onClick={() => {
              beginLiveRound(editing.id, {
                currentHole: editing.currentHole || 0,
              });
            }}
            disabled={activePlayers.length === 0 || !teesConfirmed || !teamSetupValid}
            style={{ width: '100%', textAlign: 'center', marginBottom: 8, paddingTop: 16, paddingBottom: 16, fontSize: 16 }}
          >
            {!teesConfirmed ? '⛳ Select your tees first' : !teamSetupValid ? 'Set both teams first' : editing.status === 'final' || !!editing.startedAt ? '▶ Resume live scoring' : '▶ Begin Round'}
          </PrimaryButton>
        ) : (
          <div
            className="rounded-2xl p-2"
            style={{
              position: 'sticky',
              bottom: 'calc(74px + env(safe-area-inset-bottom))',
              zIndex: 20,
              background: C.black,
              border: `1px solid ${C.border}`,
              boxShadow: `0 -8px 28px ${C.shadow}`,
              marginBottom: 10,
            }}
          >
            <PrimaryButton
              onClick={() => {
                beginLiveRound(editing.id, {
                  currentHole: editing.currentHole || 0,
                });
              }}
              disabled={activePlayers.length === 0 || !teesConfirmed || !teamSetupValid}
              style={{ width: '100%', textAlign: 'center', paddingTop: 16, paddingBottom: 16, fontSize: 16 }}
            >
              {activePlayers.length === 0
                ? 'Select players to continue'
                : !teesConfirmed
                ? `Confirm ${editing.teeName} tees to continue`
                : !teamSetupValid
                ? 'Set both teams first'
                : editing.status === 'final' || !!editing.startedAt
                ? '▶ Resume live scoring'
                : '▶ Begin Round'}
            </PrimaryButton>
          </div>
        )}
        {editing.casual && !teesConfirmed && (
          <div className="text-xs text-center mb-2 font-semibold" style={{ color: C.orange }}>
            Confirm the tees above — they set every course handicap for this round
          </div>
        )}
        {editing.casual && activePlayers.length === 0 && (
          <div className="text-xs text-center mb-2" style={{ color: C.muted }}>
            Select at least one player to begin
          </div>
        )}

        <GhostButton onClick={() => setConfirmDeleteIds([editing.id])} color={C.red} style={{ width: '100%', textAlign: 'center', marginBottom: 24 }}>
          Delete round
        </GhostButton>

        {confirmDeleteIds && (
          <ConfirmDialog
            title="Delete this round?"
            message="This will permanently remove the round, its scores, and any skins or purse results tied to it. This can't be undone."
            onCancel={() => setConfirmDeleteIds(null)}
            onConfirm={performDelete}
          />
        )}
      </div>
      </InteractiveEdgeBack>
    );
  }

  function renderRoundRow(r, idx) {
    const course = courseForRound(r, courses.find((c) => c.id === r.courseId));
    const roundPlayers = roundPlayerList(r, players);
    const scored = course ? roundPlayers.filter((p) => playerPointsInRound(settings, r, p, course) != null).length : 0;
    const selected = selectedRoundIds.includes(r.id);
    return (
      <button
        key={r.id}
        onClick={() => (selectMode ? toggleSelectRound(r.id) : setEditingRoundId(r.id))}
        className="w-full text-left rounded-3xl p-4 mb-3 flex items-center gap-3 tab-fade-in"
        style={{ background: C.surface, border: `1px solid ${selectMode && selected ? C.lime : C.border}`, animationDelay: `${Math.min(idx, 10) * 0.05}s`, transition: 'border-color 0.2s ease' }}
      >
        {selectMode && (
          <span
            key={selected ? 'on' : 'off'}
            className="w-5 h-5 rounded shrink-0 check-pop"
            style={{ background: selected ? C.lime : 'transparent', border: `1.5px solid ${selected ? C.lime : C.faint}` }}
          />
        )}
        <div className="flex-1 min-w-0">
          <div className="flex items-center justify-between">
            <div className="min-w-0">
              <div className="font-display text-lg truncate" style={{ color: C.text }}>
                {roundGameLabel(r)}
              </div>
              <div className="text-xs truncate" style={{ color: C.muted }}>
                {roundNamesLabel(roundPlayers)} · {formatRoundDate(r.date)}
              </div>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              {r.casual && (
                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold" style={{ background: C.surface2, color: C.cyan, border: `1px solid ${C.cyan}` }}>
                  CASUAL
                </span>
              )}
              {(r.status === 'live' || r.status === 'logging') && (
                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold live-pulse" style={{ background: C.red, color: '#fff' }}>
                  {r.status === 'logging' ? '✎ LOGGING' : '● LIVE'}
                </span>
              )}
              {r.logged && r.status !== 'final' && r.status !== 'logging' && (
                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold" style={{ background: C.surface2, color: C.lime, border: `1px solid ${C.lime}` }}>
                  ✎ LOGGING
                </span>
              )}
              {r.status === 'final' && !r.revisionPending && (
                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold" style={{ background: C.limeSoft, color: C.lime, border: `1px solid ${C.lime}` }}>
                  ✓ COMPLETE
                </span>
              )}
              {r.status === 'final' && r.revisionPending && (
                <span
                  className="px-2 py-0.5 rounded-full text-[10px] font-bold"
                  style={{ background: C.surface2, color: C.orange, border: `1px solid ${C.orange}` }}
                  title="A score arrived from another phone after this round was finalized. Reopen and finalize again to update the results."
                >
                  ⚠ NEEDS RE-FINALIZE
                </span>
              )}
              {(!r.status || r.status === 'setup') && (
                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold" style={{ background: C.surface2, color: C.muted, border: `1px solid ${C.border}` }}>
                  NOT STARTED
                </span>
              )}
              <div className="text-xs font-display" style={{ color: C.gold }}>
                {scored}/{roundPlayers.length} scored
              </div>
            </div>
          </div>
        </div>
      </button>
    );
  }

  const visibleRounds = rounds.filter((r) => !r.casual && !r.setupDraft);

  function confirmDeleteSelected() {
    if (selectedRoundIds.length === 0) return;
    setConfirmDeleteIds(selectedRoundIds);
  }

  return (
    <div style={{ paddingBottom: selectMode ? 88 : 0 }}>
      <div className="grid grid-cols-2 gap-2 mb-4 rounded-2xl p-1" style={{ background: C.surface2, border: `1px solid ${C.border}` }}>
        <button className="rounded-xl py-2.5 text-sm font-bold" style={{ background: C.surface, color: C.lime, border: `1px solid ${C.lime}` }}>League Rounds</button>
        <button onClick={onOpenCasual} className="rounded-xl py-2.5 text-sm font-bold tap" style={{ color: C.muted }}>Casual Rounds</button>
      </div>
      {selectMode ? (
        <div className="flex items-center justify-between gap-2 mb-4">
          <button
            onClick={() => setSelectedRoundIds(selectedRoundIds.length === visibleRounds.length ? [] : visibleRounds.map((r) => r.id))}
            className="text-xs font-semibold shrink-0"
            style={{ color: C.lime }}
          >
            {selectedRoundIds.length === visibleRounds.length && visibleRounds.length > 0 ? 'Deselect all' : 'Select all'}
          </button>
          <span className="text-xs shrink-0" style={{ color: C.muted }}>
            {selectedRoundIds.length} selected
          </span>
          <button
            onClick={() => {
              setSelectMode(false);
              setSelectedRoundIds([]);
            }}
            className="text-xs font-semibold shrink-0"
            style={{ color: C.muted }}
          >
            Cancel
          </button>
        </div>
      ) : (
        <PrimaryButton onClick={newRound} style={{ width: '100%', marginBottom: 12 }}>
          + New League Round
        </PrimaryButton>
      )}

      {!selectMode && visibleRounds.length > 0 && (
        <div className="flex justify-end mb-3">
          <button onClick={() => setSelectMode(true)} className="text-xs font-semibold" style={{ color: C.muted }}>Select</button>
        </div>
      )}

      {(() => {
        const liveRounds = visibleRounds.filter((r) => r.status === 'live' || r.status === 'logging');
        const setupRounds = visibleRounds.filter((r) => !r.status || r.status === 'setup');
        const finalRounds = visibleRounds.filter((r) => r.status === 'final');
        return (
          <>
            {liveRounds.length > 0 && (
              <div className="mb-1">
                <SectionLabel>In Progress ({liveRounds.length})</SectionLabel>
                {liveRounds.map((r, idx) => renderRoundRow(r, idx))}
              </div>
            )}
            {setupRounds.length > 0 && (
              <div className="mb-1">
                <SectionLabel>Not Started ({setupRounds.length})</SectionLabel>
                {setupRounds.map((r, idx) => renderRoundRow(r, idx))}
              </div>
            )}
            {finalRounds.length > 0 && (
              <div className="mb-1">
                <SectionLabel>Completed ({finalRounds.length})</SectionLabel>
                {finalRounds.map((r, idx) => renderRoundRow(r, idx))}
              </div>
            )}
          </>
        );
      })()}
      {visibleRounds.length === 0 && rounds.length === 0 && (
        <div className="text-sm text-center py-6" style={{ color: C.muted }}>
          No rounds yet — create one above.
        </div>
      )}
      {visibleRounds.length === 0 && rounds.length > 0 && (
        <div className="text-sm text-center py-6" style={{ color: C.muted }}>
          No league rounds yet. Use the Casual Rounds tab above to open your guest rounds.
        </div>
      )}

      {selectMode && (
        <div className="fixed bottom-4 left-0 right-0 px-4" style={{ maxWidth: 480, margin: '0 auto' }}>
          <PrimaryButton
            onClick={confirmDeleteSelected}
            disabled={selectedRoundIds.length === 0}
            style={{ width: '100%', textAlign: 'center', background: selectedRoundIds.length > 0 ? C.red : C.surface2, color: selectedRoundIds.length > 0 ? '#fff' : C.faint }}
          >
            Delete {selectedRoundIds.length || ''} round{selectedRoundIds.length === 1 ? '' : 's'}
          </PrimaryButton>
        </div>
      )}

      {confirmDeleteIds && (
        <ConfirmDialog
          title={`Delete ${confirmDeleteIds.length} round${confirmDeleteIds.length === 1 ? '' : 's'}?`}
          message="This will permanently remove the selected round(s), their scores, and any skins or purse results tied to them. This can't be undone."
          onCancel={() => setConfirmDeleteIds(null)}
          onConfirm={performDelete}
        />
      )}
    </div>
  );
}

// ---------- App feedback ----------
function FeedbackTextarea({ label, value, onChange, placeholder, rows = 4, maxLength = 2000 }) {
  return (
    <div>
      {label && (
        <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: C.muted }}>
          {label}
        </div>
      )}
      <textarea
        value={value}
        onChange={(e) => onChange(e.target.value)}
        placeholder={placeholder}
        rows={rows}
        maxLength={maxLength}
        className="w-full rounded-2xl px-3 py-2.5 text-sm outline-none resize-none"
        style={{ background: C.surface2, color: C.text, border: `1px solid ${C.border}`, boxSizing: 'border-box' }}
      />
      <div className="text-[10px] mt-1 text-right" style={{ color: C.faint }}>
        {value.length}/{maxLength}
      </div>
    </div>
  );
}

function feedbackStatusColor(status) {
  if (status === 'resolved') return C.lime;
  if (status === 'in-review') return C.gold;
  return C.cyan;
}

function FeedbackInboxCard({ item, onPatch }) {
  const [note, setNote] = useState(item.adminNote || '');
  const [detailsOpen, setDetailsOpen] = useState(false);
  useEffect(() => setNote(item.adminNote || ''), [item.id, item.adminNote]);
  const submitted = item.submittedAt ? new Date(item.submittedAt) : null;
  const dateLabel = submitted && !Number.isNaN(submitted.getTime()) ? submitted.toLocaleString() : 'Unknown date';
  const status = item.status || 'new';
  const statusColor = feedbackStatusColor(status);
  return (
    <div className="rounded-2xl p-3 mb-3" style={{ background: C.surface2, border: `1px solid ${C.border}` }}>
      <div className="flex items-start justify-between gap-2">
        <div className="min-w-0">
          <div className="flex flex-wrap items-center gap-1.5 mb-1">
            <span className="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full" style={{ background: item.type === 'bug' ? 'rgba(255,69,58,0.14)' : C.limeSoft, color: item.type === 'bug' ? C.red : C.lime }}>
              {item.type === 'bug' ? 'Bug report' : 'Suggestion'}
            </span>
            <span className="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full" style={{ border: `1px solid ${statusColor}`, color: statusColor }}>
              {status === 'in-review' ? 'In review' : status}
            </span>
          </div>
          <div className="font-display text-lg leading-tight" style={{ color: C.text }}>{item.title}</div>
          <div className="text-[11px] mt-1" style={{ color: C.faint }}>
            {item.submitter?.name || 'Anonymous'} · {dateLabel}
          </div>
        </div>
      </div>

      <p className="text-sm leading-relaxed mt-3 whitespace-pre-wrap" style={{ color: C.text }}>{item.details}</p>
      {item.extra && (
        <div className="rounded-xl p-2.5 mt-2 text-xs whitespace-pre-wrap" style={{ background: C.surface, color: C.muted }}>
          <b style={{ color: C.text }}>{item.type === 'bug' ? 'Steps / context: ' : 'Expected benefit: '}</b>{item.extra}
        </div>
      )}
      <div className="flex flex-wrap gap-x-3 gap-y-1 text-[11px] mt-2" style={{ color: C.faint }}>
        <span>Area: {item.area || 'General'}</span>

        <div className="rounded-xl p-2.5 mt-1 text-[10px] leading-relaxed break-words" style={{ background: C.surface, color: C.faint }}>

  );
}

function FeedbackTab({ feedbackItems, setFeedbackItems, players, myPlayerId, cloudStatus, cloudLeagueId }) {
  const myPlayer = players.find((p) => p.id === myPlayerId);
  const [path, setPath] = useState(null);
  const [title, setTitle] = useState('');
  const [details, setDetails] = useState('');
  const [extra, setExtra] = useState('');
  const [area, setArea] = useState('General');
  const [severity, setSeverity] = useState('normal');
  const [reporterName, setReporterName] = useState(myPlayer?.name || '');
  const [submitted, setSubmitted] = useState(false);
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [adminPromptOpen, setAdminPromptOpen] = useState(false);
  const [inboxFilter, setInboxFilter] = useState('all');

  const areaOptions = ['General', 'Home', 'League Rounds', 'Live Scoring', 'Casual Rounds', 'Standings', 'Calendar', 'Skins', 'Players', 'Settings'].map((value) => ({ value, label: value }));
  const canSubmit = path && title.trim().length >= 3 && details.trim().length >= 10;

  function resetForm() {
    setPath(null);
    setTitle('');
    setDetails('');
    setExtra('');
    setArea('General');
    setSeverity('normal');
    setSubmitted(false);
  }

  function submitFeedback() {
    if (!canSubmit) return;
    const now = new Date().toISOString();
    const cleanName = reporterName.trim();
    const item = {
      id: `feedback-${Date.now()}-${uid()}`,
      type: path,
      title: title.trim(),
      details: details.trim(),
      extra: extra.trim(),
      area,
      severity: path === 'bug' ? severity : null,
      status: 'new',
      submittedAt: now,
      updatedAt: now,
      submitter: {
        playerId: myPlayer && cleanName === myPlayer.name ? myPlayer.id : null,
        name: cleanName || 'Anonymous',
      },
      adminNote: '',
      reviewedAt: null,
      resolvedAt: null,
      metadata: {
        appVersion: APP_VERSION,
        activeScreen: 'App Feedback',
        cloudStatus,
        leagueId: cloudLeagueId || null,
        online: typeof navigator !== 'undefined' ? navigator.onLine : null,
        platform: typeof navigator !== 'undefined' ? (navigator.platform || null) : null,
        userAgent: typeof navigator !== 'undefined' ? String(navigator.userAgent || '').slice(0, 300) : null,
        viewport: typeof window !== 'undefined' ? `${window.innerWidth}×${window.innerHeight}` : null,
      },
    };
    setFeedbackItems((items) => [item, ...items]);
    setSubmitted(true);
  }

  function patchFeedback(id, patch) {
    const now = new Date().toISOString();
    setFeedbackItems((items) => items.map((item) => item.id === id ? { ...item, ...patch, updatedAt: now } : item));
  }

  const sortedItems = [...feedbackItems].sort((a, b) => String(b.submittedAt || '').localeCompare(String(a.submittedAt || '')));
  const visibleItems = inboxFilter === 'all' ? sortedItems : sortedItems.filter((item) => (item.status || 'new') === inboxFilter);
  const newCount = feedbackItems.filter((item) => (item.status || 'new') === 'new').length;

  return (
    <div>
      <Card primary>
        <SectionLabel>Help improve Dogfight League</SectionLabel>
        <div className="font-display text-2xl mb-1" style={{ color: C.text }}>What would you like to share?</div>
        <p className="text-sm leading-relaxed" style={{ color: C.muted }}>
          Report something that is not working, or send Bradford an idea for making the app better.
        </p>
      </Card>

      {!submitted && (
        <>
          <div className="grid grid-cols-2 gap-3 mb-4">
            <button
              onClick={() => setPath('bug')}
              className="rounded-3xl p-4 text-left tap"
              style={{ minHeight: 126, background: path === 'bug' ? 'rgba(255,69,58,0.12)' : C.surface, border: `1.5px solid ${path === 'bug' ? C.red : C.border}` }}
            >
              <div className="font-display text-xl mb-1" style={{ color: path === 'bug' ? C.red : C.text }}>Bug Report</div>
              <div className="text-xs leading-relaxed" style={{ color: C.muted }}>Something broke, behaved strangely, or showed the wrong result.</div>
            </button>
            <button
              onClick={() => setPath('idea')}
              className="rounded-3xl p-4 text-left tap"
              style={{ minHeight: 126, background: path === 'idea' ? C.limeSoft : C.surface, border: `1.5px solid ${path === 'idea' ? C.lime : C.border}` }}
            >
              <div className="font-display text-xl mb-1" style={{ color: path === 'idea' ? C.lime : C.text }}>Suggestion / New Idea</div>
              <div className="text-xs leading-relaxed" style={{ color: C.muted }}>A feature, shortcut, or improvement you would like to see.</div>
            </button>
          </div>

          {path && (
            <Card>
              <div className="font-display text-xl mb-3" style={{ color: path === 'bug' ? C.red : C.lime }}>
                {path === 'bug' ? 'Report a bug' : 'Share an idea'}
              </div>
              <div className="space-y-3">
                <TextField
                  label="Your name (optional)"
                  value={reporterName}
                  onChange={setReporterName}
                  placeholder="Anonymous"
                />
                <SelectField label={path === 'bug' ? 'Where did it happen?' : 'Which part of the app?'} value={area} onChange={setArea} options={areaOptions} />
                {path === 'bug' && (
                  <SelectField
                    label="Impact"
                    value={severity}
                    onChange={setSeverity}
                    options={[
                      { value: 'minor', label: 'Minor — I could keep going' },
                      { value: 'normal', label: 'Moderate — it got in the way' },
                      { value: 'blocking', label: 'Blocking — I could not continue' },
                    ]}
                  />
                )}
                <TextField
                  label={path === 'bug' ? 'Short description' : 'Idea title'}
                  value={title}
                  onChange={setTitle}
                  placeholder={path === 'bug' ? 'Example: Score did not save' : 'Example: Add team pairings'}
                />
                <FeedbackTextarea
                  label={path === 'bug' ? 'What happened?' : 'Describe your idea'}
                  value={details}
                  onChange={setDetails}
                  placeholder={path === 'bug' ? 'Tell us what you expected and what happened instead.' : 'What should the app do, and how would you use it?'}
                />
                <FeedbackTextarea
                  label={path === 'bug' ? 'Steps to reproduce (optional)' : 'What would this improve? (optional)'}
                  value={extra}
                  onChange={setExtra}
                  placeholder={path === 'bug' ? '1. Opened…  2. Tapped…  3. Saw…' : 'Why would this be useful to the group?'}
                  rows={3}
                  maxLength={1000}
                />
              </div>
              <PrimaryButton onClick={submitFeedback} disabled={!canSubmit} style={{ width: '100%', marginTop: 8, minHeight: 48 }}>
                Submit {path === 'bug' ? 'Bug Report' : 'Suggestion'}
              </PrimaryButton>
              <p className="text-[11px] text-center mt-2" style={{ color: C.faint }}>
                {cloudStatus === 'connected' ? 'Submissions are saved to the shared Bradford inbox.' : 'Saved on this device now and synced when cloud access is available.'}
              </p>
            </Card>
          )}
        </>
      )}

      {submitted && (
        <Card primary>
          <div className="font-display text-2xl mb-1" style={{ color: C.lime }}>Feedback submitted</div>
          <p className="text-sm mb-4" style={{ color: C.muted }}>
            Thanks — your {path === 'bug' ? 'bug report' : 'suggestion'} is in Bradford's feedback inbox.
          </p>
          <GhostButton onClick={resetForm} style={{ width: '100%', textAlign: 'center' }}>Send more feedback</GhostButton>
        </Card>
      )}

      <Card>
        <div className="flex items-center justify-between gap-3">
          <div>
            <SectionLabel>Bradford and Will Only</SectionLabel>
            <div className="font-display text-xl" style={{ color: C.text }}>Admin Inbox</div>
            <div className="text-xs mt-0.5" style={{ color: C.muted }}>
              {newCount} new · {feedbackItems.length} total
            </div>
          </div>
          {!adminUnlocked ? (
            <GhostButton onClick={() => setAdminPromptOpen(true)} color={C.lime}>Unlock</GhostButton>
          ) : (
            <GhostButton onClick={() => setAdminUnlocked(false)}>Lock</GhostButton>
          )}
        </div>
        {!adminUnlocked && <InfoNote>Feedback review and status controls use the same PIN as League Settings.</InfoNote>}
      </Card>

      {adminUnlocked && (
        <Card style={{ border: `1.5px solid ${C.lime}` }}>
          <div className="flex items-center justify-between gap-2 mb-3">
            <div className="font-display text-xl" style={{ color: C.lime }}>Feedback Inbox</div>
            <span className="text-[10px] uppercase font-bold" style={{ color: C.muted }}>{visibleItems.length} shown</span>
          </div>
          <SelectField
            label="Filter"
            value={inboxFilter}
            onChange={setInboxFilter}
            options={[
              { value: 'all', label: 'All feedback' },
              { value: 'new', label: 'New' },
              { value: 'in-review', label: 'In review' },
              { value: 'resolved', label: 'Resolved' },
            ]}
          />
          <div className="mt-3">
            {visibleItems.length === 0 ? (
              <div className="rounded-2xl p-4 text-sm text-center" style={{ background: C.surface2, color: C.muted }}>No feedback in this view.</div>
            ) : visibleItems.map((item) => (
              <FeedbackInboxCard key={item.id} item={item} onPatch={patchFeedback} />
            ))}
          </div>
        </Card>
      )}

      {adminPromptOpen && (
        <PinPrompt
          pin={LEAGUE_SETTINGS_PIN}
          title="Unlock feedback inbox"
          message="Enter the existing League Settings PIN to review feedback, add notes, and update submission status."
          onConfirm={() => {
            setAdminUnlocked(true);
            setAdminPromptOpen(false);
          }}
          onCancel={() => setAdminPromptOpen(false)}
        />
      )}
    </div>
  );
}

// ---------- Settings tab ----------
function SettingsTab({ settings, setSettings, players, setPlayers, courses, rounds, setRounds, availability, setAvailability, feedbackItems, setFeedbackItems, cloudStatus, cloudError, cloudLeagueId, aiStatus, aiErrorMsg, theme, setTheme }) {
  const fileInputRef = useRef(null);

  // --- League settings PIN gate ---
  // settingsUnlocked/draftSettings both live in local component state, so
  // navigating away from the Settings tab unmounts this component and wipes
  // them — the PIN is required again next visit, and any never-saved edits
  // are discarded rather than silently leaking into real settings.
  const [settingsUnlocked, setSettingsUnlocked] = useState(false);
  const [draftSettings, setDraftSettings] = useState(settings);
  const [pinPromptOpen, setPinPromptOpen] = useState(false);
  const [confirmSaveOpen, setConfirmSaveOpen] = useState(false);
  useEffect(() => {
    // Keep the draft mirrored to real settings while locked, so the dimmed
    // preview underneath the lock overlay never shows stale values (e.g.
    // after a cloud sync update from another device).
    if (!settingsUnlocked) setDraftSettings(settings);
  }, [settings, settingsUnlocked]);
  function patchDraft(p) {
    setDraftSettings((s) => ({ ...s, ...p }));
  }
  function handleUnlocked() {
    setDraftSettings(settings);
    setSettingsUnlocked(true);
    setPinPromptOpen(false);
  }
  const pendingChanges = diffSettings(settings, draftSettings);
  function discardDraft() {
    setDraftSettings(settings);
    setSettingsUnlocked(false);
  }
  function commitDraft() {
    setSettings(draftSettings);
    setConfirmSaveOpen(false);
    setSettingsUnlocked(false);
  }

  const [confirmMerge, setConfirmMerge] = useState(false);
  const dupePlan = planPlayerDedupe(players, rounds, availability);
  function mergeDuplicates() {
    const plan = planPlayerDedupe(players, rounds, availability);
    if (!plan.removeCount) return;
    const removed = new Set(Object.keys(plan.idMap));
    // Remap references first, then drop the extra player records. The existing
    // upward-sync pass notices the ids that vanished from state and deletes the
    // matching Firestore documents, so the cloud roster gets cleaned up too.
    setRounds((rs) =>
      rs.map((round) => {
        const finalSnapshot = round.finalSnapshot;
        // Strip the key entirely rather than setting it to undefined — an
        // undefined value would otherwise be handed straight to Firestore.
        const withoutSnapshot = { ...round };
        delete withoutSnapshot.finalSnapshot;
        const remapped = remapPlayerIds(withoutSnapshot, plan.idMap);
        return finalSnapshot ? { ...remapped, finalSnapshot } : remapped;
      })
    );
    setAvailability((av) => remapPlayerIds(av, plan.idMap));
    setPlayers((ps) => ps.filter((p) => !removed.has(p.id)));
  }
  function loadSample() {
    const newPlayers = makeDefaultPlayers();
    setPlayers(newPlayers);
    const sampleRound = {
      id: uid(),
      date: '2026-06-16',
      courseId: DEFAULT_COURSE.id,
      teeName: 'Grey',
      holes: 18,
      entryMode: 'holebyhole',
      combinedWith: null,
      playerIds: newPlayers.map((p) => p.id),
      skinsOptIn: [],
      trashOptIn: [],
      trash: {},
      playerData: {},
    };
    setRounds([sampleRound]);
  }
  function exportBackup() {
    const data = { settings, players, courses, rounds, availability, feedbackItems };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${settings.leagueName.replace(/\s+/g, '-').toLowerCase()}-backup.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  function importBackup(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (data.settings) setSettings(data.settings);
        if (data.players) setPlayers(data.players);
        if (data.rounds) setRounds(data.rounds);
        if (data.availability) setAvailability(data.availability);
        if (Array.isArray(data.feedbackItems)) setFeedbackItems(data.feedbackItems);
      } catch (err) {
        alert('Could not read that backup file.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }
  const [confirmErase, setConfirmErase] = useState(false);
  function eraseEverything() {
    setSettings(DEFAULT_SETTINGS);
    setPlayers([]);
    setRounds([]);
    setAvailability({});
    setFeedbackItems([]);
    setConfirmErase(false);
  }

  return (
    <div>
      <CloudSyncCard cloudStatus={cloudStatus} cloudError={cloudError} cloudLeagueId={cloudLeagueId} />
      <AiStatusCard aiStatus={aiStatus} aiErrorMsg={aiErrorMsg} />

      <Card>
        <SectionLabel>Appearance</SectionLabel>
        <p className="text-xs mb-2" style={{ color: C.muted }}>
          Light mode is easier to read in bright sun; dark mode saves battery and is easier on the eyes at night.
        </p>
        <Toggle2
          value={theme}
          onChange={setTheme}
          options={[
            { value: 'dark', label: '🌙 Dark' },
            { value: 'light', label: '☀️ Light' },
          ]}
        />
      </Card>

      <div style={{ position: 'relative' }}>
        <div style={{ opacity: settingsUnlocked ? 1 : 0.5, pointerEvents: settingsUnlocked ? 'auto' : 'none', filter: settingsUnlocked ? 'none' : 'saturate(0.4)' }}>
      <Card>
        <div className="font-display text-xl mb-3" style={{ color: C.text }}>
          League Settings
        </div>
        <div className="grid grid-cols-2 gap-2 mb-3">
          <TextField label="League name" value={draftSettings.leagueName} onChange={(v) => patchDraft({ leagueName: v })} />
          <div>
            <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: C.muted }}>
              Quota base (default 36)
            </div>
            <NumStepper value={draftSettings.quotaBase} onChange={(v) => patchDraft({ quotaBase: v })} min={0} max={72} />
          </div>
        </div>
        <div className="flex items-center justify-between gap-3 py-3" style={{ borderTop: `1px solid ${C.border}` }}>
          <div>
            <div className="text-sm font-semibold" style={{ color: C.text }}>League team competition</div>
            <div className="text-[11px] mt-0.5" style={{ color: C.faint }}>
              {draftSettings.teamsEnabled ? 'Individual and team competition' : 'Individual standings only'}
            </div>
          </div>
          <OnOffSwitch
            checked={draftSettings.teamsEnabled === true}
            onChange={(v) => patchDraft({ teamsEnabled: v })}
            label="League team competition"
          />
        </div>
        {draftSettings.teamsEnabled && (
          <div className="grid grid-cols-2 gap-2 mt-2">
            <TextField label="Team 1 name" value={draftSettings.team1Name} onChange={(v) => patchDraft({ team1Name: v })} />
            <TextField label="Team 2 name" value={draftSettings.team2Name} onChange={(v) => patchDraft({ team2Name: v })} />

// ---------- main app ----------
function DogfightLeague() {
  const [loading, setLoading] = useState(true);
  const [activeTab, setActiveTab] = useState('home');
  const [menuOpen, setMenuOpen] = useState(false);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [theme, setTheme] = useState('light');

  // keep the shared color palette in sync with the chosen theme on every render
  applyTheme(theme);

  const [players, setPlayers] = useState(makeDefaultPlayers);
  const [courses] = useState(DEFAULT_COURSES);
  const [rounds, setRounds] = useState([]);
  const [availability, setAvailability] = useState({});
  const [feedbackItems, setFeedbackItems] = useState([]);
  const [editingRoundId, setEditingRoundId] = useState(null);
  const [dashboardPlayerId, setDashboardPlayerId] = useState(null);
  const [myPlayerId, setMyPlayerId] = useState(() => {
    try {
      return localStorage.getItem(MY_PLAYER_KEY) || '';
    } catch (e) {
      return '';
    }
  });
  const [saveStatus, setSaveStatus] = useState('saved'); // saved | saving | local | error
  const saveTimer = useRef(null);

  useEffect(() => {
    document.body.style.background = C.black;
    document.documentElement.style.background = C.black;
  }, [theme]);

  const [cloudStatus, setCloudStatus] = useState('disconnected'); // disconnected | connecting | connected | error | unavailable
  const [cloudError, setCloudError] = useState('');
  const [cloudLeagueId, setCloudLeagueId] = useState('');
  const [cloudRefreshToken, setCloudRefreshToken] = useState(0);
  const dbRef = useRef(null);
  const lastSyncedRef = useRef({ players: {}, rounds: {}, availability: {}, feedback: {}, settingsJSON: null });
  // Snapshot of what THIS device held on the previous save pass. Cloud
  // deletions are only issued for things that were present here and then
  // disappeared — i.e. an actual local delete. Previously deletion was inferred
  // purely from absence, which meant any moment where local state briefly
  // lagged behind lastSyncedRef (a snapshot lands, another collection's
  // listener fires before the rounds state commits) could delete real rounds
  // outright. Never infer destruction from absence.
  const prevLocalRef = useRef(null);
  // Round ids the cloud is known to hold. Persisted to local storage so that a
  // device which was closed when another device deleted a round can tell the
  // difference between "deleted remotely" and "created here, not yet uploaded".
  const knownCloudRoundIdsRef = useRef(new Set());
  // False until the first players snapshot has come back from Firestore. The
  // upward sync must not run before this: on a cold load, state still holds the
  // freshly seeded default roster and lastSyncedRef is empty, so the debounced
  // save would happily push all 14 seeds up as brand-new documents.
  const cloudHydratedRef = useRef(false);
  const unsubsRef = useRef([]);

  const [aiStatus, setAiStatus] = useState('checking'); // checking | ready | error | unavailable
  const [aiErrorMsg, setAiErrorMsg] = useState('');

  useEffect(() => {
    let tries = 0;
    const iv = setInterval(() => {
      tries++;
      if (typeof window === 'undefined' || typeof window.dflAI === 'undefined') {
        if (tries > 20) {
          setAiStatus('unavailable');
          clearInterval(iv);
        }
        return;
      }
      if (window.dflAI.ready) {
        setAiStatus('ready');
        clearInterval(iv);
      } else if (window.dflAI.error) {
        setAiStatus('error');
        setAiErrorMsg(window.dflAI.error);
        clearInterval(iv);
      } else if (tries > 20) {
        setAiStatus('unavailable');
        clearInterval(iv);
      }
    }, 250);
    return () => clearInterval(iv);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY);
        if (res && res.value) {
          const data = JSON.parse(res.value);
          if (data.settings) setSettings({ ...DEFAULT_SETTINGS, ...data.settings });
          if (data.players) setPlayers(data.players);
          if (data.rounds) setRounds(data.rounds);
          if (data.availability) setAvailability(data.availability);
          if (Array.isArray(data.feedbackItems)) setFeedbackItems(data.feedbackItems);
          if (data.theme) setTheme(data.theme);
          if (Array.isArray(data.syncedRoundIds)) knownCloudRoundIdsRef.current = new Set(data.syncedRoundIds);
        }
      } catch (e) {}
      setLoading(false);
    })();
  }, []);

  // One-time, backward-compatible migration. Existing finalized league rounds
  // are frozen exactly once, persisted through the normal local/cloud save
  // path, and never rebuilt after a later handicap refresh.
  useEffect(() => {
    if (loading) return;
    setRounds((currentRounds) => {
      const migrated = ensureFinalSnapshots(currentRounds, settings, players, courses);
      return migrated.changed ? migrated.rounds : currentRounds;
    });
  }, [loading, rounds, settings, players, courses]);

  // connect to Firebase once local data has loaded; no-op and harmless if the SDK isn't loaded
  useEffect(() => {
    if (loading) return; // wait for local storage to load first so we don't race the cloud listener
    // Recovery mode: never touch the cloud, so this device's local data stays
    // exactly as it is and can be exported safely.
    if (RECOVERY_MODE) {
      setCloudStatus('recovery');
      return;
    }
    // Use a saved custom config if the user pasted one; otherwise fall back to the
    // app's built-in Firebase project so every device shares one league by default.
    let cfg = loadCloudConfig();
    if (cfg && cfg.projectId === DEFAULT_FIREBASE_CONFIG.projectId) {
      const canonicalLeagueId = normalizeLeagueId(cfg.leagueId, true);
      if (canonicalLeagueId && canonicalLeagueId !== cfg.leagueId) {
        cfg = { ...cfg, leagueId: canonicalLeagueId };
        saveCloudConfig(cfg);
      }
    }
    if (!cfg) {
      cfg = { ...DEFAULT_FIREBASE_CONFIG, leagueId: DEFAULT_LEAGUE_ID };
    }
    if (!fbAvailable()) {
      setCloudStatus('unavailable');
      return;
    }
    setCloudStatus('connecting');
    setCloudLeagueId(cfg.leagueId);
    // Tracks whether we've handled the first snapshot for each collection yet.
    // On that first snapshot, if the cloud is empty but this device already has
    // local data, we push local data UP instead of wiping it with the empty cloud.
    const firstSnap = { players: true, rounds: true, availability: true, feedback: true, settings: true };
    cloudHydratedRef.current = false;
    try {
      if (!window.firebase.apps.length) window.firebase.initializeApp(cfg);
      const db = window.firebase.firestore();
      // Firestore throws on an `undefined` value anywhere in a document, and a
      // single throw rejects the entire batch — so one stray key would stop all
      // syncing mid-round. Treat undefined as "leave this field alone" instead.
      try {
        db.settings({ ignoreUndefinedProperties: true });
      } catch (e) {
        // settings() can only be called before the first use; ignore if already set.
      }
      dbRef.current = db;
      const base = db.collection('leagues').doc(cfg.leagueId);
      const onErr = (err) => {
        setCloudStatus('error');
        setCloudError(err && err.message ? err.message : String(err));
      };

      const unsub1 = base.collection('players').onSnapshot((snap) => {
        if (snap.empty && firstSnap.players) {
          firstSnap.players = false;
          setPlayers((cur) => {
            if (cur.length) {
              const batch = db.batch();
              cur.forEach((p) => {
                batch.set(base.collection('players').doc(p.id), p, { merge: true });
                lastSyncedRef.current.players[p.id] = JSON.stringify(p);
              });
              batch.commit().catch((e) => { setCloudStatus('error'); setCloudError(e && e.message ? e.message : String(e)); });
            }
            return cur;
          });
          cloudHydratedRef.current = true;
          return;
        }
        firstSnap.players = false;
        const arr = [];
        const map = {};
        snap.forEach((doc) => {
          const d = { id: doc.id, ...doc.data() };
          arr.push(d);
          map[doc.id] = JSON.stringify(d);
        });
        lastSyncedRef.current.players = map;
        setPlayers(arr);
        cloudHydratedRef.current = true;
      }, onErr);

      const unsub2 = base.collection('rounds').onSnapshot((snap) => {
        if (snap.empty && firstSnap.rounds) {
          firstSnap.rounds = false;
          setRounds((cur) => {
            if (cur.length) {
              const batch = db.batch();
              cur.filter((r) => !r.casual && !r.setupDraft).forEach((r) => {
                batch.set(base.collection('rounds').doc(r.id), r, { merge: true });
                lastSyncedRef.current.rounds[r.id] = JSON.stringify(r);
              });
              batch.commit().catch((e) => { setCloudStatus('error'); setCloudError(e && e.message ? e.message : String(e)); });
            }
            return cur;
          });
          return;
        }
        firstSnap.rounds = false;
        const arr = [];
        const map = {};
        snap.forEach((doc) => {
          const d = { id: doc.id, ...doc.data() };
          // Casual rounds are device-local. Ignore any legacy casual documents
          // that may have been uploaded by an older build.
          if (d.casual) return;
          arr.push(d);
          map[doc.id] = JSON.stringify(d);
        });
        // Capture what we had previously pushed BEFORE overwriting it, so we
        // can work out which local edits haven't reached the cloud yet.
        const prevSynced = lastSyncedRef.current.rounds;
        lastSyncedRef.current.rounds = map;
        const knownIds = knownCloudRoundIdsRef.current;
        // The snapshot is authoritative for what the cloud currently holds.
        knownCloudRoundIdsRef.current = new Set(Object.keys(map));
        // Replay unsaved local edits on top of the snapshot. Without this, a
        // snapshot arriving mid-entry would wipe the score someone just typed
        // before their own debounced write had a chance to push it.
        setRounds((cur) => {
          const localCasual = cur.filter((r) => r.casual);
          const localDrafts = cur.filter((r) => !r.casual && r.setupDraft);
          const localLeague = cur.filter((r) => !r.casual && !r.setupDraft);
          return [...localDrafts, ...reconcileFromCloud(localLeague, arr, prevSynced, knownIds), ...localCasual];
        });
      }, onErr);

      const unsub3 = base.collection('availability').onSnapshot((snap) => {
        const isFirstAvailabilitySnapshot = firstSnap.availability;
        if (snap.empty && firstSnap.availability) {
          firstSnap.availability = false;
          setAvailability((cur) => {
            const keys = Object.keys(cur);
            if (keys.length) {
              const batch = db.batch();
              keys.forEach((key) => {
                batch.set(base.collection('availability').doc(key), cur[key], { merge: true });
                lastSyncedRef.current.availability[key] = JSON.stringify(cur[key]);
              });
              batch.commit().catch((e) => { setCloudStatus('error'); setCloudError(e && e.message ? e.message : String(e)); });
            }
            return cur;
          });
          return;
        }
        firstSnap.availability = false;
        const obj = {};
        const map = {};
        snap.forEach((doc) => {
          obj[doc.id] = doc.data();
          map[doc.id] = JSON.stringify(doc.data());
        });
        const prevSynced = lastSyncedRef.current.availability;
        lastSyncedRef.current.availability = map;
        setAvailability((cur) => isFirstAvailabilitySnapshot
          ? obj
          : reconcileAvailabilityFromCloud(cur, obj, prevSynced));
      }, onErr);

      const unsub4 = base.collection('feedback').onSnapshot((snap) => {
        if (snap.empty && firstSnap.feedback) {
          firstSnap.feedback = false;
          setFeedbackItems((cur) => {
            if (cur.length) {
              const batch = db.batch();
              cur.forEach((item) => {
                batch.set(base.collection('feedback').doc(item.id), item, { merge: true });
                lastSyncedRef.current.feedback[item.id] = JSON.stringify(item);
              });
              batch.commit().catch((e) => { setCloudStatus('error'); setCloudError(e && e.message ? e.message : String(e)); });
            }
            return cur;
          });
          return;
        }
        firstSnap.feedback = false;
        const arr = [];
        const map = {};
        snap.forEach((doc) => {
          const item = { id: doc.id, ...doc.data() };
          arr.push(item);
          map[doc.id] = JSON.stringify(item);
        });
        const prevSynced = lastSyncedRef.current.feedback;
        lastSyncedRef.current.feedback = map;
        setFeedbackItems((cur) => reconcileFromCloud(cur, arr, prevSynced));
      }, onErr);

      const unsub5 = base.collection('meta').doc('settings').onSnapshot((doc) => {
        if (!doc.exists && firstSnap.settings) {
          firstSnap.settings = false;
          setSettings((cur) => {
            base.collection('meta').doc('settings').set(cur).catch((e) => { setCloudStatus('error'); setCloudError(e && e.message ? e.message : String(e)); });

          return;

          setSettings((s) => ({ ...DEFAULT_SETTINGS, ...data }));

      setCloudStatus('connected');
    } catch (e) {
      setCloudStatus('error');
      setCloudError(e && e.message ? e.message : String(e));
    }
    return () => {
      unsubsRef.current.forEach((u) => u && u());
    };

          const curPlayerIds = new Set(players.map((p) => p.id));

            const j = JSON.stringify(p);
            if (lastSyncedRef.current.players[p.id] !== j) {
              batch.set(base.collection('players').doc(p.id), p, { merge: true });
              lastSyncedRef.current.players[p.id] = j;
              dirty = true;
            }
          });
          // Only delete what genuinely vanished from this device's own state
          // since the last pass — never merely what's missing right now.
          if (prevLocal) {
            prevLocal.playerIds.forEach((id) => {
              if (!curPlayerIds.has(id) && lastSyncedRef.current.players[id] !== undefined) {
                batch.delete(base.collection('players').doc(id));
                delete lastSyncedRef.current.players[id];
                dirty = true;
              }
            });
          }

          const leagueRoundsForSync = rounds.filter((r) => !r.casual && !r.setupDraft);
          const curRoundIds = new Set(leagueRoundsForSync.map((r) => r.id));
          leagueRoundsForSync.forEach((r) => {
            const j = JSON.stringify(r);
            if (lastSyncedRef.current.rounds[r.id] !== j) {
              // { merge: true } is critical for concurrent scoring. A plain
              // set() replaces the whole document, so if two people entered
              // scores within the debounce window the second write erased the
              // first — and a device that happened to hold an empty round
              // could wipe everyone's card. Merging writes only the keys this
              // device actually knows about and leaves the rest of
              // playerData/trash/gameData untouched in the cloud.
              // A finalized snapshot is one immutable top-level value. Using
              // mergeFields replaces that value atomically instead of
              // recursively retaining stale players from an older revision.

                base.collection('rounds').doc(r.id),
                r,
                r.finalSnapshot?.schemaVersion ? { mergeFields: Object.keys(r) } : { merge: true }
              );
              lastSyncedRef.current.rounds[r.id] = j;
              knownCloudRoundIdsRef.current.add(r.id);
              dirty = true;
            }
          });
          if (prevLocal) {
            prevLocal.roundIds.forEach((id) => {
              if (!curRoundIds.has(id) && lastSyncedRef.current.rounds[id] !== undefined) {
                batch.delete(base.collection('rounds').doc(id));
                delete lastSyncedRef.current.rounds[id];
                knownCloudRoundIdsRef.current.delete(id);
                dirty = true;
              }
            });
          }

          const curAvailKeys = new Set(Object.keys(availability));
          curAvailKeys.forEach((key) => {
            const j = JSON.stringify(availability[key]);
            if (lastSyncedRef.current.availability[key] !== j) {
              let cloudDay = {};
              try { cloudDay = JSON.parse(lastSyncedRef.current.availability[key] || '{}') || {}; } catch (e) {}
              const localDay = availability[key];
              const patch = {};
              new Set([...Object.keys(cloudDay), ...Object.keys(localDay)]).forEach((playerId) => {
                const cloudChoice = { am: false, pm: false, ...(cloudDay[playerId] || {}) };
                const localChoice = { am: false, pm: false, ...(localDay[playerId] || {}) };
                const changedSessions = {};
                ['am', 'pm'].forEach((session) => {
                  if (cloudChoice[session] !== localChoice[session]) changedSessions[session] = localChoice[session];
                });
                if (Object.keys(changedSessions).length) patch[playerId] = changedSessions;
              });
              if (Object.keys(patch).length) {
                // Merge only the AM/PM values this device actually changed.
                // Replacing a whole player (or date) could erase a selection
                // another device made after our most recent snapshot.
                batch.set(base.collection('availability').doc(key), patch, { merge: true });
              }
              syncedAvailability[key] = j;
              dirty = true;
            }
          });
          if (prevLocal) {
            prevLocal.availKeys.forEach((key) => {
              if (!curAvailKeys.has(key) && lastSyncedRef.current.availability[key] !== undefined) {
                let cloudDay = {};
                try { cloudDay = JSON.parse(lastSyncedRef.current.availability[key] || '{}') || {}; } catch (e) {}
                const clearPatch = {};
                Object.keys(cloudDay).forEach((playerId) => {
                  const choice = cloudDay[playerId] || {};
                  const cleared = {};
                  if (choice.am) cleared.am = false;
                  if (choice.pm) cleared.pm = false;
                  if (Object.keys(cleared).length) clearPatch[playerId] = cleared;

                  // have just added a player to it. Clear only sessions that
                  // were present in this device's last cloud baseline.
                  batch.set(base.collection('availability').doc(key), clearPatch, { merge: true });
                  syncedAvailability[key] = JSON.stringify(clearPatch);
                  dirty = true;
                }
              }
            });
          }

          feedbackItems.forEach((item) => {
            const j = JSON.stringify(item);
            if (lastSyncedRef.current.feedback[item.id] !== j) {
              batch.set(base.collection('feedback').doc(item.id), item, { merge: true });

              dirty = true;

            batch.set(base.collection('meta').doc('settings'), settings, { merge: true });
            lastSyncedRef.current.settingsJSON = settingsJSON;
            dirty = true;
          }

          if (dirty) await batch.commit();
          Object.keys(syncedAvailability).forEach((key) => {
            lastSyncedRef.current.availability[key] = syncedAvailability[key];
          });
          // Baseline for the next pass's deletion check. Only updated after a
          // successful sync attempt, so a failed commit can't cause a spurious
          // "it disappeared" conclusion next time round.
          prevLocalRef.current = {
            playerIds: new Set(players.map((p) => p.id)),
            roundIds: new Set(rounds.filter((r) => !r.casual && !r.setupDraft).map((r) => r.id)),
            availKeys: new Set(Object.keys(availability)),
          };
          setSaveStatus('saved');
        } catch (e) {
          setSaveStatus('error');
          setCloudStatus('error');
          setCloudError(e && e.message ? e.message : String(e));
        }
      } else {
        setSaveStatus('local');
      }
    }, 500);

  }, [settings, players, rounds, availability, feedbackItems, theme, loading, cloudStatus, cloudLeagueId]);

                  className="w-9 h-9 rounded-full flex items-center justify-center tap"
                  style={{ background: C.surface2, color: C.text }}
                >
                  <X size={18} />
                </button>
              </div>

              <div className="flex-1 overflow-y-auto px-3 scrollbar-hide">
                {TABS.map((t, i) => {
                  const active = activeTab === t.id;
                  return (
                    <button
                      key={t.id}
                      onClick={() => {
                        setActiveTab(t.id);
                        if (t.id !== 'rounds') setEditingRoundId(null);
                        setMenuOpen(false);
                      }}
                      className="w-full flex items-center rounded-2xl px-4 py-3 mb-1 text-left tap"
                      style={{
                        background: active ? C.surface2 : 'transparent',
                        borderLeft: active ? `3px solid ${C.lime}` : '3px solid transparent',
                        transform: menuOpen ? 'translateX(0)' : 'translateX(12px)',
                        opacity: menuOpen ? 1 : 0,
                        transition: `transform 0.3s cubic-bezier(0.16,1,0.3,1) ${0.06 + i * 0.035}s, opacity 0.3s ease ${0.06 + i * 0.035}s, background-color 0.15s ease`,
                      }}

                      <span className="font-semibold text-[15px]" style={{ color: active ? C.lime : C.text }}>
                        {t.label}
                      </span>
                    </button>
                  );
                })}
              </div>

              <div className="px-4 py-4" style={{ borderTop: `1px solid ${C.border}` }}>
                <div className="flex items-center gap-2">
                  <span
                    className={`w-2 h-2 rounded-full ${cloudStatus === 'connected' ? 'lime-pulse' : ''}`}
                    style={{ background: cloudStatus === 'connected' ? C.lime : cloudStatus === 'error' ? C.red : cloudStatus === 'connecting' ? C.gold : C.faint }}
                  />
                  <span className="text-xs font-semibold" style={{ color: C.muted }}>
                    {cloudStatus === 'connected' ? `Synced · ${cloudLeagueId}` : cloudStatus === 'connecting' ? 'Syncing…' : cloudStatus === 'error' ? 'Sync error' : 'Local only'}
                  </span>
                </div>
              </div>
          </SwipeDismissDrawer>
        )}

        {RECOVERY_MODE && (
          <div
            className="px-4 py-2.5 text-center"
            style={{ background: C.orange, color: '#1a1a1a' }}
          >
            <div className="font-display text-sm font-bold">🛟 RECOVERY MODE — nothing is being saved</div>
            <div className="text-[11px] mt-0.5">
