// One presentation layer for every game whose official result is match play.
// Scoring engines own the result; this component only renders their normalized data.
function matchPresentationState({ diff = 0, thru = 0, remaining = 0, clinched = false }) {
  const leader = diff > 0 ? 'sideA' : diff < 0 ? 'sideB' : null;
  const finished = thru > 0 && remaining === 0;
  const halved = finished && diff === 0;
  const complete = clinched || finished;
  const dormie = !complete && leader != null && remaining > 0 && Math.abs(diff) === remaining;
  return { leader, finished, halved, complete, dormie };
}

function MatchStatus({ sideAName, sideBName, diff = 0, thru = 0, remaining = 0, clinched = false, perHole = [], compact = false, emphasized = false, title }) {
  const { leader, halved, complete, dormie } = matchPresentationState({ diff, thru, remaining, clinched });
  const status = clinched
    ? `${Math.abs(diff)} & ${remaining}`
    : halved
      ? 'Match Halved'
      : diff === 0
        ? 'All Square'
        : `${Math.abs(diff)} UP`;
  const recent = perHole.slice(-3);
  const statusColor = complete ? C.cyan : leader ? C.lime : C.muted;
  const statusTextColor = complete || leader ? C.onAccent : C.text;
  const progressLabel = thru === 0
    ? `${remaining} hole${remaining === 1 ? '' : 's'} to play`
    : complete
      ? 'Match complete'
      : dormie
        ? `Dormie · ${remaining} hole${remaining === 1 ? '' : 's'} remaining`
        : `${remaining} hole${remaining === 1 ? '' : 's'} remaining`;
  const containerStyle = compact
    ? { background: emphasized ? C.surface2 : 'transparent', border: `1px solid ${emphasized ? C.limeRing : 'transparent'}`, borderRadius: 12, padding: emphasized ? '10px' : '8px 0', opacity: complete ? 0.78 : 1 }
    : { background: C.surface2, border: `1px solid ${C.border}` };
  return (
    <div className={compact ? '' : 'rounded-2xl p-4'} style={containerStyle}>
      {title && <div className="text-[10px] uppercase tracking-wide mb-2" style={{ color: C.muted }}>{title}</div>}
      <div className="grid items-center gap-3" style={{ gridTemplateColumns: 'minmax(0,1fr) auto minmax(0,1fr)' }}>
        <div className="min-w-0">
          <div className="font-display truncate" style={{ fontSize: compact ? 14 : 18, color: C.text, fontWeight: leader === 'sideA' ? 800 : 600 }}>{sideAName}</div>
          {leader === 'sideA' && <div className="text-[10px] uppercase font-bold mt-1" style={{ color: C.lime }}>Leading</div>}
        </div>
        <div className="text-center px-1">
          <div className="font-display leading-none rounded-full inline-block" style={{ fontSize: compact ? 16 : 25, color: statusTextColor, background: statusColor, padding: compact ? '5px 9px' : '7px 13px' }}>{status}</div>
          <div className="text-[10px] mt-1.5" style={{ color: C.muted }}>
            {thru === 0 ? 'Not started' : clinched ? `Final through ${thru}` : `Through ${thru}`}
          </div>
          <div className="text-[10px] font-semibold mt-0.5" style={{ color: dormie ? C.orange : C.faint }}>{progressLabel}</div>
        </div>
        <div className="min-w-0 text-right">
          <div className="font-display truncate" style={{ fontSize: compact ? 14 : 18, color: C.text, fontWeight: leader === 'sideB' ? 800 : 600 }}>{sideBName}</div>
          {leader === 'sideB' && <div className="text-[10px] uppercase font-bold mt-1" style={{ color: C.lime }}>Leading</div>}
        </div>
      </div>
      {recent.length > 0 && !compact && (
        <div className="flex items-center justify-center gap-2 mt-4 pt-3" style={{ borderTop: `1px solid ${C.border}` }} aria-label={`Recent holes for ${sideAName}`}>
          <span className="sr-only">Recent holes for {sideAName}. W means won, H means halved, L means lost.</span>
          {recent.map((hole) => (
            <div key={hole.hole} className="text-center" title={hole.winner === 'halved' ? `Hole ${hole.hole}: Halved` : `Hole ${hole.hole}: ${hole.winner === 'sideA' ? sideAName : sideBName} won`}>
              <div className="text-[9px]" style={{ color: C.faint }}>H{hole.hole}</div>
              <div className="rounded-full flex items-center justify-center text-[10px] font-bold mt-1" style={{ width: 24, height: 24, color: hole.winner === 'halved' ? C.muted : C.onAccent, background: hole.winner === 'sideA' ? C.cyan : hole.winner === 'sideB' ? C.pink : C.surface, border: `1px solid ${C.border}` }}>
                {hole.winner === 'halved' ? 'H' : hole.winner === 'sideA' ? 'W' : 'L'}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function GameScoreboardCard({ settings, round, course, players, patchGameData, readOnly }) {
  const game = GAME_LIBRARY.find((g) => g.id === round.gameId) || null;
  const scoring = game?.scoring || 'quota';
  const holes = roundHoles(round, course);
  const activePlayers = players;
  const useNet = effectivePointsBasis(round) === 'net';

  if (scoring === 'quota') {
    const board = activePlayers
      .map((p) => {
        const res = playerResultInRound(settings, round, p, course);
        const thru = holes.filter((h, i) => grossOf(round, p.id, i) != null).length;
        return { p, res, thru };
      })
      .sort((a, b) => (b.res ? b.res.result : -999) - (a.res ? a.res.result : -999));
    return (
      <Card>
        <div className="flex items-center justify-between mb-2">
          <div className="font-display text-lg" style={{ color: C.text }}>
            {readOnly ? 'Final Standings' : 'Live Standings'}
          </div>
        </div>
        {board.map(({ p, res, thru }, i) => (
          <div key={p.id} className="flex items-center justify-between py-2.5" style={{ borderBottom: `1px solid ${C.border}` }}>
            <div className="flex items-center gap-2 min-w-0">
              {i === 0 && res ? (
                <span className="w-5 text-center" style={{ fontSize: 14 }}>
                  🏆
                </span>
              ) : (
                <span className="font-display text-sm w-5 text-center" style={{ color: C.faint }}>
                  {i + 1}
                </span>
              )}
              <span className="text-sm truncate" style={{ color: i === 0 && res ? C.text : C.text, fontWeight: i === 0 && res ? 700 : 600 }}>
                {p.name}
              </span>
            </div>
            <div className="flex items-center gap-3 shrink-0">
              <span className="text-[11px] font-medium" style={{ color: C.muted }}>
                {res ? `${res.points} pts · q${res.quota}` : 'no scores'}
              </span>
              <span className="font-display text-lg w-10 text-right" style={{ color: res ? (res.result >= 0 ? C.lime : C.red) : C.faint }}>
                {res ? (res.result >= 0 ? '+' : '') + res.result : '–'}
              </span>
              <span className="font-display text-xs w-6 text-right" style={{ color: C.muted }}>
                {thru}
              </span>
            </div>
          </div>
        ))}
      </Card>
    );
  }

  if (scoring === 'stroke') {
    const rows = strokePlayBoard(round, course, activePlayers, useNet);
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>
          {game.name} — Total Strokes
        </div>
        {rows.map(({ p, total, thru }, i) => (
          <BoardRow key={p.id} rank={i + 1} name={p.name} value={thru > 0 ? total : '–'} sub={`${useNet ? 'net' : 'gross'} · thru ${thru}`} />
        ))}
      </Card>
    );
  }

  if (scoring === 'stableford') {
    const rows = stablefordBoard(round, course, activePlayers, settings, useNet);
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>
          {game.name}
        </div>
        {rows.map(({ p, total, thru }, i) => (
          <BoardRow key={p.id} rank={i + 1} name={p.name} value={thru > 0 ? total : '–'} sub={`thru ${thru}`} />
        ))}
      </Card>
    );
  }

  if (scoring === 'match') {
    if (activePlayers.length !== 2) {
      return <EmptyNote text={`${game.name} needs exactly 2 players selected for this round.`} />;
    }
    const seg = matchSegment(round, course, activePlayers, 0, holes.length, useNet);
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>{game.name}</div>
        <MatchStatus sideAName={seg.a.name} sideBName={seg.b.name} {...seg} />
      </Card>
    );
  }

  if (scoring === 'bestball') {
    const bb = bestBallMatch(round, course, activePlayers, effectivePointsBasis(round) === 'net');
    if (!bb) {
      return <EmptyNote text="Pick your two teams on the round setup screen to score Best Ball automatically." />;
    }
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>{game.name}</div>
        <MatchStatus sideAName={bb.t1.map((p) => p.name).join(' + ')} sideBName={bb.t2.map((p) => p.name).join(' + ')} {...bb} perHole={bb.perHole.map((hole) => ({ hole: hole.i + 1, winner: hole.winner === 'team1' ? 'sideA' : hole.winner === 'team2' ? 'sideB' : 'halved' }))} />
        <div className="flex items-center justify-center gap-3 pt-2 text-[11px]" style={{ borderTop: `1px solid ${C.border}`, color: C.faint }}>
          <span>
            A won <span style={{ color: C.cyan }}>{bb.wonA}</span>
          </span>
          <span>halved {bb.halved}</span>
          <span>
            B won <span style={{ color: C.pink }}>{bb.wonB}</span>
          </span>
        </div>
      </Card>
    );
  }

  if (scoring === 'nassau') {
    const isSingles = activePlayers.length === 2;
    const isTeams = activePlayers.length === 4 && !!bestBallTeams(round, activePlayers);
    if (!isSingles && !isTeams) {
      return <EmptyNote text="Nassau needs 2 players, or 4 players with two teams set on the setup screen." />;
    }
    const segment = (start, end) =>
      isSingles
        ? matchSegment(round, course, activePlayers, start, end, useNet)
        : teamMatchSegment(round, course, activePlayers, start, end, useNet);
    const sideNames = (seg) =>
      isSingles
        ? { a: seg.a.name, b: seg.b.name }
        : { a: seg.t1.map((p) => p.name).join(' + '), b: seg.t2.map((p) => p.name).join(' + ') };
    if (holes.length < 18) {
      const seg = segment(0, holes.length);
      const names = sideNames(seg);
      return (
        <Card>
          <div className="font-display text-lg mb-2" style={{ color: C.text }}>
            Nassau (single match — needs 18 holes for all 3 bets)
          </div>
          <MatchStatus sideAName={names.a} sideBName={names.b} {...seg} />
        </Card>
      );
    }
    const front = segment(0, 9);
    const back = segment(9, 18);
    const overall = segment(0, 18);
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>Nassau</div>
        {[
          ['Front 9', front],
          ['Back 9', back],
          ['Overall', overall],
        ].map(([label, seg]) => {
          const names = sideNames(seg);
          const isActive = seg.thru > 0 && !seg.clinched && seg.remaining > 0;
          return (
            <div key={label} className="py-0.5" style={{ borderBottom: `1px solid ${C.border}` }}>
              <MatchStatus title={`${label}${isActive ? ' · Live' : ''}`} sideAName={names.a} sideBName={names.b} {...seg} compact emphasized={isActive} />
            </div>
          );
        })}
      </Card>
    );
  }

  if (scoring === 'nines') {
    if (activePlayers.length !== 3) {
      return <EmptyNote text="Nines needs exactly 3 players selected for this round." />;
    }
    const { pts, thru } = ninesBoard(round, course, activePlayers, useNet);
    const rows = activePlayers.map((p) => ({ p, pts: pts[p.id] })).sort((a, b) => b.pts - a.pts);
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>
          Nines (5-3-1)
        </div>
        {rows.map(({ p, pts: v }, i) => (
          <BoardRow key={p.id} rank={i + 1} name={p.name} value={v} sub={`thru ${thru}`} />
        ))}
      </Card>
    );
  }

  if (scoring === 'wolf') {
    const { pts, thru } = wolfBoard(round, course, activePlayers, useNet);
    const rows = activePlayers.map((p) => ({ p, pts: pts[p.id] })).sort((a, b) => b.pts - a.pts);
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>
          Wolf
        </div>
        {rows.map(({ p, pts: v }, i) => (
          <BoardRow key={p.id} rank={i + 1} name={p.name} value={v} sub={`thru ${thru}`} />
        ))}
      </Card>
    );
  }

  if (scoring === 'bbb') {
    const pts = bbbBoard(round, activePlayers);
    const rows = activePlayers.map((p) => ({ p, pts: pts[p.id] })).sort((a, b) => b.pts - a.pts);
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>
          Bingo Bango Bongo
        </div>
        {rows.map(({ p, pts: v }, i) => (
          <BoardRow key={p.id} rank={i + 1} name={p.name} value={v} />
        ))}
      </Card>
    );
  }

  if (scoring === 'skins') {
    const skinsRound = { ...round, entryMode: 'holebyhole', skinsOptIn: activePlayers.map((p) => p.id) };
    const casualBuyIn = Math.max(0, Number(round.casualBet?.buyIn) || 0);
    const showSkinMoney = !round.casual || casualBuyIn > 0;
    const skins = computeSkinsForRound(skinsRound, activePlayers, course, {
      ...settings,
      skinsBuyIn: round.casual ? (casualBuyIn > 0 ? casualBuyIn : 1) : settings.skinsBuyIn || 5,
      skinsType: useNet ? 'net' : 'gross',
    });
    if (!skins) return <EmptyNote text="Skins needs at least 2 players." />;
    const rows = skins.players.map((p) => ({ p, count: skins.tally[p.id], pay: skins.payouts[p.id] })).sort((a, b) => b.count - a.count);
    return (
      <Card>
        <div className="flex items-center justify-between mb-2 gap-3">
          <div className="font-display text-lg" style={{ color: C.text }}>
            Skins
          </div>
          {showSkinMoney ? (
            <StatTile label="Pot" value={`$${skins.pot}`} />
          ) : (
            <span className="rounded-full px-2.5 py-1 text-[10px] font-bold" style={{ background: C.surface2, color: C.muted, border: `1px solid ${C.border}` }}>
              NO MONEY
            </span>
          )}
        </div>
        {rows.map(({ p, count, pay }) => (
          <div key={p.id} className="flex items-center justify-between py-1.5" style={{ borderBottom: `1px solid ${C.border}` }}>
            <span style={{ color: count > 0 ? C.text : C.muted, fontWeight: count > 0 ? 600 : 400 }}>{p.name}</span>
            <span className="font-display text-sm" style={{ color: count > 0 ? C.gold : C.faint }}>
              {count} skin{count === 1 ? '' : 's'}{showSkinMoney ? ` · $${pay.toFixed(2)}` : ''}
            </span>
          </div>
        ))}
        {skins.carry > 0 && (
          <div className="text-[11px] mt-2" style={{ color: C.orange }}>
            {skins.carry} skin{skins.carry > 1 ? 's' : ''} still carrying (thru {skins.thru})
          </div>
        )}
      </Card>
    );
  }

  if (scoring === 'vegas') {
    const board = vegasBoard(round, course, activePlayers, useNet);
    if (!board) return <EmptyNote text="Vegas needs two players on Team A and two on Team B." />;
    const leader = board.diff > 0 ? 'Team A' : board.diff < 0 ? 'Team B' : 'Tied';
    const last = board.perHole[board.perHole.length - 1];
    return (
      <Card>
        <div className="flex items-center justify-between gap-2 mb-2">
          <div className="font-display text-lg" style={{ color: C.text }}>Vegas</div>
          <span className="text-[10px] uppercase font-bold" style={{ color: C.gold }}>{leader} {board.diff !== 0 ? `+${Math.abs(board.diff)}` : ''}</span>
        </div>
        <div className="grid grid-cols-2 gap-2">
          {[
            { label: 'Team A', names: board.name1, color: C.cyan, points: Math.max(0, board.diff) },
            { label: 'Team B', names: board.name2, color: C.pink, points: Math.max(0, -board.diff) },
          ].map((team) => (
            <div key={team.label} className="rounded-2xl p-3" style={{ background: C.surface2, border: `1px solid ${C.border}` }}>
              <div className="text-[10px] uppercase font-bold" style={{ color: team.color }}>{team.label}</div>
              <div className="text-xs mt-1 truncate" style={{ color: C.text }}>{team.names}</div>
              <div className="font-display text-2xl mt-1" style={{ color: team.points > 0 ? C.gold : C.text }}>{team.points}</div>
            </div>
          ))}
        </div>
        <div className="text-[11px] mt-2" style={{ color: C.muted }}>
          Thru {board.thru}{last ? ` · Last hole ${last.aNumber}–${last.bNumber}` : ''}{board.birdieFlip ? ' · birdie flip on' : ''}
        </div>
      </Card>
    );
  }

  if (scoring === 'sixes') {
    const board = sixesBoard(round, course, activePlayers, useNet);
    if (!board) return <EmptyNote text="Sixes needs exactly four players." />;
    const rows = activePlayers.map((p) => ({ p, points: board.playerPoints[p.id] || 0 })).sort((a, b) => b.points - a.points);
    const showFinalStandings = readOnly || board.segments.every((segment) => segment.settled);
    const standings = <div className="mt-2">{rows.map(({ p, points }, index) => <BoardRow key={p.id} rank={index + 1} name={p.name} value={points} sub="match points" />)}</div>;
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>Sixes · rotating partners</div>
        {board.segments.map((segment) => {
          const isActive = segment.thru > 0 && !segment.settled;
          return (
            <div key={segment.index} className="mb-2">
              <MatchStatus
                title={`${segment.thru === 0 ? 'Upcoming · ' : ''}Holes ${segment.start + 1}–${segment.end}`}
                sideAName={segment.t1.map((p) => p.name).join(' + ')}
                sideBName={segment.t2.map((p) => p.name).join(' + ')}
                {...segment}
                compact={!isActive}
              />
            </div>
          );
        })}
        {showFinalStandings ? standings : (
          <details className="mt-2 rounded-xl px-3 py-2" style={{ background: C.surface2, border: `1px solid ${C.border}` }}>
            <summary className="text-[11px] font-semibold cursor-pointer" style={{ color: C.muted }}>Round match-point standings</summary>
            {standings}
          </details>
        )}
      </Card>
    );
  }

  if (scoring === 'rabbit') {
    const board = rabbitBoard(round, course, activePlayers, useNet);
    const holder = activePlayers.find((p) => p.id === board.holderId);
    return (
      <Card>
        <div className="flex items-center justify-between gap-2 mb-2">
          <div className="font-display text-lg" style={{ color: C.text }}>Rabbit</div>
          <span className="text-[10px] uppercase font-bold" style={{ color: C.gold }}>{board.directTransfer ? 'Direct transfer' : 'Free, then capture'}</span>
        </div>
        <div className="rounded-2xl p-3 mb-2" style={{ background: C.surface2, border: `1px solid ${holder ? C.gold : C.border}` }}>
          <div className="text-[10px] uppercase" style={{ color: C.muted }}>Current holder</div>
          <div className="font-display text-xl mt-0.5" style={{ color: holder ? C.gold : C.faint }}>{holder?.name || 'Rabbit is free'}</div>
        </div>
        {board.legs.map((leg, index) => {
          const winner = activePlayers.find((p) => p.id === leg.winnerId);
          return <div key={index} className="flex items-center justify-between py-2 text-sm" style={{ borderBottom: `1px solid ${C.border}` }}><span style={{ color: C.muted }}>{index === 0 ? 'Front' : 'Back'} rabbit</span><b style={{ color: winner ? C.lime : C.faint }}>{winner?.name || (board.thru >= leg.end ? 'Unclaimed' : 'In play')}</b></div>;
        })}
      </Card>
    );
  }

  if (scoring === 'teamscore') {
    const board = teamScoreBoard(round, course, activePlayers, useNet);
    if (!board) return <EmptyNote text="Assign every player to Team A or Team B." />;
    return (
      <Card>
        <div className="flex items-start justify-between gap-3 mb-2">
          <div className="font-display text-lg" style={{ color: C.text }}>{game.name} · Team Score</div>
          <div className="text-right">
            <div className="text-[9px] uppercase" style={{ color: C.faint }}>Scoring</div>
            <div className="text-xs font-bold" style={{ color: C.lime }}>Stroke Play</div>
          </div>
        </div>
        <div className="text-[10px] mb-2" style={{ color: C.muted }}>Official winner and payout are determined by the lowest team total.</div>
        {board.rows.map((team, index) => (
          <div key={team.id} className="flex items-center justify-between gap-3 py-2.5" style={{ borderBottom: `1px solid ${C.border}` }}>
            <div className="min-w-0">
              <div className="text-[10px] uppercase font-bold" style={{ color: index === 0 ? C.cyan : C.pink }}>Team {index === 0 ? 'A' : 'B'}</div>
              <div className="text-xs truncate" style={{ color: C.text }}>{team.name}</div>
              <div className="text-[10px]" style={{ color: C.faint }}>CH {team.courseHandicap} · {holes.length - team.thru} holes remaining</div>
            </div>
            <div className="text-right">
              <div className="font-display text-2xl" style={{ color: C.gold }}>{team.thru ? team.total : '–'}</div>
              <div className="text-xs font-bold" style={{ color: team.thru ? (team.relativeToPar <= 0 ? C.lime : C.text) : C.faint }}>
                {team.thru ? (team.relativeToPar === 0 ? 'E' : `${team.relativeToPar > 0 ? '+' : ''}${team.relativeToPar}`) : 'relative to par'}
              </div>
              <div className="text-[10px]" style={{ color: C.muted }}>{useNet ? `${team.gross} gross · net total` : 'gross total'}</div>
            </div>
          </div>
        ))}
      </Card>
    );
  }

  if (scoring === 'shamble') {
    const board = shambleBoard(round, course, activePlayers, useNet);
    if (!board) return <EmptyNote text="Assign every player to Team A or Team B." />;
    const sorted = [...board.rows].sort((a, b) => a.total - b.total);
    return (
      <Card>
        <div className="font-display text-lg mb-1" style={{ color: C.text }}>Shamble</div>
        <div className="text-[11px] mb-2" style={{ color: C.muted }}>{board.count} counting score{board.count === 1 ? '' : 's'} per team · {useNet ? 'net' : 'gross'}</div>
        {sorted.map((team, index) => <BoardRow key={team.id} rank={index + 1} name={`Team ${team.id === 'team1' ? 'A' : 'B'} · ${team.name}`} value={team.thru ? team.total : '–'} sub={`thru ${team.thru}`} />)}
      </Card>
    );
  }

  if (scoring === 'snake') {
    const board = snakeBoard(round, activePlayers);
    const holder = activePlayers.find((p) => p.id === board.holderId);
    const rows = activePlayers.map((p) => ({ p, count: board.counts[p.id] || 0 })).sort((a, b) => b.count - a.count);
    return (
      <Card>
        <div className="flex items-center justify-between gap-2 mb-2">
          <div className="font-display text-lg" style={{ color: C.text }}>Snake</div>
          <span className="text-xs font-bold" style={{ color: holder ? C.red : C.faint }}>{holder ? `${holder.name} holds it` : 'No three-putts'}</span>
        </div>
        {rows.map(({ p, count }, index) => <BoardRow key={p.id} rank={index + 1} name={p.name} value={count} sub="three-putts" />)}
      </Card>
    );
  }

  if (scoring === 'trash') {
    const value = Math.max(0, Number(round.casualBet?.buyIn) || 0) || 1;
    const trashRound = { ...round, trashOptIn: activePlayers.map((p) => p.id) };
    const result = computeTrashForRound(trashRound, activePlayers, course, { ...settings, trashValue: value });
    if (!result) return <EmptyNote text="Enter scores and tap any dots earned on each hole." />;
    const rows = activePlayers.map((p) => ({ p, total: result.tally[p.id]?.total || 0 })).sort((a, b) => b.total - a.total);
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>Dots (Trash)</div>
        {rows.map(({ p, total }, index) => <BoardRow key={p.id} rank={index + 1} name={p.name} value={total} sub="dots" />)}
      </Card>
    );
  }

  // manual tally for formats without a dedicated automatic engine
  const tally = round.gameData?.manualTally || {};
  const teamTally = round.gameData?.manualTeamTally || { team1: 0, team2: 0 };
  const pairing = round.gameData?.pairing || null;
  const teamManual = !!(pairing && game?.pairing);
  function bumpTally(playerId, delta) {
    patchGameData(round.id, { manualTally: { ...tally, [playerId]: (tally[playerId] || 0) + delta } });
  }
  function bumpTeam(teamId, delta) {
    patchGameData(round.id, { manualTeamTally: { ...teamTally, [teamId]: (teamTally[teamId] || 0) + delta } });
  }
  const rows = activePlayers.map((p) => ({ p, v: tally[p.id] || 0 })).sort((a, b) => b.v - a.v);
  const Stepper = ({ value, onMinus, onPlus }) => readOnly ? (
    <span className="font-display text-lg" style={{ color: C.text }}>{value}</span>
  ) : (
    <div className="flex items-center gap-3">
      <button onClick={onMinus} className="w-11 h-11 rounded-xl flex items-center justify-center tap" style={{ background: C.surface2, color: C.text, border: `1px solid ${C.border}` }}><Minus size={16} /></button>
      <span className="w-9 text-center font-display text-lg" style={{ color: C.text }}>{value}</span>
      <button onClick={onPlus} className="w-11 h-11 rounded-xl flex items-center justify-center tap" style={{ background: C.lime, color: C.onAccent, border: `1px solid ${C.lime}` }}><Plus size={16} /></button>
    </div>
  );

  if (teamManual) {
    const teams = [
      { id: 'team1', label: 'Team A', names: (pairing.team1Ids || []).map((id) => activePlayers.find((p) => p.id === id)?.name).filter(Boolean), color: C.cyan },
      { id: 'team2', label: 'Team B', names: (pairing.team2Ids || []).map((id) => activePlayers.find((p) => p.id === id)?.name).filter(Boolean), color: C.pink },
    ];
    return (
      <Card>
        <div className="font-display text-lg mb-1" style={{ color: C.text }}>{game.name} — Team Tally</div>
        {!readOnly && <p className="text-xs mb-3" style={{ color: C.muted }}>Use the tally for match points, holes won, or your group’s agreed scoring unit.</p>}
        {teams.map((team) => (
          <div key={team.id} className="flex items-center justify-between gap-3 py-3" style={{ borderBottom: `1px solid ${C.border}` }}>
            <div className="min-w-0">
              <div className="text-xs font-bold uppercase" style={{ color: team.color }}>{team.label}</div>
              <div className="text-sm truncate" style={{ color: C.text }}>{team.names.join(' + ')}</div>
            </div>
            <Stepper value={teamTally[team.id] || 0} onMinus={() => bumpTeam(team.id, -1)} onPlus={() => bumpTeam(team.id, 1)} />
          </div>
        ))}
      </Card>
    );
  }

  return (
    <Card>
      <div className="font-display text-lg mb-1" style={{ color: C.text }}>
        {game ? `${game.name} — Manual Tally` : 'Manual Tally'}
      </div>
      {!readOnly && <p className="text-xs mb-2" style={{ color: C.muted }}>Track points or wins by hand as you play. The highest final tally wins the casual pot.</p>}
      {rows.map(({ p, v }) => (
        <div key={p.id} className="flex items-center justify-between py-2" style={{ borderBottom: `1px solid ${C.border}` }}>
          <span className="text-sm" style={{ color: C.text }}>{p.name}</span>
          <Stepper value={v} onMinus={() => bumpTally(p.id, -1)} onPlus={() => bumpTally(p.id, 1)} />
        </div>
      ))}
    </Card>
  );
}

function BestBallHoleResult({ round, course, players, holeIdx, net }) {
  const bb = bestBallMatch(round, course, players, net);
  if (!bb) {
    return (
      <Card>
        <div className="text-xs" style={{ color: C.orange }}>
          Set your Best Ball teams on the round setup screen to score this hole automatically.
        </div>
      </Card>
    );
  }
  const hr = bb.perHole[holeIdx];
  const leadTxt = bb.diff === 0 ? 'All Square' : `Team ${bb.diff > 0 ? 'A' : 'B'} ${Math.abs(bb.diff)} UP`;
  const side = (label, col, res, isWin) => (
    <div
      className="flex-1 rounded-2xl p-2.5 text-center"
      style={{ background: isWin ? C.limeSoft : C.surface2, border: `1px solid ${isWin ? C.lime : C.border}` }}
    >
      <div className="text-[10px] uppercase tracking-wide" style={{ color: col }}>
        Team {label}
      </div>
      <div className="font-display text-2xl leading-none mt-0.5" style={{ color: res.val == null ? C.faint : C.text }}>
        {res.val == null ? '—' : res.val}
      </div>
      <div className="text-[10px] mt-0.5 truncate" style={{ color: C.faint }}>
        {res.who ? res.who.name : 'waiting'}
      </div>
    </div>
  );
  return (
    <Card>
      <div className="flex items-center justify-between mb-2">
        <div className="font-display text-sm" style={{ color: C.lime }}>
          BEST BALL — HOLE {holeIdx + 1}
        </div>
        <div className="font-display text-xs" style={{ color: C.muted }}>
          {leadTxt}
        </div>
      </div>
      <div className="flex items-stretch gap-2">
        {side('A', C.cyan, hr.a, hr.winner === 'team1')}
        <div className="flex items-center justify-center px-1">
          <span className="font-display text-xs" style={{ color: C.faint }}>
            vs
          </span>
        </div>
        {side('B', C.pink, hr.b, hr.winner === 'team2')}
      </div>
      <div className="text-center text-[11px] mt-2" style={{ color: hr.winner ? C.text : C.faint }}>
        {hr.winner === 'team1'
          ? 'Team A wins the hole'
          : hr.winner === 'team2'
          ? 'Team B wins the hole'
          : hr.winner === 'halved'
          ? 'Hole halved'
          : 'Enter a score for each team to settle this hole'}
      </div>
      <div className="text-center text-[10px] mt-1" style={{ color: C.faint }}>
        {bb.wonA} A · {bb.halved} halved · {bb.wonB} B{net ? ' · net scoring' : ''}
      </div>
    </Card>
  );
}

function LiveTicker({ settings, round, course, players }) {
  const holes = roundHoles(round, course);
  const net = effectivePointsBasis(round) !== 'gross';
  const usePoints = settings.tickerBasis === 'points';

  let rows;
  if (usePoints) {
    rows = players
      .map((p) => {
        const res = playerResultInRound(settings, round, p, course);
        const thru = holes.filter((h, i) => grossOf(round, p.id, i) != null).length;
        return { p, thru, res };
      })
      .filter((r) => r.thru > 0 && r.res)
      .sort((a, b) => b.res.result - a.res.result || b.thru - a.thru);
  } else {
    rows = players
      .map((p) => {
        let eff = 0;
        let parSum = 0;
        let thru = 0;
        holes.forEach((h, i) => {
          const g = grossOf(round, p.id, i);
          if (g == null) return;
          thru++;
          eff += net ? g - strokesThisHole(round, p, course, i) : g;
          parSum += h.par;
        });
        return { p, thru, toPar: eff - parSum };
      })
      .filter((r) => r.thru > 0)
      .sort((a, b) => a.toPar - b.toPar || b.thru - a.thru);
  }

  if (rows.length === 0) return null;

  const signed = (n) => (n > 0 ? `+${n}` : `${n}`);
  const fmtToPar = (n) => (n === 0 ? 'E' : signed(n));

  const Run = () => (
    <div className="flex items-center shrink-0">
      {rows.map((r, i) => {
        const good = usePoints ? r.res.result >= 0 : r.toPar <= 0;
        return (
          <span key={r.p.id} className="flex items-center whitespace-nowrap" style={{ paddingRight: 22 }}>
            <span className="font-display text-[11px]" style={{ color: i === 0 ? C.gold : C.faint, minWidth: 14 }}>
              {i + 1}
            </span>
            <span className="text-[12px] font-semibold ml-1.5" style={{ color: C.text }}>
              {r.p.name}
            </span>
            <span className="font-display text-[12px] ml-1.5" style={{ color: good ? C.lime : C.orange }}>
              {usePoints ? signed(r.res.result) : fmtToPar(r.toPar)}
            </span>
            {usePoints && (
              <span className="text-[10px] ml-1.5" style={{ color: C.faint }}>
                {r.res.points} pts
              </span>
            )}
            <span className="text-[10px] ml-1.5" style={{ color: C.faint }}>
              thru {r.thru}
            </span>
          </span>
        );
      })}
    </div>
  );

  // Rendered through a portal on document.body: an ancestor with any transform
  // (the .tab-fade-in wrapper keeps translateY(0) because of animation-fill-mode: both)
  // becomes the containing block for position:fixed, which would strand this bar
  // at the bottom of the scrolling content instead of the viewport.
  return ReactDOM.createPortal(
    <div style={{ position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 50, pointerEvents: 'none' }}>
      <div style={{ maxWidth: 480, margin: '0 auto', pointerEvents: 'auto' }}>
        <div
          className="flex items-center"
          style={{
            background: C.surface2,
            borderTop: `1px solid ${C.border}`,
            height: 38,
            paddingLeft: 10,
            paddingRight: 10,
            paddingBottom: 'env(safe-area-inset-bottom, 0px)',
            boxSizing: 'content-box',
          }}
        >
          <span
            className="font-display text-[9px] uppercase tracking-wider shrink-0 px-1.5 py-0.5 rounded mr-2"
            style={{ background: C.lime, color: C.onAccent }}
          >
            {usePoints ? 'vs Quota' : net ? 'Net' : 'Gross'}
          </span>
          <div className="flex-1 overflow-hidden">
            <div className="ticker-track">
              <Run />
              <Run />
            </div>
          </div>
        </div>
      </div>
    </div>,
    document.body
  );
}

function RoundTimer({ startedAt }) {
  const [now, setNow] = useState(() => Date.now());
  useEffect(() => {
    const iv = setInterval(() => setNow(Date.now()), 30000);
    return () => clearInterval(iv);
  }, []);
  if (!startedAt) return null;
  const ms = Math.max(0, now - new Date(startedAt).getTime());
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  const label = h > 0 ? `${h}h ${m}m` : `${m}m`;
  return (
    <div className="flex items-center gap-1 shrink-0 px-2 py-1 rounded-full" style={{ background: C.surface2, color: C.muted }}>
      <Clock size={12} />
      <span className="text-[11px] font-semibold">{label}</span>
    </div>
  );
}

function LiveScoring({ settings, round, players, course, patchRound, setHoleScore, toggleTrashItem, patchGameData, onBackToSetup, onFinish, cloudStatus, saveStatus }) {
  const holes = roundHoles(round, course);
  const activePlayers = roundPlayerList(round, players);
  const holeIdx = Math.min(round.currentHole || 0, holes.length - 1);
  const hole = holes[holeIdx];
  const net = effectivePointsBasis(round) === 'net';
  const game = GAME_LIBRARY.find((g) => g.id === round.gameId) || null;
  const isTeamScoreMode = game?.scoring === 'teamscore';
  const teamData = isTeamScoreMode ? fixedTeamData(round, activePlayers) : null;
  const teamScoreTeams = teamData ? [
    { id: 'team1', label: 'Team A', names: teamData.name1, color: C.cyan },
    { id: 'team2', label: 'Team B', names: teamData.name2, color: C.pink },
  ] : [];
  const [showRules, setShowRules] = useState(false);
  const [revealStandings, setRevealStandings] = useState(false);

  function setHole(i) {
    patchRound(round.id, { currentHole: i });
  }
  function bump(playerId, delta) {
    const cur = round.playerData[playerId]?.holeScores?.[holeIdx];
    const base = cur == null ? hole.par : cur;
    setHoleScore(round.id, playerId, holeIdx, Math.max(1, base + delta));
  }
  function resetToPar(playerId) {
    setHoleScore(round.id, playerId, holeIdx, hole.par);
  }
  function confirmAllPar() {
    if (isTeamScoreMode) {
      const current = round.gameData?.teamScores || {};
      const next = { team1: { ...(current.team1 || {}) }, team2: { ...(current.team2 || {}) } };
      teamScoreTeams.forEach((team) => {
        if (next[team.id]?.[holeIdx] == null) next[team.id][holeIdx] = hole.par;
      });
      patchGameData(round.id, { teamScores: next });
      return;
    }
    activePlayers.forEach((p) => {
      if (round.playerData[p.id]?.holeScores?.[holeIdx] == null) {
        setHoleScore(round.id, p.id, holeIdx, hole.par);
      }
    });
  }
  function setTeamHoleScore(teamId, value) {
    const scores = round.gameData?.teamScores || {};
    patchGameData(round.id, { teamScores: { ...scores, [teamId]: { ...(scores[teamId] || {}), [holeIdx]: value } } });
  }
  function bumpTeamScore(teamId, delta) {
    const current = round.gameData?.teamScores?.[teamId]?.[holeIdx];
    setTeamHoleScore(teamId, Math.max(1, (current == null ? hole.par : current) + delta));
  }
  function toggleSnakeThreePutt(playerId) {
    const events = round.gameData?.snakeEvents || [];
    const exists = events.some((event) => event.holeIdx === holeIdx && event.playerId === playerId);
    const next = exists
      ? events.filter((event) => !(event.holeIdx === holeIdx && event.playerId === playerId))
      : [...events, { holeIdx, playerId, at: new Date().toISOString() }];
    patchGameData(round.id, { snakeEvents: next });
  }

  const allScoredThisHole = isTeamScoreMode
    ? teamScoreTeams.length === 2 && teamScoreTeams.every((team) => round.gameData?.teamScores?.[team.id]?.[holeIdx] != null)
    : activePlayers.length > 0 && activePlayers.every((p) => round.playerData[p.id]?.holeScores?.[holeIdx] != null);
  const missingThisHole = isTeamScoreMode
    ? teamScoreTeams.filter((team) => round.gameData?.teamScores?.[team.id]?.[holeIdx] == null).length
    : activePlayers.filter((p) => round.playerData[p.id]?.holeScores?.[holeIdx] == null).length;
  const missingScoresTotal = holes.reduce((total, h, i) => total + (
    isTeamScoreMode
      ? teamScoreTeams.filter((team) => round.gameData?.teamScores?.[team.id]?.[i] == null).length
      : activePlayers.filter((p) => round.playerData[p.id]?.holeScores?.[i] == null).length
  ), 0);
  const syncLabel = RECOVERY_MODE
    ? 'Recovery mode'
    : saveStatus === 'saving'
    ? 'Saving…'
    : saveStatus === 'error' || cloudStatus === 'error'
    ? 'Save error'
    : cloudStatus === 'connected'
    ? 'Saved'
    : 'Saved on phone';
  const syncColor = saveStatus === 'error' || cloudStatus === 'error' ? C.red : saveStatus === 'saving' ? C.gold : C.lime;

  const showDogfightInfo = !game || game.scoring === 'quota';

  const standingsHidden = settings.hideLiveStandings && !revealStandings;
  const tickerOn = settings.showLiveTicker !== false && !standingsHidden && !isTeamScoreMode;

  return (
    <div style={{ paddingBottom: tickerOn ? 'calc(46px + env(safe-area-inset-bottom, 0px))' : 0 }}>

          zIndex: 30,

          marginRight: -16,

        </div>
      </div>

      {game && (

        <button
          onClick={() => setHole(Math.min(holes.length - 1, holeIdx + 1))}

      <div key={holeIdx} className="tab-fade-in">

          />

          <BBBPicker
            players={activePlayers}
            pick={round.gameData?.bbbPicks?.[holeIdx]}
            onChange={(patch) => patchGameData(round.id, { bbbPicks: { ...(round.gameData?.bbbPicks || {}), [holeIdx]: patch } })}
          />

        {game?.scoring === 'snake' && (
          <Card>
            <div className="font-display text-sm mb-1" style={{ color: C.gold }}>SNAKE · THIS HOLE</div>
            <p className="text-[11px] mb-2" style={{ color: C.muted }}>Tap anyone who three-putted. The last recorded three-putt becomes the current Snake holder.</p>
            <div className="grid grid-cols-2 gap-2">
              {activePlayers.map((p) => {
                const on = (round.gameData?.snakeEvents || []).some((event) => event.holeIdx === holeIdx && event.playerId === p.id);
                return (
                  <button key={p.id} onClick={() => toggleSnakeThreePutt(p.id)} className="rounded-xl px-3 py-3 text-left tap" style={{ background: on ? C.goldSoft : C.surface2, border: `1.5px solid ${on ? C.gold : C.border}` }}>

        {missingThisHole > 0 && (

      {game?.scoring === 'bestball' && <BestBallHoleResult round={round} course={course} players={activePlayers} holeIdx={holeIdx} net={net} />}

      {(game?.scoring === 'trash' || ((round.trashOptIn || []).length > 0 && settings.trashValue > 0)) && (
        <Card>
          <div className="font-display text-sm mb-2" style={{ color: C.lime }}>
            {game?.scoring === 'trash' ? 'DOTS (TRASH) — this hole' : 'TRASH — this hole'}
          </div>
          {activePlayers
            .filter((p) => game?.scoring === 'trash' || (round.trashOptIn || []).includes(p.id))
            .map((p) => {
              const marks = round.trash?.[holeIdx]?.[p.id] || {};
              const score = round.playerData[p.id]?.holeScores?.[holeIdx];
              const isBirdie = score != null && score <= hole.par - 1;
              return (
                <div key={p.id} className="flex items-center justify-between gap-2 py-1.5 flex-wrap" style={{ borderBottom: `1px solid ${C.border}` }}>
                  <span className="text-sm truncate" style={{ color: C.text }}>
                    {p.name}
                  </span>
                  <div className="flex items-center gap-1.5 shrink-0 flex-wrap justify-end">
                    {isBirdie && (
                      <span className="px-2 py-1 rounded-full text-[10px] font-bold" style={{ background: C.goldSoft, color: C.gold }}>
                        BIRDIE
                      </span>
                    )}
                    {TRASH_TYPES.filter((t) => !t.par3Only || hole.par === 3).map((t) => {
                      const on = !!marks[t.id];
                      return (
                        <button
                          key={t.id}
                          onClick={() => toggleTrashItem(round.id, holeIdx, p.id, t.id)}
                          className="px-3 py-2 rounded-xl text-[11px] font-bold tap"
                          style={{
                            minHeight: 40,
                            background: on ? C.lime : C.surface2,
                            color: on ? C.onAccent : C.muted,
                            border: `1px solid ${on ? C.lime : C.border}`,
                          }}
                        >
                          {t.label}
                        </button>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          <div className="text-[10px] mt-2" style={{ color: C.faint }}>
            Birdies are counted automatically from the score above.
          </div>
        </Card>
      )}

      {/* next hole — big full-width lime button (reference style) */}
      {holeIdx < holes.length - 1 ? (
        <button
          onClick={() => setHole(holeIdx + 1)}
          className="w-full rounded-2xl flex items-center justify-center gap-2 tap mb-2"
          style={{ background: C.lime, color: C.onAccent, height: 60, fontWeight: 700, fontSize: 18 }}
        >
          <span className="font-display tracking-wide">NEXT HOLE {holeIdx + 2}</span>
          <span style={{ fontSize: 20 }}>→</span>
        </button>
      ) : (
        <button
          onClick={onFinish}
          disabled={missingScoresTotal > 0}
          className="w-full rounded-2xl flex items-center justify-center gap-2 tap mb-2"
          style={{
            background: missingScoresTotal > 0 ? C.surface2 : C.lime,
            color: missingScoresTotal > 0 ? C.muted : C.onAccent,
            border: `1px solid ${missingScoresTotal > 0 ? C.border : C.lime}`,
            height: 60,
            fontWeight: 700,
            fontSize: 18,
            opacity: missingScoresTotal > 0 ? 0.85 : 1,
          }}
        >
          <span className="font-display tracking-wide">
            {missingScoresTotal > 0 ? `CONFIRM ${missingScoresTotal} SCORE${missingScoresTotal === 1 ? '' : 'S'}` : 'FINISH ROUND'}
          </span>
          <span style={{ fontSize: 18 }}>{missingScoresTotal > 0 ? '!' : '✓'}</span>
        </button>
      )}
      {holeIdx === holes.length - 1 && missingScoresTotal > 0 && (
        <div className="text-xs text-center mb-3" style={{ color: C.orange }}>
          Unconfirmed scores are still blank. Use the hole strip to find incomplete holes before finalizing.
        </div>
      )}
      {holeIdx > 0 && (
        <button onClick={() => setHole(holeIdx - 1)} className="w-full text-center text-xs font-semibold mb-4 tap" style={{ color: C.muted }}>
          ← Back to hole {holeIdx}
        </button>
      )}

      </div>
      </HorizontalSwipePager>

      {/* live scoreboard, tailored to the selected game */}
      {settings.hideLiveStandings && !revealStandings ? (
        <button onClick={() => setRevealStandings(true)} className="w-full text-left tap" style={{ display: 'block' }}>
          <Card>
            <div className="flex items-center gap-2">
              <EyeOff size={16} color={C.muted} />
              <div className="min-w-0">
                <div className="text-sm font-semibold" style={{ color: C.text }}>
                  Live standings hidden
                </div>
                <div className="text-[11px]" style={{ color: C.muted }}>
                  Tap to reveal who's winning right now
                </div>
              </div>
            </div>
          </Card>
        </button>
      ) : (
        <div>
          <GameScoreboardCard settings={settings} round={round} course={course} players={activePlayers} patchGameData={patchGameData} />
          {settings.hideLiveStandings && (
            <button
              onClick={() => setRevealStandings(false)}
              className="w-full flex items-center justify-center gap-1.5 text-xs font-semibold mb-4 tap"
              style={{ color: C.muted }}
            >
              <EyeOff size={13} />
              Hide standings again
            </button>
          )}
        </div>
      )}

      <GhostButton onClick={onBackToSetup} style={{ width: '100%', textAlign: 'center', marginBottom: 24 }}>
        Exit round mode
      </GhostButton>

      {tickerOn && <LiveTicker settings={settings} round={round} course={course} players={activePlayers} />}
    </div>
  );
}

function casualRoundOutcome(settings, round, course, players) {
  if (!round.casual || players.length === 0) return null;
  const game = GAME_LIBRARY.find((g) => g.id === round.gameId) || null;
  const scoring = game?.scoring || 'stroke';
  const useNet = effectivePointsBasis(round) === 'net';
  const holes = roundHoles(round, course);
  const complete = scoring === 'teamscore'
    ? ['team1', 'team2'].every((teamId) => holes.every((h, i) => round.gameData?.teamScores?.[teamId]?.[i] != null))
    : players.every((p) => holes.every((h, i) => grossOf(round, p.id, i) != null));
  const tieIds = (rows, key, higher = true) => {
    if (!rows.length) return [];
    const best = rows.reduce((v, row) => (higher ? Math.max(v, row[key]) : Math.min(v, row[key])), higher ? -Infinity : Infinity);
    return rows.filter((row) => row[key] === best).map((row) => row.p.id);
  };

  if (scoring === 'quota') {
    const rows = players
      .map((p) => ({ p, result: playerResultInRound(settings, round, p, course) }))
      .filter((x) => x.result)
      .map((x) => ({ p: x.p, value: x.result.result, detail: `${x.result.points} pts · quota ${x.result.quota}` }))
      .sort((a, b) => b.value - a.value);
    return { game, complete, winnerIds: tieIds(rows, 'value', true), rows, label: 'Best result versus quota' };
  }

  if (scoring === 'stroke') {
    const rows = strokePlayBoard(round, course, players, useNet).map((x) => ({ p: x.p, value: x.total, detail: `${useNet ? 'net' : 'gross'} · ${x.grossTotal} gross` }));
    return { game, complete, winnerIds: tieIds(rows, 'value', false), rows, label: `Winner determined by ${useNet ? 'net' : 'gross'} score` };
  }

  if (scoring === 'stableford') {
    const rows = stablefordBoard(round, course, players, settings, useNet).map((x) => ({ p: x.p, value: x.total, detail: `${useNet ? 'net' : 'gross'} points` }));
    return { game, complete, winnerIds: tieIds(rows, 'value', true), rows, label: `Winner determined by ${useNet ? 'net' : 'gross'} Stableford points` };
  }

  if (scoring === 'match' && players.length === 2) {
    const seg = matchSegment(round, course, players, 0, holes.length, useNet);
    const winnerIds = seg.diff > 0 ? [seg.a.id] : seg.diff < 0 ? [seg.b.id] : [seg.a.id, seg.b.id];
    const runnerUpIds = seg.diff > 0 ? [seg.b.id] : seg.diff < 0 ? [seg.a.id] : [];
    return { game, complete, winnerIds, runnerUpIds, rows: [], label: matchLabel(seg), winnerLabel: seg.diff > 0 ? seg.a.name : seg.diff < 0 ? seg.b.name : 'Match halved' };
  }

  if (scoring === 'bestball') {
    const bb = bestBallMatch(round, course, players, useNet);
    if (!bb) return { game, complete, winnerIds: [], rows: [], label: 'Teams not set' };
    const winnerIds = bb.diff > 0 ? bb.t1.map((p) => p.id) : bb.diff < 0 ? bb.t2.map((p) => p.id) : players.map((p) => p.id);
    const runnerUpIds = bb.diff > 0 ? bb.t2.map((p) => p.id) : bb.diff < 0 ? bb.t1.map((p) => p.id) : [];
    const winnerLabel = bb.diff > 0 ? bb.t1.map((p) => p.name).join(' + ') : bb.diff < 0 ? bb.t2.map((p) => p.name).join(' + ') : 'Match halved';
    return { game, complete, winnerIds, runnerUpIds, rows: [], label: bestBallLabel(bb), winnerLabel };
  }

  if (scoring === 'nassau') {
    const singles = players.length === 2;
    const teams = players.length === 4 && bestBallTeams(round, players);
    if (!singles && !teams) return { game, complete, winnerIds: [], rows: [], label: 'Teams not set' };
    const segment = (start, end) => singles ? matchSegment(round, course, players, start, end, useNet) : teamMatchSegment(round, course, players, start, end, useNet);
    const segments = holes.length >= 18 ? [segment(0, 9), segment(9, 18), segment(0, 18)] : [segment(0, holes.length)];
    let aWins = 0;
    let bWins = 0;
    segments.forEach((seg) => { if (seg.diff > 0) aWins++; else if (seg.diff < 0) bWins++; });
    const sideA = singles ? [players[0]] : teams.t1;
    const sideB = singles ? [players[1]] : teams.t2;
    const winnerIds = aWins > bWins ? sideA.map((p) => p.id) : bWins > aWins ? sideB.map((p) => p.id) : players.map((p) => p.id);
    const runnerUpIds = aWins > bWins ? sideB.map((p) => p.id) : bWins > aWins ? sideA.map((p) => p.id) : [];
    const winnerLabel = aWins > bWins ? sideA.map((p) => p.name).join(' + ') : bWins > aWins ? sideB.map((p) => p.name).join(' + ') : 'Nassau tied';
    return { game, complete, winnerIds, runnerUpIds, rows: [], label: `${aWins}–${bWins} in Nassau bets`, winnerLabel };
  }

  if (scoring === 'nines' && players.length === 3) {
    const board = ninesBoard(round, course, players, useNet);
    const rows = players.map((p) => ({ p, value: board.pts[p.id], detail: `${useNet ? 'net' : 'gross'} points` })).sort((a, b) => b.value - a.value);
    return { game, complete, winnerIds: tieIds(rows, 'value', true), rows, label: 'Most Nines points' };
  }

  if (scoring === 'wolf') {
    const board = wolfBoard(round, course, players, useNet);
    const rows = players.map((p) => ({ p, value: board.pts[p.id], detail: `${useNet ? 'net' : 'gross'} points` })).sort((a, b) => b.value - a.value);
    return { game, complete, winnerIds: tieIds(rows, 'value', true), rows, label: 'Most Wolf points' };
  }

  if (scoring === 'bbb') {
    const pts = bbbBoard(round, players);
    const rows = players.map((p) => ({ p, value: pts[p.id] || 0, detail: 'Bingo Bango Bongo points' })).sort((a, b) => b.value - a.value);
    return { game, complete, winnerIds: tieIds(rows, 'value', true), rows, label: 'Most points' };
  }

  if (scoring === 'skins') {
    const skinRound = { ...round, skinsOptIn: players.map((p) => p.id), entryMode: 'holebyhole' };
    const skins = computeSkinsForRound(skinRound, players, course, { ...settings, skinsBuyIn: 1, skinsType: useNet ? 'net' : 'gross' });
    const rows = skins ? players.map((p) => ({ p, value: skins.tally[p.id] || 0, detail: 'skins won' })).sort((a, b) => b.value - a.value) : [];
    return { game, complete, winnerIds: tieIds(rows, 'value', true), rows, label: 'Most skins' };
  }

  if (scoring === 'vegas') {
    const board = vegasBoard(round, course, players, useNet);
    if (!board) return { game, complete, winnerIds: [], rows: [], label: 'Teams not set' };
    const winnerTeam = board.diff > 0 ? board.t1 : board.diff < 0 ? board.t2 : players;
    return {
      game,
      complete,
      winnerIds: winnerTeam.map((p) => p.id),
      rows: [],
      label: `${Math.abs(board.diff)} Vegas point${Math.abs(board.diff) === 1 ? '' : 's'} · thru ${board.thru}`,
      winnerLabel: board.diff === 0 ? 'Vegas tied' : `Team ${board.diff > 0 ? 'A' : 'B'} · ${board.diff > 0 ? board.name1 : board.name2}`,
    };
  }

  if (scoring === 'sixes') {
    const board = sixesBoard(round, course, players, useNet);
    if (!board) return { game, complete, winnerIds: [], rows: [], label: 'Four players required' };
    const rows = players.map((p) => ({ p, value: board.playerPoints[p.id] || 0, detail: 'Sixes match points' })).sort((a, b) => b.value - a.value);
    return { game, complete, winnerIds: tieIds(rows, 'value', true), rows, label: 'Most Sixes match points' };
  }

  if (scoring === 'rabbit') {
    const board = rabbitBoard(round, course, players, useNet);
    const rows = players.map((p) => ({ p, value: board.legWins[p.id] || 0, detail: 'rabbits won' })).sort((a, b) => b.value - a.value);
    const claimed = rows.filter((row) => row.value > 0);
    return { game, complete, winnerIds: claimed.length ? tieIds(claimed, 'value', true) : [], rows, label: claimed.length ? 'Most Rabbit legs won' : 'No Rabbit was held at the end of a leg' };
  }

  if (scoring === 'teamscore') {
    const board = teamScoreBoard(round, course, players, useNet);
    if (!board) return { game, complete, winnerIds: [], rows: [], label: 'Teams not set' };
    const [a, b] = board.rows;
    const winners = a.total < b.total ? board.t1 : b.total < a.total ? board.t2 : players;
    const runners = a.total < b.total ? board.t2 : b.total < a.total ? board.t1 : [];
    return {
      game,
      complete,
      winnerIds: winners.map((p) => p.id),
      runnerUpIds: runners.map((p) => p.id),
      rows: [],
      label: `${useNet ? 'Net' : 'Gross'} team total · ${a.total}–${b.total}`,
      winnerLabel: a.total === b.total ? 'Team match tied' : `Team ${a.total < b.total ? 'A' : 'B'} · ${a.total < b.total ? board.name1 : board.name2}`,
    };
  }

  if (scoring === 'shamble') {
    const board = shambleBoard(round, course, players, useNet);
    if (!board) return { game, complete, winnerIds: [], rows: [], label: 'Teams not set' };
    const [a, b] = board.rows;
    const winners = a.total < b.total ? board.t1 : b.total < a.total ? board.t2 : players;
    const runners = a.total < b.total ? board.t2 : b.total < a.total ? board.t1 : [];
    return {
      game,
      complete,
      winnerIds: winners.map((p) => p.id),
      runnerUpIds: runners.map((p) => p.id),
      rows: [],
      label: `${board.count} counting score${board.count === 1 ? '' : 's'} · ${a.total}–${b.total}`,
      winnerLabel: a.total === b.total ? 'Shamble tied' : `Team ${a.total < b.total ? 'A' : 'B'} · ${a.total < b.total ? board.name1 : board.name2}`,
    };
  }

  if (scoring === 'snake') {
    const board = snakeBoard(round, players);
    const holder = players.find((p) => p.id === board.holderId);
    const winners = holder ? players.filter((p) => p.id !== holder.id) : players;
    const rows = players.map((p) => ({ p, value: board.counts[p.id] || 0, detail: p.id === board.holderId ? 'holds the Snake' : 'three-putts' })).sort((a, b) => b.value - a.value);
    return { game, complete, winnerIds: winners.map((p) => p.id), rows, label: holder ? `${holder.name} finished holding the Snake` : 'No three-putts recorded', winnerLabel: holder ? `Everyone except ${holder.name}` : 'No Snake holder' };
  }

  if (scoring === 'trash') {
    const value = Math.max(0, Number(round.casualBet?.buyIn) || 0) || 1;
    const trashRound = { ...round, trashOptIn: players.map((p) => p.id) };
    const result = computeTrashForRound(trashRound, players, course, { ...settings, trashValue: value });
    const rows = players.map((p) => ({ p, value: result?.tally[p.id]?.total || 0, detail: 'dots' })).sort((a, b) => b.value - a.value);
    return { game, complete, winnerIds: tieIds(rows, 'value', true), rows, label: 'Most Trash dots' };
  }

  const pairing = round.gameData?.pairing || null;
  if (game?.pairing && pairing) {
    const teamTally = round.gameData?.manualTeamTally || { team1: 0, team2: 0 };
    const a = Number(teamTally.team1) || 0;
    const b = Number(teamTally.team2) || 0;
    const team1Ids = pairing.team1Ids || [];
    const team2Ids = pairing.team2Ids || [];
    const winnerIds = a > b ? team1Ids : b > a ? team2Ids : [...team1Ids, ...team2Ids];
    const runnerUpIds = a > b ? team2Ids : b > a ? team1Ids : [];
    const namesFor = (ids) => ids.map((id) => players.find((p) => p.id === id)?.name).filter(Boolean).join(' + ');
    const winnerLabel = a > b ? namesFor(team1Ids) : b > a ? namesFor(team2Ids) : 'Team match tied';
    return { game, complete, winnerIds, runnerUpIds, rows: [], label: `Team tally ${a}–${b}`, winnerLabel };
  }
  const tally = round.gameData?.manualTally || {};
  const rows = players.map((p) => ({ p, value: Number(tally[p.id]) || 0, detail: 'manual tally' })).sort((a, b) => b.value - a.value);
  return { game, complete, winnerIds: tieIds(rows, 'value', true), rows, label: 'Highest manual tally' };
}

function casualMoneyForRound(settings, round, course, players) {
  if (!round.casual) return null;
  const buyIn = Math.max(0, Number(round.casualBet?.buyIn) || 0);
  if (buyIn <= 0 || players.length === 0) return null;
  const useNet = effectivePointsBasis(round) === 'net';
  const game = GAME_LIBRARY.find((g) => g.id === round.gameId) || null;
  if (game?.scoring === 'vegas') {
    const board = vegasBoard(round, course, players, useNet);
    if (!board) return null;
    const amount = Math.round(Math.abs(board.diff) * buyIn * 100) / 100;
    const winningIds = board.diff > 0 ? board.t1.map((p) => p.id) : board.diff < 0 ? board.t2.map((p) => p.id) : [];
    const losingIds = board.diff > 0 ? board.t2.map((p) => p.id) : board.diff < 0 ? board.t1.map((p) => p.id) : [];
    const net = Object.fromEntries(players.map((p) => [p.id, winningIds.includes(p.id) ? amount : losingIds.includes(p.id) ? -amount : 0]));
    const payouts = Object.fromEntries(players.map((p) => [p.id, Math.max(0, net[p.id] || 0)]));
    return { buyIn, pot: amount * winningIds.length, payouts, net, mode: 'settlement', label: `$${buyIn.toFixed(2)} per Vegas point` };
  }
  if (game?.scoring === 'snake') {
    const board = snakeBoard(round, players);
    if (!board.holderId) return { buyIn, pot: 0, payouts: Object.fromEntries(players.map((p) => [p.id, 0])), net: Object.fromEntries(players.map((p) => [p.id, 0])), mode: 'settlement', label: `$${buyIn.toFixed(2)} per player` };
    const net = Object.fromEntries(players.map((p) => [p.id, p.id === board.holderId ? -buyIn * (players.length - 1) : buyIn]));
    const payouts = Object.fromEntries(players.map((p) => [p.id, Math.max(0, net[p.id] || 0)]));
    return { buyIn, pot: buyIn * (players.length - 1), payouts, net, mode: 'settlement', label: `$${buyIn.toFixed(2)} paid to each player by the Snake holder` };
  }
  if (game?.scoring === 'trash') {
    const trashRound = { ...round, trashOptIn: players.map((p) => p.id) };
    const result = computeTrashForRound(trashRound, players, course, { ...settings, trashValue: buyIn });
    const dots = Object.fromEntries(players.map((p) => [p.id, result?.tally[p.id]?.total || 0]));
    const net = Object.fromEntries(players.map((p) => [
      p.id,
      Math.round(players.reduce((sum, opponent) => sum + (dots[p.id] - dots[opponent.id]) * buyIn, 0) * 100) / 100,
    ]));
    const payouts = Object.fromEntries(players.map((p) => [p.id, Math.max(0, net[p.id] || 0)]));
    const pot = Object.values(payouts).reduce((sum, value) => sum + value, 0);
    return { buyIn, pot, payouts, net, mode: 'settlement', label: `$${buyIn.toFixed(2)} per dot difference` };
  }
  const pot = Math.round(buyIn * players.length * 100) / 100;
  const payouts = Object.fromEntries(players.map((p) => [p.id, 0]));
  const payoutMode = round.casualBet?.payoutMode === 'secondRefund' ? 'secondRefund' : 'winnerTakeAll';
  let refundTotal = 0;
  let winnerPool = pot;
  let runnerUpIds = [];

  if (game?.scoring === 'skins') {
    const skinRound = { ...round, skinsOptIn: players.map((p) => p.id), entryMode: 'holebyhole' };
    const skins = computeSkinsForRound(skinRound, players, course, { ...settings, skinsBuyIn: buyIn, skinsType: useNet ? 'net' : 'gross' });
    if (skins) {
      if (skins.totalSkins === 0) players.forEach((p) => { payouts[p.id] = buyIn; });
      else players.forEach((p) => { payouts[p.id] = skins.payouts[p.id] || 0; });
    }
  } else {
    const outcome = casualRoundOutcome(settings, round, course, players);
    const winners = outcome?.winnerIds || [];
    runnerUpIds = (outcome?.runnerUpIds || []).filter((id) => !winners.includes(id));
    if (payoutMode === 'secondRefund' && runnerUpIds.length === 0 && outcome?.rows?.length) {
      const firstRunner = outcome.rows.find((row) => !winners.includes(row.p.id));
      if (firstRunner) {
        runnerUpIds = outcome.rows
          .filter((row) => !winners.includes(row.p.id) && row.value === firstRunner.value)
          .map((row) => row.p.id);
      }
    }
    if (payoutMode === 'secondRefund' && runnerUpIds.length > 0) {
      const refundCents = Math.min(Math.round(pot * 100), Math.round(buyIn * runnerUpIds.length * 100));
      refundTotal = refundCents / 100;
      winnerPool = Math.round((pot - refundTotal) * 100) / 100;
      runnerUpIds.forEach((id) => { payouts[id] = buyIn; });
    }
    if (winners.length > 0) {
      const cents = Math.round(winnerPool * 100);
      const each = Math.floor(cents / winners.length);
      let remainder = cents - each * winners.length;
      winners.forEach((id) => {
        payouts[id] = (each + (remainder-- > 0 ? 1 : 0)) / 100;
      });
    }
  }

  const net = {};
  players.forEach((p) => { net[p.id] = Math.round(((payouts[p.id] || 0) - buyIn) * 100) / 100; });
  return {
    buyIn,
    pot,
    payouts,
    net,
    payoutMode: game?.scoring === 'skins' ? 'skins' : payoutMode,
    refundTotal,
    winnerPool,
    runnerUpIds,
  };
}

function RoundSummary({ round, course, players, courses, rounds, settings, onDone, onReopen }) {
  const [confirmReopen, setConfirmReopen] = useState(false);
  const activePlayers = roundPlayerList(round, players);
  const game = GAME_LIBRARY.find((g) => g.id === round.gameId) || null;
  const holes = roundHoles(round, course);

  const winnerBasis = effectivePointsBasis(round);
  const scoreRows = activePlayers
    .map((p) => ({ p, ...casualScoreTotals(round, p, course) }))
    .sort((a, b) => {
      if (a.thru === 0) return 1;
      if (b.thru === 0) return -1;
      const av = winnerBasis === 'net' ? a.net : a.gross;
      const bv = winnerBasis === 'net' ? b.net : b.gross;
      return (av ?? Infinity) - (bv ?? Infinity);
    });

  const casualOutcome = round.casual ? casualRoundOutcome(settings, round, course, activePlayers) : null;
  const casualMoney = round.casual ? casualMoneyForRound(settings, round, course, activePlayers) : null;
  const summaryLeagueRounds = !round.casual ? finalLeagueRounds(rounds, settings) : [];
  const summaryEvent = !round.casual ? getEvents(summaryLeagueRounds).find((event) => event.roundIds.includes(round.id)) : null;
  const summaryPlayers = !round.casual ? seasonPlayersForRounds(players, summaryLeagueRounds) : players;
  const purse = !round.casual
    ? summaryEvent
      ? purseForEvent(settings, summaryEvent, summaryLeagueRounds, courses, summaryPlayers)
      : purseForRound(settings, round, activePlayers, course)
    : null;
  const skinsRound = !round.casual && round.entryMode === 'holebyhole' ? { ...round } : null;
  const skins = skinsRound ? computeSkinsForRound(skinsRound, activePlayers, course, settings) : null;
  const trash = !round.casual && round.entryMode === 'holebyhole' ? computeTrashForRound(round, activePlayers, course, settings) : null;
  const hasMoney = !!casualMoney || (purse && purse.scoredCount > 0) || (skins && skins.pot > 0) || (trash && trash.totalItems > 0);
  const casualWinnerNames = casualOutcome ? casualOutcome.winnerIds.map((id) => activePlayers.find((p) => p.id === id)?.name).filter(Boolean) : [];
  const casualWinnerText = casualOutcome
    ? casualOutcome.winnerLabel || (casualWinnerNames.length > 1 ? `Tie: ${casualWinnerNames.join(' & ')}` : casualWinnerNames[0] || 'No winner recorded')
    : '';

  let impact = null;
  if (!round.casual) {
    const leagueRounds = summaryLeagueRounds;
    const event = summaryEvent;
    if (event) {
      const { ranked } = computeEventRanking(settings, event, leagueRounds, courses, summaryPlayers);
      const season = computeSeason(settings, leagueRounds, courses, summaryPlayers);
      const leaderboard = [...season.players]
        .filter((p) => (season.roundsPlayed[p.id] || 0) > 0)
        .sort((a, b) => (season.rawTotals[b.id] || 0) - (season.rawTotals[a.id] || 0));
      impact = { ranked, season, leaderboard };
    }
  }

  return (
    <div>
      <div className="text-center py-3 fade-in" style={{ position: 'relative' }}>
        <div className="font-display text-3xl leading-none pop-in" style={{ color: C.lime, textShadow: C.limeGlow }}>
          ROUND COMPLETE
        </div>
        <div className="text-xs mt-1" style={{ color: C.muted }}>
          {round.date} · {course?.name} · {round.holes}-hole{round.casual ? ' · Casual' : ''}
          {game ? ` · ${game.name}` : ''}
        </div>
        {['⛳', '🏆', '✨', '🎉'].map((e, i) => (
          <span
            key={i}
            className="float-particle text-lg"
            style={{ left: `${20 + i * 20}%`, top: '10px', animationDelay: `${i * 0.12}s` }}
          >
            {e}
          </span>
        ))}
      </div>

      <div className="tab-fade-in" style={{ animationDelay: '0.08s' }}>
        <GameScoreboardCard settings={settings} round={round} course={course} players={activePlayers} readOnly />
      </div>

      {casualOutcome && (
        <div className="tab-fade-in" style={{ animationDelay: '0.12s' }}>
          <Card primary>
            <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: C.muted }}>Casual round winner</div>
            <div className="font-display text-2xl" style={{ color: C.gold }}>
              🏆 {casualWinnerText}
            </div>
            <div className="text-sm mt-1" style={{ color: C.muted }}>{casualOutcome.label}</div>
            <div className="flex items-center gap-2 mt-2 flex-wrap">
              <span className="px-2 py-1 rounded-full text-[10px] font-bold uppercase" style={{ background: C.goldSoft, color: C.gold, border: `1px solid ${C.gold}` }}>
                Winner basis · {winnerBasis}
              </span>
              <span className="text-[11px]" style={{ color: C.cyan }}>Casual only · no Dogfight League impact</span>
            </div>
          </Card>
        </div>

                  </div>
                  <span className="font-display text-base text-center" style={{ color: winnerBasis === 'gross' ? C.gold : C.text }}>{gross ?? '–'}</span>

                  <span className="text-xs text-center" style={{ color: C.muted }}>{courseHandicap}</span>
                </div>
              ))}
            </>
          ) : (
            scoreRows.map(({ p, gross, thru, grossToPar }, i) => (
              <BoardRow key={p.id} rank={i + 1} name={p.name} value={thru > 0 ? gross : '–'} sub={thru > 0 ? `${formatRelativeToPar(grossToPar)} · thru ${thru}` : 'no scores'} />
            ))
          )}
        </Card>
      </div>}

      <div className="tab-fade-in" style={{ animationDelay: '0.24s' }}>
        {round.entryMode === 'holebyhole' ? (
          game?.scoring === 'teamscore'
            ? <TeamScoreRecap round={round} course={course} players={activePlayers} />
            : <HoleByHoleRecap round={round} course={course} players={activePlayers} />
        ) : (
          <EmptyNote text="This round was scored by total points, not hole-by-hole, so there's no scorecard to show." />
        )}
      </div>

      {hasMoney && (
        <div className="tab-fade-in" style={{ animationDelay: '0.32s' }}>
        <Card>
          <div className="font-display text-lg mb-2" style={{ color: C.text }}>

          </div>
          {casualMoney && (
            <div className="mb-3">
              <div className="flex items-center justify-between mb-1 gap-2">
                <div>
                  <div className="text-[10px] uppercase tracking-wide" style={{ color: C.muted }}>{casualMoney.mode === 'settlement' ? casualMoney.label : `Casual pot · $${casualMoney.buyIn.toFixed(2)} each`}</div>
                  <div className="text-[10px] font-bold uppercase mt-0.5" style={{ color: C.cyan }}>Settled by {winnerBasis}</div>
                </div>
                <div className="font-display text-lg" style={{ color: C.gold }}>${casualMoney.pot.toFixed(2)} {casualMoney.mode === 'settlement' ? 'changes hands' : ''}</div>
              </div>
              {casualMoney.mode !== 'settlement' && casualMoney.payoutMode !== 'skins' && (
                <div className="rounded-xl p-2.5 mb-2" style={{ background: C.surface2, border: `1px solid ${C.border}` }}>
                  <div className="flex items-center justify-between gap-3">
                    <div>
                      <div className="text-[10px] uppercase tracking-wide" style={{ color: C.muted }}>Payout rule</div>
                      <div className="text-xs font-bold" style={{ color: C.text }}>{casualMoney.payoutMode === 'secondRefund' ? '2nd gets money back' : 'Winner take all'}</div>
                    </div>
                    <div className="text-right">
                      <div className="text-[10px] uppercase tracking-wide" style={{ color: C.muted }}>Winner pool</div>
                      <div className="font-display text-base" style={{ color: C.lime }}>${casualMoney.winnerPool.toFixed(2)}</div>

                  {casualMoney.payoutMode === 'secondRefund' && (

              )}
              {activePlayers
                .map((p) => ({ p, payout: casualMoney.payouts[p.id] || 0, net: casualMoney.net[p.id] || 0 }))
                .sort((a, b) => b.payout - a.payout)

          {skins && skins.pot > 0 && (
            <div>
              <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: C.muted }}>

              {skins.players
                .map((p) => ({ p, count: skins.tally[p.id], pay: skins.payouts[p.id] }))

                    <span className="font-display text-sm" style={{ color: count > 0 ? C.gold : C.faint }}>
                      {count} skin{count === 1 ? '' : 's'} · ${pay.toFixed(2)}
                    </span>

                ))}

          )}
          {trash && trash.totalItems > 0 && (
            <div className={skins && skins.pot > 0 ? 'mt-3' : ''}>
              <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: C.muted }}>
                Trash — ${trash.value} per item
              </div>
              {trash.players
                .map((p) => ({ p, t: trash.tally[p.id], pay: trash.payouts[p.id] }))
                .sort((a, b) => b.t.total - a.t.total)
                .map(({ p, t, pay }) => (
                  <div key={p.id} className="flex items-center justify-between py-1.5" style={{ borderBottom: `1px solid ${C.border}` }}>
                    <div className="min-w-0">
                      <div style={{ color: t.total > 0 ? C.text : C.muted, fontWeight: t.total > 0 ? 600 : 400 }}>{p.name}</div>
                      {t.total > 0 && (
                        <div className="text-[10px]" style={{ color: C.faint }}>
                          {[
                            ...TRASH_TYPES.map((type) => t[type.id] ? `${t[type.id]} ${type.label.toLowerCase()}${t[type.id] === 1 ? '' : 's'}` : null),
                            t.birdie ? `${t.birdie} birdie${t.birdie === 1 ? '' : 's'}` : null,

                            .filter(Boolean)
                            .join(' · ')}

                      )}
                    </div>
                    <span className="font-display text-sm shrink-0" style={{ color: t.total > 0 ? C.gold : C.faint }}>
                      {t.total} item{t.total === 1 ? '' : 's'} · ${pay.toFixed(2)}

      {impact && (
        <div className="tab-fade-in" style={{ animationDelay: '0.4s' }}>

          <div className="font-display text-lg mb-1" style={{ color: C.text }}>

          </p>

            const p = players.find((pp) => pp.id === x.id);
            const roundResult = x.r.result;
            const total = impact.season.rawTotals[x.id] || 0;
            const rank = impact.leaderboard.findIndex((pp) => pp.id === x.id) + 1;
            return (
              <div key={x.id} className="flex items-center justify-between py-2 row-in" style={{ borderBottom: `1px solid ${C.border}`, animationDelay: `${0.4 + Math.min(i, 10) * 0.04}s` }}>
                <div className="flex items-center gap-2 min-w-0">
                  <span className="font-display text-xs w-4" style={{ color: i === 0 ? C.gold : C.faint }}>

                  </span>
                  <span className="text-sm truncate" style={{ color: C.text }}>
                    {p?.name || '?'}
                  </span>
                </div>
                <div className="text-right shrink-0">
                  <div className="font-display text-sm" style={{ color: roundResult >= 0 ? C.lime : C.red }}>
                    {roundResult >= 0 ? '+' : ''}{roundResult} this round
                  </div>
                  <div className="text-[10px]" style={{ color: C.faint }}>
                    {total >= 0 ? '+' : ''}{total} season · #{rank} of {impact.leaderboard.length}
                  </div>
                </div>
              </div>
            );
          })}
        </Card>
        </div>
      )}

      <PrimaryButton onClick={onDone} style={{ width: '100%', textAlign: 'center', marginBottom: 8 }}>
        Done
      </PrimaryButton>
      <GhostButton onClick={() => round.casual ? onReopen() : setConfirmReopen(true)} style={{ width: '100%', textAlign: 'center', marginBottom: 24 }}>
        {round.casual ? 'Reopen this round' : 'Edit Finalized Round'}
      </GhostButton>
      {confirmReopen && (
        <ConfirmDialog
          title="Edit this finalized round?"
          message="This round is locked as a historical snapshot. Reopening it allows scores, tees, and results to change. The current snapshot stays preserved until you intentionally finish the round again, which creates a new revision."
          confirmLabel="Edit Round"
          destructive={false}
          onCancel={() => setConfirmReopen(false)}
          onConfirm={() => {
            setConfirmReopen(false);
            onReopen();
          }}
        />
      )}
    </div>
  );
}
