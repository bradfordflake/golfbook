// ---------- Calendar tab (availability scheduling) ----------
function isoDate(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function dayAvailability(availability, dateKey) {
  return availability[dateKey] || {};
}
function countAvail(dayData, session) {
  return Object.values(dayData).filter((v) => v && v[session]).length;
}
function CalendarTab({ players, availability, setAvailability }) {
  const today = new Date();
  const todayKey = isoDate(today.getFullYear(), today.getMonth(), today.getDate());
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [selectedDay, setSelectedDay] = useState(todayKey);

  function shiftMonth(delta) {
    let m = viewMonth + delta,
      y = viewYear;
    if (m < 0) {
      m = 11;
      y--;
    }
    if (m > 11) {
      m = 0;
      y++;
    }
    setViewMonth(m);
    setViewYear(y);
  }

  function toggleAvail(dateKey, playerId, session) {
    setAvailability((av) => {
      const day = { ...(av[dateKey] || {}) };
      const cur = { am: false, pm: false, ...(day[playerId] || {}) };
      cur[session] = !cur[session];
      if (!cur.am && !cur.pm) delete day[playerId];
      else day[playerId] = cur;
      const next = { ...av };
      if (Object.keys(day).length === 0) delete next[dateKey];
      else next[dateKey] = day;
      return next;
    });
  }

  const monthName = new Date(viewYear, viewMonth, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const firstDow = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const selData = dayAvailability(availability, selectedDay);
  const selDate = new Date(selectedDay + 'T00:00:00');
  const selLabel = isNaN(selDate.getTime()) ? selectedDay : selDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const amPlayers = players.filter((p) => selData[p.id]?.am);
  const pmPlayers = players.filter((p) => selData[p.id]?.pm);

  // upcoming days (from today) with any availability, for the tee-time planner
  const upcoming = Object.keys(availability)
    .filter((k) => k >= todayKey)
    .sort()
    .slice(0, 6)
    .map((k) => {
      const d = dayAvailability(availability, k);
      return { key: k, am: countAvail(d, 'am'), pm: countAvail(d, 'pm') };
    })
    .filter((x) => x.am > 0 || x.pm > 0);

  function SessionSection({ label, session, icon, availList }) {
    return (
      <div className="mb-4 last:mb-0">
        <div className="flex items-center justify-between mb-2">
          <div className="text-[10px] uppercase tracking-wide" style={{ color: C.lime }}>
            {icon} {label}
          </div>
          <div className="text-[11px] font-display" style={{ color: availList.length >= 2 ? C.gold : C.faint }}>
            {availList.length} in{availList.length >= 4 ? ' — full group!' : availList.length >= 2 ? ' — enough to play' : ''}
          </div>
        </div>
        {availList.length > 0 && (
          <div className="text-xs mb-2" style={{ color: C.text }}>
            {availList.map((p) => p.name.split(/\s+/)[0]).join(', ')}
          </div>
        )}
        <div className="flex flex-wrap gap-2">
          {players.map((p) => {
            const on = selData[p.id]?.[session];
            return (
              <button
                key={p.id}
                onClick={() => toggleAvail(selectedDay, p.id, session)}
                className="px-3 py-1.5 rounded-full text-xs font-semibold tap"
                style={{ background: on ? C.lime : C.surface2, color: on ? C.onAccent : C.muted, transition: 'background-color 0.2s ease, color 0.2s ease, transform 0.12s ease' }}
              >
                {p.name.split(/\s+/)[0]}
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  return (
    <div>
      <Card>
        <div className="flex items-center justify-between mb-3">
          <button onClick={() => shiftMonth(-1)} className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: C.surface2, color: C.text }}>
            ‹
          </button>
          <div className="font-display text-xl" style={{ color: C.text }}>
            {monthName}
          </div>
          <button onClick={() => shiftMonth(1)} className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: C.surface2, color: C.text }}>
            ›
          </button>
        </div>
        <div className="grid grid-cols-7 gap-1 mb-1">
          {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d, i) => (
            <div key={i} className="text-center text-[10px] uppercase py-1" style={{ color: C.faint }}>
              {d}
            </div>
          ))}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((d, i) => {
            if (d == null) return <div key={i} />;
            const key = isoDate(viewYear, viewMonth, d);
            const dayData = dayAvailability(availability, key);
            const am = countAvail(dayData, 'am');
            const pm = countAvail(dayData, 'pm');
            const isToday = key === todayKey;
            const isSelected = key === selectedDay;
            return (
              <button
                key={i}
                onClick={() => setSelectedDay(key)}
                className="rounded-xl flex flex-col items-center justify-center py-1.5 tap"
                style={{
                  background: isSelected ? C.lime : C.surface2,
                  border: isToday && !isSelected ? `1.5px solid ${C.lime}` : '1.5px solid transparent',
                  minHeight: 44,
                  transition: 'background-color 0.2s ease, border-color 0.2s ease, transform 0.12s ease',
                }}
              >
                <span className="font-display text-sm leading-none" style={{ color: isSelected ? C.onAccent : C.text, transition: 'color 0.2s ease' }}>
                  {d}
                </span>
                {(am > 0 || pm > 0) && (
                  <span className="flex gap-0.5 mt-1">
                    {am > 0 && <span className="w-1.5 h-1.5 rounded-full" style={{ background: isSelected ? C.onAccent : C.lime }} />}
                    {pm > 0 && <span className="w-1.5 h-1.5 rounded-full" style={{ background: isSelected ? C.onAccent : C.cyan }} />}
                  </span>
                )}
              </button>
            );
          })}
        </div>
        <div className="flex items-center gap-3 mt-3 text-[10px]" style={{ color: C.faint }}>
          <span>
            <span className="inline-block w-1.5 h-1.5 rounded-full mr-1" style={{ background: C.lime }} />
            morning
          </span>
          <span>
            <span className="inline-block w-1.5 h-1.5 rounded-full mr-1" style={{ background: C.cyan }} />
            afternoon
          </span>
          <span className="ml-auto">Tap your name to mark yourself in</span>
        </div>
      </Card>

      <Card>
        <div className="font-display text-lg mb-3" style={{ color: C.text }}>
          {selLabel}
        </div>
        <SessionSection label="Morning" session="am" icon="🌅" availList={amPlayers} />
        <SessionSection label="Afternoon" session="pm" icon="🌇" availList={pmPlayers} />
      </Card>

      {upcoming.length > 0 && (
        <Card>
          <div className="font-display text-lg mb-1" style={{ color: C.text }}>
            Tee Time Planner
          </div>
          <p className="text-xs mb-2" style={{ color: C.muted }}>
            Upcoming days with players marked available — tap one to see who's in.
          </p>
          {upcoming.map(({ key, am, pm }) => {
            const d = new Date(key + 'T00:00:00');
            const label = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            return (
              <button key={key} onClick={() => setSelectedDay(key)} className="w-full flex items-center justify-between py-2" style={{ borderBottom: `1px solid ${C.border}` }}>
                <span className="text-sm" style={{ color: C.text }}>
                  {label}
                </span>
                <span className="text-xs font-display" style={{ color: C.muted }}>
                  {am > 0 && <span style={{ color: C.lime }}>{am} AM</span>}
                  {am > 0 && pm > 0 && ' · '}
                  {pm > 0 && <span style={{ color: C.cyan }}>{pm} PM</span>}
                </span>
              </button>
            );
          })}
        </Card>
      )}
    </div>
  );
}

// ---------- Casual rounds: guest-friendly, completely separate from league play ----------
function GameFinderTab({ players, courses, rounds, myPlayerId, setRounds, setEditingRoundId, setActiveTab }) {
  const firstCourse = courses[0];
  const [showCreate, setShowCreate] = useState(false);
  const [selectCasualMode, setSelectCasualMode] = useState(false);
  const [selectedCasualIds, setSelectedCasualIds] = useState([]);
  const [confirmCasualDeleteIds, setConfirmCasualDeleteIds] = useState(null);
  const initialLeagueId = myPlayerId && players.some((p) => p.id === myPlayerId) ? myPlayerId : '';
  const [courseId, setCourseId] = useState(firstCourse?.id || '');
  const [holes, setHoles] = useState(18);
  const [selectedIds, setSelectedIds] = useState(initialLeagueId ? [initialLeagueId] : []);
  const [leagueTees, setLeagueTees] = useState(() => (initialLeagueId && firstCourse ? { [initialLeagueId]: defaultTee(firstCourse).name } : {}));
  const [guestDrafts, setGuestDrafts] = useState(() => {
    const teeName = firstCourse ? defaultTee(firstCourse).name : '';
    return [1, 2, 3].map((n) => ({ id: `guest-${uid()}`, name: '', handicap: '', teeName, label: `Guest ${n}` }));
  });
  const [selectedGameId, setSelectedGameId] = useState('stroke');
  const [expandedId, setExpandedId] = useState(null);
  const [winnerBasis, setWinnerBasis] = useState('net');
  const [buyIn, setBuyIn] = useState('');
  const [payoutMode, setPayoutMode] = useState('winnerTakeAll');
  const [teamOverride, setTeamOverride] = useState(null);
  const [vegasBirdieFlip, setVegasBirdieFlip] = useState(false);
  const [rabbitMode, setRabbitMode] = useState('free');
  const [shambleCount, setShambleCount] = useState(1);
  const [aiTeamLoading, setAiTeamLoading] = useState(false);
  const [aiTeamSuggestion, setAiTeamSuggestion] = useState(null);
  const [aiTeamError, setAiTeamError] = useState('');
  const [error, setError] = useState('');
  const teamSectionRef = useRef(null);
  const scoringSectionRef = useRef(null);

  const course = courses.find((c) => c.id === courseId) || firstCourse;
  const selectedGame = GAME_LIBRARY.find((g) => g.id === selectedGameId) || null;
  const namedGuests = guestDrafts.filter((g) => g.name.trim());
  const participantCount = selectedIds.length + namedGuests.length;
  const gameFits = !!selectedGame && participantCount >= selectedGame.min && participantCount <= selectedGame.max;
  const guestHandicapsValid = namedGuests.every((g) => g.handicap !== '' && Number.isFinite(Number(g.handicap)));
  const pot = Math.max(0, Number(buyIn) || 0) * participantCount;
  const settlementUnit = selectedGameId === 'vegas' ? 'Vegas point' : selectedGameId === 'snake' ? 'player paid by the Snake holder' : selectedGameId === 'trash' ? 'dot difference' : null;
  const moneyFieldLabel = selectedGameId === 'vegas' ? 'Value per point' : selectedGameId === 'snake' ? 'Amount per player' : selectedGameId === 'trash' ? 'Value per dot' : 'Buy-in each';
  const estimatedTeamGame = !!(selectedGame?.pairing || (selectedGame?.scoring === 'nassau' && participantCount === 4));
  const estimatedWinnerCount = estimatedTeamGame ? Math.max(1, Math.floor(participantCount / 2)) : 1;
  const estimatedRunnerCount = estimatedTeamGame ? Math.max(1, participantCount - estimatedWinnerCount) : 1;
  const estimatedRefund = !settlementUnit && payoutMode === 'secondRefund' ? Math.min(pot, Math.max(0, Number(buyIn) || 0) * estimatedRunnerCount) : 0;
  const estimatedWinnerPool = Math.max(0, pot - estimatedRefund);
  const estimatedWinnerShare = estimatedWinnerCount > 0 ? estimatedWinnerPool / estimatedWinnerCount : 0;
  const draftLeaguePlayers = selectedIds.map((id) => players.find((p) => p.id === id)).filter(Boolean);
  const draftGuestPlayers = namedGuests.map((g, i) => {
    const handicap = Number(g.handicap);
    return {
      id: g.id,
      name: g.name.trim() || `Guest ${i + 1}`,
      handicap: Number.isFinite(handicap) ? Math.max(-10, Math.min(54, handicap)) : 0,
      guest: true,
    };
  });
  const draftParticipants = [...draftLeaguePlayers, ...draftGuestPlayers];
  const fallbackTee = course ? defaultTee(course).name : '';
  const draftPlayerData = Object.fromEntries(draftParticipants.map((p) => {
    const guest = guestDrafts.find((g) => g.id === p.id);
    return [p.id, { teeName: guest?.teeName || leagueTees[p.id] || fallbackTee, holeScores: {} }];
  }));
  const participantKey = draftParticipants.map((p) => p.id).join('|');
  const teamInputsKey = draftParticipants.map((p) => `${p.id}:${p.handicap}:${draftPlayerData[p.id]?.teeName || ''}`).join('|');
  const needsDraftTeams = !!(selectedGame?.pairing || (selectedGame?.scoring === 'nassau' && participantCount === 4));
  const autoPairing = needsDraftTeams ? balancedPairing(draftParticipants, draftPlayerData) : null;
  const overrideMatches = teamOverride?.gameId === selectedGameId && teamOverride?.participantKey === participantKey;
  const activePairing = overrideMatches ? teamOverride.pairing : autoPairing;
  const evenTeamsRequired = ['vegas', 'bestball', 'altshot', 'chapman'].includes(selectedGameId) || (selectedGameId === 'nassau' && participantCount === 4);
  const draftTeamValid = !needsDraftTeams || (
    (activePairing?.team1Ids?.length || 0) > 0 &&
    (activePairing?.team2Ids?.length || 0) > 0 &&
    (!evenTeamsRequired || activePairing.team1Ids.length === activePairing.team2Ids.length) &&
    draftParticipants.every((p) => activePairing.team1Ids.includes(p.id) || activePairing.team2Ids.includes(p.id))
  );
  const canCreate = gameFits && participantCount > 0 && guestHandicapsValid && draftTeamValid;

  useEffect(() => {
    if (!course) return;
    const fallback = defaultTee(course).name;
    setLeagueTees((current) => {
      const next = { ...current };
      selectedIds.forEach((id) => {
        if (!course.tees.some((t) => t.name === next[id])) next[id] = fallback;
      });
      return next;
    });
    setGuestDrafts((rows) => rows.map((g) => ({ ...g, teeName: course.tees.some((t) => t.name === g.teeName) ? g.teeName : fallback })));
  }, [courseId]);

  useEffect(() => {
    setAiTeamSuggestion(null);
    setAiTeamError('');
  }, [selectedGameId, courseId, teamInputsKey]);

  function toggleLeaguePlayer(id) {
    setSelectedIds((ids) => {
      const next = ids.includes(id) ? ids.filter((x) => x !== id) : [...ids, id];
      return next;
    });
    if (course) setLeagueTees((m) => ({ ...m, [id]: m[id] || defaultTee(course).name }));
  }

  function updateGuest(id, patch) {
    setGuestDrafts((rows) => rows.map((g) => (g.id === id ? { ...g, ...patch } : g)));
  }

  function addGuests(count = 1) {
    const start = guestDrafts.length + 1;
    const teeName = course ? defaultTee(course).name : '';
    setGuestDrafts((rows) => [
      ...rows,
      ...Array.from({ length: count }, (_, i) => ({ id: `guest-${uid()}`, name: '', handicap: '', teeName, label: `Guest ${start + i}` })),
    ]);
  }

  function removeGuest(id) {
    setGuestDrafts((rows) => rows.filter((g) => g.id !== id));
  }

  function chooseCasualGame(game, isOpen) {
    const changed = game.id !== selectedGameId;
    const teamGame = !!(game.pairing || (game.scoring === 'nassau' && participantCount === 4));
    setSelectedGameId(game.id);
    setExpandedId(isOpen ? null : game.id);
    if (!changed) return;
    window.setTimeout(() => {
      const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
      const target = teamGame ? teamSectionRef.current : scoringSectionRef.current;
      target?.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
    }, 320);
  }

  function moveDraftPlayerToOtherTeam(playerId) {
    if (!activePairing) return;
    const team1Ids = [...(activePairing.team1Ids || [])];
    const team2Ids = [...(activePairing.team2Ids || [])];
    const onTeamA = team1Ids.includes(playerId);
    const nextTeam1 = onTeamA ? team1Ids.filter((id) => id !== playerId) : [...team1Ids.filter((id) => id !== playerId), playerId];
    const nextTeam2 = onTeamA ? [...team2Ids.filter((id) => id !== playerId), playerId] : team2Ids.filter((id) => id !== playerId);
    const nameOf = (id) => draftParticipants.find((p) => p.id === id)?.name || '';
    setTeamOverride({
      gameId: selectedGameId,
      participantKey,
      pairing: {
        team1Ids: nextTeam1,
        team2Ids: nextTeam2,
        team1: nextTeam1.map(nameOf),
        team2: nextTeam2.map(nameOf),
        reasoning: 'Teams selected during casual-round setup.',
      },
    });
  }


  function balancedPairing(participants, playerData) {
    if (!(selectedGame?.pairing || selectedGame?.scoring === 'nassau') || participants.length < 2 || !course) return null;
    const fakeRound = { holes, teeName: defaultTee(course).name, playerData };
    const sorted = [...participants].sort((a, b) => courseHandicapFor(fakeRound, b, course) - courseHandicapFor(fakeRound, a, course));
    const team1 = [];
    const team2 = [];
    let sum1 = 0;
    let sum2 = 0;
    sorted.forEach((player) => {
      const handicap = courseHandicapFor(fakeRound, player, course);
      const maxSize = Math.ceil(sorted.length / 2);
      if (team1.length >= maxSize || (team2.length < maxSize && sum2 < sum1)) {
        team2.push(player);
        sum2 += handicap;
      } else {
        team1.push(player);
        sum1 += handicap;
      }
    });
    return {
      team1: team1.map((p) => p.name),
      team2: team2.map((p) => p.name),
      team1Ids: team1.map((p) => p.id),
      team2Ids: team2.map((p) => p.id),
      reasoning: 'Automatically balanced using each player’s course handicap from the selected tee.',
    };
  }

  function draftCourseHandicap(player) {
    if (!course) return 0;
    return courseHandicapFor({ holes, teeName: fallbackTee, playerData: draftPlayerData }, player, course);
  }

  function draftTeamHandicapTotal(ids = []) {
    return ids.reduce((sum, id) => {
      const player = draftParticipants.find((p) => p.id === id);
      return sum + (player ? draftCourseHandicap(player) : 0);
    }, 0);
  }

  async function suggestFairTeamsWithGemini() {
    setAiTeamError('');
    setAiTeamSuggestion(null);
    if (!needsDraftTeams || !course || draftParticipants.length < 2) return;
    if (!aiAvailable()) {
      setAiTeamError("Gemini isn't available in this preview. The app's automatic handicap balance is still applied.");
      return;
    }
    const roster = draftParticipants.map((p) => ({
      id: p.id,
      name: p.name,
      handicapIndex: p.handicap,
      tee: draftPlayerData[p.id]?.teeName || fallbackTee,
      courseHandicap: draftCourseHandicap(p),
    }));
    const requestKey = `${selectedGameId}|${courseId}|${teamInputsKey}`;
    const prompt = `You are balancing teams for a casual golf game.
Game: ${selectedGame?.name || 'Team golf'}
Course: ${course.name}
Players, including the tee-adjusted Course Handicap that should drive the balance:
${JSON.stringify(roster)}

Create two teams that are as fair as possible. Prioritize the smallest possible difference between the SUM of Course Handicaps on Team A and Team B, while also spreading the strongest and weakest players sensibly. ${evenTeamsRequired ? 'The teams MUST contain the same number of players.' : 'Team sizes may differ by at most one player.'} Every player ID must appear exactly once. Do not change or invent IDs.
Respond with ONLY this JSON shape:
{"team1Ids":["exact-id"],"team2Ids":["exact-id"],"explanation":"One short, friendly sentence explaining why the teams are fair."}`;
    setAiTeamLoading(true);
    const res = await callGeminiJSON(prompt);
    setAiTeamLoading(false);
    if (!res.ok) {
      setAiTeamError(`${res.error} The automatic handicap-balanced teams remain available.`);
      return;
    }
    const team1Ids = Array.isArray(res.data?.team1Ids) ? res.data.team1Ids.map(String) : [];
    const team2Ids = Array.isArray(res.data?.team2Ids) ? res.data.team2Ids.map(String) : [];
    const expectedIds = roster.map((p) => p.id);
    const allIds = [...team1Ids, ...team2Ids];
    const uniqueIds = new Set(allIds);
    const coversRoster = allIds.length === expectedIds.length && uniqueIds.size === expectedIds.length && expectedIds.every((id) => uniqueIds.has(id));
    const sizesValid = team1Ids.length > 0 && team2Ids.length > 0 && (evenTeamsRequired ? team1Ids.length === team2Ids.length : Math.abs(team1Ids.length - team2Ids.length) <= 1);
    if (!coversRoster || !sizesValid) {
      setAiTeamError("Gemini's suggestion didn't match this group correctly. Tap again to retry, or keep the automatic balance.");
      return;
    }
    const nameOf = (id) => draftParticipants.find((p) => p.id === id)?.name || '';
    setAiTeamSuggestion({
      requestKey,
      pairing: {
        team1Ids,
        team2Ids,
        team1: team1Ids.map(nameOf),
        team2: team2Ids.map(nameOf),
        reasoning: res.data?.explanation || 'Gemini balanced the teams using tee-adjusted course handicaps.',
      },
      explanation: res.data?.explanation || 'Gemini balanced the teams using tee-adjusted course handicaps.',
    });
  }

  function applyAiTeamSuggestion() {
    if (!aiTeamSuggestion || aiTeamSuggestion.requestKey !== `${selectedGameId}|${courseId}|${teamInputsKey}`) return;
    setTeamOverride({ gameId: selectedGameId, participantKey, pairing: aiTeamSuggestion.pairing });
    setAiTeamSuggestion(null);

  function beginCasualRound() {
    setError('');

    if (!gameFits) return setError(`${selectedGame.name} needs ${selectedGame.min === selectedGame.max ? selectedGame.min : `${selectedGame.min}–${selectedGame.max}`} players.`);
    if (!draftTeamValid) return setError('Finish setting both teams before starting.');

    const participants = draftParticipants;
    const guestPlayers = draftGuestPlayers;
    const playerData = draftPlayerData;
    const pairing = needsDraftTeams ? activePairing : null;
    const gameData = pairing ? { pairing } : {};
    if (selectedGame.scoring === 'vegas') gameData.vegasBirdieFlip = vegasBirdieFlip;
    if (selectedGame.scoring === 'rabbit') gameData.rabbitMode = rabbitMode;
    if (selectedGame.scoring === 'shamble') gameData.shambleCount = shambleCount;
    if (selectedGame.scoring === 'teamscore') gameData.teamScores = { team1: {}, team2: {} };
    if (selectedGame.scoring === 'snake') gameData.snakeEvents = [];
    const amount = Math.max(0, Number(buyIn) || 0);
    const ids = participants.map((p) => p.id);
    const r = {
      id: uid(),
      date: new Date().toISOString().slice(0, 10),
      courseId: course.id,
      teeName: fallbackTee,
      teeConfirmed: true,
      holes,
      entryMode: 'holebyhole',
      combinedWith: null,
      playerIds: ids,
      guestPlayers,
      skinsOptIn: selectedGame.scoring === 'skins' ? ids : [],
      trashOptIn: selectedGame.scoring === 'trash' ? ids : [],
      trash: {},
      playerData,
      status: 'live',
      currentHole: 0,
      startedAt: new Date().toISOString(),
      winnerBasis,
      pointsBasis: winnerBasis, // backward compatibility with older casual rounds
      casual: true,
      gameId: selectedGame.id,
      gameData,
      casualBet: { buyIn: amount, type: amount > 0 ? 'pot' : 'none', payoutMode },

    setEditingRoundId(r.id);

// Net profit across the season. Purse and skins are buy-in games, so profit is
// payout minus what they paid in. Trash has no pot in this app, so it's treated
// as zero-sum: each opted-in player pays every other player per item they earned.
function playerSeasonMoney(settings, rounds, courses, allPlayers, player) {
  const rows = [];
  let purseNet = 0;
  let skinsNet = 0;
  let trashNet = 0;
  const sorted = [...rounds].sort((a, b) => (a.date < b.date ? -1 : 1));
  sorted.forEach((r) => {
    if (r.casual || r.status !== 'final') return;
    if (settings.seasonStart && r.date && r.date < settings.seasonStart) return;
    const storedPlayer = immutableFinalSnapshot(r)?.players?.[player.id];
    if (!storedPlayer && !(r.playerIds || []).includes(player.id)) return;
    const course = courseForRound(r, courses.find((c) => c.id === r.courseId));
    if (!course) return;
    const roundPlayers = roundPlayerList(r, allPlayers);
    let rPurse = 0;
    let rSkins = 0;
    let rTrash = 0;

    // Purse is settled per DAY, not per round: a day played as two combined
    // nines is one buy-in, not two. Only the round that owns the event
    // contributes, so the buy-in isn't charged twice.
    if (!r.casual && playerPointsInRound(settings, r, player, course) != null) {
      const ownsEvent = !r.combinedWith || r.id < r.combinedWith;
      if (ownsEvent) {
        const evRounds = r.combinedWith ? sorted.filter((x) => x.id === r.id || x.id === r.combinedWith) : [r];
        const ev = { id: r.id, date: r.date, roundIds: evRounds.map((x) => x.id) };
        const evPlayerIds = new Set();
        evRounds.forEach((x) => (x.playerIds || []).forEach((id) => evPlayerIds.add(id)));
        const evPlayers = seasonPlayersForRounds(allPlayers, evRounds).filter((p) => evPlayerIds.has(p.id) || evRounds.some((eventRound) => immutableFinalSnapshot(eventRound)?.players?.[p.id]));
        const purse = purseForEvent(settings, ev, sorted, courses, evPlayers);
        if (purse && purse.scoredCount > 0) {
          rPurse = purse.net[player.id] != null ? purse.net[player.id] : 0;
        }
      }
    }

    if (storedPlayer) {
      rSkins = storedPlayer.money?.skinsNet || 0;
    } else if ((r.skinsOptIn || []).includes(player.id)) {
      const skins = computeSkinsForRound(r, roundPlayers, course, settings);
      if (skins) rSkins = (skins.payouts[player.id] || 0) - settings.skinsBuyIn;
    }

    if (storedPlayer) {
      rTrash = storedPlayer.money?.trashNet || 0;
    } else if ((r.trashOptIn || []).includes(player.id)) {
      const trash = computeTrashForRound(r, roundPlayers, course, settings);
      if (trash && trash.players.length > 1) {
        const n = trash.players.length;
        const mine = trash.tally[player.id] ? trash.tally[player.id].total : 0;
        rTrash = trash.value * (mine * n - trash.totalItems);
      }
    }

    purseNet += rPurse;
    skinsNet += rSkins;
    trashNet += rTrash;
    if (rPurse !== 0 || rSkins !== 0 || rTrash !== 0) {
      rows.push({ date: r.date, casual: !!r.casual, purse: rPurse, skins: rSkins, trash: rTrash, net: rPurse + rSkins + rTrash });
    }
  });
  const total = purseNet + skinsNet + trashNet;
  const best = rows.length ? Math.max(...rows.map((x) => x.net)) : null;
  return { rows, purseNet, skinsNet, trashNet, total, best };
}

function playerScoreDistribution(rounds, playerId, courses) {
  const counts = { eagle: 0, birdie: 0, par: 0, bogey: 0, double: 0 };
  let holesPlayed = 0;
  rounds.forEach((r) => {
    const course = courseForRound(r, courses.find((c) => c.id === r.courseId));
    if (!course) return;
    roundHoles(r, course).forEach((h, i) => {
      const g = immutableFinalSnapshot(r)?.players?.[playerId]?.holeScores?.[i] ?? r.playerData?.[playerId]?.holeScores?.[i];
      if (g == null) return;
      holesPlayed++;
      const d = g - h.par;
      if (d <= -2) counts.eagle++;
      else if (d === -1) counts.birdie++;
      else if (d === 0) counts.par++;
      else if (d === 1) counts.bogey++;
      else counts.double++;
    });
  });
  return { counts, holesPlayed };
}

function DonutChart({ segments, size = 150, thickness = 22, centerLabel, centerSub }) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  const r = (size - thickness) / 2;
  const circ = 2 * Math.PI * r;
  let acc = 0;
  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.surface2} strokeWidth={thickness} />
        {total > 0 &&
          segments.map((s) => {
            if (s.value <= 0) return null;
            const len = (s.value / total) * circ;
            const el = (
              <circle
                key={s.label}
                cx={size / 2}
                cy={size / 2}
                r={r}
                fill="none"
                stroke={s.color}
                strokeWidth={thickness}
                strokeDasharray={`${len} ${circ - len}`}
                strokeDashoffset={-acc}
              />
            );
            acc += len;
            return el;
          })}
      </svg>
      <div
        style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}
      >
        <div className="font-display leading-none" style={{ color: C.text, fontSize: 26 }}>
          {centerLabel}
        </div>
        {centerSub && (
          <div className="text-[10px] mt-1" style={{ color: C.muted }}>
            {centerSub}
          </div>
        )}
      </div>
    </div>
  );
}

function TrendChart({ points, height = 130 }) {
  if (points.length === 0) return null;
  const w = 320;
  const padX = 8;
  const padY = 14;
  const vals = points.map((p) => p.value);
  const maxAbs = Math.max(4, ...vals.map((v) => Math.abs(v)));
  const lo = -maxAbs;
  const hi = maxAbs;
  const x = (i) => (points.length === 1 ? w / 2 : padX + (i * (w - padX * 2)) / (points.length - 1));
  const y = (v) => padY + ((hi - v) / (hi - lo)) * (height - padY * 2);
  const zeroY = y(0);
  const line = points.map((p, i) => `${x(i)},${y(p.value)}`).join(' ');
  const area = `${x(0)},${zeroY} ${line} ${x(points.length - 1)},${zeroY}`;
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" style={{ display: 'block', overflow: 'visible' }}>
      <defs>
        <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={C.lime} stopOpacity="0.28" />
          <stop offset="100%" stopColor={C.lime} stopOpacity="0.02" />
        </linearGradient>
      </defs>
      <line x1="0" y1={zeroY} x2={w} y2={zeroY} stroke={C.border} strokeWidth="1" strokeDasharray="4 4" />
      {points.length > 1 && <polygon points={area} fill="url(#trendFill)" />}
      <polyline points={line} fill="none" stroke={C.lime} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p, i) => (
        <circle key={i} cx={x(i)} cy={y(p.value)} r="3.5" fill={p.value >= 0 ? C.lime : C.red} stroke={C.surface} strokeWidth="1.5" />
      ))}
    </svg>
  );
}

      {sub && (
        <div className="text-[9px] mt-0.5" style={{ color: C.faint }}>
          {sub}
        </div>
      )}
    </div>
  );

  const signed = (n) => (n > 0 ? `+${n}` : `${n}`);

  return (
    <div>
      <button onClick={onBack} className="text-sm font-semibold mb-3 tap" style={{ color: C.lime }}>
        ← {backLabel}
      </button>

      <HorizontalSwipePager
        enabled={!!onChangePlayer && swipePlayers.length > 1}
        edgeInset={32}
        canPrevious={swipeIndex > 0}
        canNext={swipeIndex >= 0 && swipeIndex < swipePlayers.length - 1}
        onPrevious={() => moveToPlayer(swipePlayers[swipeIndex - 1])}
        onNext={() => moveToPlayer(swipePlayers[swipeIndex + 1])}
        ariaLabel={`${player.name} dashboard. Swipe left or right to view another player.`}
      >
      <div key={player.id}>
      {/* identity header */}
      <Card primary style={{ background: C.surface }}>
        <div className="flex items-center gap-3">
          <div
            className="font-display flex items-center justify-center shrink-0"
            style={{ width: 54, height: 54, borderRadius: '50%', background: C.lime, color: C.onAccent, fontSize: 20 }}
          >
            {initials || '?'}
          </div>
          <div className="min-w-0 flex-1">
            <div className="font-display text-2xl leading-tight truncate" style={{ color: C.text }}>
              {player.name}
            </div>
            <div className="flex items-center gap-2 mt-1 flex-wrap">
              {settings.teamsEnabled && (
                <span
                  className="px-2 py-0.5 rounded-full text-[10px] font-bold"
                  style={{ background: C.surface2, color: player.team === 'team2' ? C.pink : C.cyan, border: `1px solid ${player.team === 'team2' ? C.pink : C.cyan}` }}
                >
                  {teamName}
                </span>
              )}
              {rank > 0 && season.anyResults && (
                <span className="text-[11px]" style={{ color: C.muted }}>
                  #{rank} of {board.length} · {myQuotaTotal > 0 ? '+' : ''}{myQuotaTotal} vs quota
                </span>
              )}
            </div>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-2 mt-3">
          <Stat label="Handicap" value={player.handicap ?? 0} />
          <Stat label="Base quota" value={quotaFromIndex(settings.quotaBase, player.handicap)} accent={C.gold} />
        </div>
        <button
          onClick={() => onSetMyPlayer(player.id)}
          className="w-full rounded-xl px-3 py-2 mt-3 text-xs font-semibold tap"
          style={{ background: isMyPlayer ? C.limeSoft : C.surface2, color: isMyPlayer ? C.lime : C.muted, border: `1px solid ${isMyPlayer ? C.lime : C.border}` }}
        >
          {isMyPlayer ? '✓ My dashboard on this device' : 'Set as my dashboard on this device'}
        </button>
      </Card>

      {/* upcoming golf date */}
      <Card primary={!!nextGolf} style={{ background: C.surface }}>
        <div className="flex items-start justify-between gap-3">
          <div>
            <SectionLabel>Next golf date</SectionLabel>
            {nextGolf ? (
              <>
                <div className="font-display text-xl" style={{ color: C.text }}>{formatRoundDate(nextGolf.date)}</div>
                <div className="text-xs mt-1" style={{ color: C.muted }}>
                  {nextGolf.sessions.map((x) => `${x.label} · ${x.count} player${x.count === 1 ? '' : 's'} in`).join(' / ')}
                </div>
                <div className="text-[10px] mt-2" style={{ color: nextGolf.bestCount >= 4 ? C.lime : nextGolf.bestCount >= 2 ? C.gold : C.faint }}>
                  {nextGolf.bestCount >= 4 ? 'Full group available' : nextGolf.bestCount >= 2 ? 'Enough players to organize a game' : 'Waiting on more players'}
                </div>
              </>
            ) : (
              <div className="text-xs" style={{ color: C.faint }}>No upcoming availability marked.</div>
            )}
          </div>
          <button onClick={onGoCalendar} className="text-[11px] font-semibold tap shrink-0" style={{ color: C.lime }}>
            Calendar →
          </button>
        </div>
      </Card>

      {/* venmo */}
      <Card>
        <TextField
          label="Venmo handle"
          value={player.venmo || ''}
          onChange={(v) => updatePlayer(player.id, { venmo: v })}
          placeholder="@username"
        />
        <div className="text-[11px] mt-1.5" style={{ color: C.faint }}>
          Used for settling up after rounds. Stored with the league and synced across devices.
        </div>
      </Card>

      {/* net profit */}
      <Card primary={money.total !== 0} style={{ background: C.surface }}>
        <SectionLabel>Net profit this season</SectionLabel>
        <div className="flex items-baseline gap-2">
          <span className="font-display leading-none" style={{ fontSize: 40, color: money.total > 0 ? C.lime : money.total < 0 ? C.red : C.text }}>
            {money.total < 0 ? '-' : money.total > 0 ? '+' : ''}${Math.abs(money.total).toFixed(2)}
          </span>
          {money.rows.length > 0 && (
            <span className="text-[11px]" style={{ color: C.muted }}>
              over {money.rows.length} round{money.rows.length === 1 ? '' : 's'}
            </span>
          )}
        </div>

        {money.rows.length === 0 ? (
          <div className="text-xs mt-2" style={{ color: C.faint }}>
            No money games played yet.
          </div>
        ) : (
          <>
            <div className="grid grid-cols-3 gap-2 mt-3">
              {[
                { label: 'Purse', v: money.purseNet },
                { label: 'Skins', v: money.skinsNet },
                { label: 'Trash', v: money.trashNet },
              ].map((x) => (
                <div key={x.label} className="rounded-2xl px-2 py-2.5 text-center" style={{ background: C.surface2, border: `1px solid ${C.border}` }}>
                  <div className="font-display text-base leading-none" style={{ color: x.v > 0 ? C.lime : x.v < 0 ? C.red : C.faint }}>
                    {x.v < 0 ? '-' : x.v > 0 ? '+' : ''}${Math.abs(x.v).toFixed(0)}
                  </div>
                  <div className="text-[9px] uppercase tracking-wide mt-1" style={{ color: C.muted }}>
                    {x.label}
                  </div>
                </div>
              ))}
            </div>
            <div className="text-[10px] mt-2.5" style={{ color: C.faint }}>
              Purse and skins are payout minus buy-in. Trash is settled between players at ${settings.trashValue} per item.
            </div>
          </>
        )}
      </Card>

      {/* season performance */}
      <Card>
        <SectionLabel>Season performance</SectionLabel>
        <div className="grid grid-cols-2 gap-2">
          <Stat label="Events played" value={eventCount} />
          <Stat label="Scores counted" value={`${countedCount}/${settings.topScoresCounted}`} accent={countedCount >= settings.topScoresCounted ? C.lime : C.gold} />
          <Stat label="Avg vs quota" value={avgVsQuota == null ? '—' : signed(avgVsQuota)} accent={avgVsQuota == null ? C.text : avgVsQuota >= 0 ? C.lime : C.red} />
          <Stat label="Best round" value={bestRound == null ? '—' : signed(bestRound)} accent={bestRound == null ? C.text : C.gold} />
        </div>
        <div className="text-[10px] mt-2" style={{ color: C.faint }}>
          {eventCount < settings.topScoresCounted
            ? `${settings.topScoresCounted - eventCount} more event${settings.topScoresCounted - eventCount === 1 ? '' : 's'} before the season card is full.`
            : `Only the best ${settings.topScoresCounted} event scores count toward the season total.`}
        </div>
        {momentum != null && (
          <div className="flex items-center gap-2 mt-3 pt-3" style={{ borderTop: `1px solid ${C.border}` }}>
            <span className="text-[11px]" style={{ color: C.muted }}>
              Momentum
            </span>
            <span className="font-display text-sm" style={{ color: momentum > 0 ? C.lime : momentum < 0 ? C.red : C.muted }}>
              {momentum > 0 ? '▲' : momentum < 0 ? '▼' : '—'} {signed(momentum)}
            </span>
            <span className="text-[10px]" style={{ color: C.faint }}>
              last 3 vs prior 3
            </span>
          </div>
        )}
      </Card>

      {/* trend */}
      <Card>
        <SectionLabel>Trending this season</SectionLabel>
        {trend.length < 2 ? (
          <div className="text-xs py-3 text-center" style={{ color: C.faint }}>
            {trend.length === 0 ? 'No league rounds scored yet.' : 'Play one more league round to see a trend line.'}
          </div>
        ) : (
          <>
            <TrendChart points={trend} />
            <div className="flex items-center justify-between mt-2 text-[10px]" style={{ color: C.faint }}>
              <span>{formatRoundDate(trend[0].date)}</span>
              <span>points vs quota · dashed line = quota</span>
              <span>{formatRoundDate(trend[trend.length - 1].date)}</span>
            </div>
          </>
        )}
      </Card>

      {/* scoring breakdown */}
      <Card>
        <SectionLabel>Scoring breakdown</SectionLabel>
        {holesPlayed === 0 ? (
          <div className="text-xs py-3 text-center" style={{ color: C.faint }}>
            No holes scored yet.
          </div>
        ) : (
          <div className="flex items-center gap-4">
            <DonutChart segments={segments} centerLabel={holesPlayed} centerSub="holes" />
            <div className="flex-1 min-w-0">
              {segments.map((s) => {
                const pct = holesPlayed > 0 ? Math.round((s.value / holesPlayed) * 100) : 0;
                return (
                  <div key={s.label} className="flex items-center gap-2 py-1">
                    <span className="shrink-0" style={{ width: 10, height: 10, borderRadius: 3, background: s.color }} />
                    <span className="text-xs flex-1 truncate" style={{ color: C.text }}>
                      {s.label}
                    </span>
                    <span className="font-display text-xs" style={{ color: C.text }}>
                      {s.value}
                    </span>
                    <span className="text-[10px] w-8 text-right" style={{ color: C.faint }}>
                      {pct}%
                    </span>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </Card>

      {/* money by round */}
      {money.rows.length > 0 && (
        <Card>
          <SectionLabel>Money by round</SectionLabel>
          <div className="flex items-center justify-between text-[9px] uppercase tracking-wide pb-1.5" style={{ color: C.muted, borderBottom: `1px solid ${C.border}` }}>
            <span>Date</span>
            <div className="flex items-center gap-3">
              <span className="w-10 text-right">Purse</span>
              <span className="w-10 text-right">Skins</span>
              <span className="w-10 text-right">Trash</span>
              <span className="w-12 text-right">Net</span>
            </div>
          </div>
          {[...money.rows].reverse().map((m, i) => {
            const cell = (v) => (
              <span className="w-10 text-right font-display text-[11px]" style={{ color: v > 0 ? C.lime : v < 0 ? C.red : C.faint }}>
                {v === 0 ? '—' : `${v < 0 ? '-' : '+'}${Math.abs(v).toFixed(0)}`}
              </span>
            );
            return (
              <div key={i} className="flex items-center justify-between py-1.5" style={{ borderBottom: i < money.rows.length - 1 ? `1px solid ${C.border}` : 'none' }}>
                <span className="text-[11px] truncate" style={{ color: C.muted }}>
                  {formatRoundDate(m.date)}
                  {m.casual && <span style={{ color: C.cyan }}> · casual</span>}
                </span>
                <div className="flex items-center gap-3 shrink-0">
                  {cell(m.purse)}
                  {cell(m.skins)}
                  {cell(m.trash)}
                  <span className="w-12 text-right font-display text-xs" style={{ color: m.net > 0 ? C.lime : m.net < 0 ? C.red : C.faint }}>
                    {m.net < 0 ? '-' : m.net > 0 ? '+' : ''}${Math.abs(m.net).toFixed(0)}
                  </span>
                </div>
              </div>
            );
          })}
        </Card>
      )}

      {/* round log */}
      {trend.length > 0 && (
        <Card>
          <SectionLabel>Round log</SectionLabel>
          {[...trend].reverse().map((t, i) => (
            <div key={i} className="flex items-center justify-between py-1.5" style={{ borderBottom: i < trend.length - 1 ? `1px solid ${C.border}` : 'none' }}>
              <span className="text-xs" style={{ color: C.muted }}>
                {formatRoundDate(t.date)}
              </span>
              <span className="font-display text-sm" style={{ color: t.value >= 0 ? C.lime : C.red }}>
                {signed(t.value)}
              </span>
            </div>
          ))}
        </Card>
      )}
      {/* GHIN — kept at the bottom since it's reference info, not a headline stat */}
      <Card>
        <TextField
          label="GHIN #"
          value={player.ghin || ''}
          onChange={(v) => updatePlayer(player.id, { ghin: v })}
          placeholder="not set"
        />
        <div className="text-[11px] mt-1.5" style={{ color: C.faint }}>
          Used when refreshing handicaps against GHIN from a backup file.
        </div>
      </Card>
      </div>
      </HorizontalSwipePager>
    </div>
  );
}

function PlayersTab({ settings, players, setPlayers, rounds, courses, availability, dashboardPlayerId, setDashboardPlayerId, myPlayerId, onSetMyPlayer, onGoCalendar }) {
  const [form, setForm] = useState({ name: '', ghin: '', handicap: '', team: 'team1' });
  const [showGhinInfo, setShowGhinInfo] = useState(false);
  const [aiTeams, setAiTeams] = useState(null);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState('');

  function addPlayer() {
    if (!form.name.trim()) return;
    setPlayers((ps) => [...ps, { id: uid(), name: form.name.trim(), ghin: form.ghin.trim(), handicap: Number(form.handicap) || 0, team: form.team }]);
    setForm({ name: '', ghin: '', handicap: '', team: 'team1' });
  }
  function updatePlayer(id, patch) {
    setPlayers((ps) => ps.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  }
  function removePlayer(id) {
    setPlayers((ps) => ps.filter((p) => p.id !== id));
  }

  async function suggestTeams() {
    setAiError('');
    setAiTeams(null);
    if (players.length < 2) {
      setAiError('Add at least 2 players first.');
      return;
    }
    setAiLoading(true);
    const list = players.map((p) => `${p.name} (handicap ${p.handicap})`).join(', ');
    const prompt = `You are helping split a golf league roster into two balanced teams for a season-long team competition, based on handicap (lower handicap = better player).
Players: ${list}.
Split them into "team1" and "team2" so the two sides are as evenly matched as possible by skill (balance the average handicap on each side). Team sizes should differ by at most 1. Every player must be used exactly once, using their exact full name as given above.
Respond with ONLY this JSON shape, no other text: {"team1": ["Full Name", ...], "team2": ["Full Name", ...], "explanation": "one upbeat sentence explaining the split"}`;
    const res = await callGeminiJSON(prompt);
    setAiLoading(false);
    if (!res.ok) {
      setAiError(res.error);
      return;
    }
    const t1 = Array.isArray(res.data.team1) ? res.data.team1 : [];
    const t2 = Array.isArray(res.data.team2) ? res.data.team2 : [];
    const covered = new Set([...t1, ...t2]);
    const missing = players.filter((p) => !covered.has(p.name));
    if (missing.length > 0 || t1.length + t2.length !== players.length) {
      setAiError("That didn't quite match your roster — give it another tap to retry.");
      return;
    }
    setAiTeams({ team1: t1, team2: t2, explanation: res.data.explanation || '' });
  }
  function applyAiTeams() {
    if (!aiTeams) return;
    const t1set = new Set(aiTeams.team1);
    setPlayers((ps) => ps.map((p) => ({ ...p, team: t1set.has(p.name) ? 'team1' : 'team2' })));
    setAiTeams(null);
  }
  function avgHandicap(names) {
    const list = players.filter((p) => names.includes(p.name));
    if (list.length === 0) return 0;
    return Math.round((list.reduce((s, p) => s + p.handicap, 0) / list.length) * 10) / 10;
  }

  const dashPlayer = dashboardPlayerId ? players.find((p) => p.id === dashboardPlayerId) : null;
  if (dashPlayer) {
    const alphabeticalPlayers = [...players].sort((a, b) => a.name.localeCompare(b.name));
    return (
      <InteractiveEdgeBack
        onBack={() => setDashboardPlayerId(null)}
        underlay={
          <DrilldownUnderlay
            title="Players"
            subtitle={`${players.length} league player${players.length === 1 ? '' : 's'}`}
            rows={alphabeticalPlayers.map((p) => ({ label: p.name, detail: `Handicap Index ${p.handicap}` }))}
          />
        }
      >
      <PlayerDashboard
        settings={settings}
        player={dashPlayer}
        players={players}
        rounds={rounds || []}
        courses={courses || []}
        availability={availability}
        onBack={() => setDashboardPlayerId(null)}
        onGoCalendar={onGoCalendar}
        updatePlayer={updatePlayer}
        isMyPlayer={myPlayerId === dashPlayer.id}
        onSetMyPlayer={onSetMyPlayer}
        playerOrder={alphabeticalPlayers}
        onChangePlayer={setDashboardPlayerId}
      />
      </InteractiveEdgeBack>
    );
  }

  return (
    <div>
      <Card>
        <div className="flex items-start justify-between mb-2">
          <div>
            <div className="font-display text-xl" style={{ color: C.text }}>
              Players
            </div>
            <p className="text-xs mt-1" style={{ color: C.muted }}>
              Base quota is {settings.quotaBase} − Handicap Index. The playing quota is course- and tee-adjusted, then shown during round setup.
            </p>
          </div>
          <GhostButton onClick={() => setShowGhinInfo((v) => !v)} color={C.lime}>
            <RotateCcw size={12} style={{ display: 'inline', marginRight: 6 }} /> Sync from GHIN
          </GhostButton>
        </div>
        <Collapse open={showGhinInfo}>
          <InfoNote>
            GHIN doesn't offer a public live sync, so this stays a two-step process: add each player's GHIN number below, export a backup (Settings tab), refresh handicaps against GHIN on your computer, then import the updated file. Quotas recalculate automatically.
          </InfoNote>
        </Collapse>

        <div className="grid grid-cols-2 gap-2 mt-2">
          <TextField label="Name" value={form.name} onChange={(v) => setForm((f) => ({ ...f, name: v }))} placeholder="Player name" />
          <TextField label="GHIN #" value={form.ghin} onChange={(v) => setForm((f) => ({ ...f, ghin: v }))} placeholder="optional" />
          <TextField label="Handicap" value={form.handicap} onChange={(v) => setForm((f) => ({ ...f, handicap: v }))} placeholder="e.g. 14" type="number" />
          {settings.teamsEnabled && (
            <SelectField
              label="Team"
              value={form.team}
              onChange={(v) => setForm((f) => ({ ...f, team: v }))}
              options={[
                { value: 'team1', label: settings.team1Name },
                { value: 'team2', label: settings.team2Name },
              ]}
            />
          )}
        </div>
        <PrimaryButton onClick={addPlayer} style={{ marginTop: 12 }}>
          Add
        </PrimaryButton>
      </Card>

      <Card>
        <div style={{ overflowX: 'auto' }}>
          <div style={{ minWidth: settings.teamsEnabled ? 620 : 540 }}>
            <div className={`grid ${settings.teamsEnabled ? 'grid-cols-7' : 'grid-cols-6'} gap-2 text-[10px] uppercase tracking-wide pb-2`} style={{ color: C.muted, borderBottom: `1px solid ${C.border}` }}>
              <div className="col-span-2">Player</div>
              <div>Base quota</div>
              <div>Handicap</div>
              {settings.teamsEnabled && <div>Team</div>}
              <div>GHIN</div>
              <div />
            </div>
            {players.map((p) => (
              <div key={p.id} className={`grid ${settings.teamsEnabled ? 'grid-cols-7' : 'grid-cols-6'} gap-2 items-center py-2`} style={{ borderBottom: `1px solid ${C.border}` }}>
                <div className="col-span-2 flex items-center gap-2 min-w-0">
                  <button
                    onClick={() => setDashboardPlayerId(p.id)}
                    title={`Open ${p.name}'s dashboard`}
                    aria-label={`Open ${p.name}'s dashboard`}
                    className="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 tap"
                    style={{ background: C.limeSoft, color: C.lime, border: `1px solid ${C.lime}` }}
                  >
                    <BarChart size={16} />
                  </button>
                  <input
                    className="flex-1 min-w-0 bg-transparent outline-none text-sm rounded-xl px-2 py-1.5"
                    style={{ background: C.surface2, color: C.text }}
                    value={p.name}
                    onChange={(e) => updatePlayer(p.id, { name: e.target.value })}
                  />
                </div>
                <div className="font-display text-base" style={{ color: C.gold }}>
                  {quotaFromIndex(settings.quotaBase, p.handicap)}
                </div>
                <input
                  type="number"
                  className="text-sm rounded-xl px-2 py-1.5 outline-none w-full"
                  style={{ background: C.surface2, color: C.text }}
                  value={p.handicap}
                  onChange={(e) => updatePlayer(p.id, { handicap: Number(e.target.value) })}
                />
                {settings.teamsEnabled && (
                  <select
                    value={p.team || 'team1'}
                    onChange={(e) => updatePlayer(p.id, { team: e.target.value })}
                    className="text-xs rounded-xl px-1.5 py-1.5 outline-none w-full"
                    style={{ background: C.surface2, color: C.text }}
                  >
                    <option value="team1">{settings.team1Name}</option>
                    <option value="team2">{settings.team2Name}</option>
                  </select>
                )}
                <input
                  className="text-sm rounded-xl px-2 py-1.5 outline-none w-full"
                  style={{ background: C.surface2, color: C.faint }}
                  value={p.ghin}
                  onChange={(e) => updatePlayer(p.id, { ghin: e.target.value })}
                />
                <div className="flex justify-end">
                  <button
                    onClick={() => removePlayer(p.id)}
                    aria-label={`Remove ${p.name}`}
                    className="w-7 h-7 rounded-full flex items-center justify-center shrink-0 tap"
                    style={{ background: C.surface2, color: C.red }}
                  >
                    <X size={13} />
                  </button>
                </div>
              </div>
            ))}
            {players.length === 0 && (
              <div className="text-sm text-center py-6" style={{ color: C.muted }}>
                No players yet — add your first above.
              </div>
            )}
          </div>
        </div>
      </Card>

      {settings.teamsEnabled && (
        <Card>
          <div className="flex items-center justify-between mb-1">
            <div className="font-display text-xl" style={{ color: C.text }}>
              🤖 Balanced Teams
            </div>
          </div>
          <p className="text-xs mb-3" style={{ color: C.muted }}>
            Let AI split the roster into two evenly matched teams by handicap for the season Team Battle.
          </p>
          <PrimaryButton onClick={suggestTeams} disabled={aiLoading} style={{ width: '100%', textAlign: 'center' }}>
            {aiLoading ? 'Thinking…' : '✨ Suggest Balanced Teams'}
          </PrimaryButton>
          {aiError && (
            <div className="text-xs mt-2" style={{ color: C.red }}>
              {aiError}
            </div>
          )}
          <Collapse open={!!aiTeams}>
            {aiTeams && (
              <div className="mt-3 pop-in">
                <div className="grid grid-cols-2 gap-2 mb-2">
                  <div className="rounded-2xl p-3" style={{ background: C.surface2 }}>
                    <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: C.cyan }}>
                      {settings.team1Name} · avg {avgHandicap(aiTeams.team1)}
                    </div>
                    {aiTeams.team1.map((n) => (
                      <div key={n} className="text-sm" style={{ color: C.text }}>
                        {n}
                      </div>
                    ))}
                  </div>
                  <div className="rounded-2xl p-3" style={{ background: C.surface2 }}>
                    <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: C.pink }}>
                      {settings.team2Name} · avg {avgHandicap(aiTeams.team2)}
                    </div>
                    {aiTeams.team2.map((n) => (
                      <div key={n} className="text-sm" style={{ color: C.text }}>
                        {n}
                      </div>
                    ))}
                  </div>
                </div>
                {aiTeams.explanation && (
                  <p className="text-xs mb-3 italic" style={{ color: C.muted }}>
                    "{aiTeams.explanation}"
                  </p>
                )}
                <div className="flex gap-2">
                  <GhostButton onClick={() => setAiTeams(null)} style={{ flex: 1, textAlign: 'center' }}>
                    Dismiss
                  </GhostButton>
                  <PrimaryButton onClick={applyAiTeams} style={{ flex: 1, textAlign: 'center' }}>
                    Apply Teams
                  </PrimaryButton>
                </div>
              </div>
            )}
          </Collapse>
        </Card>
      )}
    </div>
  );
}
