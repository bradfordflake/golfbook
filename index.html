// Net profit across the season. Purse and skins are buy-in games, so profit is
// payout minus what they paid in. Trash has no pot in this app, so it's treated
// as zero-sum: each opted-in player pays every other player per item they earned.
function playerSeasonMoney(settings, rounds, courses, allPlayers, player) {
  const rows = [];
  let purseNet = 0;
  let skinsNet = 0;
  let trashNet = 0;
  const sorted = [...rounds].sort((a, b) => (a.date < b.date ? -1 : 1));
  sorted.forEach((r) => {
    if (!(r.playerIds || []).includes(player.id)) return;
    const course = courses.find((c) => c.id === r.courseId);
    if (!course) return;
    const roundPlayers = allPlayers.filter((p) => (r.playerIds || []).includes(p.id));
    let rPurse = 0;
    let rSkins = 0;
    let rTrash = 0;

    if (!r.casual && playerPointsInRound(settings, r, player, course) != null) {
      const purse = purseForRound(settings, r, roundPlayers, course);
      if (purse && purse.scoredCount > 0) {
        rPurse = (purse.payouts[player.id] || 0) - settings.purseBuyIn;
      }
    }

    if ((r.skinsOptIn || []).includes(player.id)) {
      const skins = computeSkinsForRound(r, roundPlayers, course, settings);
      if (skins) rSkins = (skins.payouts[player.id] || 0) - settings.skinsBuyIn;
    }

    if ((r.trashOptIn || []).includes(player.id)) {
      const trash = computeTrashForRound(r, roundPlayers, course, settings);
      if (trash && trash.players.length > 1) {
        const n = trash.players.length;
        const mine = trash.tally[player.id] ? trash.tally[player.id].total : 0;
        rTrash = trash.value * (mine * n - trash.totalItems);
      }
    }

    purseNet += rPurse;
    skinsNet += rSkins;
    trashNet += rTrash;
    if (rPurse !== 0 || rSkins !== 0 || rTrash !== 0) {
      rows.push({ date: r.date, casual: !!r.casual, purse: rPurse, skins: rSkins, trash: rTrash, net: rPurse + rSkins + rTrash });
    }
  });
  const total = purseNet + skinsNet + trashNet;
  const best = rows.length ? Math.max(...rows.map((x) => x.net)) : null;
  return { rows, purseNet, skinsNet, trashNet, total, best };
}

function playerScoreDistribution(rounds, playerId, courses) {
  const counts = { eagle: 0, birdie: 0, par: 0, bogey: 0, double: 0 };
  let holesPlayed = 0;
  rounds.forEach((r) => {
    const course = courses.find((c) => c.id === r.courseId);
    if (!course) return;
    roundHoles(r, course).forEach((h, i) => {
      const g = r.playerData?.[playerId]?.holeScores?.[i];
      if (g == null) return;
      holesPlayed++;
      const d = g - h.par;
      if (d <= -2) counts.eagle++;
      else if (d === -1) counts.birdie++;
      else if (d === 0) counts.par++;
      else if (d === 1) counts.bogey++;
      else counts.double++;
    });
  });
  return { counts, holesPlayed };
}

function DonutChart({ segments, size = 150, thickness = 22, centerLabel, centerSub }) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  const r = (size - thickness) / 2;
  const circ = 2 * Math.PI * r;
  let acc = 0;
  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.surface2} strokeWidth={thickness} />
        {total > 0 &&
          segments.map((s) => {
            if (s.value <= 0) return null;
            const len = (s.value / total) * circ;
            const el = (
              <circle
                key={s.label}
                cx={size / 2}
                cy={size / 2}
                r={r}
                fill="none"
                stroke={s.color}
                strokeWidth={thickness}
                strokeDasharray={`${len} ${circ - len}`}
                strokeDashoffset={-acc}
              />
            );
            acc += len;
            return el;
          })}
      </svg>
      <div
        style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}
      >
        <div className="font-display leading-none" style={{ color: C.text, fontSize: 26 }}>
          {centerLabel}
        </div>
        {centerSub && (
          <div className="text-[10px] mt-1" style={{ color: C.muted }}>
            {centerSub}
          </div>
        )}
      </div>
    </div>
  );
}

function TrendChart({ points, height = 130 }) {
  if (points.length === 0) return null;
  const w = 320;
  const padX = 8;
  const padY = 14;
  const vals = points.map((p) => p.value);
  const maxAbs = Math.max(4, ...vals.map((v) => Math.abs(v)));
  const lo = -maxAbs;
  const hi = maxAbs;
  const x = (i) => (points.length === 1 ? w / 2 : padX + (i * (w - padX * 2)) / (points.length - 1));
  const y = (v) => padY + ((hi - v) / (hi - lo)) * (height - padY * 2);
  const zeroY = y(0);
  const line = points.map((p, i) => `${x(i)},${y(p.value)}`).join(' ');
  const area = `${x(0)},${zeroY} ${line} ${x(points.length - 1)},${zeroY}`;
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" style={{ display: 'block', overflow: 'visible' }}>
      <defs>
        <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={C.lime} stopOpacity="0.28" />
          <stop offset="100%" stopColor={C.lime} stopOpacity="0.02" />
        </linearGradient>
      </defs>
      <line x1="0" y1={zeroY} x2={w} y2={zeroY} stroke={C.border} strokeWidth="1" strokeDasharray="4 4" />
      {points.length > 1 && <polygon points={area} fill="url(#trendFill)" />}
      <polyline points={line} fill="none" stroke={C.lime} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p, i) => (
        <circle key={i} cx={x(i)} cy={y(p.value)} r="3.5" fill={p.value >= 0 ? C.lime : C.red} stroke={C.surface} strokeWidth="1.5" />
      ))}
    </svg>
  );
}

function PlayerDashboard({ settings, player, players, rounds, courses, onBack, updatePlayer, backLabel = 'All players' }) {
  const leagueRounds = rounds.filter((r) => !r.casual);
  const season = computeSeason(settings, leagueRounds, courses, players);

  const board = players
    .map((p) => ({ p, pts: season.seasonTotals[p.id] || 0 }))
    .sort((a, b) => b.pts - a.pts);
  const rank = board.findIndex((r) => r.p.id === player.id) + 1;
  const myPts = season.seasonTotals[player.id] || 0;

  const scored = leagueRounds
    .filter((r) => {
      const course = courses.find((c) => c.id === r.courseId);
      return course && playerResultInRound(settings, r, player, course) != null;
    })
    .sort((a, b) => (a.date < b.date ? -1 : 1));

  const trend = scored.map((r) => {
    const course = courses.find((c) => c.id === r.courseId);
    return { value: playerResultInRound(settings, r, player, course).result, date: r.date };
  });

  const allScored = rounds.filter((r) => r.playerData?.[player.id]);
  const { counts, holesPlayed } = playerScoreDistribution(allScored, player.id, courses);
  const money = playerSeasonMoney(settings, rounds, courses, players, player);

  const segments = [
    { label: 'Eagle+', value: counts.eagle, color: C.gold },
    { label: 'Birdie', value: counts.birdie, color: C.lime },
    { label: 'Par', value: counts.par, color: C.cyan },
    { label: 'Bogey', value: counts.bogey, color: C.orange },
    { label: 'Double+', value: counts.double, color: C.red },
  ];

  const avgVsQuota = trend.length ? Math.round((trend.reduce((s, t) => s + t.value, 0) / trend.length) * 10) / 10 : null;
  const bestRound = trend.length ? Math.max(...trend.map((t) => t.value)) : null;
  const last3 = trend.slice(-3);
  const prev3 = trend.slice(-6, -3);
  const avg = (arr) => (arr.length ? arr.reduce((s, t) => s + t.value, 0) / arr.length : null);
  const recentAvg = avg(last3);
  const priorAvg = avg(prev3);
  const momentum = recentAvg != null && priorAvg != null ? Math.round((recentAvg - priorAvg) * 10) / 10 : null;

  const teamName = player.team === 'team2' ? settings.team2Name : settings.team1Name;
  const initials = player.name
    .split(' ')
    .map((s) => s[0])
    .filter(Boolean)
    .slice(0, 2)
    .join('')
    .toUpperCase();

  const Stat = ({ label, value, accent, sub }) => (
    <div className="rounded-2xl px-2 py-3 text-center" style={{ background: C.surface2, border: `1px solid ${C.border}` }}>
      <div className="font-display text-xl leading-none" style={{ color: accent || C.text }}>
        {value}
      </div>
      <div className="text-[9px] uppercase tracking-wide mt-1.5" style={{ color: C.muted }}>
        {label}
      </div>
      {sub && (
        <div className="text-[9px] mt-0.5" style={{ color: C.faint }}>
          {sub}
        </div>
      )}
    </div>
  );

  const signed = (n) => (n > 0 ? `+${n}` : `${n}`);

  return (
    <div>
      <button onClick={onBack} className="text-sm font-semibold mb-3 tap" style={{ color: C.lime }}>
        ← {backLabel}
      </button>

      {/* identity header */}
      <Card primary>
        <div className="flex items-center gap-3">
          <div
            className="font-display flex items-center justify-center shrink-0"
            style={{ width: 54, height: 54, borderRadius: '50%', background: C.lime, color: C.onAccent, fontSize: 20 }}
          >
            {initials || '?'}
          </div>
          <div className="min-w-0 flex-1">
            <div className="font-display text-2xl leading-tight truncate" style={{ color: C.text }}>
              {player.name}
            </div>
            <div className="flex items-center gap-2 mt-1 flex-wrap">
              <span
                className="px-2 py-0.5 rounded-full text-[10px] font-bold"
                style={{ background: C.surface2, color: player.team === 'team2' ? C.pink : C.cyan, border: `1px solid ${player.team === 'team2' ? C.pink : C.cyan}` }}
              >
                {teamName}
              </span>
              {rank > 0 && season.anyResults && (
                <span className="text-[11px]" style={{ color: C.muted }}>
                  #{rank} of {players.length} · {myPts} pts
                </span>
              )}
            </div>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-2 mt-3">
          <Stat label="Handicap" value={player.handicap ?? 0} />
          <Stat label="Quota" value={quotaFromIndex(settings.quotaBase, player.handicap)} accent={C.gold} />
        </div>
      </Card>

      {/* venmo */}
      <Card>
        <TextField
          label="Venmo handle"
          value={player.venmo || ''}
          onChange={(v) => updatePlayer(player.id, { venmo: v })}
          placeholder="@username"
        />
        <div className="text-[11px] mt-1.5" style={{ color: C.faint }}>
          Used for settling up after rounds. Stored with the league and synced across devices.
        </div>
      </Card>

      {/* net profit */}
      <Card primary={money.total !== 0}>
        <SectionLabel>Net profit this season</SectionLabel>
        <div className="flex items-baseline gap-2">
          <span className="font-display leading-none" style={{ fontSize: 40, color: money.total > 0 ? C.lime : money.total < 0 ? C.red : C.text }}>
            {money.total < 0 ? '-' : money.total > 0 ? '+' : ''}${Math.abs(money.total).toFixed(2)}
          </span>
          {money.rows.length > 0 && (
            <span className="text-[11px]" style={{ color: C.muted }}>
              over {money.rows.length} round{money.rows.length === 1 ? '' : 's'}
            </span>
          )}
        </div>

        {money.rows.length === 0 ? (
          <div className="text-xs mt-2" style={{ color: C.faint }}>
            No money games played yet.
          </div>
        ) : (
          <>
            <div className="grid grid-cols-3 gap-2 mt-3">
              {[
                { label: 'Purse', v: money.purseNet },
                { label: 'Skins', v: money.skinsNet },
                { label: 'Trash', v: money.trashNet },
              ].map((x) => (
                <div key={x.label} className="rounded-2xl px-2 py-2.5 text-center" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
                  <div className="font-display text-base leading-none" style={{ color: x.v > 0 ? C.lime : x.v < 0 ? C.red : C.faint }}>
                    {x.v < 0 ? '-' : x.v > 0 ? '+' : ''}${Math.abs(x.v).toFixed(0)}
                  </div>
                  <div className="text-[9px] uppercase tracking-wide mt-1" style={{ color: C.muted }}>
                    {x.label}
                  </div>
                </div>
              ))}
            </div>
            <div className="text-[10px] mt-2.5" style={{ color: C.faint }}>
              Purse and skins are payout minus buy-in. Trash is settled between players at ${settings.trashValue} per item.
            </div>
          </>
        )}
      </Card>

      {/* season performance */}
      <Card>
        <SectionLabel>Season performance</SectionLabel>
        <div className="grid grid-cols-3 gap-2">
          <Stat label="Rounds" value={trend.length} />
          <Stat label="Avg vs quota" value={avgVsQuota == null ? '—' : signed(avgVsQuota)} accent={avgVsQuota == null ? C.text : avgVsQuota >= 0 ? C.lime : C.red} />
          <Stat label="Best round" value={bestRound == null ? '—' : signed(bestRound)} accent={bestRound == null ? C.text : C.gold} />
        </div>
        {momentum != null && (
          <div className="flex items-center gap-2 mt-3 pt-3" style={{ borderTop: `1px solid ${C.border}` }}>
            <span className="text-[11px]" style={{ color: C.muted }}>
              Momentum
            </span>
            <span className="font-display text-sm" style={{ color: momentum > 0 ? C.lime : momentum < 0 ? C.red : C.muted }}>
              {momentum > 0 ? '▲' : momentum < 0 ? '▼' : '—'} {signed(momentum)}
            </span>
            <span className="text-[10px]" style={{ color: C.faint }}>
              last 3 vs prior 3
            </span>
          </div>
        )}
      </Card>

      {/* trend */}
      <Card>
        <SectionLabel>Trending this season</SectionLabel>
        {trend.length < 2 ? (
          <div className="text-xs py-3 text-center" style={{ color: C.faint }}>
            {trend.length === 0 ? 'No league rounds scored yet.' : 'Play one more league round to see a trend line.'}
          </div>
        ) : (
          <>
            <TrendChart points={trend} />
            <div className="flex items-center justify-between mt-2 text-[10px]" style={{ color: C.faint }}>
              <span>{formatRoundDate(trend[0].date)}</span>
              <span>points vs quota · dashed line = quota</span>
              <span>{formatRoundDate(trend[trend.length - 1].date)}</span>
            </div>
          </>
        )}
      </Card>

      {/* scoring breakdown */}
      <Card>
        <SectionLabel>Scoring breakdown</SectionLabel>
        {holesPlayed === 0 ? (
          <div className="text-xs py-3 text-center" style={{ color: C.faint }}>
            No holes scored yet.
          </div>
        ) : (
          <div className="flex items-center gap-4">
            <DonutChart segments={segments} centerLabel={holesPlayed} centerSub="holes" />
            <div className="flex-1 min-w-0">
              {segments.map((s) => {
                const pct = holesPlayed > 0 ? Math.round((s.value / holesPlayed) * 100) : 0;
                return (
                  <div key={s.label} className="flex items-center gap-2 py-1">
                    <span className="shrink-0" style={{ width: 10, height: 10, borderRadius: 3, background: s.color }} />
                    <span className="text-xs flex-1 truncate" style={{ color: C.text }}>
                      {s.label}
                    </span>
                    <span className="font-display text-xs" style={{ color: C.text }}>
                      {s.value}
                    </span>
                    <span className="text-[10px] w-8 text-right" style={{ color: C.faint }}>
                      {pct}%
                    </span>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </Card>

      {/* money by round */}
      {money.rows.length > 0 && (
        <Card>
          <SectionLabel>Money by round</SectionLabel>
          <div className="flex items-center justify-between text-[9px] uppercase tracking-wide pb-1.5" style={{ color: C.muted, borderBottom: `1px solid ${C.border}` }}>
            <span>Date</span>
            <div className="flex items-center gap-3">
              <span className="w-10 text-right">Purse</span>
              <span className="w-10 text-right">Skins</span>
              <span className="w-10 text-right">Trash</span>
              <span className="w-12 text-right">Net</span>
            </div>
          </div>
          {[...money.rows].reverse().map((m, i) => {
            const cell = (v) => (
              <span className="w-10 text-right font-display text-[11px]" style={{ color: v > 0 ? C.lime : v < 0 ? C.red : C.faint }}>
                {v === 0 ? '—' : `${v < 0 ? '-' : '+'}${Math.abs(v).toFixed(0)}`}
              </span>
            );
            return (
              <div key={i} className="flex items-center justify-between py-1.5" style={{ borderBottom: i < money.rows.length - 1 ? `1px solid ${C.border}` : 'none' }}>
                <span className="text-[11px] truncate" style={{ color: C.muted }}>
                  {formatRoundDate(m.date)}
                  {m.casual && <span style={{ color: C.cyan }}> · casual</span>}
                </span>
                <div className="flex items-center gap-3 shrink-0">
                  {cell(m.purse)}
                  {cell(m.skins)}
                  {cell(m.trash)}
                  <span className="w-12 text-right font-display text-xs" style={{ color: m.net > 0 ? C.lime : m.net < 0 ? C.red : C.faint }}>
                    {m.net < 0 ? '-' : m.net > 0 ? '+' : ''}${Math.abs(m.net).toFixed(0)}
                  </span>
                </div>
              </div>
            );
          })}
        </Card>
      )}

      {/* round log */}
      {trend.length > 0 && (
        <Card>
          <SectionLabel>Round log</SectionLabel>
          {[...trend].reverse().map((t, i) => (
            <div key={i} className="flex items-center justify-between py-1.5" style={{ borderBottom: i < trend.length - 1 ? `1px solid ${C.border}` : 'none' }}>
              <span className="text-xs" style={{ color: C.muted }}>
                {formatRoundDate(t.date)}
              </span>
              <span className="font-display text-sm" style={{ color: t.value >= 0 ? C.lime : C.red }}>
                {signed(t.value)}
              </span>
            </div>
          ))}
        </Card>
      )}
      {/* GHIN — kept at the bottom since it's reference info, not a headline stat */}
      <Card>
        <TextField
          label="GHIN #"
          value={player.ghin || ''}
          onChange={(v) => updatePlayer(player.id, { ghin: v })}
          placeholder="not set"
        />
        <div className="text-[11px] mt-1.5" style={{ color: C.faint }}>
          Used when refreshing handicaps against GHIN from a backup file.
        </div>
      </Card>
    </div>
  );
}

function PlayersTab({ settings, players, setPlayers, rounds, courses }) {
  const [form, setForm] = useState({ name: '', ghin: '', handicap: '', team: 'team1' });
  const [dashPlayerId, setDashPlayerId] = useState(null);
  const [showGhinInfo, setShowGhinInfo] = useState(false);
  const [aiTeams, setAiTeams] = useState(null);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState('');

  function addPlayer() {
    if (!form.name.trim()) return;
    setPlayers((ps) => [...ps, { id: uid(), name: form.name.trim(), ghin: form.ghin.trim(), handicap: Number(form.handicap) || 0, team: form.team }]);
    setForm({ name: '', ghin: '', handicap: '', team: 'team1' });
  }
  function updatePlayer(id, patch) {
    setPlayers((ps) => ps.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  }
  function removePlayer(id) {
    setPlayers((ps) => ps.filter((p) => p.id !== id));
  }

  async function suggestTeams() {
    setAiError('');
    setAiTeams(null);
    if (players.length < 2) {
      setAiError('Add at least 2 players first.');
      return;
    }
    setAiLoading(true);
    const list = players.map((p) => `${p.name} (handicap ${p.handicap})`).join(', ');
    const prompt = `You are helping split a golf league roster into two balanced teams for a season-long team competition, based on handicap (lower handicap = better player).
Players: ${list}.
Split them into "team1" and "team2" so the two sides are as evenly matched as possible by skill (balance the average handicap on each side). Team sizes should differ by at most 1. Every player must be used exactly once, using their exact full name as given above.
Respond with ONLY this JSON shape, no other text: {"team1": ["Full Name", ...], "team2": ["Full Name", ...], "explanation": "one upbeat sentence explaining the split"}`;
    const res = await callGeminiJSON(prompt);
    setAiLoading(false);
    if (!res.ok) {
      setAiError(res.error);
      return;
    }
    const t1 = Array.isArray(res.data.team1) ? res.data.team1 : [];
    const t2 = Array.isArray(res.data.team2) ? res.data.team2 : [];
    const covered = new Set([...t1, ...t2]);
    const missing = players.filter((p) => !covered.has(p.name));
    if (missing.length > 0 || t1.length + t2.length !== players.length) {
      setAiError("That didn't quite match your roster — give it another tap to retry.");
      return;
    }
    setAiTeams({ team1: t1, team2: t2, explanation: res.data.explanation || '' });
  }
  function applyAiTeams() {
    if (!aiTeams) return;
    const t1set = new Set(aiTeams.team1);
    setPlayers((ps) => ps.map((p) => ({ ...p, team: t1set.has(p.name) ? 'team1' : 'team2' })));
    setAiTeams(null);
  }
  function avgHandicap(names) {
    const list = players.filter((p) => names.includes(p.name));
    if (list.length === 0) return 0;
    return Math.round((list.reduce((s, p) => s + p.handicap, 0) / list.length) * 10) / 10;
  }

  const dashPlayer = dashPlayerId ? players.find((p) => p.id === dashPlayerId) : null;
  if (dashPlayer) {
    return (
      <PlayerDashboard
        settings={settings}
        player={dashPlayer}
        players={players}
        rounds={rounds || []}
        courses={courses || []}
        onBack={() => setDashPlayerId(null)}
        updatePlayer={updatePlayer}
      />
    );
  }

  return (
    <div>
      <Card>
        <div className="flex items-start justify-between mb-2">
          <div>
            <div className="font-display text-xl" style={{ color: C.text }}>
              Players
            </div>
            <p className="text-xs mt-1" style={{ color: C.muted }}>
              Quota auto-calculates as {settings.quotaBase} − handicap. Edit a handicap anytime.
            </p>
          </div>
          <GhostButton onClick={() => setShowGhinInfo((v) => !v)} color={C.lime}>
            <RotateCcw size={12} style={{ display: 'inline', marginRight: 6 }} /> Sync from GHIN
          </GhostButton>
        </div>
        <Collapse open={showGhinInfo}>
          <InfoNote>
            GHIN doesn't offer a public live sync, so this stays a two-step process: add each player's GHIN number below, export a backup (Settings tab), refresh handicaps against GHIN on your computer, then import the updated file. Quotas recalculate automatically.
          </InfoNote>
        </Collapse>

        <div className="grid grid-cols-2 gap-2 mt-2">
          <TextField label="Name" value={form.name} onChange={(v) => setForm((f) => ({ ...f, name: v }))} placeholder="Player name" />
          <TextField label="GHIN #" value={form.ghin} onChange={(v) => setForm((f) => ({ ...f, ghin: v }))} placeholder="optional" />
          <TextField label="Handicap" value={form.handicap} onChange={(v) => setForm((f) => ({ ...f, handicap: v }))} placeholder="e.g. 14" type="number" />
          <SelectField
            label="Team"
            value={form.team}
            onChange={(v) => setForm((f) => ({ ...f, team: v }))}
            options={[
              { value: 'team1', label: settings.team1Name },
              { value: 'team2', label: settings.team2Name },
            ]}
          />
        </div>
        <PrimaryButton onClick={addPlayer} style={{ marginTop: 12 }}>
          Add
        </PrimaryButton>
      </Card>

      <Card>
        <div style={{ overflowX: 'auto' }}>
          <div style={{ minWidth: 620 }}>
            <div className="grid grid-cols-7 gap-2 text-[10px] uppercase tracking-wide pb-2" style={{ color: C.muted, borderBottom: `1px solid ${C.border}` }}>
              <div className="col-span-2">Player</div>
              <div>Quota</div>
              <div>Handicap</div>
              <div>Team</div>
              <div>GHIN</div>
              <div />
            </div>
            {players.map((p) => (
              <div key={p.id} className="grid grid-cols-7 gap-2 items-center py-2" style={{ borderBottom: `1px solid ${C.border}` }}>
                <div className="col-span-2 flex items-center gap-2 min-w-0">
                  <button
                    onClick={() => setDashPlayerId(p.id)}
                    title={`Open ${p.name}'s dashboard`}
                    aria-label={`Open ${p.name}'s dashboard`}
                    className="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 tap"
                    style={{ background: C.limeSoft, color: C.lime, border: `1px solid ${C.lime}` }}
                  >
                    <BarChart size={16} />
                  </button>
                  <input
                    className="flex-1 min-w-0 bg-transparent outline-none text-sm rounded-xl px-2 py-1.5"
                    style={{ background: C.surface2, color: C.text }}
                    value={p.name}
                    onChange={(e) => updatePlayer(p.id, { name: e.target.value })}
                  />
                </div>
                <div className="font-display text-base" style={{ color: C.gold }}>
                  {quotaFromIndex(settings.quotaBase, p.handicap)}
                </div>
                <input
                  type="number"
                  className="text-sm rounded-xl px-2 py-1.5 outline-none w-full"
                  style={{ background: C.surface2, color: C.text }}
                  value={p.handicap}
                  onChange={(e) => updatePlayer(p.id, { handicap: Number(e.target.value) })}
                />
                <select
                  value={p.team}
                  onChange={(e) => updatePlayer(p.id, { team: e.target.value })}
                  className="text-xs rounded-xl px-1.5 py-1.5 outline-none w-full"
                  style={{ background: C.surface2, color: C.text }}
                >
                  <option value="team1">{settings.team1Name}</option>
                  <option value="team2">{settings.team2Name}</option>
                </select>
                <input
                  className="text-sm rounded-xl px-2 py-1.5 outline-none w-full"
                  style={{ background: C.surface2, color: C.faint }}
                  value={p.ghin}
                  onChange={(e) => updatePlayer(p.id, { ghin: e.target.value })}
                />
                <div className="flex justify-end">
                  <button
                    onClick={() => removePlayer(p.id)}
                    aria-label={`Remove ${p.name}`}
                    className="w-7 h-7 rounded-full flex items-center justify-center shrink-0 tap"
                    style={{ background: C.surface2, color: C.red }}
                  >
                    <X size={13} />
                  </button>
                </div>
              </div>
            ))}
            {players.length === 0 && (
              <div className="text-sm text-center py-6" style={{ color: C.muted }}>
                No players yet — add your first above.
              </div>
            )}
          </div>
        </div>
      </Card>

      <Card>
        <div className="flex items-center justify-between mb-1">
          <div className="font-display text-xl" style={{ color: C.text }}>
            🤖 Balanced Teams
          </div>
        </div>
        <p className="text-xs mb-3" style={{ color: C.muted }}>
          Let AI split the roster into two evenly matched teams by handicap for the season Team Battle.
        </p>
        <PrimaryButton onClick={suggestTeams} disabled={aiLoading} style={{ width: '100%', textAlign: 'center' }}>
          {aiLoading ? 'Thinking…' : '✨ Suggest Balanced Teams'}
        </PrimaryButton>
        {aiError && (
          <div className="text-xs mt-2" style={{ color: C.red }}>
            {aiError}
          </div>
        )}
        <Collapse open={!!aiTeams}>
          {aiTeams && (
            <div className="mt-3 pop-in">
              <div className="grid grid-cols-2 gap-2 mb-2">
                <div className="rounded-2xl p-3" style={{ background: C.surface2 }}>
                  <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: C.cyan }}>
                    {settings.team1Name} · avg {avgHandicap(aiTeams.team1)}
                  </div>
                  {aiTeams.team1.map((n) => (
                    <div key={n} className="text-sm" style={{ color: C.text }}>
                      {n}
                    </div>
                  ))}
                </div>
                <div className="rounded-2xl p-3" style={{ background: C.surface2 }}>
                  <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: C.pink }}>
                    {settings.team2Name} · avg {avgHandicap(aiTeams.team2)}

                    <div key={n} className="text-sm" style={{ color: C.text }}>

function GameScoreboardCard({ settings, round, course, players, patchGameData, readOnly }) {
  const game = GAME_LIBRARY.find((g) => g.id === round.gameId) || null;
  const scoring = game?.scoring || 'quota';
  const holes = roundHoles(round, course);
  const activePlayers = players;

  if (scoring === 'quota') {
    const board = activePlayers
      .map((p) => {
        const res = playerResultInRound(settings, round, p, course);
        const thru = holes.filter((h, i) => round.playerData[p.id]?.holeScores?.[i] != null).length;
        return { p, res, thru };
      })
      .sort((a, b) => (b.res ? b.res.result : -999) - (a.res ? a.res.result : -999));
    return (
      <Card>
        <div className="flex items-center justify-between mb-2">
          <div className="font-display text-lg" style={{ color: C.text }}>
            {readOnly ? 'Final Standings' : 'Live Standings'}
          </div>
        </div>
        {board.map(({ p, res, thru }, i) => (
          <div key={p.id} className="flex items-center justify-between py-2.5" style={{ borderBottom: `1px solid ${C.border}` }}>
            <div className="flex items-center gap-2 min-w-0">
              {i === 0 && res ? (
                <span className="w-5 text-center" style={{ fontSize: 14 }}>
                  🏆
                </span>
              ) : (
                <span className="font-display text-sm w-5 text-center" style={{ color: C.faint }}>
                  {i + 1}
                </span>
              )}
              <span className="text-sm truncate" style={{ color: i === 0 && res ? C.text : C.text, fontWeight: i === 0 && res ? 700 : 600 }}>
                {p.name}
              </span>
            </div>
            <div className="flex items-center gap-3 shrink-0">
              <span className="text-[11px] font-medium" style={{ color: C.muted }}>
                {res ? `${res.points} pts · q${res.quota}` : 'no scores'}
              </span>
              <span className="font-display text-lg w-10 text-right" style={{ color: res ? (res.result >= 0 ? C.lime : C.red) : C.faint }}>
                {res ? (res.result >= 0 ? '+' : '') + res.result : '–'}
              </span>
              <span className="font-display text-xs w-6 text-right" style={{ color: C.muted }}>
                {thru}
              </span>
            </div>
          </div>
        ))}
      </Card>
    );
  }

  if (scoring === 'stroke') {
    const rows = strokePlayBoard(round, course, activePlayers);
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>
          {game.name} — Total Strokes
        </div>
        {rows.map(({ p, total, thru }, i) => (
          <BoardRow key={p.id} rank={i + 1} name={p.name} value={thru > 0 ? total : '–'} sub={`thru ${thru}`} />
        ))}
      </Card>
    );
  }

  if (scoring === 'stableford') {
    const rows = stablefordBoard(round, course, activePlayers, settings);
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>
          {game.name}
        </div>
        {rows.map(({ p, total, thru }, i) => (
          <BoardRow key={p.id} rank={i + 1} name={p.name} value={thru > 0 ? total : '–'} sub={`thru ${thru}`} />
        ))}
      </Card>
    );
  }

  if (scoring === 'match') {
    if (activePlayers.length !== 2) {
      return <EmptyNote text={`${game.name} needs exactly 2 players selected for this round.`} />;
    }
    const seg = matchSegment(round, course, activePlayers, 0, holes.length);
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>
          {game.name}
        </div>
        <div className="flex items-center justify-between py-2">
          <span className="font-display text-lg" style={{ color: seg.diff > 0 ? C.gold : C.text }}>
            {seg.a.name}
          </span>
          <span className="font-display text-xs" style={{ color: C.muted }}>
            {matchLabel(seg)}
          </span>
          <span className="font-display text-lg" style={{ color: seg.diff < 0 ? C.gold : C.text }}>
            {seg.b.name}
          </span>
        </div>
      </Card>
    );
  }

  if (scoring === 'bestball') {
    const bb = bestBallMatch(round, course, activePlayers, effectivePointsBasis(round) === 'net');
    if (!bb) {
      return <EmptyNote text="Pick your two teams on the round setup screen to score Best Ball automatically." />;
    }
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>
          {game.name}
        </div>
        <div className="flex items-center justify-between py-2">
          <div className="flex-1 min-w-0">
            <div className="text-[10px] uppercase" style={{ color: C.cyan }}>
              Team A
            </div>
            {bb.t1.map((p) => (
              <div key={p.id} className="text-sm truncate" style={{ color: C.text }}>
                {p.name}
              </div>
            ))}
          </div>
          <span className="font-display text-xs px-2 text-center shrink-0" style={{ color: C.muted }}>
            {bestBallLabel(bb)}
          </span>
          <div className="flex-1 min-w-0 text-right">
            <div className="text-[10px] uppercase" style={{ color: C.pink }}>
              Team B
            </div>
            {bb.t2.map((p) => (
              <div key={p.id} className="text-sm truncate" style={{ color: C.text }}>
                {p.name}
              </div>
            ))}
          </div>
        </div>
        <div className="flex items-center justify-center gap-3 pt-2 text-[11px]" style={{ borderTop: `1px solid ${C.border}`, color: C.faint }}>
          <span>
            A won <span style={{ color: C.cyan }}>{bb.wonA}</span>
          </span>
          <span>halved {bb.halved}</span>
          <span>
            B won <span style={{ color: C.pink }}>{bb.wonB}</span>
          </span>
        </div>
      </Card>
    );
  }

  if (scoring === 'nassau') {
    if (activePlayers.length !== 2) {
      return <EmptyNote text="Nassau needs exactly 2 players selected for this round." />;
    }
    if (holes.length < 18) {
      const seg = matchSegment(round, course, activePlayers, 0, holes.length);
      return (
        <Card>
          <div className="font-display text-lg mb-2" style={{ color: C.text }}>
            Nassau (single match — needs 18 holes for all 3 bets)
          </div>
          <div className="flex items-center justify-between py-2">
            <span className="font-display text-base" style={{ color: seg.diff > 0 ? C.gold : C.text }}>
              {seg.a.name}
            </span>
            <span className="font-display text-xs" style={{ color: C.muted }}>
              {matchLabel(seg)}
            </span>
            <span className="font-display text-base" style={{ color: seg.diff < 0 ? C.gold : C.text }}>
              {seg.b.name}
            </span>
          </div>
        </Card>
      );
    }
    const front = matchSegment(round, course, activePlayers, 0, 9);
    const back = matchSegment(round, course, activePlayers, 9, 18);
    const overall = matchSegment(round, course, activePlayers, 0, 18);
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>
          Nassau
        </div>
        {[
          ['Front 9', front],
          ['Back 9', back],
          ['Overall', overall],
        ].map(([label, seg]) => (
          <div key={label} className="py-2" style={{ borderBottom: `1px solid ${C.border}` }}>
            <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: C.muted }}>
              {label}
            </div>
            <div className="flex items-center justify-between">
              <span className="font-display text-sm" style={{ color: seg.diff > 0 ? C.gold : C.text }}>
                {seg.a.name}
              </span>
              <span className="font-display text-xs" style={{ color: C.muted }}>
                {matchLabel(seg)}
              </span>
              <span className="font-display text-sm" style={{ color: seg.diff < 0 ? C.gold : C.text }}>
                {seg.b.name}
              </span>
            </div>
          </div>
        ))}
      </Card>
    );
  }

  if (scoring === 'nines') {
    if (activePlayers.length !== 3) {
      return <EmptyNote text="Nines needs exactly 3 players selected for this round." />;
    }
    const { pts, thru } = ninesBoard(round, course, activePlayers);
    const rows = activePlayers.map((p) => ({ p, pts: pts[p.id] })).sort((a, b) => b.pts - a.pts);
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>
          Nines (5-3-1)
        </div>
        {rows.map(({ p, pts: v }, i) => (
          <BoardRow key={p.id} rank={i + 1} name={p.name} value={v} sub={`thru ${thru}`} />
        ))}
      </Card>
    );
  }

  if (scoring === 'wolf') {
    const { pts, thru } = wolfBoard(round, course, activePlayers);
    const rows = activePlayers.map((p) => ({ p, pts: pts[p.id] })).sort((a, b) => b.pts - a.pts);
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>
          Wolf
        </div>
        {rows.map(({ p, pts: v }, i) => (
          <BoardRow key={p.id} rank={i + 1} name={p.name} value={v} sub={`thru ${thru}`} />
        ))}
      </Card>
    );
  }

  if (scoring === 'bbb') {
    const pts = bbbBoard(round, activePlayers);
    const rows = activePlayers.map((p) => ({ p, pts: pts[p.id] })).sort((a, b) => b.pts - a.pts);
    return (
      <Card>
        <div className="font-display text-lg mb-2" style={{ color: C.text }}>
          Bingo Bango Bongo
        </div>
        {rows.map(({ p, pts: v }, i) => (
          <BoardRow key={p.id} rank={i + 1} name={p.name} value={v} />
        ))}
      </Card>
    );
  }

  if (scoring === 'skins') {
    const skinsRound = { ...round, entryMode: 'holebyhole', skinsOptIn: activePlayers.map((p) => p.id) };
    const skins = computeSkinsForRound(skinsRound, activePlayers, course, { ...settings, skinsBuyIn: settings.skinsBuyIn || 5 });
    if (!skins) return <EmptyNote text="Skins needs at least 2 players and a skins buy-in above $0 (set in Settings)." />;
    const rows = skins.players.map((p) => ({ p, count: skins.tally[p.id], pay: skins.payouts[p.id] })).sort((a, b) => b.count - a.count);
    return (
      <Card>
        <div className="flex items-center justify-between mb-2">
          <div className="font-display text-lg" style={{ color: C.text }}>
            Skins
          </div>
          <StatTile label="Pot" value={`$${skins.pot}`} />
        </div>
        {rows.map(({ p, count, pay }) => (
          <div key={p.id} className="flex items-center justify-between py-1.5" style={{ borderBottom: `1px solid ${C.border}` }}>
            <span style={{ color: count > 0 ? C.text : C.muted, fontWeight: count > 0 ? 600 : 400 }}>{p.name}</span>
            <span className="font-display text-sm" style={{ color: count > 0 ? C.gold : C.faint }}>
              {count} skin{count === 1 ? '' : 's'} · ${pay.toFixed(2)}
            </span>
          </div>
        ))}
        {skins.carry > 0 && (
          <div className="text-[11px] mt-2" style={{ color: C.orange }}>
            {skins.carry} skin{skins.carry > 1 ? 's' : ''} still carrying (thru {skins.thru})
          </div>
        )}
      </Card>
    );
  }

  // manual tally — for formats without a dedicated automatic engine
  const tally = round.gameData?.manualTally || {};
  const pairing = round.gameData?.pairing || null;
  function bumpTally(playerId, delta) {
    patchGameData(round.id, { manualTally: { ...tally, [playerId]: (tally[playerId] || 0) + delta } });
  }
  const rows = activePlayers.map((p) => ({ p, v: tally[p.id] || 0 })).sort((a, b) => b.v - a.v);
  return (
    <Card>
      <div className="font-display text-lg mb-1" style={{ color: C.text }}>
        {game ? `${game.name} — Manual Tally` : 'Manual Tally'}
      </div>
      {pairing && (
        <div className="rounded-2xl p-3 mb-3" style={{ background: C.surface2 }}>
          <div className="text-[10px] uppercase tracking-wide mb-2" style={{ color: C.lime }}>
            🤖 AI Pairings
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div>
              <div className="text-[10px] uppercase" style={{ color: C.cyan }}>
                Team A{pairing.strokesTeam1 > 0 ? ` (+${pairing.strokesTeam1})` : ''}
              </div>
              {pairing.team1.map((n) => (
                <div key={n} className="text-sm" style={{ color: C.text }}>
                  {n}
                </div>
              ))}
            </div>
            <div>
              <div className="text-[10px] uppercase" style={{ color: C.pink }}>
                Team B{pairing.strokesTeam2 > 0 ? ` (+${pairing.strokesTeam2})` : ''}
              </div>
              {pairing.team2.map((n) => (
                <div key={n} className="text-sm" style={{ color: C.text }}>
                  {n}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
      {!readOnly && (
        <p className="text-xs mb-2" style={{ color: C.muted }}>
          No automatic engine for this format yet — tap +/− to track it by hand as you play. Check "Rules" above for how to score it.
        </p>
      )}
      {rows.map(({ p, v }) => (
        <div key={p.id} className="flex items-center justify-between py-1.5" style={{ borderBottom: `1px solid ${C.border}` }}>
          <span className="text-sm" style={{ color: C.text }}>
            {p.name}
          </span>
          {readOnly ? (
            <span className="font-display text-base" style={{ color: C.text }}>
              {v}
            </span>
          ) : (
            <div className="flex items-center gap-3">
              <button onClick={() => bumpTally(p.id, -1)} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background: C.surface2, color: C.text }}>
                <Minus size={12} />
              </button>
              <span className="w-8 text-center font-display text-base" style={{ color: C.text }}>
                {v}
              </span>
              <button onClick={() => bumpTally(p.id, 1)} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background: C.lime, color: C.onAccent }}>
                <Plus size={12} />
              </button>
            </div>
          )}
        </div>
      ))}
    </Card>
  );
}

function CourseLogo({ course }) {
  if (!course || course.id !== 'pine-tree-cc-al') return null;
  return (
    <div
      style={{
        background: '#FFFFFF',
        borderRadius: 16,
        padding: '10px 16px',
        boxShadow: `0 4px 16px ${C.shadow}`,
        display: 'inline-flex',
        alignItems: 'center',
        flexShrink: 0,
      }}
    >
      <img
        src={PINE_TREE_LOGO}
        alt="Pine Tree Golf & Country Club"
        style={{ height: 64, width: 'auto', display: 'block' }}
      />
    </div>
  );

function RoundPhotoBanner({ course }) {
  if (!course || course.id !== 'pine-tree-cc-al') return null;
  return (
    <div
      style={{
        marginLeft: -16,
        marginRight: -16,
        marginBottom: 12,
        overflow: 'hidden',
        borderRadius: '0 0 20px 20px',
      }}
    >
      <img
        src={PINE_TREE_BANNER}
        alt="Pine Tree Golf & Country Club"
        style={{ width: '100%', height: 150, objectFit: 'cover', display: 'block' }}
      />
    </div>
  );
}

function BestBallHoleResult({ round, course, players, holeIdx, net }) {
  const bb = bestBallMatch(round, course, players, net);
  if (!bb) {
    return (
      <Card>
        <div className="text-xs" style={{ color: C.orange }}>
          Set your Best Ball teams on the round setup screen to score this hole automatically.
        </div>
      </Card>
    );
  }
  const hr = bb.perHole[holeIdx];
  const leadTxt = bb.diff === 0 ? 'All Square' : `Team ${bb.diff > 0 ? 'A' : 'B'} ${Math.abs(bb.diff)} UP`;
  const side = (label, col, res, isWin) => (
    <div
      className="flex-1 rounded-2xl p-2.5 text-center"
      style={{ background: isWin ? C.limeSoft : C.surface2, border: `1px solid ${isWin ? C.lime : C.border}` }}
    >
      <div className="text-[10px] uppercase tracking-wide" style={{ color: col }}>
        Team {label}
      </div>
      <div className="font-display text-2xl leading-none mt-0.5" style={{ color: res.val == null ? C.faint : C.text }}>
        {res.val == null ? '—' : res.val}
      </div>
      <div className="text-[10px] mt-0.5 truncate" style={{ color: C.faint }}>
        {res.who ? res.who.name : 'waiting'}
      </div>
    </div>
  );
  return (
    <Card>
      <div className="flex items-center justify-between mb-2">
        <div className="font-display text-sm" style={{ color: C.lime }}>
          BEST BALL — HOLE {holeIdx + 1}
        </div>
        <div className="font-display text-xs" style={{ color: C.muted }}>
          {leadTxt}
        </div>
      </div>
      <div className="flex items-stretch gap-2">
        {side('A', C.cyan, hr.a, hr.winner === 'team1')}
        <div className="flex items-center justify-center px-1">
          <span className="font-display text-xs" style={{ color: C.faint }}>
            vs
          </span>
        </div>
        {side('B', C.pink, hr.b, hr.winner === 'team2')}
      </div>
      <div className="text-center text-[11px] mt-2" style={{ color: hr.winner ? C.text : C.faint }}>
        {hr.winner === 'team1'
          ? 'Team A wins the hole'
          : hr.winner === 'team2'
          ? 'Team B wins the hole'
          : hr.winner === 'halved'
          ? 'Hole halved'
          : 'Enter a score for each team to settle this hole'}
      </div>
      <div className="text-center text-[10px] mt-1" style={{ color: C.faint }}>
        {bb.wonA} A · {bb.halved} halved · {bb.wonB} B{net ? ' · net scoring' : ''}
      </div>
    </Card>
  );
}

function LiveTicker({ settings, round, course, players }) {
  const holes = roundHoles(round, course);
  const net = effectivePointsBasis(round) !== 'gross';
  const usePoints = settings.tickerBasis === 'points';

  let rows;
  if (usePoints) {
    rows = players
      .map((p) => {
        const res = playerResultInRound(settings, round, p, course);
        const thru = holes.filter((h, i) => grossOf(round, p.id, i) != null).length;
        return { p, thru, res };
      })
      .filter((r) => r.thru > 0 && r.res)
      .sort((a, b) => b.res.result - a.res.result || b.thru - a.thru);
  } else {
    rows = players
      .map((p) => {
        let eff = 0;
        let parSum = 0;
        let thru = 0;
        holes.forEach((h, i) => {
          const g = grossOf(round, p.id, i);
          if (g == null) return;
          thru++;
          eff += net ? g - strokesThisHole(round, p, course, i) : g;
          parSum += h.par;
        });
        return { p, thru, toPar: eff - parSum };
      })
      .filter((r) => r.thru > 0)
      .sort((a, b) => a.toPar - b.toPar || b.thru - a.thru);
  }

  if (rows.length === 0) return null;

  const signed = (n) => (n > 0 ? `+${n}` : `${n}`);
  const fmtToPar = (n) => (n === 0 ? 'E' : signed(n));

  const Run = () => (
    <div className="flex items-center shrink-0">
      {rows.map((r, i) => {
        const good = usePoints ? r.res.result >= 0 : r.toPar <= 0;
        return (
          <span key={r.p.id} className="flex items-center whitespace-nowrap" style={{ paddingRight: 22 }}>
            <span className="font-display text-[11px]" style={{ color: i === 0 ? C.gold : C.faint, minWidth: 14 }}>
              {i + 1}
            </span>
            <span className="text-[12px] font-semibold ml-1.5" style={{ color: C.text }}>
              {r.p.name}
            </span>
            <span className="font-display text-[12px] ml-1.5" style={{ color: good ? C.lime : C.orange }}>
              {usePoints ? signed(r.res.result) : fmtToPar(r.toPar)}
            </span>
            {usePoints && (
              <span className="text-[10px] ml-1.5" style={{ color: C.faint }}>
                {r.res.points} pts
              </span>
            )}
            <span className="text-[10px] ml-1.5" style={{ color: C.faint }}>
              thru {r.thru}
            </span>
          </span>
        );
      })}
    </div>
  );

  // Rendered through a portal on document.body: an ancestor with any transform
  // (the .tab-fade-in wrapper keeps translateY(0) because of animation-fill-mode: both)
  // becomes the containing block for position:fixed, which would strand this bar
  // at the bottom of the scrolling content instead of the viewport.
  return ReactDOM.createPortal(
    <div style={{ position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 50, pointerEvents: 'none' }}>
      <div style={{ maxWidth: 480, margin: '0 auto', pointerEvents: 'auto' }}>
        <div
          className="flex items-center"
          style={{
            background: C.surface2,
            borderTop: `1px solid ${C.border}`,
            height: 38,
            paddingLeft: 10,
            paddingRight: 10,
            paddingBottom: 'env(safe-area-inset-bottom, 0px)',
            boxSizing: 'content-box',
          }}
        >
          <span
            className="font-display text-[9px] uppercase tracking-wider shrink-0 px-1.5 py-0.5 rounded mr-2"
            style={{ background: C.lime, color: C.onAccent }}
          >
            {usePoints ? 'vs Quota' : net ? 'Net' : 'Gross'}
          </span>
          <div className="flex-1 overflow-hidden">
            <div className="ticker-track">
              <Run />
              <Run />
            </div>
          </div>
        </div>
      </div>
    </div>,
    document.body
  );
}

function RoundTimer({ startedAt }) {
  const [now, setNow] = useState(() => Date.now());
  useEffect(() => {
    const iv = setInterval(() => setNow(Date.now()), 30000);
    return () => clearInterval(iv);
  }, []);
  if (!startedAt) return null;
  const ms = Math.max(0, now - new Date(startedAt).getTime());
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  const label = h > 0 ? `${h}h ${m}m` : `${m}m`;
  return (
    <div className="flex items-center gap-1 shrink-0 px-2 py-1 rounded-full" style={{ background: C.surface2, color: C.muted }}>
      <Clock size={12} />
      <span className="text-[11px] font-semibold">{label}</span>
    </div>
  );
}

function LiveScoring({ settings, round, players, course, patchRound, setHoleScore, toggleTrashItem, patchGameData, onBackToSetup, onFinish }) {
  const holes = roundHoles(round, course);
  const activePlayers = roundPlayerList(round, players);
  const holeIdx = Math.min(round.currentHole || 0, holes.length - 1);
  const hole = holes[holeIdx];
  const net = effectivePointsBasis(round) === 'net';
  const [showRules, setShowRules] = useState(false);
  const [revealStandings, setRevealStandings] = useState(false);

  // Default every player to par as soon as a hole is opened, so a par round takes zero taps.
  useEffect(() => {
    activePlayers.forEach((p) => {
      if (round.playerData[p.id]?.holeScores?.[holeIdx] == null) {
        setHoleScore(round.id, p.id, holeIdx, hole.par);
      }
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [holeIdx, round.id]);

  function setHole(i) {
    patchRound(round.id, { currentHole: i });
  }
  function bump(playerId, delta) {
    const cur = round.playerData[playerId]?.holeScores?.[holeIdx];
    const base = cur == null ? hole.par : cur;
    setHoleScore(round.id, playerId, holeIdx, Math.max(1, base + delta));
  }
  function resetToPar(playerId) {
    setHoleScore(round.id, playerId, holeIdx, hole.par);
  }

  const allScoredThisHole = activePlayers.length > 0 && activePlayers.every((p) => round.playerData[p.id]?.holeScores?.[holeIdx] != null);

  const game = GAME_LIBRARY.find((g) => g.id === round.gameId) || null;
  const showDogfightInfo = !game || game.scoring === 'quota';

  const standingsHidden = settings.hideLiveStandings && !revealStandings;
  const tickerOn = settings.showLiveTicker !== false && !standingsHidden;

  return (

          ← Round setup

          <RoundTimer startedAt={round.startedAt} />
          {round.casual && (
            <span className="shrink-0 px-2 py-0.5 rounded-full text-[10px] font-bold" style={{ background: C.surface2, color: C.cyan, border: `1px solid ${C.cyan}` }}>

              </span>
              {isQuotaRound(round) ? (
                // No toggle on a quota round — gross is the only correct basis,
                // so offering a switch that gets overridden would be a lie.
                <span
                  className="px-3 py-1 rounded-full text-[11px] font-bold uppercase flex items-center gap-1"
                  style={{ background: C.limeSoft, color: C.lime, border: `1px solid ${C.lime}` }}
                  title="Quota games are always scored gross — your quota already accounts for your handicap."
                >

                </span>
              ) : (
                <div className="flex rounded-full p-0.5" style={{ background: C.surface2 }}>
                  {['gross', 'net'].map((v) => (
                    <button
                      key={v}
                      onClick={() => patchRound(round.id, { pointsBasis: v })}
                      className="px-3 py-1 rounded-full text-[11px] font-bold uppercase"
                      style={{ background: (round.pointsBasis || 'net') === v ? C.lime : 'transparent', color: (round.pointsBasis || 'net') === v ? C.onAccent : C.muted }}
                    >
                      {v}
                    </button>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      </div>

      {game && (
        <div className="mb-3">
          <button
            onClick={() => setShowRules((v) => !v)}
            className="w-full flex items-center justify-between rounded-2xl px-3 py-2.5 tap"
            style={{ background: C.limeSolid, border: `1.5px solid ${C.lime}` }}

            holeIdx={holeIdx}

          const gross = round.playerData[p.id]?.holeScores?.[holeIdx];
          const eff = gross != null ? (net ? gross - strokes : gross) : null;
          const pts = eff != null ? stablefordPoints(eff, hole.par, settings) : null;
          const toPar = gross != null ? gross - hole.par : null;
          const toParLabel = toPar == null ? '' : toPar === 0 ? 'E' : toPar > 0 ? `+${toPar}` : `${toPar}`;
          return (

                        : strokes > 0
                        ? `Gets ${strokes} stroke${strokes > 1 ? 's' : ''} here`
                        : 'No stroke this hole'
                      : strokes > 0
                      ? `Gets ${strokes} stroke${strokes > 1 ? 's' : ''} here`
                      : 'No stroke this hole'}

                </div>
                <div className="flex items-center gap-2.5 shrink-0">

                    onClick={() => bump(p.id, -1)}

                    style={{ width: 46, height: 46, background: C.surface2, color: C.text, border: `1px solid ${C.border}` }}
                  >
                    <Minus size={18} />
                  </button>
                  <button onClick={() => resetToPar(p.id)} className="text-center" style={{ width: 46 }}>
                    <span key={gross ?? 'par'} className="inline-block font-display pop-in leading-none" style={{ color: C.lime, fontSize: 34, fontWeight: 700 }}>
                      {gross ?? hole.par}

                    <div className="text-[10px] font-bold leading-none mt-0.5" style={{ color: toPar == null ? C.faint : toPar <= 0 ? C.lime : C.orange }}>

                  </button>
                  <button
                    onClick={() => bump(p.id, 1)}

                    style={{ width: 46, height: 46, background: C.lime, color: C.onAccent, border: `1px solid ${C.lime}` }}
                  >

      </div>
      <div className="text-[11px] text-center mb-3" style={{ color: C.faint }}>
        Defaults to par — tap +/− to adjust, tap the score to reset it
      </div>

      {game?.scoring === 'bestball' && <BestBallHoleResult round={round} course={course} players={activePlayers} holeIdx={holeIdx} net={net} />}

      {(round.trashOptIn || []).length > 0 && settings.trashValue > 0 && (
        <Card>
          <div className="font-display text-sm mb-2" style={{ color: C.lime }}>
            TRASH — this hole
          </div>
          {activePlayers
            .filter((p) => (round.trashOptIn || []).includes(p.id))
            .map((p) => {
              const marks = round.trash?.[holeIdx]?.[p.id] || {};
              const score = round.playerData[p.id]?.holeScores?.[holeIdx];
              const isBirdie = score != null && score <= hole.par - 1;
              return (
                <div key={p.id} className="flex items-center justify-between gap-2 py-1.5 flex-wrap" style={{ borderBottom: `1px solid ${C.border}` }}>
                  <span className="text-sm truncate" style={{ color: C.text }}>
                    {p.name}
                  </span>
                  <div className="flex items-center gap-1.5 shrink-0 flex-wrap justify-end">
                    {isBirdie && (
                      <span className="px-2 py-1 rounded-full text-[10px] font-bold" style={{ background: C.goldSoft, color: C.gold }}>
                        BIRDIE
                      </span>
                    )}
                    {TRASH_TYPES.filter((t) => !t.par3Only || hole.par === 3).map((t) => {
                      const on = !!marks[t.id];
                      return (
                        <button
                          key={t.id}
                          onClick={() => toggleTrashItem(round.id, holeIdx, p.id, t.id)}
                          className="px-2 py-1 rounded-full text-[10px] font-bold tap"
                          style={{
                            background: on ? C.lime : C.surface2,
                            color: on ? C.onAccent : C.muted,
                            border: `1px solid ${on ? C.lime : C.border}`,
                          }}
