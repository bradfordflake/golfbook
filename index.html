    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
function saveCloudConfig(cfg) {
  try {
    localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cfg));
  } catch (e) {}
}
function clearCloudConfig() {
  try {
    localStorage.removeItem(CLOUD_CONFIG_KEY);
  } catch (e) {}
}
function normalizeLeagueId(value, useBuiltInProject = false) {
  const cleaned = String(value || '').trim().replace(/\//g, '-');
  const equivalentToDefault =
    cleaned.replace(/[\s-]+/g, ' ').toLowerCase() === DEFAULT_LEAGUE_ID.toLowerCase();
  return useBuiltInProject && equivalentToDefault ? DEFAULT_LEAGUE_ID : cleaned;
}

      a = after[key];
    if (JSON.stringify(b) !== JSON.stringify(a)) {

// Seeded players get a STABLE id derived from their name. uid() was used here
// before, which meant every fresh load minted 14 brand-new ids for the same 14
// people — and since all devices share one cloud league by default, each one
// pushed its own copy up. Deterministic ids make the seed idempotent: repeated
// seeds write to the same 14 documents and overwrite rather than accumulate.
function seedPlayerId(name) {
  return 'seed-' + String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function makeDefaultPlayers() {
  return SAMPLE_PLAYERS.map((p, i) => ({ id: seedPlayerId(p.name), name: p.name, ghin: p.ghin, handicap: p.handicap, team: i % 2 === 0 ? 'team1' : 'team2' }));
}

// ---------- duplicate player cleanup ----------
function normalizePlayerName(n) {
  return String(n || '').trim().toLowerCase().replace(/\s+/g, ' ');
}
// Recursively rewrite any player id that appears as an object key or a string
// value. Deliberately generic so it covers playerIds, playerData, skinsOptIn,
// trashOptIn, trash[hole][playerId], gameData picks and availability[date][playerId]
// without needing to enumerate every shape by hand.
function remapPlayerIds(value, idMap) {
  if (Array.isArray(value)) {
    const out = [];
    const seen = new Set();
    value.forEach((v) => {
      const mapped = typeof v === 'string' && idMap[v] ? idMap[v] : remapPlayerIds(v, idMap);
      if (typeof mapped === 'string') {
        if (seen.has(mapped)) return; // collapse ids that just became identical
        seen.add(mapped);
      }
      out.push(mapped);
    });
    return out;
  }
  if (value && typeof value === 'object') {
    const out = {};
    // Process survivors (unmapped keys) first so that when a duplicate collides
    // with the keeper, the keeper's real data wins instead of being overwritten.
    const keys = Object.keys(value).sort((a, b) => (idMap[a] ? 1 : 0) - (idMap[b] ? 1 : 0));
    keys.forEach((k) => {
      const nk = idMap[k] || k;
      if (Object.prototype.hasOwnProperty.call(out, nk)) return;
      out[nk] = remapPlayerIds(value[k], idMap);
    });
    return out;
  }
  if (typeof value === 'string' && idMap[value]) return idMap[value];
  return value;
}
// True if this round holds actual scoring data for the given player id.
function hasRoundData(round, id) {
  const pd = round && round.playerData ? round.playerData[id] : null;
  if (!pd) return false;
  if (pd.points != null) return true;
  const hs = pd.holeScores || {};
  return Object.keys(hs).some((k) => hs[k] != null);
}
// Groups players by name and picks the copy with the most existing references
// as the survivor, so the record actually tied to your rounds is the one kept.
// Also reports conflicts: rounds where two copies of one person BOTH carry
// scores, which is the only situation where merging has to discard something.
function planPlayerDedupe(players, rounds, availability) {
  const roundList = rounds || [];
  const haystack = JSON.stringify({ rounds: roundList, availability: availability || {} });
  const refCount = (id) => haystack.split(id).length - 1;
  const groups = {};
  players.forEach((p) => {
    const k = normalizePlayerName(p.name);
    if (!k) return;
    (groups[k] = groups[k] || []).push(p);
  });
  const idMap = {};
  const merges = [];
  const conflicts = [];
  Object.keys(groups).forEach((k) => {
    const list = groups[k];
    if (list.length < 2) return;
    const ranked = [...list].sort((a, b) => refCount(b.id) - refCount(a.id));
    const keeper = ranked[0];
    const dupes = ranked.slice(1);
    dupes.forEach((d) => {
      idMap[d.id] = keeper.id;
    });
    roundList.forEach((r) => {
      const scored = list.filter((p) => hasRoundData(r, p.id));
      if (scored.length > 1) {
        conflicts.push({ name: keeper.name, roundId: r.id, date: r.date, copies: scored.length });
      }
    });
    merges.push({ name: keeper.name, keeperId: keeper.id, removed: dupes.length });
  });
  return { idMap, merges, conflicts, removeCount: Object.keys(idMap).length };
}

// ---------- helpers ----------
function uid() {
  return Math.random().toString(36).slice(2, 9);
}
function roundHalfDown(x) {
  return Math.ceil(x - 0.5);
}
function quotaFromIndex(quotaBase, handicap) {
  return roundHalfDown(quotaBase - handicap);
}
function courseParTotal(course, n) {
  return course.holes.slice(0, n).reduce((s, h) => s + h.par, 0);
}

      style={{
        width: size + 7,

        border: `1.5px solid ${color}`,

      .map((id) => snapshot.players?.[id])
      .filter(Boolean)

        id: stored.playerId,

    // includes (rating - par), so relative strokes stay correct across a
    // mixed-tee group without any extra adjustment.

  let thru = 0;

    const b = bestFor(t2, i);

function ninesBoard(round, course, players, net = false) {

function fixedTeamData(round, players) {

function vegasBoard(round, course, players, net = false) {
  const teams = fixedTeamData(round, players);
  if (!teams || teams.t1.length !== 2 || teams.t2.length !== 2) return null;
  const holes = roundHoles(round, course);
  const birdieFlip = !!round.gameData?.vegasBirdieFlip;

  let thru = 0;
  const numberFor = (values, forceHighFirst) => {
    const low = Math.min(...values);
    const high = Math.max(...values);

  };
  for (let i = 0; i < holes.length; i++) {
    const aValues = teams.t1.map((p) => effectiveHoleScore(round, p, course, i, net));
    const bValues = teams.t2.map((p) => effectiveHoleScore(round, p, course, i, net));
    if (aValues.some((v) => v == null) || bValues.some((v) => v == null)) break;

    thru = i + 1;

function sixesBoard(round, course, players, net = false) {
  if (players.length !== 4) return null;
  const holes = roundHoles(round, course);
  const [a, b, c, d] = players;
  const segmentSize = Math.max(1, Math.floor(holes.length / 3));
  const rotations = [
    { start: 0, end: segmentSize, t1: [a, b], t2: [c, d] },
    { start: segmentSize, end: segmentSize * 2, t1: [a, c], t2: [b, d] },
    { start: segmentSize * 2, end: holes.length, t1: [a, d], t2: [b, c] },
  ];

    let diff = 0;
    let thru = 0;
    let clinched = false;
    const perHole = [];
    for (let i = segment.start; i < segment.end; i++) {
      const av = segment.t1.map((p) => effectiveHoleScore(round, p, course, i, net));
      const bv = segment.t2.map((p) => effectiveHoleScore(round, p, course, i, net));
      if (av.some((v) => v == null) || bv.some((v) => v == null)) break;
      const aBest = Math.min(...av);
      const bBest = Math.min(...bv);
      let winner = 'halved';
      if (aBest < bBest) { diff++; winner = 'sideA'; }
      else if (bBest < aBest) { diff--; winner = 'sideB'; }
      thru++;
      perHole.push({ hole: i + 1, winner, statusAfter: diff });
      if (segment.end - segment.start - thru > 0 && Math.abs(diff) > segment.end - segment.start - thru) {
        clinched = true;
        break;
      }
    }
    const complete = thru === segment.end - segment.start;
    const settled = complete || clinched;

      else if (diff < 0) segment.t2.forEach((p) => { playerPoints[p.id] += 1; });
      else players.forEach((p) => { playerPoints[p.id] += 0.5; });

function rabbitBoard(round, course, players, net = false) {
  const holes = roundHoles(round, course);
  const directTransfer = round.gameData?.rabbitMode === 'direct';
  const legs = [];
  let holder = null;
  let needsRecapture = false;
  let thru = 0;
  let currentLeg = null;
  for (let i = 0; i < holes.length; i++) {
    if (i === 0 || i === 9) {
      currentLeg = { start: i, end: Math.min(i + 9, holes.length), winnerId: null, holderId: null };
      legs.push(currentLeg);
      holder = null;
      needsRecapture = false;
    }
    const values = players.map((p) => ({ p, value: effectiveHoleScore(round, p, course, i, net) }));
    if (values.some((x) => x.value == null)) break;
    thru = i + 1;
    const best = Math.min(...values.map((x) => x.value));
    const winners = values.filter((x) => x.value === best);
    const winnerId = winners.length === 1 ? winners[0].p.id : null;
    if (winnerId) {
      if (directTransfer) {
        holder = winnerId;
      } else if (!holder) {
        holder = winnerId;
        needsRecapture = false;
      } else if (holder !== winnerId) {
        holder = null;
        needsRecapture = true;
      } else if (needsRecapture) {
        holder = winnerId;
        needsRecapture = false;
      }
    }
    currentLeg.holderId = holder;
    if (i === currentLeg.end - 1) currentLeg.winnerId = holder;
  }
  if (currentLeg && thru > 0 && thru < currentLeg.end) currentLeg.holderId = holder;
  const legWins = Object.fromEntries(players.map((p) => [p.id, 0]));
  legs.forEach((leg) => { if (leg.winnerId) legWins[leg.winnerId]++; });

  const handicaps = team.map((p) => Math.max(0, courseHandicapFor(round, p, course))).sort((a, b) => a - b);

function teamScoreBoard(round, course, players, net = false) {
  const teams = fixedTeamData(round, players);
  if (!teams) return null;

  const scores = round.gameData?.teamScores || {};

    let thru = 0;
    let parPlayed = 0;

      if (value == null) return;

      gross += value;

function shambleBoard(round, course, players, net = false) {
  const teams = fixedTeamData(round, players);
  if (!teams) return null;
  const holes = roundHoles(round, course);
  const count = Math.max(1, Math.min(2, Number(round.gameData?.shambleCount) || 1));
  const rows = [
    { id: 'team1', players: teams.t1, name: teams.name1 },
    { id: 'team2', players: teams.t2, name: teams.name2 },
  ].map((team) => {
    let total = 0;
    let thru = 0;
    holes.forEach((hole, i) => {
      const values = team.players.map((p) => effectiveHoleScore(round, p, course, i, net));
      if (values.some((v) => v == null)) return;
      total += [...values].sort((a, b) => a - b).slice(0, Math.min(count, values.length)).reduce((sum, value) => sum + value, 0);
      thru++;
    });
    return { ...team, total, thru };
  });
  return { ...teams, rows, count, thru: Math.min(rows[0].thru, rows[1].thru) };
}

function snakeBoard(round, players) {
  const events = [...(round.gameData?.snakeEvents || [])].sort((a, b) => a.holeIdx - b.holeIdx || String(a.at).localeCompare(String(b.at)));
  const counts = Object.fromEntries(players.map((p) => [p.id, 0]));
  let holderId = null;
  events.forEach((event) => {
    if (!players.some((p) => p.id === event.playerId)) return;
    holderId = event.playerId;
    counts[event.playerId] = (counts[event.playerId] || 0) + 1;
  });
  return { events, counts, holderId };
}

    const stored = immutableFinalSnapshot(round)?.eventSnapshot;
    if (!stored || stored.status !== 'complete') continue;
    if ([...(stored.roundIds || [])].sort().join('|') === wanted) return stored;

    // winner takes everything left. Anyone tied for 2nd is also refunded; if
    // the pool can't cover every refund it's shared evenly among them.
    const winners = groups[0] || [];
    const seconds = groups[1] || [];
    const refundTotal = Math.min(payoutPool, seconds.length * settings.purseBuyIn);
    let refundEach = seconds.length ? Math.floor(refundTotal / seconds.length) : 0;
    // Guard: on a short field the pot can be too thin to refund 2nd and still
    // leave the winner ahead — a full refund would literally pay the winner
    // less than the runner-up. When that happens, share what's there evenly
    // between the winner(s) and 2nd rather than inverting the finish order.
    if (seconds.length && winners.length) {
      const leftover = payoutPool - refundEach * seconds.length;
      if (Math.floor(leftover / winners.length) < refundEach) {
        refundEach = Math.floor(payoutPool / (winners.length + seconds.length));
      }
    }
    seconds.forEach((x) => (payouts[x.id] = refundEach));
    const remainder = payoutPool - refundEach * seconds.length;
    const winEach = winners.length ? Math.floor(remainder / winners.length) : 0;
    winners.forEach((x) => (payouts[x.id] = winEach));
    ranked.forEach((x) => {
      if (payouts[x.id] == null) payouts[x.id] = 0;
    });
    // Hand any rounding remainder to the outright leader so the pot balances.
    const paid = Object.values(payouts).reduce((a, b) => a + b, 0);
    if (winners.length && payoutPool - paid > 0) payouts[winners[0].id] += payoutPool - paid;
  } else {
    // Percentage splits. Ties share the combined payout for the places they
    // occupy, so nobody loses money to an arbitrary sort order.
    let placeIdx = 0;
    groups.forEach((g) => {
      let share = 0;
      for (let k = placeIdx; k < placeIdx + g.length; k++) share += settings.purseSplits[k] || 0;
      const each = Math.round((payoutPool * share) / 100 / g.length);
      g.forEach((x) => (payouts[x.id] = each));
      placeIdx += g.length;
    });
  }
  // Net profit, not gross winnings: everyone who played paid the buy-in into
  // the pot, so a player who collects less than they put in is down on the day.
  const net = {};
  ranked.forEach((x) => {
    net[x.id] = (payouts[x.id] || 0) - settings.purseBuyIn;
  });
  return { pot, rake, payoutPool, ranked, payouts, net, scoredCount: ranked.length };
}

function purseForRound(settings, round, players, course) {
  const stored = immutableFinalSnapshot(round)?.purseResults;
  if (stored) return stored;
  const scored = players.filter((p) => playerPointsInRound(settings, round, p, course) != null);
  const pot = settings.purseBuyIn * scored.length;
  const rake = scored.length > 0 ? settings.seasonRakePerRound : 0;
  const payoutPool = Math.max(0, pot - rake);
  const ranked = scored
    .map((p) => ({ id: p.id, result: playerResultInRound(settings, round, p, course).result }))
    .sort((a, b) => b.result - a.result);
  const payouts = {};
  ranked.forEach((r, i) => {
    const pct = settings.purseSplits[i] || 0;
    payouts[r.id] = Math.round((payoutPool * pct) / 100);
  });
  return { pot, rake, payoutPool, ranked, payouts, scoredCount: scored.length };
}

function snapshotSettings(settings) {

    stablefordPoints: { ...(settings.stablefordPoints || {}) },
    purseBuyIn: settings.purseBuyIn,
    purseMode: settings.purseMode,
    purseSplits: [...(settings.purseSplits || [])],
    seasonRakePerRound: settings.seasonRakePerRound,
    skinsBuyIn: settings.skinsBuyIn,
    skinsType: settings.skinsType,

}
function serializeSkinsResult(result) {

    tally: { ...result.tally },

  ranked.forEach((row, index) => {
    const place = index > 0 && row.result === lastResult ? lastPlace : index + 1;
    placements[row.id] = place;
    lastResult = row.result;
    lastPlace = place;

function buildPlayingSnapshot(settings, round, allPlayers, course, capturedAt = new Date().toISOString()) {

  const holes = roundHoles(calculationRound, course).map((hole) => ({ par: hole.par, si: hole.si }));
  const groupTee = getTee(course, round.teeName);
  const players = {};

    players[player.id] = {

      playerName: player.name,
      handicapIndex: Number(player.handicap) || 0,
      team: player.team || null,
      teeName: tee.name,
      teeRating: tee.rating,
      teeSlope: tee.slope,
      teeYards: tee.yards ?? null,
      courseHandicap: courseHandicapFor(calculationRound, player, course),
      quota: playerQuotaInRound(settings, calculationRound, player, course),

    schemaVersion: PLAYING_SNAPSHOT_SCHEMA_VERSION,
    capturedAt,
    settings: snapshotSettings(settings),
    courseId: course.id,
    courseName: course.name,
    courseLocation: course.location || '',
    defaultTee: { name: groupTee.name, rating: groupTee.rating, slope: groupTee.slope, yards: groupTee.yards ?? null },
    holes,

}
function buildFinalSnapshot(settings, round, allPlayers, course, options = {}) {

  const previous = round.finalSnapshot?.schemaVersion ? round.finalSnapshot : null;
  const calculationRound = { ...round, status: 'live', finalSnapshot: null };

  const sourceIds = Array.isArray(round.playerIds) ? round.playerIds : Object.keys(round.playerData || {});
  sourceIds.forEach((playerId) => {
    if (knownParticipantIds.has(playerId)) return;
    const pd = round.playerData?.[playerId] || {};
    participants.push({
      id: playerId,
      name: pd.playerName || `Historical player ${playerId}`,
      handicap: Number(pd.handicapIndex ?? pd.handicap) || 0,
      team: pd.team || null,
      historical: true,
      snapshotPlaceholder: true,

    .map((player) => {

      const holeScores = JSON.parse(JSON.stringify(pd.holeScores || {}));
      const grossValues = Object.values(holeScores).filter((score) => score != null && Number.isFinite(Number(score))).map(Number);
      const grossTotal = grossValues.length ? grossValues.reduce((sum, score) => sum + score, 0) : null;
      const points = playerPointsInRound(settingsAtFinal, calculationRound, player, course);
      const quota = playerQuotaInRound(settingsAtFinal, calculationRound, player, course);
      const result = points == null ? null : points - quota;
      const source = historicalPlayerRecord(calculationRound, player.id);
      const storedHandicapIndex = source?.handicapIndex ?? pd.handicapIndexAtStart ?? pd.handicapIndex ?? pd.handicap;
      const hasStoredHistoricalInput = storedHandicapIndex != null || pd.quotaAtStart != null || pd.quota != null || pd.quotaOverride != null || pd.courseHandicapAtStart != null || pd.courseHandicap != null;

        player,
        stored: {
          playerId: player.id,
          playerName: source?.playerName || player.name,
          handicapIndex: storedHandicapIndex ?? (Number(player.handicap) || 0),
          handicapSource: source ? 'captured-when-live-scoring-began' : hasStoredHistoricalInput ? 'stored-round-values' : options.migration ? 'legacy-current-displayed-profile' : 'player-profile-at-finalization',
          team: source?.team || player.team || null,
          teeName: tee.name,
          teeRating: tee.rating,
          teeSlope: tee.slope,
          teeYards: tee.yards ?? null,
          courseHandicap: courseHandicapFor(calculationRound, player, course),
          quota,
          quotaOverride: pd.quotaOverride ?? null,
          holeScores,
          grossTotal,
          stablefordPoints: points,
          totalPoints: points,
          resultVsQuota: result,
          finish: null,
          eventFinish: null,
          seasonPointsAwarded: result,
          pursePayout: 0,
          skinsWon: 0,
          trashTotal: 0,
          money: { purseNet: 0, skinsNet: 0, trashNet: 0 },
        },
      };
    });

    .filter((row) => row.stored.resultVsQuota != null)
    .map((row) => ({
      id: row.player.id,
      result: row.stored.resultVsQuota,
      points: row.stored.stablefordPoints,
      quota: row.stored.quota,
    }))
    .sort((a, b) => b.result - a.result);

  const skins = serializeSkinsResult(computeSkinsForRound(calculationRound, participants, course, settingsAtFinal));
  const trash = serializeTrashResult(computeTrashForRound(calculationRound, participants, course, settingsAtFinal));

    stored.pursePayout = purse?.payouts?.[stored.playerId] || 0;
    stored.money.purseNet = purse?.net?.[stored.playerId] ?? ((purse?.payouts?.[stored.playerId] || 0) - (purse?.scoredCount > 0 ? settingsAtFinal.purseBuyIn : 0));

    stored.money.skinsNet = skins ? (skins.payouts?.[stored.playerId] || 0) - settingsAtFinal.skinsBuyIn : 0;

      }

    schemaVersion: FINAL_SNAPSHOT_SCHEMA_VERSION,
    snapshotRevision: (previous?.snapshotRevision || 0) + 1,
    finalizedAt: round.finalizedAt || now,
    previousFinalizedAt: previous?.finalizedAt || null,
    revisedAt: previous ? now : null,
    migration: options.migration ? { migratedAt: now, assumptions } : null,
    settings: settingsAtFinal,
    source: {
      roundId: round.id,
      date: round.date,
      holes: round.holes,
      entryMode: round.entryMode,
      pointsBasis: effectivePointsBasis(calculationRound),
      combinedWith: round.combinedWith || null,
      playerIds: participants.map((player) => player.id),
      skinsOptIn: [...(round.skinsOptIn || [])],
      trashOptIn: [...(round.trashOptIn || [])],
    },
    course: {
      courseId: course.id,
      courseName: round.playingSnapshot?.courseName || course.name,
      location: round.playingSnapshot?.courseLocation || course.location || '',
      teeName: defaultTeeUsed.name,
      defaultTee: defaultTeeUsed.name,
      rating: defaultTeeUsed.rating,
      slope: defaultTeeUsed.slope,
      par: holes.reduce((sum, hole) => sum + hole.par, 0),
      holes,
      tees: (course.tees || []).map((tee) => ({ name: tee.name, rating: tee.rating, slope: tee.slope, yards: tee.yards ?? null })),
    },
    playerOrder: participants.map((player) => player.id),
    players: storedPlayers,
    standingsResults: Object.fromEntries(ranked.map((row) => [row.id, { ...row, finish: placements[row.id] }])),
    purseResults: purse ? JSON.parse(JSON.stringify(purse)) : null,
    skinsResults: skins,

}
function buildEventSnapshot(settings, event, rounds, courses, players, previous = null, finalizedAt = new Date().toISOString()) {
  const calculationRounds = rounds.map((round) =>
    round.finalSnapshot
      ? { ...round, finalSnapshot: { ...round.finalSnapshot, eventSnapshot: null } }
      : round
  );
  const eventPlayers = seasonPlayersForRounds(players, calculationRounds);
  const { ranked } = computeEventRanking(settings, event, calculationRounds, courses, eventPlayers);
  const purse = purseForEvent(settings, event, calculationRounds, courses, eventPlayers);
  const placementRows = ranked.map((row) => ({
    id: row.id,
    result: row.r.result,
    points: row.r.points,
    quota: row.r.quota,
  }));
  const placements = snapshotPlacementMap(placementRows);
  return {
    schemaVersion: FINAL_SNAPSHOT_SCHEMA_VERSION,
    snapshotRevision: (previous?.snapshotRevision || 0) + 1,
    status: 'complete',
    finalizedAt,
    previousFinalizedAt: previous?.finalizedAt || null,
    roundIds: [...event.roundIds],
    date: event.date,
    standingsResults: Object.fromEntries(
      placementRows.map((row) => [row.id, { ...row, finish: placements[row.id], seasonPointsAwarded: row.result }])
    ),
    purseResults: JSON.parse(JSON.stringify(purse)),
    settings: snapshotSettings(settings),
  };
}
function attachCompletedEventSnapshots(rounds, settings, players, courses, forceRoundId = null) {
  let next = rounds;
  const completedLeagueRounds = next.filter((round) => !round.casual && round.status === 'final' && round.finalSnapshot?.schemaVersion);
  getEvents(completedLeagueRounds).forEach((event) => {
    const eventRounds = event.roundIds.map((id) => next.find((round) => round.id === id)).filter(Boolean);
    if (eventRounds.length !== event.roundIds.length || eventRounds.some((round) => round.status !== 'final' || !round.finalSnapshot?.schemaVersion)) return;
    const waitingPartner = eventRounds.length === 1 && eventRounds[0].combinedWith
      ? next.find((round) => round.id === eventRounds[0].combinedWith && round.status !== 'final')
      : null;
    if (waitingPartner) return;
    const eventKey = [...event.roundIds].sort().join('|');
    const existing = eventRounds
      .map((round) => round.finalSnapshot.eventSnapshot)
      .find((stored) => stored?.status === 'complete' && [...(stored.roundIds || [])].sort().join('|') === eventKey);
    const forced = forceRoundId && event.roundIds.includes(forceRoundId);
    if (existing && !forced && eventRounds.every((round) => round.finalSnapshot.eventSnapshot?.status === 'complete')) return;
    const eventSnapshot = buildEventSnapshot(settings, event, next, courses, players, existing || null);
    next = next.map((round) => {
      if (!event.roundIds.includes(round.id)) return round;
      const updatedPlayers = { ...round.finalSnapshot.players };
      Object.keys(updatedPlayers).forEach((playerId) => {
        const eventResult = eventSnapshot.standingsResults[playerId];
        const stored = updatedPlayers[playerId];
        updatedPlayers[playerId] = {
          ...stored,
          eventFinish: eventResult?.finish ?? null,
          pursePayout: eventSnapshot.purseResults.payouts?.[playerId] || 0,
          money: {
            ...(stored.money || {}),
            purseNet: eventSnapshot.purseResults.net?.[playerId] || 0,
          },
        };
      });
      return {
        ...round,
        finalSnapshot: {
          ...round.finalSnapshot,
          players: updatedPlayers,
          purseResults: eventSnapshot.purseResults,
          eventSnapshot,
        },
      };
    });
  });
  return next;
}
function ensureFinalSnapshots(rounds, settings, players, courses) {
  let changed = false;
  let next = (rounds || []).map((round) => {
    if (round.casual || round.status !== 'final' || round.finalSnapshot?.schemaVersion) return round;
    const course = courses.find((candidate) => candidate.id === round.courseId) || courses[0];
    if (!course) return round;
    changed = true;
    const finalizedAt = round.finalizedAt || new Date().toISOString();
    return {
      ...round,
      finalizedAt,
      finalSnapshot: buildFinalSnapshot(settings, { ...round, finalizedAt }, players, course, { migration: true, finalizedAt }),
    };
  });
  const withEvents = attachCompletedEventSnapshots(next, settings, players, courses);
  if (withEvents !== next) changed = true;
  return { rounds: withEvents, changed };
}
function finalizeRoundCollection(rounds, roundId, settings, players, courses) {
  const target = rounds.find((round) => round.id === roundId);
  if (!target) return rounds;
  if (target.casual) return rounds.map((round) => (round.id === roundId ? { ...round, status: 'final' } : round));
  const course = courses.find((candidate) => candidate.id === target.courseId) || courses[0];
  if (!course) return rounds;
  const now = new Date().toISOString();
  const finalized = { ...target, status: 'final', finalizedAt: target.finalizedAt || now, revisionPending: false };
  finalized.finalSnapshot = buildFinalSnapshot(settings, finalized, players, course, { finalizedAt: now });
  const next = rounds.map((round) => (round.id === roundId ? finalized : round));
  return attachCompletedEventSnapshots(next, settings, players, courses, roundId);
}

// ---------- small UI primitives ----------
const IOS_GESTURE_EASING = 'cubic-bezier(0.22, 1, 0.36, 1)';
const IOS_GESTURE_SETTLE = 'cubic-bezier(0.32, 0.72, 0, 1)';

function prefersReducedMotion() {
  return typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function gestureFeedback(strength = 'light') {
  // iOS Safari does not expose the Taptic Engine to web pages. This provides
  // equivalent threshold feedback on browsers that implement vibration while
  // the visual spring remains the universal fallback.
  try {
    if (typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(strength === 'medium' ? 12 : 7);
  } catch (e) {}
}

function nextPaint(fn) {
  requestAnimationFrame(() => requestAnimationFrame(fn));
}

function currentTranslateX(element) {
  if (!element || typeof window === 'undefined') return 0;
  try {
    const transform = window.getComputedStyle(element).transform;
    if (!transform || transform === 'none') return 0;
    if (typeof DOMMatrixReadOnly !== 'undefined') return new DOMMatrixReadOnly(transform).m41 || 0;
    const values = transform.match(/matrix(?:3d)?\((.+)\)/)?.[1]?.split(',').map(Number) || [];
    return values.length === 16 ? values[12] || 0 : values[4] || 0;
  } catch (e) {
    return 0;
  }
}

function SwipeDismissDrawer({ open, onClose, children, ariaLabel = 'More menu' }) {
  const drawerRef = useRef(null);
  const backdropRef = useRef(null);
  const gestureRef = useRef(null);
  const rafRef = useRef(null);
  const settleTimerRef = useRef(null);
  const returnFocusRef = useRef(null);
  const wasOpenRef = useRef(false);

  function paint(offset) {
    const drawer = drawerRef.current;
    const backdrop = backdropRef.current;
    if (!drawer || !backdrop) return;
    const width = Math.max(1, drawer.getBoundingClientRect().width);
    const clamped = Math.max(0, Math.min(width, offset));
    const progress = clamped / width;
    drawer.style.transform = `translate3d(${clamped}px,0,0)`;
    drawer.style.boxShadow = progress > 0.96 ? 'none' : `-${Math.round(24 * (1 - progress))}px 0 ${Math.round(48 * (1 - progress))}px rgba(0,0,0,${0.45 * (1 - progress)})`;
    backdrop.style.opacity = String(1 - progress);
  }

  function closeImmediately() {
    if (settleTimerRef.current) clearTimeout(settleTimerRef.current);
    gestureRef.current = null;
    onClose();
  }

  function settle(complete, velocity = 0) {
    const drawer = drawerRef.current;
    const backdrop = backdropRef.current;
    const g = gestureRef.current;
    if (!drawer || !backdrop) {
      if (complete) onClose();
      return;
    }
    const width = Math.max(1, drawer.getBoundingClientRect().width);
    const current = Math.max(0, Math.min(width, g?.offset ?? currentTranslateX(drawer)));
    const target = complete ? width : 0;
    const distance = Math.abs(target - current);
    const speed = Math.max(0.3, Math.abs(velocity || 0));
    const reduced = prefersReducedMotion();
    const duration = reduced ? 1 : Math.max(170, Math.min(340, 155 + distance / speed * 0.1));
    drawer.style.transition = `transform ${duration}ms ${complete ? IOS_GESTURE_SETTLE : IOS_GESTURE_EASING}, box-shadow ${duration}ms ease`;
    backdrop.style.transition = `opacity ${duration}ms ease`;
    paint(target);
    settleTimerRef.current = setTimeout(() => {
      if (complete) {
        gestureFeedback('light');
        onClose();
      } else {
        drawer.style.transition = '';
        backdrop.style.transition = '';
        paint(0);
      }
      gestureRef.current = null;
    }, duration + 18);
  }

  function onPointerDown(e) {
    if (!open || e.isPrimary === false || e.button > 0) return;
    if (e.target.closest('input, textarea, select, [data-swipe-ignore="true"]')) return;
    const drawer = drawerRef.current;
    if (!drawer) return;
    if (settleTimerRef.current) clearTimeout(settleTimerRef.current);
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    const interruptedOffset = Math.max(0, currentTranslateX(drawer));
    drawer.style.transition = 'none';
    if (backdropRef.current) backdropRef.current.style.transition = 'none';
    gestureRef.current = {
      pointerId: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      startOffset: interruptedOffset,
      offset: interruptedOffset,
      lastX: e.clientX,
      lastTime: performance.now(),
      velocity: 0,
      lock: null,
      didDrag: false,
      thresholdFeedback: false,
      width: Math.max(1, drawer.getBoundingClientRect().width),

    const pointerDx = e.clientX - g.startX;
    const dy = e.clientY - g.startY;
    if (!g.lock && Math.max(Math.abs(pointerDx), Math.abs(dy)) > 9) {
      const canMoveBackLeft = g.startOffset > 0;
      g.lock = Math.abs(pointerDx) > Math.abs(dy) * 1.2 && (pointerDx > 0 || canMoveBackLeft) ? 'horizontal' : 'vertical';

        gestureRef.current = null;
        return;
      }

    }
    if (g.lock !== 'horizontal') return;
    e.preventDefault();
    const now = performance.now();
    const elapsed = Math.max(1, now - g.lastTime);
    const instantaneousVelocity = (e.clientX - g.lastX) / elapsed;
    g.velocity = g.velocity * 0.7 + instantaneousVelocity * 0.3;
    g.lastX = e.clientX;
    g.lastTime = now;
    g.offset = Math.max(0, Math.min(g.width, g.startOffset + pointerDx));
    g.didDrag = g.didDrag || Math.abs(g.offset - g.startOffset) > 8;
    const crossed = g.offset / g.width >= 0.32;
    if (crossed && !g.thresholdFeedback) {
      g.thresholdFeedback = true;

function NumStepper({ value, onChange, step = 1, min, max, decimals = 0 }) {
  const clamp = (v) => {
    let n = v;
    if (min != null) n = Math.max(min, n);
    if (max != null) n = Math.min(max, n);
    return +n.toFixed(decimals);
  };
  return (
    <div className="flex items-center gap-2">
      <button onClick={() => onChange(clamp(value - step))} className="w-7 h-7 rounded-full flex items-center justify-center shrink-0 tap" style={{ background: C.surface2, color: C.text }}>
        <Minus size={12} />
      </button>
      <span key={value} className="w-10 text-center font-display text-sm inline-block pop-in" style={{ color: C.text }}>
        {decimals ? value.toFixed(decimals) : value}

      <button onClick={() => onChange(clamp(value + step))} className="w-7 h-7 rounded-full flex items-center justify-center shrink-0 tap" style={{ background: C.surface2, color: C.text }}>
        <Plus size={12} />
      </button>
    </div>

}

function PinPrompt({ pin, title = 'Enter PIN', message, onConfirm, onCancel }) {
  const [value, setValue] = useState('');
  const [error, setError] = useState(false);
  const inputRef = useRef(null);
  useEffect(() => {
    inputRef.current?.focus();
  }, []);
  function submit() {
    if (value === pin) {
      onConfirm();

      setError(true);
      setValue('');
      inputRef.current?.focus();
    }
  }
  return (
    <div
      className="fixed inset-0 flex items-center justify-center p-4 backdrop-fade"
      style={{ background: 'rgba(0,0,0,0.75)', zIndex: 100 }}

          {message || 'League settings are PIN-protected. Enter the PIN to make changes.'}
        </p>
        <input
          ref={inputRef}
          type="tel"
          inputMode="numeric"
          pattern="[0-9]*"
          maxLength={pin.length}
          value={value}
          onChange={(e) => {
            setError(false);
            setValue(e.target.value.replace(/\D/g, '').slice(0, pin.length));
          }}
          onKeyDown={(e) => {
            if (e.key === 'Enter') submit();
          }}
          className="w-full text-center font-display outline-none rounded-xl px-3 py-3 mb-2"
          style={{ fontSize: 26, letterSpacing: '0.5em', background: C.surface2, color: C.text, border: `1.5px solid ${error ? C.red : C.border}` }}
          placeholder={'•'.repeat(pin.length)}

          </div>

          <PrimaryButton onClick={submit} disabled={value.length !== pin.length} style={{ flex: 1, textAlign: 'center' }}>

// Personal identity is device-specific. Availability is the closest thing the
// current data model has to a scheduled round, so this intentionally reports a
// player's next marked golf date rather than inventing a tee time.
function nextPlayerAvailability(availability, playerId) {
  if (!playerId) return null;
  const now = new Date();
  const todayKey = isoDate(now.getFullYear(), now.getMonth(), now.getDate());
  const dates = Object.keys(availability || {}).filter((k) => k >= todayKey).sort();
  for (const date of dates) {
    const day = availability[date] || {};
    const mine = day[playerId];
    if (!mine || (!mine.am && !mine.pm)) continue;
    const amCount = Object.values(day).filter((v) => v && v.am).length;
    const pmCount = Object.values(day).filter((v) => v && v.pm).length;
    const sessions = [];
    if (mine.am) sessions.push({ id: 'am', label: 'Morning', count: amCount });
    if (mine.pm) sessions.push({ id: 'pm', label: 'Afternoon', count: pmCount });
    return { date, sessions, bestCount: Math.max(...sessions.map((x) => x.count)) };
  }
  return null;
}

        <div style={{ position: 'absolute', left: 24, right: 24, bottom: 18 }}>
          <div className="font-display text-sm uppercase tracking-[0.12em]" style={{ color: '#C6FF3D' }}>
            {season.eventsCount > 0 ? `${season.eventsCount} event${season.eventsCount === 1 ? '' : 's'} played` : 'Season not started'}
          </div>
          <div className="font-display text-[34px] leading-none mt-1" style={{ color: '#FFFFFF', textShadow: '0 2px 8px rgba(0,0,0,0.45)' }}>
            {settings.leagueName}
          </div>
          {course && (
            <div className="text-base font-semibold mt-2" style={{ color: 'rgba(255,255,255,0.9)' }}>
              {course.name}
            </div>
          )}
        </div>
      </div>

      <button
        onClick={() => liveRound ? onResume(liveRound.id) : onBeginRound()}
        className="w-full flex items-center justify-between rounded-2xl px-4 py-4 mb-3 tap"
        style={{
          minHeight: 92,
          background: isDark
            ? 'linear-gradient(135deg, #171B12 0%, #0E120C 58%, #090B08 100%)'
            : 'linear-gradient(135deg, #0B6A35 0%, #08733A 58%, #07592E 100%)',
          border: isDark ? '1px solid rgba(198,255,61,0.52)' : '1px solid rgba(255,255,255,0.16)',
          boxShadow: isDark ? '0 8px 26px rgba(0,0,0,0.46), 0 0 18px rgba(198,255,61,0.10)' : '0 10px 28px rgba(6,93,46,0.28)',
          color: '#fff',
        }}
      >
        <div className="flex items-center gap-3 min-w-0 text-left">
          <span className="w-12 h-12 rounded-full flex items-center justify-center shrink-0" style={{ border: `2px solid ${isDark ? C.lime : '#A9E73A'}`, color: isDark ? C.lime : '#fff', background: isDark ? 'rgba(198,255,61,0.08)' : 'rgba(255,255,255,0.06)' }}>
            <FlagIcon size={25} />
          </span>
          <span className="min-w-0">
            <span className="font-display text-2xl leading-tight block truncate">
              {liveRound ? `Resume Hole ${(liveRound.currentHole || 0) + 1}` : 'Start League Round'}
            </span>
            <span className="text-sm mt-1 block truncate" style={{ color: 'rgba(255,255,255,0.78)' }}>
              {liveRound ? `${liveCourse?.name || 'Golf course'} · ${livePlayers.length} player${livePlayers.length === 1 ? '' : 's'}` : 'Set the group, tees and side games'}
            </span>
          </span>
        </div>
        {liveRound ? (
          <span className="rounded-full px-4 py-2 font-display text-sm shrink-0" style={{ background: '#B9F22F', color: '#12391F' }}>LIVE</span>
        ) : (
          <span className="font-display text-2xl shrink-0">›</span>
        )}
      </button>

      <div className="grid grid-cols-2 gap-3 mb-4">
        <button
          onClick={() => onGoTab('gamefinder')}
          className="rounded-2xl px-3 py-4 flex items-center justify-center gap-2 tap"
          style={{ ...homeCardStyle, background: C.surface, color: C.text, minHeight: 72 }}
        >
          <UsersIcon size={25} style={{ color: C.lime }} />
          <span className="font-display text-lg">Casual Round</span>
        </button>
        <button
          onClick={onLogRound}
          className="rounded-2xl px-3 py-4 flex items-center justify-center gap-2 tap"
          style={{ ...homeCardStyle, background: C.surface, color: C.text, minHeight: 72 }}
        >
          <ClipboardIcon size={24} style={{ color: C.lime }} />
          <span className="font-display text-lg">Log Scorecard</span>
        </button>
      </div>

      {!myPlayer ? (
        <Card primary>
          <div className="font-display text-lg" style={{ color: C.lime }}>Make this your dashboard</div>
          <div className="text-xs mt-1 mb-3" style={{ color: C.muted }}>
            Choose your player once. It stays on this device and does not change anyone else’s view.
          </div>
          <SelectField
            label="My player"
            value=""
            onChange={onSetMyPlayer}
            options={[{ value: '', label: 'Choose your name' }, ...players.map((p) => ({ value: p.id, label: p.name }))]}
          />
        </Card>
      ) : (
        <Card style={homeCardStyle}>
          <button onClick={() => onOpenPlayerDashboard(myPlayer.id)} className="w-full text-left tap">
            <div className="flex items-start justify-between gap-3">
              <div className="min-w-0">
                <div className="font-display text-base" style={{ color: C.lime }}>My Dashboard</div>
                <div className="font-display text-2xl truncate mt-0.5" style={{ color: C.text }}>{myPlayer.name}</div>
                <div className="text-sm mt-1" style={{ color: C.muted }}>Handicap Index {Number(myPlayer.handicap).toFixed(1)}</div>
              </div>
              <span className="w-14 h-14 rounded-full flex items-center justify-center font-display text-2xl shrink-0" style={{ background: isDark ? C.lime : '#07592E', color: isDark ? C.onAccent : '#fff', border: `3px solid ${C.surface2}`, boxShadow: isDark ? '0 0 16px rgba(198,255,61,0.18)' : 'none' }}>{initials}</span>
            </div>
            <div className="grid grid-cols-3 gap-2 mt-4">
              <div className="rounded-xl px-2 py-3 text-center" style={{ background: C.surface2 }}>
                <div className="text-[11px]" style={{ color: C.muted }}>Season Rank</div>
                <div className="font-display text-2xl mt-1" style={{ color: C.lime }}>{myRank ? ordinal(myRank) : '—'}</div>
              </div>
              <div className="rounded-xl px-2 py-3 text-center" style={{ background: C.surface2 }}>
                <div className="text-[11px]" style={{ color: C.muted }}>Season Net</div>
                <div className="font-display text-2xl mt-1" style={{ color: myMoney.total >= 0 ? C.lime : C.red }}>{moneySigned(myMoney.total)}</div>
              </div>
              <div className="rounded-xl px-2 py-3 text-center" style={{ background: C.surface2 }}>
                <div className="text-[11px]" style={{ color: C.muted }}>Last Round</div>
                {myLastGross != null && myLastResult ? (
                  <>
                    <div className="font-display mt-1 flex items-baseline justify-center gap-1.5 whitespace-nowrap">
                      <span className="text-2xl" style={{ color: C.text }}>{myLastGross}</span>
                      <span className="text-base" style={{ color: myLastResult.result >= 0 ? C.lime : C.red }}>({signed(myLastResult.result)})</span>
                    </div>
                    <div className="text-[10px] mt-0.5" style={{ color: C.muted }}>Score · quota</div>
                  </>
                ) : (
                  <div className="font-display text-2xl mt-1" style={{ color: C.faint }}>—</div>
                )}
              </div>
            </div>
          </button>
          <button onClick={() => onSetMyPlayer('')} className="w-full text-center text-[11px] font-semibold mt-3 tap" style={{ color: C.muted }}>
            Not {myPlayer.name.split(/\s+/)[0]}? Change player
          </button>
        </Card>
      )}

      {lastEvent && lastPurse && (
        <button onClick={() => onGoTab('rounds')} className="w-full text-left tap" style={{ display: 'block' }}>
          <Card style={homeCardStyle}>
            <div className="flex items-center justify-between gap-3">
              <div className="min-w-0">
                <div className="font-display text-base" style={{ color: C.lime }}>Your Last Dogfight</div>
                <div className="font-display text-xl mt-1 truncate" style={{ color: C.text }}>{myLastResult && myPlayer ? myPlayer.name : formatRoundDate(lastEvent.date)}</div>
                {myLastResult && myPlayer ? (
                  <>
                    <div className="text-xs mt-0.5" style={{ color: C.muted }}>{formatRoundDate(lastEvent.date)}</div>
                    <div className="text-sm mt-1 truncate" style={{ color: myLastResult.result >= 0 ? C.lime : C.red }}>
                      {signed(myLastResult.result)} vs quota · {myLastPlaceIndex >= 0 ? ordinal(myLastPlaceIndex + 1) : '—'} place
                      {myLastNet != null && <span style={{ color: myLastNet > 0 ? C.lime : myLastNet < 0 ? C.red : 'inherit' }}> · {moneySigned(myLastNet)}</span>}
                    </div>
                    {lastWinner && (
                      <div className="text-sm mt-0.5 truncate" style={{ color: C.muted }}>Winner: {lastWinner.name} · {signed(lastWinnerRow.result)}</div>
                    )}
                  </>
                ) : (
                  <div className="text-sm mt-1 truncate" style={{ color: C.muted }}>
                    {lastWinner ? `Winner: ${lastWinner.name} · ${signed(lastWinnerRow.result)}` : lastCourse?.name || 'Completed round'}
                  </div>
                )}
              </div>
              <span className="w-12 h-12 rounded-full flex items-center justify-center shrink-0" style={{ background: C.limeSoft, color: C.lime }}>
                <TrophyIcon size={26} />
              </span>
            </div>
          </Card>
        </button>
      )}

      <button onClick={() => onGoTab('standings')} className="w-full text-left tap" style={{ display: 'block' }}>
        <Card style={homeCardStyle}>
          <div className="font-display text-base mb-2" style={{ color: C.lime }}>Season Leaders</div>
          {officialBoard.length === 0 ? (
            <div className="text-sm py-2" style={{ color: C.faint }}>No league results yet—play a round to start the standings.</div>
          ) : (
            <>
              {top3.map((leader, index) => (
                <div key={leader.id} className="flex items-center gap-3 py-1.5">
                  <span className="w-6 h-6 rounded-full flex items-center justify-center font-display text-xs shrink-0" style={{ background: index === 0 ? C.lime : C.surface2, color: index === 0 ? C.onAccent : C.lime, border: `1px solid ${C.lime}` }}>{index + 1}</span>
                  <span className="flex-1 truncate text-sm" style={{ color: C.text }}>{leader.name}</span>
                  <span className="font-display text-lg shrink-0" style={{ color: C.lime }}>{signed(season.rawTotals[leader.id] || 0)}</span>
                </div>
              ))}
              {myPlayer && myRank && (
                <div className="flex items-center gap-3 mt-2 pt-2" style={{ borderTop: `1px solid ${C.border}` }}>
                  <span className="w-6 shrink-0" />
                  <span className="flex-1 text-sm" style={{ color: C.text }}>You</span>
                  <span className="font-display text-base shrink-0" style={{ color: C.lime }}>{ordinal(myRank)} · {signed(season.rawTotals[myPlayer.id] || 0)}</span>
                </div>
              )}
            </>
          )}
        </Card>
      </button>

      {myPlayer && (
        <button onClick={() => onGoTab('calendar')} className="w-full text-left tap" style={{ display: 'block' }}>
          <Card style={homeCardStyle}>
            <div className="flex items-center justify-between gap-3">
              <div className="min-w-0">
                <div className="font-display text-base" style={{ color: C.lime }}>Next Tee Time</div>
                <div className="font-display text-xl mt-1 truncate" style={{ color: C.text }}>
                  {myNextGolf ? `${formatRoundDate(myNextGolf.date)} · ${myNextGolf.sessions.map((session) => session.label).join(' / ')}` : 'Mark your availability'}
                </div>
                <div className="text-sm mt-0.5" style={{ color: C.muted }}>
                  {myNextGolf ? `${myNextGolf.bestCount} player${myNextGolf.bestCount === 1 ? '' : 's'} available` : 'Open the calendar to choose a date'}
                </div>
              </div>
              <span className="font-display text-3xl shrink-0" style={{ color: C.lime }}>›</span>
            </div>
          </Card>
        </button>
      )}
    </div>
  );
}

function StandingsTab({ settings, players, setPlayers, rounds, courses, availability, myPlayerId, onSetMyPlayer, onGoCalendar, onGoPlayers }) {
  const leagueRounds = finalLeagueRounds(rounds, settings);
  const season = computeSeason(settings, leagueRounds, courses, players);
  const seasonPlayers = season.players;
  const [dashPlayerId, setDashPlayerId] = useState(null);
  const [eventIdx, setEventIdx] = useState(0);
  const [showSeason, setShowSeason] = useState(false);
  const [awards, setAwards] = useState(null);
  const [awardsLoading, setAwardsLoading] = useState(false);
  const [awardsError, setAwardsError] = useState('');

  // Days, newest first. Each event is one dogfight — a single 18 or two
  // combined nines played the same day.
  const events = getEvents(leagueRounds)
    .map((ev) => ({ ...ev, purse: purseForEvent(settings, ev, leagueRounds, courses, seasonPlayers) }))
    .filter((ev) => ev.purse.scoredCount > 0)
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  const activeEvent = events[Math.min(eventIdx, Math.max(0, events.length - 1))] || null;

  // Money won per player across every day, net of the buy-in they paid in.
  const moneyByPlayer = {};
  seasonPlayers.forEach((p) => (moneyByPlayer[p.id] = 0));
  events.forEach((ev) => {
    Object.entries(ev.purse.net).forEach(([pid, amt]) => (moneyByPlayer[pid] = (moneyByPlayer[pid] || 0) + amt));
  });

  const seasonPool = settings.seasonBuyIn * players.length + events.reduce((sum, event) => sum + (event.purse.rake || 0), 0);

  // Season order is driven by quota points — total strokes over/under quota —
  // rather than finish-position points, since that's what the league cares about.
  const leaderboard = [...seasonPlayers]
    .filter((p) => (season.roundsPlayed[p.id] || 0) > 0)
    .sort((a, b) => (season.rawTotals[b.id] || 0) - (season.rawTotals[a.id] || 0));

  function updatePlayerFromStandings(id, patch) {
    setPlayers((ps) => ps.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  }
  const dashPlayer = dashPlayerId ? seasonPlayers.find((p) => p.id === dashPlayerId) : null;

  const skinsByPlayer = {};
  seasonPlayers.forEach((p) => (skinsByPlayer[p.id] = 0));
  leagueRounds.forEach((r) => {
    const course = courseForRound(r, courses.find((c) => c.id === r.courseId));
    if (!course) return;
    const skins = computeSkinsForRound(r, seasonPlayers, course, settings);
    if (skins) Object.entries(skins.tally).forEach(([pid, count]) => (skinsByPlayer[pid] = (skinsByPlayer[pid] || 0) + count));
  });

  async function generateAwards() {
    setAwardsError('');
    setAwards(null);
    if (!season.anyResults) {
      setAwardsError('Play at least one round first.');
      return;
    }
    setAwardsLoading(true);
    const summary = leaderboard
      .map(
        (p, i) =>
          `${p.name}: rank #${i + 1}, ${(season.rawTotals[p.id] || 0) >= 0 ? '+' : ''}${season.rawTotals[p.id] || 0} quota points, ${season.roundsPlayed[p.id] || 0} dogfights played, ${skinsByPlayer[p.id] || 0} skins won, $${(moneyByPlayer[p.id] || 0) >= 0 ? '+' : '-'}$${Math.abs(moneyByPlayer[p.id] || 0)} net after buy-ins`
      )
      .join('\n');
    const prompt = `You are writing a fun, lighthearted end-of-season awards write-up for a golf betting league called "${settings.leagueName}". Here is the season data, one line per player:
${summary}

Write 5 to 6 award categories (invent fitting categories from the data — things like season champion, most skins won, biggest overachiever vs quota, most rounds played / most dedicated, closest rivalry, etc). For each award, pick a real player from the data above by exact name where it fits the category. Keep the tone fun, warm, a little teasing — like a golf buddies group chat, not a corporate write-up. Each blurb should be 1-2 sentences and reference an actual stat from the data.
Respond with ONLY this JSON, no other text: [{"title": "Award Name", "player": "Full Name", "blurb": "1-2 sentence writeup"}]`;
    const res = await callGeminiJSON(prompt);
    setAwardsLoading(false);
    if (!res.ok) {
      setAwardsError(res.error);
      return;
    }
    if (!Array.isArray(res.data)) {
      setAwardsError("That didn't come back right — give it another tap.");
      return;
    }
    setAwards(res.data);
  }

  if (dashPlayer) {
    return (
      <InteractiveEdgeBack
        onBack={() => setDashPlayerId(null)}
        underlay={
          <DrilldownUnderlay
            title="Standings"
            subtitle="Season leaders"
            rows={leaderboard.map((p, index) => ({
              label: `${index + 1}. ${p.name}`,
              detail: `${(season.rawTotals[p.id] || 0) >= 0 ? '+' : ''}${season.rawTotals[p.id] || 0} vs quota`,
            }))}
          />
        }
      >
      <PlayerDashboard
        settings={settings}
        player={dashPlayer}
        players={seasonPlayers}
        rounds={rounds || []}
        courses={courses || []}
        availability={availability}
        onBack={() => setDashPlayerId(null)}
        onGoCalendar={onGoCalendar}
        updatePlayer={updatePlayerFromStandings}
        isMyPlayer={myPlayerId === dashPlayer.id}
        onSetMyPlayer={onSetMyPlayer}
        backLabel="Standings"
        playerOrder={leaderboard}
        onChangePlayer={setDashPlayerId}
      />
      </InteractiveEdgeBack>
    );
  }

  return (
    <div>
      {events.length === 0 ? (
        <Card style={{ textAlign: 'center' }}>
          <div className="font-display text-xl mb-1" style={{ color: C.text }}>
            No dogfights yet
          </div>
          <p className="text-sm mb-3" style={{ color: C.muted }}>
            Add players, then start a round under <b style={{ color: C.text }}>Rounds → League Rounds</b>.
            Once scores go in, the day's result and payouts show up here.
          </p>
          {players.length === 0 && (
            <PrimaryButton onClick={onGoPlayers} style={{ margin: '0 auto' }}>
              Add Players
            </PrimaryButton>
          )}
        </Card>
      ) : (
        <>
          {/* Day picker — most recent dogfight first */}
          {events.length > 1 && (
            <div className="flex gap-2 overflow-x-auto scrollbar-hide mb-3 pb-1">
              {events.map((ev, i) => (
                <button
                  key={ev.id}
                  onClick={() => setEventIdx(i)}
                  className="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold tap"
                  style={{
                    background: i === eventIdx ? C.lime : C.surface2,
                    color: i === eventIdx ? C.onAccent : C.muted,
                    border: `1px solid ${i === eventIdx ? C.lime : C.border}`,
                  }}
                >
                  {i === 0 ? 'Latest' : formatRoundDate(ev.date)}
                </button>
              ))}
            </div>
          )}

          {activeEvent && (() => {
            const purse = activeEvent.purse;
            const winner = purse.ranked[0];
              const winnerPlayer = winner ? seasonPlayers.find((p) => p.id === winner.id) : null;
            const tiedAtTop = purse.ranked.filter((x) => winner && x.result === winner.result);
            const evRound = leagueRounds.find((r) => r.id === activeEvent.roundIds[0]);
              const evCourse = evRound ? courseForRound(evRound, courses.find((c) => c.id === evRound.courseId)) : null;
            return (
              <>
                <Card primary>
                  <div className="flex items-start justify-between gap-2 mb-1">
                    <div className="min-w-0">
                      <div className="font-display text-xl" style={{ color: C.text }}>
                        {formatRoundDate(activeEvent.date)}
                      </div>
                      <div className="text-xs" style={{ color: C.muted }}>
                        {evCourse ? evCourse.name : ''} · {purse.scoredCount} player
                        {purse.scoredCount === 1 ? '' : 's'}
                      </div>
                    </div>
                    <span className="shrink-0 px-2 py-0.5 rounded-full text-[10px] font-bold" style={{ background: C.limeSoft, color: C.lime }}>
                      DOGFIGHT
                    </span>
                  </div>
                  {winnerPlayer && (
                    <div className="rounded-2xl p-3 mt-3" style={{ background: C.surface }}>
                      <div className="text-[11px] uppercase tracking-wide" style={{ color: C.muted }}>
                        {tiedAtTop.length > 1 ? `Tied for the win (${tiedAtTop.length})` : 'Winner'}
                      </div>
                      <div className="font-display text-2xl" style={{ color: C.gold, textShadow: C.goldGlow }}>
                        {tiedAtTop.length > 1
                          ? tiedAtTop.map((x) => (seasonPlayers.find((p) => p.id === x.id) || {}).name).join(' & ')
                          : winnerPlayer.name}
                      </div>
                      <div className="text-xs" style={{ color: C.muted }}>
                        {winner.result >= 0 ? '+' : ''}
                        {winner.result} vs quota · ${purse.payouts[winner.id] || 0}
                      </div>
                    </div>
                  )}
                </Card>

                <Card>
                  <div className="font-display text-lg mb-1" style={{ color: C.text }}>
                    Result &amp; payouts
                  </div>
                  <div className="text-xs mb-3" style={{ color: C.muted }}>
                    {purse.scoredCount} × ${settings.purseBuyIn} = ${purse.pot} pot
                    {purse.rake > 0 && ` · −$${purse.rake} to the season pool`} ·{' '}
                    <b style={{ color: C.lime }}>${purse.payoutPool} paid out</b>
                  </div>
                  <div
                    className="grid gap-2 text-[10px] uppercase tracking-wide pb-1"
                    style={{ gridTemplateColumns: '18px 1fr 42px 42px 46px', color: C.muted, borderBottom: `1px solid ${C.border}` }}
                  >
                    <div />
                    <div>Player</div>
                    <div className="text-right">Quota</div>
                    <div className="text-right">Pts</div>
                    <div className="text-right">+/−</div>
                  </div>
                  {purse.ranked.map((x, i) => {
                    const p = seasonPlayers.find((pp) => pp.id === x.id);
                    if (!p) return null;
                    const money = purse.payouts[x.id] || 0;
                    const dayNet = purse.net[x.id] || 0;
                    return (
                      <div key={x.id}>
                        <div
                          className="grid gap-2 items-center py-2 row-in"
                          style={{ gridTemplateColumns: '18px 1fr 42px 42px 46px', animationDelay: `${Math.min(i, 12) * 0.04}s` }}
                        >
                          <span className="font-display text-xs" style={{ color: i === 0 ? C.gold : C.faint }}>
                            {i + 1}
                          </span>
                          <button
                            onClick={() => setDashPlayerId(p.id)}
                            title={`Open ${p.name}'s dashboard`}
                            className="flex items-center gap-1.5 min-w-0 text-left tap"
                          >
                            <span className="truncate text-sm" style={{ color: C.text, fontWeight: i === 0 ? 700 : 500 }}>
                              {p.name}
                            </span>
                            <BarChart size={11} style={{ color: C.lime, flexShrink: 0 }} />
                          </button>
                          <span className="text-right text-xs" style={{ color: C.muted }}>
                            {x.quota}
                          </span>
                          <span className="text-right text-xs" style={{ color: C.text }}>
                            {x.points}
                          </span>
                          <span className="text-right font-display text-sm" style={{ color: x.result >= 0 ? C.lime : C.red }}>
                            {x.result >= 0 ? '+' : ''}
                            {x.result}
                          </span>
                        </div>
                        <div className="flex justify-end -mt-1 mb-1 gap-1.5 items-center">
                          {money > 0 && (
                            <span className="px-2 py-0.5 rounded-full text-[11px] font-bold" style={{ background: C.limeSoft, color: C.lime }}>
                              collects ${money}
                            </span>
                          )}
                          <span
                            className="px-2 py-0.5 rounded-full text-[11px] font-bold"
                            style={{ background: C.surface2, color: dayNet >= 0 ? C.lime : C.red }}
                            title={`$${money} won − $${settings.purseBuyIn} buy-in`}
                          >
                            {dayNet >= 0 ? '+' : '−'}${Math.abs(dayNet)} net
                          </span>
                        </div>
                      </div>
                    );
                  })}
                  {purse.ranked.every((x) => !purse.payouts[x.id]) && (
                    <div className="text-xs mt-2" style={{ color: C.faint }}>
                      Nothing to pay out — the pot didn't cover the season rake.
                    </div>
                  )}
                  <div className="text-[11px] mt-2" style={{ color: C.faint }}>
                    Net is what each player collects minus their ${settings.purseBuyIn} buy-in, so it
                    adds up to −${purse.rake} across the group — the amount going to the season pool.
                  </div>
                </Card>
              </>
            );
          })()}

          {/* Season roll-up, deliberately secondary */}
          <Card>
            <button
              onClick={() => setShowSeason((v) => !v)}
              className="w-full flex items-center justify-between text-left tap"
            >
              <div>
